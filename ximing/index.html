<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f6b5c">
<title>西学中题库 · 四科答题入口</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --paper:#f6f3ec;--card:#fffdf8;--ink:#1b2422;--ink2:#3f4c48;--mut:#8b9793;
  --line:rgba(27,36,34,.09);
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}

.hero{
  position:relative;overflow:hidden;margin:0 -16px;
  padding:calc(34px + env(safe-area-inset-top)) 22px 52px;
  background:linear-gradient(158deg,#0f6b5c,#2aa593);color:#fff;
  border-radius:0 0 30px 30px;
}
.hero::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(58% 70% at 90% 6%,rgba(255,255,255,.22),transparent 62%),
             radial-gradient(46% 60% at 2% 98%,rgba(0,0,0,.15),transparent 60%);
}
.hero::after{
  content:"";position:absolute;right:-54px;top:-58px;width:200px;height:200px;border-radius:50%;
  border:1px solid rgba(255,255,255,.2);box-shadow:0 0 0 24px rgba(255,255,255,.05),0 0 0 50px rgba(255,255,255,.032);
}
.hero .k{position:relative;font-size:11.5px;letter-spacing:2.2px;opacity:.85;font-weight:500}
.hero h1{position:relative;font-size:27px;font-weight:800;letter-spacing:1.4px;margin-top:12px;line-height:1.3}
.hero p{position:relative;font-size:13px;opacity:.84;margin-top:10px;letter-spacing:.4px;line-height:1.7}
.hero .meta{position:relative;display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.hero .meta span{font-size:11.5px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.2);letter-spacing:.3px}

.grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:-26px;position:relative;z-index:2}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:18px 18px 16px;box-shadow:0 8px 26px rgba(27,36,34,.08);
  position:relative;overflow:hidden;
  transition:transform .16s,box-shadow .2s;
}
.card:active{transform:scale(.99)}
.card::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:linear-gradient(90deg,var(--c1),var(--c2))}
.ctop{display:flex;align-items:flex-start;gap:14px}
.cinfo{flex:1;min-width:0;padding-top:4px}
.cinfo h2{font-size:19px;font-weight:800;letter-spacing:1.1px;color:var(--c1)}
.cinfo .py{font-size:10px;letter-spacing:1.6px;color:var(--mut);margin-top:4px;text-transform:uppercase}
.cinfo .nm{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
.cinfo .nm span{font-size:10.5px;padding:3px 8px;border-radius:6px;background:rgba(27,36,34,.05);color:var(--ink2);letter-spacing:.2px}
.cqr{flex:0 0 auto;width:96px;height:96px;border-radius:10px;overflow:hidden;background:#fff;border:1px solid var(--line);padding:4px}
.cqr img{width:100%;height:100%;display:block;image-rendering:pixelated}
.ctip{font-size:11px;color:var(--mut);margin-top:13px;letter-spacing:.2px;line-height:1.6}
.go{
  display:flex;align-items:center;justify-content:center;gap:6px;
  margin-top:13px;height:42px;border-radius:12px;width:100%;
  background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;
  font-size:14px;font-weight:700;letter-spacing:1px;text-decoration:none;
  box-shadow:0 8px 18px -9px var(--c1);
}
.go:active{opacity:.9}
.go svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.note{margin-top:22px;padding:16px 18px;border-radius:16px;background:rgba(255,253,248,.7);border:1px dashed rgba(27,36,34,.14)}
.note h3{font-size:12.5px;letter-spacing:1px;color:var(--ink);margin-bottom:9px;font-weight:700}
.note li{font-size:12px;color:var(--ink2);line-height:2;list-style:none;padding-left:13px;position:relative}
.note li::before{content:"";position:absolute;left:0;top:11px;width:4px;height:4px;border-radius:50%;background:var(--mut)}
.foot{margin-top:26px;text-align:center;font-size:11px;color:var(--mut);line-height:2;letter-spacing:.4px}
</style>
</head>
