/* ---------------- 会话 ---------------- */
function startSession(mode, opt){
  opt = opt || {};
  var all = Q.map(function(_,i){ return i; });
  var list;

  if(mode === 'seq'){
    list = all.slice();
    S.pos = Math.min(Math.max(DB.pos|0, 0), N-1);
  }else if(mode === 'rand'){
    list = shuffle(all.slice());
    if(opt.limit) list = list.slice(0, opt.limit);
    S.pos = 0;
  }else if(mode === 'chapter'){
    list = all.filter(function(i){ return Q[i].k === opt.kp; });
    S.pos = 0;
  }else if(mode === 'wrong'){
    list = DB.wrong.filter(function(i){ return i>=0 && i<N; }).slice();
    if(!list.length){ toast('错题本是空的，先去做几题'); return; }
    S.pos = 0;
  }else if(mode === 'fav'){
    list = DB.fav.filter(function(i){ return i>=0 && i<N; }).slice();
    if(!list.length){ toast('还没有收藏题目'); return; }
    S.pos = 0;
  }else if(mode === 'exam'){
    var sg = all.filter(function(i){ return Q[i].t === 1; });
    var mt = all.filter(function(i){ return Q[i].t === 2; });
    var pick = shuffle(sg.slice()).slice(0, 60).concat(shuffle(mt.slice()).slice(0, 40));
    list = shuffle(pick);
    S.pos = 0;
    S.exam = { start: Date.now(), limit: 90*60*1000 };
  }

  S.mode = mode;
  S.chapter = opt.kp || null;
  S.list = list;
  S.ans = {}; S.judged = {}; S.res = {};
  S.review = false;
  if(mode !== 'exam') S.exam = null;
  if(mode === 'exam') S.exam.start = Date.now();

  show('quiz');
  renderQ();
  startTimer();
}

function startTimer(){
  stopTimer();
  var t = $('timer');
  if(S.exam){
    t.style.display = '';
    var upd = function(){
      var left = S.exam.limit - (Date.now() - S.exam.start);
      t.textContent = fmtTime(left);
      t.classList.toggle('warn', left < 5*60*1000);
      if(left <= 0){ stopTimer(); submitExam(); }
    };
    upd();
    tick = setInterval(upd, 1000);
  }else{
    t.style.display = 'none';
  }
}
function stopTimer(){ if(tick){ clearInterval(tick); tick = null; } }

/* ---------------- 渲染题目 ---------------- */
function curQ(){ return Q[S.list[S.pos]]; }
function curIdx(){ return S.list[S.pos]; }

function renderQ(){
  var gi = curIdx(), q = curQ();
  var card = $('qcard');
  card.classList.remove('cin');
  void card.offsetWidth;
  card.classList.add('cin');

  $('qtag').textContent = q.t === 1 ? '单选题' : '多选题';
  $('qtag').className = 'tag' + (q.t === 2 ? ' multi' : '');
  $('qkp').textContent = q.k || '综合';
  $('stem').textContent = q.s;

  // 选项
  var box = $('opts'); box.innerHTML = '';
  var picked = (S.ans[gi] || '');
  var judged = !!S.judged[gi];
  var right = q.a;

  q.o.forEach(function(text, i){
    var L = LTR[i];
    var b = document.createElement('button');
    b.className = 'opt';
    b.dataset.l = L;
    var ob = document.createElement('span'); ob.className = 'ob'; ob.textContent = L;
    var ot = document.createElement('span'); ot.className = 'ot'; ot.textContent = text;
    var mk = document.createElement('span'); mk.className = 'mk'; mk.textContent = '';
    b.appendChild(ob); b.appendChild(ot); b.appendChild(mk);

    if(judged){
      b.classList.add('lock');
      var isR = right.indexOf(L) >= 0;
      var isP = picked.indexOf(L) >= 0;
      if(isR){ b.classList.add('right'); mk.textContent = '✓'; }
      else if(isP){ b.classList.add('bad'); mk.textContent = '✗'; }
      else b.classList.add('dim');
      if(S.review && isP && !isR) b.classList.add('bad');
    }else{
      if(picked.indexOf(L) >= 0) b.classList.add('sel');
      b.addEventListener('click', function(){ pick(L); });
    }
    box.appendChild(b);
  });

  // 解析
  var exp = $('exp');
  if(judged){
    var ok = S.res[gi] === 1;
    $('ansTxt').textContent = q.a.split('').join(' ');
    var v = $('verd');
    v.textContent = ok ? '回答正确' : '回答错误';
    v.className = 'verd ' + (ok ? 'ok' : 'no');
    $('expTxt').textContent = q.e || '本题暂无解析。';
    $('expKp').textContent = '考查范围：' + (q.k || '综合') + '　·　本题为' + (q.t===1?'单选':'多选') + '题';
    exp.classList.add('on');
  }else{
    exp.classList.remove('on');
  }

  renderFoot(judged, picked);
  renderProg();
  // 记录顺序模式位置
  if(S.mode === 'seq' && !S.review){ DB.pos = gi; save(); }
}

function renderProg(){
  var answered = 0;
  S.list.forEach(function(gi){ if(S.judged[gi]) answered++; });
  $('progTxt').textContent = (S.pos+1) + ' / ' + S.list.length;
  $('progSub').textContent = S.exam ? ('已答 ' + Object.keys(S.ans).length) : ('已答 ' + answered);
  var pct = S.exam ? (Object.keys(S.ans).length / S.list.length * 100)
                   : (answered / S.list.length * 100);
  $('progBar').style.width = pct + '%';
}

function renderFoot(judged, picked){
  var box = $('qfoot'); box.innerHTML = '';
  var q = curQ();
  var gi = curIdx();

  function btn(cls, label, fn, dis){
    var b = document.createElement('button');
    b.className = 'fbtn ' + cls;
    b.textContent = label;
    if(dis) b.disabled = true;
    b.addEventListener('click', fn);
    return b;
  }

  if(S.review){
    var b1 = btn('gh', '上一题', function(){ go(-1); }, S.pos === 0);
    var b2 = btn('pri', S.pos === S.list.length-1 ? '完成回顾' : '下一题', function(){
      if(S.pos === S.list.length-1) exitToHome(); else go(1);
    });
    box.appendChild(b1); box.appendChild(b2);
    return;
  }

  if(S.exam){
    var e1 = btn('gh', '上一题', function(){ go(-1); }, S.pos === 0);
    var e2 = btn('pri', S.pos === S.list.length-1 ? '交卷' : '下一题', function(){
      if(S.pos === S.list.length-1) submitExam(); else go(1);
    });
    box.appendChild(e1); box.appendChild(e2);
    return;
  }

  if(judged){
    var prev = btn('gh', '上一题', function(){ go(-1); }, S.pos === 0);
    var last = S.pos === S.list.length-1;
    var next = btn('pri', last ? '查看结果' : '下一题', function(){
      if(last) renderResult('practice'); else go(1);
    });
    box.appendChild(prev); box.appendChild(next);
    return;
  }

  if(q.t === 2){
    var pv = btn('gh', '上一题', function(){ go(-1); }, S.pos === 0);
    var cf = btn('pri', '确认作答', function(){ doJudge(); }, !picked);
    box.appendChild(pv); box.appendChild(cf);
  }else{
    var pv2 = btn('gh', '上一题', function(){ go(-1); }, S.pos === 0);
    var tip = btn('pri', '请选择答案', function(){}, true);
    box.appendChild(pv2); box.appendChild(tip);
  }
}

function pick(L){
  var gi = curIdx(), q = curQ();
  if(S.judged[gi] || S.review) return;

  if(q.t === 1){
    if(S.exam){
      S.ans[gi] = (S.ans[gi] === L) ? '' : L;
      repaintSel();
    }else{
      S.ans[gi] = L;
      doJudge();
    }
  }else{
    var cur = (S.ans[gi] || '').split('').filter(Boolean);
    var p = cur.indexOf(L);
    if(p >= 0) cur.splice(p, 1); else cur.push(L);
    S.ans[gi] = sortAns(cur.join(''));
    repaintSel();
  }
}

function repaintSel(){
  var picked = S.ans[curIdx()] || '';
  var opts = $('opts').children;
  for(var i=0;i<opts.length;i++){
    var L = opts[i].dataset.l;
    opts[i].classList.toggle('sel', picked.indexOf(L) >= 0);
  }
  var q = curQ();
  if(q.t === 2 && !S.exam && !S.judged[curIdx()]){
    var f = $('qfoot').querySelector('.fbtn.pri');
    if(f){ f.disabled = !picked; f.textContent = picked ? '确认作答' : '请选择答案'; }
  }
  renderProg();
}

function doJudge(){
  var gi = curIdx(), q = curQ();
  var picked = sortAns(S.ans[gi] || '');
  if(!picked) return;
  var ok = (picked === sortAns(q.a));
  S.judged[gi] = true;
  S.res[gi] = ok ? 1 : 0;

  DB.hist[gi] = ok ? 1 : 0;
  var w = DB.wrong.indexOf(gi);
  if(ok){ if(w >= 0) DB.wrong.splice(w, 1); }
  else { if(w < 0) DB.wrong.push(gi); }
  save();

  renderQ();   // 重绘（保留选中态）
  if(ok && DB.auto && S.pos < S.list.length-1){
    setTimeout(function(){ go(1); }, 720);
  }
}

function go(d){
  var n = S.pos + d;
  if(n < 0 || n >= S.list.length) return;
  S.pos = n;
  renderQ();
  if(S.mode === 'seq' && !S.review){ DB.pos = curIdx(); save(); }
}

function exitToHome(){
  stopTimer();
  renderHome();
  show('home');
}

/* ---------------- 交卷 ---------------- */
function submitExam(){
  if(!S.exam) return;
  var unanswered = 0;
  S.list.forEach(function(gi){
    var picked = sortAns(S.ans[gi] || '');
    if(!picked) unanswered++;
    var ok = picked && picked === sortAns(Q[gi].a);
    S.judged[gi] = true;
    S.res[gi] = ok ? 1 : 0;
    DB.hist[gi] = ok ? 1 : 0;
    var w = DB.wrong.indexOf(gi);
    if(ok){ if(w >= 0) DB.wrong.splice(w, 1); }
    else { if(w < 0) DB.wrong.push(gi); }
  });
  DB.examDone = (DB.examDone|0) + 1;
  save(true);
  stopTimer();
  renderResult('exam', unanswered);
}

/* ---------------- 结果 ---------------- */
function renderResult(kind, unanswered){
  var total = S.list.length;
  var ok = 0, no = 0;
  S.list.forEach(function(gi){ if(S.res[gi] === 1) ok++; else if(S.res[gi] === 0) no++; });
  var rate = total ? Math.round(ok/total*100) : 0;

  $('rTtl').textContent = kind === 'exam' ? '模拟考试 · 成绩单' : '本次练习 · 完成';
  $('rScore').innerHTML = '0<i>%</i>';
  $('rOk').textContent = ok;
  $('rNo').textContent = no;
  $('rTotal').textContent = total;
  var used = S.exam ? (Date.now() - S.exam.start) : 0;
  $('rTime').textContent = S.exam ? fmtTime(used) : '--';

  // 环形
  var C = 2 * Math.PI * 80;
  var ring = $('ring');
  ring.style.strokeDasharray = C;
  ring.style.strokeDashoffset = C;
  setTimeout(function(){ ring.style.strokeDashoffset = C * (1 - rate/100); }, 80);

  // 数字滚动
  var s0 = null;
  function step(ts){
    if(!s0) s0 = ts;
    var p = Math.min((ts - s0)/900, 1);
    var e = 1 - Math.pow(1-p, 3);
    $('rScore').innerHTML = Math.round(rate*e) + '<i>%</i>';
    if(p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);

  // 章节掌握
  var m = {}, order = [];
  S.list.forEach(function(gi){
    if(S.res[gi] === undefined) return;
    var k = Q[gi].k || '综合';
    if(!m[k]){ m[k] = {ok:0, n:0}; order.push(k); }
    m[k].n++; if(S.res[gi] === 1) m[k].ok++;
  });
  var bars = $('kpBars'); bars.innerHTML = '';
  order.sort(function(a,b){ return (m[a].ok/m[a].n) - (m[b].ok/m[b].n); });
  var shown = order.slice(0, 10);
  shown.forEach(function(k){
    var d = m[k], pc = Math.round(d.ok/d.n*100);
    var row = document.createElement('div'); row.className = 'bar';
    row.innerHTML = '<span class="n"></span><span class="t"><i></i></span><span class="v"></span>';
    row.querySelector('.n').textContent = k;
    row.querySelector('.v').textContent = d.ok + '/' + d.n + ' ' + pc + '%';
    bars.appendChild(row);
    setTimeout(function(){ row.querySelector('.t i').style.width = pc + '%'; }, 120 + Math.random()*160);
  });
  if(!order.length){
    bars.innerHTML = '<div class="empty">本组题目没有可统计的答题记录</div>';
  }else if(order.length > shown.length){
    var more = document.createElement('div');
    more.className = 'empty';
    more.style.padding = '10px 0 0';
    more.style.fontSize = '11.5px';
    more.textContent = '另有 ' + (order.length - shown.length) + ' 个章节未显示（题量较少）';
    bars.appendChild(more);
  }

  // 按钮
  var acts = $('rActs'); acts.innerHTML = '';
  function act(cls, label, fn){
    var b = document.createElement('button');
    b.className = 'fbtn ' + cls; b.textContent = label;
    b.addEventListener('click', fn); acts.appendChild(b);
  }
  var wrongN = S.list.filter(function(gi){ return S.res[gi] === 0; }).length;

  if(wrongN){
    act('pri', '重做错题（' + wrongN + ' 题）', function(){
      var list = S.list.filter(function(gi){ return S.res[gi] === 0; });
      S.list = list; S.pos = 0; S.review = false; S.exam = null;
      S.ans = {}; S.judged = {}; S.res = {};
      S.mode = 'wrong'; stopTimer();
      show('quiz'); renderQ();
    });
  }
  act('gh', '查看全部解析', function(){
    S.review = true; S.pos = 0; S.exam = null; stopTimer();
    show('quiz'); renderQ();
  });
  act('gh', '返回首页', function(){ stopTimer(); S.exam = null; renderHome(); show('home'); });

  show('result');
}

/* ---------------- 答题卡 ---------------- */
function openSheet(){
  var sb = $('sheetSubmit');
  sb.style.display = S.exam ? '' : 'none';
  var g = $('grid'); g.innerHTML = '';
  S.list.forEach(function(gi, i){
    var b = document.createElement('button');
    b.className = 'gi';
    b.textContent = i+1;
    if(S.judged[gi]) b.classList.add(S.res[gi] === 1 ? 'ok' : 'no');
    else if(S.ans[gi]) b.classList.add('did');
    if(i === S.pos) b.classList.add('cur');
    b.addEventListener('click', function(){ S.pos = i; renderQ(); closeSheet(); });
    g.appendChild(b);
  });
  $('mask').classList.add('on');
  $('sheet').classList.add('on');
}
function closeSheet(){
  $('mask').classList.remove('on');
  $('sheet').classList.remove('on');
}
function filterSheet(f){
  var g = $('grid');
  for(var i=0;i<g.children.length;i++){
    var gi = S.list[i], b = g.children[i], hide = false;
    if(f === 'undone') hide = !!(S.judged[gi] || S.ans[gi]);
    else if(f === 'wrong') hide = !(S.res[gi] === 0);
    b.classList.toggle('none', hide);
  }
}

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(QR_URL).then(done, function(){ fallbackCopy(); });
  }else fallbackCopy();
  function fallbackCopy(){
    var ta = document.createElement('textarea');
    ta.value = QR_URL; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('复制失败，请长按上方链接'); }
    document.body.removeChild(ta);
  }
});

// 键盘（桌面端）
document.addEventListener('keydown', function(e){
  if(!$('quiz').classList.contains('on')) return;
  var k = e.key.toUpperCase();
  if(LTR.indexOf(k) >= 0 && k.length === 1){
    var opts = $('opts').children;
    for(var i=0;i<opts.length;i++){
      if(opts[i].dataset.l === k){ opts[i].click(); break; }
    }
  }else if(e.key === 'ArrowRight'){ go(1); }
  else if(e.key === 'ArrowLeft'){ go(-1); }
  else if(e.key === 'Enter'){
    var f = $('qfoot').querySelector('.fbtn.pri');
    if(f && !f.disabled) f.click();
  }
});

// 初始化
renderHome();

// 调试入口（自动化测试用，不影响正常使用）
window.__XM__ = { S:S, Q:Q, DB:DB, renderQ:renderQ, renderHome:renderHome, startSession:startSession };
})();
</script>
