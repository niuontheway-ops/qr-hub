活血汤","桂枝茯苓丸","小蓟饮子","血府逐瘀汤"],"a":"B","e":"本题主要考查对重点方剂中药物组成的掌握。复元活血汤的功用是活血祛瘀、疏肝通络。","k":"模拟试卷A卷"},{"t":1,"s":"具有温胆汤的功用是()","o":["清气化痰，理气止咳","理气化痰，清胆和胃","清胆利湿，和胃化痰","燥湿化痰，理气和中","化痰息风，健脾祛湿"],"a":"B","e":"本题主要考查对温胆汤功用的掌握。温胆汤主治胆郁痰扰证，其功用是理气化痰、清胆和胃。","k":"模拟试卷A卷"},{"t":1,"s":"蒿芩清胆汤的功用是()","o":["清气化痰，理气止咳","理气化痰，清胆和胃","清胆利湿，和胃化痰","燥湿化痰，理气和中","化痰息风，健脾祛湿"],"a":"C","e":"本题主要考查对蒿芩清胆汤的掌握。蒿芩清胆汤主治少阳湿热证，其功用为清胆利湿、和胃化痰。","k":"模拟试卷A卷"},{"t":1,"s":"牡蛎散中黄芪是()","o":["君药","臣药","佐药","使药","佐使药"],"a":"B","e":"本题主要考查对牡蛎散方解的掌握。牡蛎散的功用是敛阴止汗、益气固表。主治体虚自汗、盗汗证。常自汗出，夜卧更甚，心悸惊惕，短气烦倦，舌淡红，脉细弱。黄芪味甘微温，益气实卫，固表止汗，在此方中为臣药。","k":"模拟试卷A卷"},{"t":1,"s":"当归补血汤中黄芪是()","o":["君药","臣药","佐药","使药","佐使药"],"a":"A","e":"本题主要考查对当归补血汤方解的掌握。当归补血汤的功用是补气生血。主治血虚阳浮发热证。肌热面红，烦渴欲饮，脉洪大而虚，重按无力。亦治妇人经期、产后血虚发热头痛；或疮疡溃后，久不愈合者。本方重用黄芪，一是滋阴补血固里不及，阳气外亡，故重用黄芪补气而专固肌表；一是有形之血生于无形之气，故用黄芪大补脾肺之气，以资化源，使气旺血生，为君药。","k":"模拟试卷A卷"},{"t":1,"s":"主治脾胃气虚证的方剂是()","o":["理中丸","健脾丸","保和丸","平胃散","四君子汤"],"a":"E","e":"本题主要考查对主治相似方剂的掌握。理中丸主治脾胃虚寒证；健脾丸主治脾虚食积证；保和丸主治食积停滞；平胃散主治湿滞脾胃证；四君子汤主治脾胃气虚证。","k":"模拟试卷A卷"},{"t":1,"s":"主治湿滞脾胃证的方剂是()","o":["理中丸","健脾丸","保和丸","平胃散","四君子汤"],"a":"D","e":"本题主要考查对主治相似方剂的掌握。平胃散主治湿滞脾胃证。","k":"模拟试卷A卷"},{"t":1,"s":"主治脾胃虚寒证的方剂是()","o":["理中丸","健脾丸","保和丸","平胃散","四君子汤"],"a":"A","e":"本题主要考查对主治相似方剂的掌握。理中丸主治脾胃虚寒证。","k":"模拟试卷A卷"},{"t":1,"s":"对胃肠道有刺激的药物，其服药时间宜于","o":["不拘时服","空腹服","睡前服","饭后服","发作前2小时服"],"a":"D","e":"本题考查服药法中的服药时间。胃肠有刺激的药应食后服；补益药和泻下药宜空腹服；安神药宜临卧服；急性重病则不拘时服；治疟药宜在发作前2小时服。","k":"模拟试卷B卷"},{"t":1,"s":"四逆汤与通脉四逆汤两方的变化形式属于","o":["药量增减的变化","药味增减的变化","剂型更换的变化","随证加减的变化","药物配伍的变化"],"a":"A","e":"本题考查方剂变化。两方药味相同，不同之处为附子、干姜用量的改变，通脉四逆汤是在四逆汤药基础上增加了附子和干姜的用量。","k":"模拟试卷B卷"},{"t":1,"s":"下列哪项不是真武汤中配伍芍药的意义","o":["敛阴止汗","敛阴舒筋","缓急止痛","酸敛护阴","利小便利水气"],"a":"A","e":"真武汤配白芍，一者利小便以行水气；二者柔肝缓急以止腹痛；三者敛阴舒筋以解筋肉瞤动；四者防止附子燥热伤阴，亦为佐药。","k":"模拟试卷B卷"},{"t":1,"s":"四物汤中的“血中血药”是","o":["生地黄、白芍","当归、熟地黄","熟地黄、赤芍","川芎、当归","熟地黄、白芍"],"a":"E","e":"四物汤由当归、熟地、川芎、白芍组成。熟地甘温味厚，为滋阴补血之要药；当归补血和血；白芍养血敛阴，柔肝缓急；川芎活血行气。方以熟地黄、白芍两味阴柔补血之品为血中血药，配伍辛甘发散之当归、川芎（血中气药），动静结合，重在滋补营血，补中寓行。","k":"模拟试卷B卷"},{"t":1,"s":"少阳湿热痰浊证，治宜选用的方剂是","o":["小柴胡汤","蒿芩清胆汤","葛根黄芩黄连汤","温胆汤","大柴胡汤"],"a":"B","e":"蒿芩清胆汤功用为清胆利湿、和胃化痰，主要治疗少阳湿热痰浊证。","k":"模拟试卷B卷"},{"t":1,"s":"桃核承气汤是","o":["由调胃承气汤加桃仁、桂枝变化而来","由大承气汤加桃仁、桂枝变化而来","由小承气汤加桃仁、桂枝变化而来","由增液承气汤加桃仁、桂枝变化而来","由四物汤加桃仁、桂枝变化而来"],"a":"A","e":"桃核承气汤与调胃承气汤均用了大黄、芒硝、炙甘草，但桃核承气汤中芒硝用量仅为调胃承气汤中芒硝用量的四分之一，且加入了桃仁与桂枝。","k":"模拟试卷B卷"},{"t":1,"s":"下列哪项不是独活寄生汤的组成药物","o":["杜仲、牛膝、细辛","秦艽、防风、川芎","人参、甘草、茯苓","白术、荆芥、桂枝","地黄、当归、芍药"],"a":"D","e":"本方由独活、桑寄生、杜仲、牛膝、细辛、秦艽、茯苓、肉桂心、防风、川芎、人参、甘草、当归、芍药、干地黄组成，用于治疗痹证日久，肝肾两虚，气血不足证。","k":"模拟试卷B卷"},{"t":1,"s":"具有泻火通便、清上泄下功用，体现“以泻代清”法的方剂是","o":["桃核承气汤","凉膈散","大柴胡汤","黄连解毒汤","麻子仁丸"],"a":"B","e":"凉膈散清上与泻下并行，但泻下是为清泄胸膈郁热而设，即所谓“以泻代清”。","k":"模拟试卷B卷"},{"t":1,"s":"香薷散的功用是","o":["解表清暑，化湿和中","解表散寒，温肺化饮","祛暑解表，清热化湿","祛暑解表，化湿和中","清暑解热，化气利湿"],"a":"D","e":"香薷散用香薷为君，配以厚朴、白扁豆，共奏祛暑解表、化湿和中之效。","k":"模拟试卷B卷"},{"t":1,"s":"临床治疗阴疽的代表方剂是","o":["黄连解毒汤","五味消毒饮","仙方活命饮","阳和汤","内补黄芪汤"],"a":"D","e":"阳和汤出于《外科全生集》：“主治鹤膝风，贴骨疽，及一切阴疽。”具有温阳补血，散寒通滞。","k":"模拟试卷B卷"},{"t":1,"s":"九味羌活汤中清泄里热的药物是","o":["石膏、知母","黄连、黄芩","黄芩、石膏","黄芩、生地黄","生地黄、柴胡"],"a":"D","e":"方中生地、黄芩清泄里热，并防诸辛温燥烈之品伤津。","k":"模拟试卷B卷"},{"t":1,"s":"阴虚肝郁所致脘胁疼痛的常用方剂是","o":["百合固金汤","一贯煎","逍遥散","龙胆泻肝汤","左金丸"],"a":"B","e":"一贯煎功能滋阴疏肝，是治疗阴虚肝郁所致脘胁疼痛的常用方。","k":"模拟试卷B卷"},{"t":1,"s":"脉结代，心动悸，虚羸少气，舌光少苔，治宜选用的方剂是","o":["大补阴丸","归脾汤","天王补心丹","炙甘草汤","酸枣仁汤"],"a":"D","e":"此乃阴血不足，阳气虚弱所致。故选功能益气滋阴，通阳复脉之炙甘草汤。","k":"模拟试卷B卷"},{"t":1,"s":"二陈汤的主治证是","o":["热痰证","燥痰证","寒痰证","湿痰证","风痰证"],"a":"D","e":"二陈汤由半夏、橘红、白茯苓、甘草组成，功用为燥湿化痰、理气和中，用于治疗湿痰证。","k":"模拟试卷B卷"},{"t":1,"s":"鼻衄，症见血色鲜红，来势急暴，伴烦热、口渴、尿赤，舌红，脉数。治宜首选的方剂是","o":["黄土汤","槐花散","十灰散","归脾汤","小蓟饮子"],"a":"C","e":"十灰散主治血热妄行之上部出血证。呕血、吐血、咯血、嗽血、衄血等，表现为血色鲜红，来势急暴，舌红，脉数。","k":"模拟试卷B卷"},{"t":1,"s":"止嗽散的功用是","o":["发散风热，止咳平喘","宣利肺气，疏风止咳","清肺化痰，止嗽定喘","疏风清热，止咳化痰","轻宣肺燥，化痰止嗽"],"a":"B","e":"本方由桔梗、荆芥、紫菀、百部、白前、甘草、陈皮相配，诸药配伍，肺气得宣，外邪得散，则咳痰咽痒得瘥。故其功效为宣利肺气、疏风止咳。","k":"模拟试卷B卷"},{"t":1,"s":"体现“先入后出之妙”配伍特点的方剂是","o":["清暑益气汤","犀角地黄汤","清营汤","青蒿鳖甲汤","银翘散"],"a":"D","e":"青蒿鳖甲汤主治温病后期邪伏阴分证。方中鳖甲咸寒，直入阴分，滋阴退热，入络搜邪；青蒿芳香，清热透络，引邪外出。两药相合，谓“先入后出之妙”。","k":"模拟试卷B卷"},{"t":1,"s":"下利清水，色纯青，其气臭秽，脐腹疼痛，按之坚硬有块，口舌干燥，脉滑实，治当首选的方剂是","o":["大承气汤","黄龙汤","葛根黄芩黄连汤","白头翁汤","真人养脏汤"],"a":"A","e":"此为热结旁流证。是因“旁流”是现象，燥屎坚结才是本质。故用大承气汤峻下热结，“旁流”可止。","k":"模拟试卷B卷"},{"t":1,"s":"具有和解少阳、内泻热结功用的方剂是","o":["小柴胡汤","大柴胡汤","蒿芩清胆汤","大承气汤","桃核承气汤"],"a":"B","e":"大柴胡汤是由柴胡、黄芩、半夏、生姜、枳实、大枣、芍药、大黄组成，功能和解少阳、内泻热结，为治疗少阳阳明合病代表方剂。","k":"模拟试卷B卷"},{"t":1,"s":"四君子汤和补中益气汤中共有的药物是","o":["人参、茯苓","白术、茯苓","升麻、人参","人参、甘草","白术、黄芪"],"a":"D","e":"四君子汤由人参、白术、茯苓、甘草组成；补中益气汤由黄芪、甘草、人参、当归、陈皮、升麻、柴胡组成；两方共同的药物是人参、甘草。","k":"模拟试卷B卷"},{"t":1,"s":"桂枝茯苓丸中配伍桂枝的用意是","o":["温经散寒","解表散邪","助阳化气","温通血脉","降逆平冲"],"a":"D","e":"本方由桂枝、茯苓、丹皮、桃仁、芍药组成，其中桂枝辛甘而温、温通血脉，以行瘀滞，为君药。","k":"模拟试卷B卷"},{"t":1,"s":"天麻钩藤饮的功用是","o":["滋补肝肾，益气复脉，潜阳息风","滋阴养血，柔肝息风，潜阳通络","平肝息风，补益心肾，清热活血","清热息风，补益肝肾，益气解痉","平肝息风，清热活血，补益肝肾"],"a":"E","e":"天麻钩藤饮由天麻、钩藤、石决明、山栀、黄芩、川牛膝、杜仲、桑寄生、益母草、夜交藤、朱茯神组成。功用为平肝息风、清热活血、补益肝肾。","k":"模拟试卷B卷"},{"t":1,"s":"麦门冬汤中半夏的配伍意义不包括","o":["降逆以止咳呕","开胃行津以润肺","防麦门冬滋腻壅滞","臣药","散结消痞满"],"a":"E","e":"方中麦门冬重用为君，臣以半夏降逆下气、化痰和胃，一则降逆以止咳呕，二则开胃行津以润肺，三则防大剂量麦冬之滋腻壅滞，二药相反相成。","k":"模拟试卷B卷"},{"t":1,"s":"患者，男，60岁。呛咳少痰，气短自汗，口干舌燥，苔薄少津，脉虚数。证属久咳肺虚，气阴两伤。治宜首选的方剂是","o":["泻白散","牡蛎散","百合固金汤","生脉散","清暑益气汤"],"a":"D","e":"本久咳伤肺，气阴两虚证，治法为益气生津、敛阴止汗，故生脉散宜之。","k":"模拟试卷B卷"},{"t":1,"s":"患者，男，52岁。素体虚弱，身常汗出，夜卧尤甚，伴有心悸惊惕，气短烦倦，舌淡红，脉细弱。此病证的治法是","o":["滋阴泻火，固表止汗","清暑益气，养阴生津","益气固表，育阴除烦","清热生津，敛阴止汗","敛阴止汗，益气固表"],"a":"E","e":"本证因卫外不固，阴液损伤，心阳不潜所致。应选用牡蛎散主治，因此可敛阴止汗、益气固表。","k":"模拟试卷B卷"},{"t":1,"s":"患者，女，29岁。因情志不遂，忧思过度而致胸膈痞闷，脘腹胀痛，嗳腐吞酸，恶心呕吐，饮食不消。治疗当首选的方剂是","o":["半夏厚朴汤","越鞠丸","逍遥散","健脾丸","四逆散"],"a":"B","e":"患者因情志不遂，忧思过度而致胸膈痞闷，脘腹胀痛，嗳腐吞酸，恶心呕吐，饮食不消。为气郁之证，应行气解郁，选用越鞠丸。","k":"模拟试卷B卷"},{"t":1,"s":"患者，男，48岁。失眠1年余，加重3个月。现症见失眠多梦，健忘，腰腿酸软，耳鸣遗精，口舌生疮，手足心热，大便干结，舌红苔少，脉细数。此病证治宜首选的方剂是","o":["大补阴丸","导赤散","温胆汤","朱砂安神丸","天王补心丹"],"a":"E","e":"此证为阴虚血少，虚火内扰之神志不安。天王补心丹功能滋阴清热、养血安神，是主治心肾阴血亏虚、虚火内扰所致神志不安的常用方。","k":"模拟试卷B卷"},{"t":1,"s":"患者，男，20岁。发热1天，患者症见发热，汗出不畅，微恶风寒，头痛口渴，咽痛咳嗽，舌尖红，苔微黄，脉浮数。治宜选用的方剂是","o":["麻黄汤","桂枝汤","银翘散","桑杏汤","败毒散"],"a":"C","e":"此证为温病初起，银翘散功能为辛凉透表、清热解毒，为主治该证的常用方。","k":"模拟试卷B卷"},{"t":1,"s":"患者，女，35岁。症见咳痰稠带血，咳吐不爽，心烦易怒，胸胁刺痛，咽干口苦，舌红苔黄，脉弦数。此病证治宜首选的方剂是","o":["百合固金汤","大补阴丸","咳血方","清气化痰丸","犀角地黄汤"],"a":"C","e":"此为肝火犯肺，灼伤肺络证。咳血方具有清肝宁肺、凉血止血之功，为治木火刑金的咳血常用方。","k":"模拟试卷B卷"},{"t":1,"s":"（51~53题共用题干）患儿，男，10岁。素有支气管哮喘，近因天气转冷，调摄不慎，引发哮喘。症见咳喘气急，喉中痰鸣，咯痰色黄质稠，胸膈满闷，微恶风寒，舌苔黄腻，脉滑数。该病例的病机是","o":["痰热内壅，外感风寒","痰壅于肺，肾气亏虚","外感风寒，饮郁化热","外感风热，痰饮内停","寒饮蕴肺，外感风寒"],"a":"A","e":"此证为痰热内蕴，风寒外束之哮喘，本证因素体痰多，复感风寒，郁而化热所致，因此选择痰热内壅，外感风寒。","k":"模拟试卷B卷"},{"t":1,"s":"（51~53题共用题干）其治法是","o":["发汗解表，温肺止咳","宣降肺气，清热化痰","解表散寒，温肺化饮","降气祛痰，纳气平喘","发散风热，清热化饮"],"a":"B","e":"根据51题，此证为痰热内蕴，风寒外束之哮喘，因此应宣降肺气、清热化痰。","k":"模拟试卷B卷"},{"t":1,"s":"（51~53题共用题干）治宜选用的方剂是","o":["定喘汤","小青龙汤","苏子降气汤","麻黄杏仁甘草石膏汤","贝母瓜蒌散"],"a":"A","e":"由于此证为痰热内蕴，风寒外束之哮喘，可选用定喘汤宣降肺气、清热化痰。","k":"模拟试卷B卷"},{"t":1,"s":"（54~56题共用题干）患者，男，18岁。近3日出现腹痛，便脓血，赤白相兼，里急后重，肛门灼热，小便短赤，舌苔黄腻，脉弦数。当辨证诊为","o":["湿热痢疾","热毒痢疾","虚寒痢疾","寒湿痢疾","阴虚痢疾"],"a":"A","e":"根据患者腹痛，便脓血，赤白相兼，里急后重，肛门灼热，小便短赤，舌苔黄腻，脉弦数，可以诊断为湿热痢疾。","k":"模拟试卷B卷"},{"t":1,"s":"（54~56题共用题干）当选用的治法是","o":["温中化湿，行气活血","清热解毒，凉血止痢","清热燥湿，调和气血","温补脾肾，涩肠止痢","滋阴养血，清热止痢"],"a":"C","e":"根据54题湿热痢疾判断，本证由湿热壅滞肠中，气血失调所致，因此可清热燥湿、调气和血。","k":"模拟试卷B卷"},{"t":1,"s":"（54~56题共用题干）当选用的方剂是","o":["四神丸","黄连解毒汤","乌梅丸","白头翁汤","芍药汤"],"a":"E","e":"芍药汤为治疗湿热痢疾之常用方，由芍药、槟榔、大黄、黄芩、黄连、当归、官桂、甘草、木香组成。","k":"模拟试卷B卷"},{"t":1,"s":"（57~59题共用题干）患者，男，25岁。发病5天，高热不退，烦闷躁扰，手足抽搐，舌绛而干，脉弦而数。此病例的病机是","o":["肝经热盛，热极动风","肝阳偏亢，肝风上扰","热入营血，心神被扰","邪热炽盛，灼伤阴血，虚风内动","温病后期，邪伏阴分"],"a":"A","e":"根据患者高热不退，烦闷躁扰，手足抽搐，舌绛而干，脉弦而数，为肝热生风证，本证系由温热病邪传入厥阴，肝经热盛，热极动风所致。","k":"模拟试卷B卷"},{"t":1,"s":"（57~59题共用题干）其治法是","o":["凉肝息风，增液舒筋","平肝息风，滋阴潜阳","祛风清热，通络散结","清营凉血，安神宁心","滋阴清热，养血息风"],"a":"E","e":"根据57题得肝热生风证，有高热不退、烦闷躁扰、手足抽搐等症状，因此治宜清热凉肝息风为主，配以养阴增液舒筋为法。","k":"模拟试卷B卷"},{"t":1,"s":"（57~59题共用题干）治疗宜首选的方剂是","o":["清营汤","镇肝熄风汤","天麻钩藤饮","羚角钩藤汤","大定风珠"],"a":"D","e":"羚角钩藤汤为治疗肝热生风证之常用方，由羚角片、桑叶、川贝、鲜生地、钩藤后、菊花、茯神木、生白芍、生甘草、淡竹茹组成，诸药相配，共奏凉肝息风、增液舒筋之功。","k":"模拟试卷B卷"},{"t":1,"s":"（60~61题共用备选答案）阳和汤中配伍麻黄的意义是","o":["宣通毛窍","固表止汗","宣肺平喘","利尿消肿","润肺止咳"],"a":"A","e":"阳和汤为治疗阴疽证，配伍少量麻黄，辛温达表，宣通毛窍，开腠理，散寒凝。","k":"模拟试卷B卷"},{"t":1,"s":"（60~61题共用备选答案）麻黄杏仁甘草石膏汤配伍麻黄的主要意义是","o":["宣通毛窍","固表止汗","宣肺平喘","利尿消肿","润肺止咳"],"a":"C","e":"麻黄杏仁甘草石膏汤用于治疗外感风邪，邪热壅肺证，可辛凉疏表、清肺平喘，配伍麻黄辛温，宣肺平喘、解表散邪。","k":"模拟试卷B卷"},{"t":1,"s":"（62~63题共用备选答案）小建中汤主治证的病机是","o":["中焦虚寒，肝脾失调","中焦虚寒，脾不统血","下焦阳衰，不达四末","中焦虚寒，浊阴上逆","中阳虚衰，阴寒内盛"],"a":"A","e":"小建中汤治疗中焦虚寒，肝脾失调，阴阳不和证，此证为中焦虚寒，肝脾失调，阴阳不和所致。","k":"模拟试卷B卷"},{"t":1,"s":"（62~63题共用备选答案）吴茱萸汤主治证的病机是","o":["中焦虚寒，肝脾失调","中焦虚寒，脾不统血","下焦阳衰，不达四末","中焦虚寒，浊阴上逆","中阳虚衰，阴寒内盛"],"a":"D","e":"吴茱萸汤治疗胃寒呕吐证、肝寒上逆证、肾寒上逆证，本证一为阳明寒呕，二为厥阴头痛，三为少阴吐利。其证虽属三经，然病机皆为虚寒之邪上逆犯胃所致。","k":"模拟试卷B卷"},{"t":1,"s":"（64~65题共用备选答案）四逆汤的君药是","o":["饴糖","干姜","人参","附子","甘草"],"a":"D","e":"四逆汤由炙甘草、干姜、附子组成，附子为君药。","k":"模拟试卷B卷"},{"t":1,"s":"（64~65题共用备选答案）理中丸的君药是","o":["饴糖","干姜","人参","附子","甘草"],"a":"B","e":"理中丸由人参、干姜、甘草、白术组成，方中干姜大辛大热，温脾暖胃，助阳祛寒为君药。","k":"模拟试卷B卷"},{"t":1,"s":"（66~67题共用备选答案）桑菊饮主治","o":["肺肾阴虚，虚火上炎之咳嗽","风邪犯肺之咳嗽","外寒内饮之咳嗽","风温初起，邪客肺络之咳嗽","上实下虚之喘咳"],"a":"D","e":"桑菊饮疏风清热、宣肺止咳，用于治疗风温初起，邪客肺络证。","k":"模拟试卷B卷"},{"t":1,"s":"（66~67题共用备选答案）止嗽散主治","o":["肺肾阴虚，虚火上炎之咳嗽","风邪犯肺之咳嗽","外寒内饮之咳嗽","风温初起，邪客肺络之咳嗽","上实下虚之喘咳"],"a":"B","e":"止嗽散功能宣利肺气、疏风止咳，为治疗风邪犯肺致咳嗽的常用方。","k":"模拟试卷B卷"},{"t":1,"s":"（68~69题共用备选答案）当归补血汤中当归与黄芪的用量比例是","o":["1∶2","1∶3","1∶5","3∶2","1∶7"],"a":"C","e":"方中重用黄芪，补气固表，生血，使阳生阴长，气旺血生，故以之为君。配以少量当归养血和营，并得黄芪生血之助，使阴血渐充，则浮阳秘敛，虚热自退。其用药比例1∶5。","k":"模拟试卷B卷"},{"t":1,"s":"（68~69题共用备选答案）大承气汤中大黄与厚朴的用量比例是","o":["1∶2","1∶3","1∶5","3∶2","1∶7"],"a":"A","e":"方中大黄苦寒泄热，攻积通便，荡涤肠胃邪热积滞，用为君药。积滞内阻，致使腑气不通，则内结之实热积滞，恐难速下，故本方重用厚朴亦为君药，行气消胀除满。因此用药比例为1∶2。","k":"模拟试卷B卷"},{"t":1,"s":"（74~75题共用备选答案）组成中含有川芎的方剂是","o":["温脾汤","酸枣仁汤","导赤散","三仁汤","参苓白术散"],"a":"B","e":"此方由酸枣仁、甘草、知母、茯苓、川芎组成。","k":"模拟试卷B卷"},{"t":1,"s":"（74~75题共用备选答案）组成中含有杏仁的方剂是","o":["温脾汤","酸枣仁汤","导赤散","三仁汤","参苓白术散"],"a":"D","e":"此方由杏仁、飞滑石、白通草、白蔻仁、竹叶、厚朴、生薏苡仁、半夏组成，主治湿温初起或暑温夹湿之湿重于热证。","k":"模拟试卷B卷"},{"t":1,"s":"（76~77题共用备选答案）龙胆泻肝汤方中配伍滋阴养血药物是","o":["生地、当归","生地、白芍","当归、熟地","白芍、当归","熟地、麦冬"],"a":"A","e":"因为肝为藏血之脏，肝经实火，易伤阴血，所用诸药又属苦燥渗利伤阴之品，故用生地养阴、当归补血，使祛邪而不伤正。","k":"模拟试卷B卷"},{"t":1,"s":"（76~77题共用备选答案）羚角钩藤汤方中配伍的滋阴养血药物是","o":["生地、当归","生地、白芍","当归、熟地","白芍、当归","熟地、麦冬"],"a":"B","e":"因热极动风，风火相煽，最易耗阴劫液，故用鲜生地凉血滋阴，白芍养阴柔肝。","k":"模拟试卷B卷"},{"t":1,"s":"（78~79题共用备选答案）大黄牡丹汤的组成包括","o":["桃仁、冬瓜仁","大黄、栀子","神曲、麦芽","芒硝、桂枝","山楂、莱菔子"],"a":"A","e":"大黄牡丹汤由大黄、丹皮、桃仁、瓜子、芒硝组成。","k":"模拟试卷B卷"},{"t":1,"s":"（80~81题共用备选答案）复元活血汤的君药是","o":["大黄、柴胡","青黛、栀子","柴胡、当归","栀子、黄连","生地、木通"],"a":"A","e":"复元活血汤主治跌打损伤，瘀血阻滞证。方中重用酒制大黄，荡涤凝瘀败血，导瘀下行，推陈致新；柴胡疏肝行气，并可引诸药入肝经。两药合用，一升一降，攻散胁下之瘀滞，共为君药。","k":"模拟试卷B卷"},{"t":1,"s":"（80~81题共用备选答案）咳血方的君药是","o":["大黄、柴胡","青黛、栀子","柴胡、当归","栀子、黄连","生地、木通"],"a":"B","e":"咳血方主治肝火犯肺之咳血证，故方中以青黛、栀子清肝泻火、凉血止血为君。","k":"模拟试卷B卷"},{"t":2,"s":"败毒散的药物组成包括","o":["羌活","独活","川芎","枳壳","木香"],"a":"ABCD","e":"败毒散由柴胡、前胡、川芎、枳壳、羌活、独活、茯苓、桔梗、人参、甘草组成。","k":"模拟试卷B卷"},{"t":2,"s":"理中丸的主治病证包括","o":["脾胃虚寒证","阳虚失血证","小儿慢惊风","病后喜唾涎沫","胸痹"],"a":"ABCDE","e":"理中丸主治脾胃虚寒证；阳虚失血证；中阳不足，阴寒上乘之胸痹；脾气虚寒，不能摄津之病后多涎唾；中阳虚损，土不荣木之小儿慢惊等病。","k":"模拟试卷B卷"},{"t":2,"s":"阳和汤的主治病证包括","o":["脱疽","鹤膝风","痰核","流注","贴骨疽"],"a":"ABCDE","e":"阳和汤治疗阴疽。如贴骨疽、脱疽、流注、痰核、鹤膝风等。","k":"模拟试卷B卷"},{"t":2,"s":"六味地黄丸中“三补”的药物是","o":["生地","熟地","山药","吴茱萸","山茱萸"],"a":"BCE","e":"熟地、山萸肉、山药君臣相伍，补肝脾肾，即所谓“三阴并补”。然熟地黄用量独重，而以滋补肾之阴精为主。","k":"模拟试卷B卷"},{"t":2,"s":"下列方剂的组成中含有四君子汤的是","o":["健脾丸","八珍汤","补中益气汤","参苓白术散","独活寄生汤"],"a":"ABD","e":"健脾丸由四君子汤（人参、茯苓、白术、甘草）加上山楂、麦芽、陈皮、枳实等药物组成，具有健脾和胃，消食止泻功用。八珍汤由四君子汤与四物汤合方而成，气血双补。参苓白术散是四君子汤加山药、莲子肉、白扁豆、薏苡仁、砂仁、桔梗而成。","k":"模拟试卷B卷"},{"t":2,"s":"黄芪、当归两药同用的方剂是","o":["玉屏风散","归脾汤","补中益气汤","补阳还五汤","牡蛎散"],"a":"BCD","e":"归脾汤由白术、人参、黄芪、当归、甘草、白茯苓、远志、酸枣仁、木香、龙眼肉、生姜、大枣组成。补中益气汤由黄芪、白术、陈皮、升麻、柴胡、人参、甘草、当归组成。补阳还五汤由黄芪、当归尾、赤芍、地龙（去土）、川芎、红花、桃仁组成。","k":"模拟试卷B卷"},{"t":2,"s":"仙方活命饮的功用是","o":["清热解毒","敛疮生肌","消肿溃坚","温阳补血","活血止痛"],"a":"ACE","e":"仙方活命饮由白芷、贝母、防风、赤芍药、当归尾、甘草节、皂角刺（炒）、穿山甲（炙）、天花粉、乳香、没药、金银花、陈皮组成，具有清热解毒、消肿溃坚、活血止痛之功。","k":"模拟试卷B卷"},{"t":2,"s":"芍药、甘草共用的方剂是","o":["桂枝汤","当归四逆汤","四逆散","小建中汤","五苓散"],"a":"ABCD","e":"桂枝汤组成为桂枝、芍药、甘草、大枣、生姜。当归四逆汤由当归、桂枝、芍药、细辛、通草、甘草、大枣组成。四逆散由柴胡、芍药、枳实、甘草组成。小建中汤由饴糖、桂枝、芍药、炙甘草、大枣、生姜组成。因此四方中都有芍药、甘草。","k":"模拟试卷B卷"},{"t":2,"s":"下列各项中属于“消法”范畴的是","o":["消食导滞","通导大便","行气活血","化痰利水","驱虫"],"a":"ACDE","e":"消法是通过消食导滞、行气活血、化痰利水、驱虫等方法，使气、血、痰、食、水、虫等有形之邪渐消缓散的一种治法。","k":"模拟试卷B卷"},{"t":1,"s":"应用麻黄汤与桂枝汤辨证要点的主要区别是","o":["恶寒发热","头身疼痛","舌苔脉象","口渴不渴","有汗无汗"],"a":"E","e":"麻黄汤与桂枝汤同属辛温解表之剂，都可用治外感风寒证。但麻黄汤为辛温发汗之重剂，适用于外感风寒，肺气失宣之恶寒发热、头疼身痛、无汗而喘、舌苔薄白、脉浮紧之表实证。桂枝汤发汗解表之力逊于麻黄汤，但有调和营卫之功，为辛温解表之和剂；适用于外感风寒，营卫不和所致的恶风发热、汗出、头痛、鼻鸣干呕、苔白不渴、脉浮缓或浮弱之表虚证。故二者辨证要点应是有汗无汗。","k":"模拟试卷C卷"},{"t":1,"s":"桑菊饮的组成不含有","o":["杏仁","桔梗","薄荷","芦根","竹叶"],"a":"E","e":"桑菊饮由桑叶、菊花、杏仁、连翘、薄荷、苦桔梗、甘草、苇根组成。","k":"模拟试卷C卷"},{"t":1,"s":"九味羌活汤的组成含有","o":["白芷、川芎","白术、黄芩","黄连、防风","细辛、升麻","生地、麻黄"],"a":"A","e":"九味羌活汤由羌活、防风、细辛、苍术、白芷、川芎、黄芩、生地、甘草组成。","k":"模拟试卷C卷"},{"t":1,"s":"治疗里热实证之热厥、痉病或发狂者，宜选用的药物组合是","o":["生地、玄参、麦冬","石膏、知母、粳米、竹叶","大黄、芒硝、炙甘草","生地、木通、竹叶、甘草","大黄、芒硝、枳实、厚朴"],"a":"E","e":"大承气汤由大黄、枳实、厚朴、芒硝组成，具有峻下热结的作用，主治：①阳明腑实证。②热结旁流证。③里热实证之热厥、痉病或发狂等。","k":"模拟试卷C卷"},{"t":1,"s":"温脾汤中含有的药物是","o":["附子、干姜","当归、细辛","人参、玄参","生地、芒硝","大黄、枳实"],"a":"A","e":"温脾汤由附子、大黄、芒硝、当归、干姜、人参、甘草组成。","k":"模拟试卷C卷"},{"t":1,"s":"芫花在十枣汤中的作用是","o":["渗利膀胱水湿","祛皮里膜外之痰湿","行经络络脉间水湿","消胸胁伏饮痰癖","泻脏腑之水湿"],"a":"D","e":"十枣汤主治水饮壅盛之实证，治宜攻逐水饮，使水邪速下。方中甘遂善行经隧水湿，大戟善泄脏腑水湿，芫花善消胸胁伏饮痰癖。","k":"模拟试卷C卷"},{"t":1,"s":"四逆散与龙胆泻肝汤均含有的药物是","o":["栀子、芍药","柴胡、甘草","枳实、当归","干姜、芍药","生地、甘草"],"a":"B","e":"四逆散由柴胡、芍药、枳实、甘草组成，龙胆泻肝汤由龙胆草、栀子、黄芩、木通、泽泻、车前子、柴胡、甘草、当归、生地组成。二者共有药物为柴胡和甘草。","k":"模拟试卷C卷"},{"t":1,"s":"蒿芩清胆汤的组成不包括","o":["栀子","滑石","青黛","半夏","竹茹"],"a":"A","e":"蒿芩清胆汤由青蒿、黄芩、枳壳、竹茹、陈皮、半夏、茯苓、碧玉散（滑石、甘草、青黛）组成。","k":"模拟试卷C卷"},{"t":1,"s":"小柴胡汤中柴胡与黄芩的配伍作用是","o":["解表清里","和解少阳","疏肝泄热","理气疏肝","解表燥湿"],"a":"B","e":"小柴胡汤是和解少阳的代表方剂。方中柴胡苦平，入肝胆经，透泄少阳之邪，并能疏泄气机之郁滞，使少阳半表之邪得以疏散，为君药。黄芩苦寒，清泄少阳半里之热，为臣药。柴胡之升散，得黄芩之降泄，两者配伍，是和解少阳的基本结构。","k":"模拟试卷C卷"},{"t":1,"s":"《伤寒论》原著中，半夏泻心汤证的成因是","o":["麻黄汤证误下","桂枝汤证过汗","小柴胡汤证误下","小柴胡汤证误汗","大承气汤证应下失下"],"a":"C","e":"《伤寒论》原文中提到“伤寒五六日，呕而发热者，柴胡汤证具，而以他药下之，柴胡证仍在者，复与柴胡汤……若心下满而硬痛者，此为结胸也，大陷胸汤主之；但满而不痛者，此为痞，柴胡不中与之，宜半夏泻心汤。”此方所治之痞，原系小柴胡汤证误行泻下，损伤中阳，少阳邪热乘虚内陷，以致寒热错杂，而成心下痞。","k":"模拟试卷C卷"},{"t":1,"s":"清胃散的组成不包括","o":["当归","生地","丹皮","升麻","连翘"],"a":"E","e":"清胃散由升麻、黄连、当归、生地、丹皮组成。","k":"模拟试卷C卷"},{"t":1,"s":"芍药汤的功用是","o": var S = {

  exam:null, review:false, chapter:null
};
var tick = null;

/* ---------------- 工具 ---------------- */
function $(id){ return document.getElementById(id); }
function shuffle(a){
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function esc(s){ return s; }
function toast(msg){
  var t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove('on'); }, 1700);
}
function show(id){
  closeSheet();
  var qm = document.getElementById('qrmask'); if(qm) qm.classList.remove('on');
  var ss = document.querySelectorAll('.screen');
  for(var i=0;i<ss.length;i++) ss[i].classList.remove('on');
  $(id).classList.add('on');
  window.scrollTo(0,0);
}
function fmtTime(ms){
  if(ms<0) ms=0;
  var s = Math.floor(ms/1000), m = Math.floor(s/60), h = Math.floor(m/60);
  if(h>0) return h + ':' + String(m%60).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
  return String(m).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}
function sortAns(s){ return String(s||'').split('').sort().join(''); }
function isWrongBy(gi){
  return S.res[gi] === 0;
}

/* ---------------- 会话 ---------------- */
function startSession(mode, opt){
  opt = opt || {};
  var all = Q.map(function(_,i){ return i; });
  var list;

  if(mode === 'seq'){
    list = all.slice();
    S.pos = Math.min(Math.max(DB.pos|0, 0), N-1);
  }else if(mode === 'rand'){
    list = shuffle(all.slice());
    if(opt.limit) list = list.slice(0, opt.limit);
    S.pos = 0;
  }else if(mode === 'chapter'){
    list = all.filter(function(i){ return Q[i].k === opt.kp; });
    S.pos = 0;
  }else if(mode === 'wrong'){
    list = DB.wrong.filter(function(i){ return i>=0 && i<N; }).slice();
    if(!list.length){ toast('错题本是空的，先去做几题'); return; }
    S.pos = 0;
  }else if(mode === 'fav'){
    list = DB.fav.filter(function(i){ return i>=0 && i<N; }).slice();
    if(!list.length){ toast('还没有收藏题目'); return; }
    S.pos = 0;
  }else if(mode === 'exam'){
    var sg = all.filter(function(i){ return Q[i].t === 1; });
    var mt = all.filter(function(i){ return Q[i].t === 2; });
    var pick = shuffle(sg.slice()).slice(0, 60).concat(shuffle(mt.slice()).slice(0, 40));
    list = shuffle(pick);
    S.pos = 0;
    S.exam = { start: Date.now(), limit: 90*60*1000 };
  }

  S.mode = mode;
  S.chapter = opt.kp || null;
  S.list = list;
  S.ans = {}; S.judged = {}; S.res = {};
  S.review = false;
  if(mode !== 'exam') S.exam = null;
  if(mode === 'exam') S.exam.start = Date.now();

  show('quiz');
  renderQ();
  startTimer();
}

function startTimer(){
  stopTimer();
  var t = $('timer');
  if(S.exam){
    t.style.display = '';
    var upd = function(){
      var left = S.exam.limit - (Date.now() - S.exam.start);
      t.textContent = fmtTime(left);
      t.classList.toggle('warn', left < 5*60*1000);
      if(left <= 0){ stopTimer(); submitExam(); }
    };
    upd();
    tick = setInterval(upd, 1000);
  }else{
    t.style.display = 'none';
  }
}
function stopTimer(){ if(tick){ clearInterval(tick); tick = null; } }

/* ---------------- 渲染题目 ---------------- */
function curQ(){ return Q[S.list[S.pos]]; }
function curIdx(){ return S.list[S.pos]; }

function renderQ(){
  var gi = curIdx(), q = curQ();
  var card = $('qcard');
  card.classList.remove('cin');
  void card.offsetWidth;
  card.classList.add('cin');

  $('qtag').textContent = q.t === 1 ? '单选题' : '多选题';
  $('qtag').className = 'tag' + (q.t === 2 ? ' multi' : '');
  $('qkp').textContent = q.k || '综合';
  $('stem').textContent = q.s;

  // 选项
  var box = $('opts'); box.innerHTML = '';
  var picked = (S.ans[gi] || '');
  var judged = !!S.judged[gi];
  var right = q.a;

  q.o.forEach(function(text, i){
    var L = LTR[i];
    var b = document.createElement('button');
    b.className = 'opt';
    b.dataset.l = L;
    var ob = document.createElement('span'); ob.className = 'ob'; ob.textContent = L;
    var ot = document.createElement('span'); ot.className = 'ot'; ot.textContent = text;
    var mk = document.createElement('span'); mk.className = 'mk'; mk.textContent = '';
    b.appendChild(ob); b.appendChild(ot); b.appendChild(mk);

    if(judged){
      b.classList.add('lock');
      var isR = right.indexOf(L) >= 0;
      var isP = picked.indexOf(L) >= 0;
      if(isR){ b.classList.add('right'); mk.textContent = '✓'; }
      else if(isP){ b.classList.add('bad'); mk.textContent = '✗'; }
      else b.classList.add('dim');
      if(S.review && isP && !isR) b.classList.add('bad');
    }else{
      if(picked.indexOf(L) >= 0) b.classList.add('sel');
      b.addEventListener('click', function(){ pick(L); });
    }
    box.appendChild(b);
  });

  // 解析
  var exp = $('exp');
  if(judged){
    var ok = S.res[gi] === 1;
    $('ansTxt').textContent = q.a.split('').join(' ');
    var v = $('verd');
    v.textContent = ok ? '回答正确' : '回答错误';
    v.className = 'verd ' + (ok ? 'ok' : 'no');
    $('expTxt').textContent = q.e || '本题暂无解析。';
    $('expKp').textContent = '考查范围：' + (q.k || '综合') + '　·　本题为' + (q.t===1?'单选':'多选') + '题';
    exp.classList.add('on');
  }else{
    exp.classList.remove('on');
  }

  renderFoot(judged, picked);
  renderProg();
  // 记录顺序模式位置
  if(S.mode === 'seq' && !S.review){ DB.pos = gi; save(); }
}

function renderProg(){
  var answered = 0;
  S.list.forEach(function(gi){ if(S.judged[gi]) answered++; });
  $('progTxt').textContent = (S.pos+1) + ' / ' + S.list.length;
  $('progSub').textContent = S.exam ? ('已答 ' + Object.keys(S.ans).length) : ('已答 ' + answered);
  var pct = S.exam ? (Object.keys(S.ans).length / S.list.length * 100)
                   : (answered / S.list.length * 100);
  $('progBar').style.width = pct + '%';
}

function renderFoot(judged, picked){
  var box = $('qfoot'); box.innerHTML = '';
  var q = curQ();
  var gi = curIdx();

  function btn(cls, label, fn, dis){
    var b = document.createElement('button');
    b.className = 'fbtn ' + cls;
    b.textContent = label;
    if(dis) b.disabled = true;
    b.addEventListener('click', fn);
    return b;
  }

  if(S.review){
    var b1 = btn('gh', '上一题', function(){ go(-1); }, S.pos === 0);
    var b2 = btn('pri', S.pos === S.list.length-1 ? '完成回顾' : '下一题', function(){
      if(S.pos === S.list.length-1) exitToHome(); else go(1);
    });
    box.appendChild(b1); box.appendChild(b2);
    return;
  }

  if(S.exam){
    var e1 = btn('gh', '上一题', function(){ go(-1); }, S.pos === 0);
    var e2 = btn('pri', S.pos === S.list.length-1 ? '交卷' : '下一题', function(){
      if(S.pos === S.list.length-1) submitExam(); else go(1);
    });
    box.appendChild(e1); box.appendChild(e2);
    return;
  }

  if(judged){
    var prev = btn('gh', '上一题', function(){ go(-1); }, S.pos === 0);
    var last = S.pos === S.list.length-1;
    var next = btn('pri', last ? '查看结果' : '下一题', function(){
      if(last) renderResult('practice'); else go(1);
    });
    box.appendChild(prev); box.appendChild(next);
    return;
  }

  if(q.t === 2){
    var pv = btn('gh', '上一题', function(){ go(-1); }, S.pos === 0);
    var cf = btn('pri', '确认作答', function(){ doJudge(); }, !picked);
    box.appendChild(pv); box.appendChild(cf);
  }else{
    var pv2 = btn('gh', '上一题', function(){ go(-1); }, S.pos === 0);
    var tip = btn('pri', '请选择答案', function(){}, true);
    box.appendChild(pv2); box.appendChild(tip);
  }
}

function pick(L){
  var gi = curIdx(), q = curQ();
  if(S.judged[gi] || S.review) return;

  if(q.t === 1){
    if(S.exam){
      S.ans[gi] = (S.ans[gi] === L) ? '' : L;
      repaintSel();
    }else{
      S.ans[gi] = L;
      doJudge();
    }
  }else{
    var cur = (S.ans[gi] || '').split('').filter(Boolean);
    var p = cur.indexOf(L);
    if(p >= 0) cur.splice(p, 1); else cur.push(L);
    S.ans[gi] = sortAns(cur.join(''));
    repaintSel();
  }
}

function repaintSel(){
  var picked = S.ans[curIdx()] || '';
  var opts = $('opts').children;
  for(var i=0;i<opts.length;i++){
    var L = opts[i].dataset.l;
    opts[i].classList.toggle('sel', picked.indexOf(L) >= 0);
  }
  var q = curQ();
  if(q.t === 2 && !S.exam && !S.judged[curIdx()]){
    var f = $('qfoot').querySelector('.fbtn.pri');
    if(f){ f.disabled = !picked; f.textContent = picked ? '确认作答' : '请选择答案'; }
  }
  renderProg();
}

function doJudge(){
  var gi = curIdx(), q = curQ();
  var picked = sortAns(S.ans[gi] || '');
  if(!picked) return;
  var ok = (picked === sortAns(q.a));
  S.judged[gi] = true;
  S.res[gi] = ok ? 1 : 0;

  DB.hist[gi] = ok ? 1 : 0;
  var w = DB.wrong.indexOf(gi);
  if(ok){ if(w >= 0) DB.wrong.splice(w, 1); }
  else { if(w < 0) DB.wrong.push(gi); }
  save();

  renderQ();   // 重绘（保留选中态）
  if(ok && DB.auto && S.pos < S.list.length-1){
    setTimeout(function(){ go(1); }, 720);
  }
}

function go(d){
  var n = S.pos + d;
  if(n < 0 || n >= S.list.length) return;
  S.pos = n;
  renderQ();
  if(S.mode === 'seq' && !S.review){ DB.pos = curIdx(); save(); }
}

function exitToHome(){
  stopTimer();
  renderHome();
  show('home');
}

/* ---------------- 交卷 ---------------- */
function submitExam(){
  if(!S.exam) return;
  var unanswered = 0;
  S.list.forEach(function(gi){
    var picked = sortAns(S.ans[gi] || '');
    if(!picked) unanswered++;
    var ok = picked && picked === sortAns(Q[gi].a);
    S.judged[gi] = true;
    S.res[gi] = ok ? 1 : 0;
    DB.hist[gi] = ok ? 1 : 0;
    var w = DB.wrong.indexOf(gi);
    if(ok){ if(w >= 0) DB.wrong.splice(w, 1); }
    else { if(w < 0) DB.wrong.push(gi); }
  });
  DB.examDone = (DB.examDone|0) + 1;
  save(true);
  stopTimer();
  renderResult('exam', unanswered);
}

/* ---------------- 结果 ---------------- */
function renderResult(kind, unanswered){
  var total = S.list.length;
  var ok = 0, no = 0;
  S.list.forEach(function(gi){ if(S.res[gi] === 1) ok++; else if(S.res[gi] === 0) no++; });
  var rate = total ? Math.round(ok/total*100) : 0;

  $('rTtl').textContent = kind === 'exam' ? '模拟考试 · 成绩单' : '本次练习 · 完成';
  $('rScore').innerHTML = '0<i>%</i>';
  $('rOk').textContent = ok;
  $('rNo').textContent = no;
  $('rTotal').textContent = total;
  var used = S.exam ? (Date.now() - S.exam.start) : 0;
  $('rTime').textContent = S.exam ? fmtTime(used) : '--';

  // 环形
  var C = 2 * Math.PI * 80;
  var ring = $('ring');
  ring.style.strokeDasharray = C;
  ring.style.strokeDashoffset = C;
  setTimeout(function(){ ring.style.strokeDashoffset = C * (1 - rate/100); }, 80);

  // 数字滚动
  var s0 = null;
  function step(ts){
    if(!s0) s0 = ts;
    var p = Math.min((ts - s0)/900, 1);
    var e = 1 - Math.pow(1-p, 3);
    $('rScore').innerHTML = Math.round(rate*e) + '<i>%</i>';
    if(p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);

  // 章节掌握
  var m = {}, order = [];
  S.list.forEach(function(gi){
    if(S.res[gi] === undefined) return;
    var k = Q[gi].k || '综合';
    if(!m[k]){ m[k] = {ok:0, n:0}; order.push(k); }
    m[k].n++; if(S.res[gi] === 1) m[k].ok++;
  });
  var bars = $('kpBars'); bars.innerHTML = '';
  order.sort(function(a,b){ return (m[a].ok/m[a].n) - (m[b].ok/m[b].n); });
  var shown = order.slice(0, 10);
  shown.forEach(function(k){
    var d = m[k], pc = Math.round(d.ok/d.n*100);
    var row = document.createElement('div'); row.className = 'bar';
    row.innerHTML = '<span class="n"></span><span class="t"><i></i></span><span class="v"></span>';
    row.querySelector('.n').textContent = k;
    row.querySelector('.v').textContent = d.ok + '/' + d.n + ' ' + pc + '%';
    bars.appendChild(row);
    setTimeout(function(){ row.querySelector('.t i').style.width = pc + '%'; }, 120 + Math.random()*160);
  });
  if(!order.length){
    bars.innerHTML = '<div class="empty">本组题目没有可统计的答题记录</div>';
  }else if(order.length > shown.length){
    var more = document.createElement('div');
    more.className = 'empty';
    more.style.padding = '10px 0 0';
    more.style.fontSize = '11.5px';
    more.textContent = '另有 ' + (order.length - shown.length) + ' 个章节未显示（题量较少）';
    bars.appendChild(more);
  }

  // 按钮
  var acts = $('rActs'); acts.innerHTML = '';
  function act(cls, label, fn){
    var b = document.createElement('button');
    b.className = 'fbtn ' + cls; b.textContent = label;
    b.addEventListener('click', fn); acts.appendChild(b);
  }
  var wrongN = S.list.filter(function(gi){ return S.res[gi] === 0; }).length;

  if(wrongN){
    act('pri', '重做错题（' + wrongN + ' 题）', function(){
      var list = S.list.filter(function(gi){ return S.res[gi] === 0; });
      S.list = list; S.pos = 0; S.review = false; S.exam = null;
      S.ans = {}; S.judged = {}; S.res = {};
      S.mode = 'wrong'; stopTimer();
      show('quiz'); renderQ();
    });
  }
  act('gh', '查看全部解析', function(){
    S.review = true; S.pos = 0; S.exam = null; stopTimer();
    show('quiz'); renderQ();
  });
  act('gh', '返回首页', function(){ stopTimer(); S.exam = null; renderHome(); show('home'); });

  show('result');
}

document.addEventListener('keydown', function(e){
  if(!$('quiz').classList.contains('on')) return;
  var k = e.key.toUpperCase();
  if(LTR.indexOf(k) >= 0 && k.length === 1){
    var opts = $('opts').children;
    for(var i=0;i<opts.length;i++){
      if(opts[i].dataset.l === k){ opts[i].click(); break; }
    }
  }else if(e.key === 'ArrowRight'){ go(1); }
  else if(e.key === 'ArrowLeft'){ go(-1); }
  else if(e.key === 'Enter'){
    var f = $('qfoot').querySelector('.fbtn.pri');
    if(f && !f.disabled) f.click();
  }
});
