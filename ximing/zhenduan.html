<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#a4432a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>中医诊断学 · 西学中题库</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --c1:#a4432a;
  --c2:#cf6b4a;
  --paper:#f6f3ec;
  --card:#fffdf8;
  --ink:#1b2422;
  --ink2:#3f4c48;
  --mut:#8b9793;
  --line:rgba(27,36,34,.09);
  --ok:#2e8f63;
  --okbg:#e8f5ee;
  --no:#c5463a;
  --nobg:#fbe9e6;
  --r:16px;
  --sh:0 2px 10px rgba(27,36,34,.05);
  --sh2:0 8px 28px rgba(27,36,34,.10);
}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--paper);color:var(--ink);
  font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
#app{max-width:720px;margin:0 auto;min-height:100vh;position:relative;overflow-x:hidden}
.screen{display:none}
.screen.on{display:block;animation:fade .28s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ============ 首页 ============ */
.hero{
  position:relative;overflow:hidden;
  padding:calc(18px + env(safe-area-inset-top)) 20px 44px;
  background:linear-gradient(158deg,var(--c1) 0%,var(--c2) 100%);
  color:#fff;border-radius:0 0 30px 30px;
}
.hero::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(60% 70% at 88% 8%,rgba(255,255,255,.22),transparent 62%),
    radial-gradient(50% 60% at 4% 96%,rgba(0,0,0,.16),transparent 60%);
}
.hero::after{
  content:"";position:absolute;right:-46px;top:-52px;width:190px;height:190px;
  border-radius:50%;border:1px solid rgba(255,255,255,.20);
  box-shadow:0 0 0 22px rgba(255,255,255,.05),0 0 0 46px rgba(255,255,255,.035);
}
.htop{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brandline{font-size:11.5px;letter-spacing:1.6px;opacity:.84;font-weight:500}
.qrbtn{
  width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);
  backdrop-filter:blur(4px);transition:transform .16s,background .16s;
}
.qrbtn:active{transform:scale(.92);background:rgba(255,255,255,.26)}
.qrbtn svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.7}
.hname{position:relative;font-size:27px;font-weight:800;letter-spacing:1.5px;margin-top:20px;line-height:1.28}
.hname small{display:block;font-size:12px;font-weight:500;letter-spacing:2.6px;opacity:.62;margin-top:7px;text-transform:uppercase}
.hmeta{position:relative;display:flex;align-items:center;gap:9px;margin-top:15px;font-size:12px;opacity:.9;flex-wrap:wrap}
.hmeta i{width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.55);font-style:normal}

.statcard{
  position:relative;margin:-28px 16px 0;padding:16px 16px 14px;
  background:var(--card);border-radius:var(--r);box-shadow:var(--sh2);
  border:1px solid var(--line);
}
.statrow{display:flex}
.st{flex:1;text-align:center;position:relative}
.st+.st::before{content:"";position:absolute;left:0;top:14%;height:72%;width:1px;background:var(--line)}
.st b{display:block;font-size:21px;font-weight:800;letter-spacing:.4px;font-variant-numeric:tabular-nums}
.st span{font-size:11.5px;color:var(--mut);letter-spacing:.6px}
.pbar{height:5px;border-radius:4px;background:rgba(27,36,34,.07);margin-top:14px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--c2),var(--c1));transition:width .6s cubic-bezier(.2,.8,.3,1)}

.cta{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  margin:14px 16px 0;padding:16px 18px;width:calc(100% - 32px);
  background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;
  border-radius:var(--r);box-shadow:0 10px 24px -10px var(--c1);
  transition:transform .14s ease;
}
.cta:active{transform:scale(.985)}
.cta span{font-size:16px;font-weight:700;letter-spacing:.6px}
.cta em{font-style:normal;font-size:12px;opacity:.8;font-weight:400}
.cta .arw{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;opacity:.85;flex:0 0 auto}

.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:26px 20px 11px}
.sec h2{font-size:14px;font-weight:700;letter-spacing:1.1px;color:var(--ink)}
.sec .hint{font-size:11.5px;color:var(--mut)}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.mode{
  display:flex;align-items:center;gap:11px;padding:15px 13px;min-height:74px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  text-align:left;box-shadow:var(--sh);transition:transform .14s,border-color .18s,box-shadow .18s;
}
.mode:active{transform:scale(.97)}
.mode .ic{
  flex:0 0 auto;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--c1) 10%,transparent);
}
.mode .ic svg{width:17px;height:17px;stroke:var(--c1);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mode b{display:block;font-size:14.5px;font-weight:700;letter-spacing:.3px;line-height:1.35}
.mode span{display:block;font-size:11px;color:var(--mut);margin-top:2px;letter-spacing:.2px}

.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px}
.chip{
  padding:8px 13px;border-radius:10px;background:var(--card);border:1px solid var(--line);
  font-size:12.5px;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;
  transition:transform .14s,border-color .16s,color .16s;
}
.chip:active{transform:scale(.95)}
.chip b{font-weight:700;font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.chip.hot{border-color:color-mix(in srgb,var(--c1) 34%,transparent);color:var(--c1);background:color-mix(in srgb,var(--c1) 6%,var(--card))}
.chip.hot b{color:var(--c2)}

.foot{padding:28px 20px calc(38px + env(safe-area-inset-bottom))}
.switch{display:flex;align-items:center;gap:10px;padding:13px 15px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:13px;color:var(--ink2)}
.switch input{display:none}
.switch i{position:relative;width:38px;height:22px;border-radius:20px;background:rgba(27,36,34,.14);flex:0 0 auto;transition:background .2s}
.switch i::after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch input:checked+i{background:var(--c1)}
.switch input:checked+i::after{transform:translateX(16px)}
.brand{margin-top:22px;text-align:center;font-size:11px;color:var(--mut);letter-spacing:.6px;line-height:1.9}

/* ============ 答题页 ============ */
#quiz{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.tbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
}
.ibtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;transition:background .16s,transform .14s;flex:0 0 auto}
.ibtn:active{transform:scale(.9);background:rgba(27,36,34,.06)}
.ibtn svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tprog{flex:1;min-width:0}
.tprog .t1{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin-bottom:5px;font-variant-numeric:tabular-nums}
.tprog .t1 b{color:var(--ink);font-weight:700}
.tline{height:4px;border-radius:3px;background:rgba(27,36,34,.08);overflow:hidden}
.tline i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c2),var(--c1));border-radius:3px;transition:width .35s cubic-bezier(.2,.8,.3,1)}
.timer{font-size:12px;font-weight:700;color:var(--c1);font-variant-numeric:tabular-nums;letter-spacing:.5px;padding:5px 9px;border-radius:8px;background:color-mix(in srgb,var(--c1) 9%,transparent);flex:0 0 auto}
.timer.warn{color:var(--no);background:var(--nobg);animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.45}}

.qwrap{padding:18px 16px 0}
.qcard{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:18px 17px 16px;box-shadow:var(--sh);
}
.qcard.cin{animation:cin .3s cubic-bezier(.2,.85,.3,1)}
@keyframes cin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.qcard.cin.rev{animation-direction:reverse}
.qhead{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.8px;padding:3px 8px;border-radius:6px;background:color-mix(in srgb,var(--c1) 11%,transparent);color:var(--c1)}
.tag.multi{background:rgba(160,120,40,.11);color:#9a7328}
.kptag{font-size:10.5px;letter-spacing:.3px;padding:3px 8px;border-radius:6px;background:rgba(27,36,34,.05);color:var(--mut);max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qnum{margin-left:auto;font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.stem{font-size:16.5px;line-height:1.78;letter-spacing:.2px;color:var(--ink);font-weight:500;word-break:break-word}
.opts{margin-top:16px;display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
  padding:12px 13px;background:#fff;border:1.4px solid var(--line);border-radius:13px;
  transition:border-color .16s,background .16s,transform .12s,box-shadow .16s;
  position:relative;
}
.opt:active{transform:scale(.988)}
.ob{
  flex:0 0 auto;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;font-weight:700;color:var(--mut);background:rgba(27,36,34,.05);
  transition:background .16s,color .16s,transform .16s;margin-top:1px;
}
.ot{font-size:15px;line-height:1.6;color:var(--ink2);letter-spacing:.2px;word-break:break-word}
.opt.sel{border-color:var(--c1);background:color-mix(in srgb,var(--c1) 5%,#fff)}
.opt.sel .ob{background:var(--c1);color:#fff}
.opt.sel .ot{color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .ob{background:var(--ok);color:#fff;animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
.opt.right .ot{color:#1e6b47;font-weight:600}
.opt.bad{border-color:var(--no);background:var(--nobg);animation:shake .32s}
.opt.bad .ob{background:var(--no);color:#fff}
.opt.bad .ot{color:#9c3428}
.opt.dim{opacity:.55}
.opt.lock{cursor:default}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}22%{transform:translateX(-6px)}45%{transform:translateX(5px)}70%{transform:translateX(-3px)}}
.opt .mk{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:15px;font-weight:800;opacity:0}
.opt.right .mk{opacity:1;color:var(--ok);animation:pop .34s .05s both}
.opt.bad .mk{opacity:1;color:var(--no)}

.exp{
  margin-top:14px;border-radius:14px;padding:0 14px;
  background:color-mix(in srgb,var(--c1) 5%,#fff);
  border:1px solid color-mix(in srgb,var(--c1) 15%,transparent);
  max-height:0;overflow:hidden;opacity:0;padding-top:0;padding-bottom:0;
  transition:max-height .34s cubic-bezier(.2,.85,.3,1),opacity .26s,padding .3s;
}
.exp.on{max-height:1400px;opacity:1;padding-top:13px;padding-bottom:13px;margin-top:15px}
.exphead{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.exphead .lbl{font-size:11px;color:var(--mut);letter-spacing:.6px}
.exphead .ans{font-size:15px;font-weight:800;color:var(--c1);letter-spacing:1px}
.exphead .verd{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.5px}
.verd.ok{color:var(--ok);background:var(--okbg)}
.verd.no{color:var(--no);background:var(--nobg)}
.exptxt{font-size:14px;line-height:1.85;color:var(--ink2);letter-spacing:.2px;word-break:break-word;white-space:pre-wrap}
.expfoot{display:flex;align-items:center;gap:8px;margin-top:11px;padding-top:10px;border-top:1px dashed color-mix(in srgb,var(--c1) 18%,transparent);font-size:11px;color:var(--mut)}

.qfoot{
  position:fixed;left:0;right:0;bottom:0;z-index:22;
  max-width:720px;margin:0 auto;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--paper) 92%,transparent);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:flex;gap:9px;
}
.fbtn{
  flex:1;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;gap:7px;
  font-size:15px;font-weight:700;letter-spacing:.6px;transition:transform .14s,opacity .2s,background .2s;
}
.fbtn:active{transform:scale(.98)}
.fbtn.pri{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;box-shadow:0 8px 18px -8px var(--c1)}
.fbtn.gh{background:rgba(27,36,34,.06);color:var(--ink2);flex:0 0 88px}
.fbtn[disabled]{opacity:.38;box-shadow:none}
.fbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ============ 答题卡 / 弹层 ============ */
.mask{
  position:fixed;inset:0;z-index:40;background:rgba(18,26,24,.42);
  opacity:0;pointer-events:none;transition:opacity .26s;backdrop-filter:blur(2px);
}
.mask.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:720px;margin:0 auto;
  background:var(--card);border-radius:22px 22px 0 0;
  transform:translateY(100%);transition:transform .34s cubic-bezier(.2,.85,.3,1);
  padding-bottom:env(safe-area-inset-bottom);max-height:82vh;display:flex;flex-direction:column;
}
.sheet.on{transform:none}
.shead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;flex:0 0 auto}
.shead h3{font-size:15px;font-weight:700;letter-spacing:.6px}
.shead .cbtn{font-size:12.5px;color:var(--mut);padding:5px 9px;border-radius:8px}
.sfilters{display:flex;gap:7px;padding:0 18px 12px;flex:0 0 auto}
.sf{font-size:12px;padding:6px 12px;border-radius:8px;background:rgba(27,36,34,.05);color:var(--ink2);transition:background .16s,color .16s}
.sf.on{background:var(--c1);color:#fff}
.grid{
  display:grid;grid-template-columns:repeat(8,1fr);gap:8px;
  padding:4px 18px 22px;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;
}
.gi{
  aspect-ratio:1;border-radius:9px;display:grid;place-items:center;
  font-size:12.5px;font-weight:700;color:var(--ink2);
  background:rgba(27,36,34,.055);transition:transform .12s,background .16s;font-variant-numeric:tabular-nums;
}
.gi:active{transform:scale(.9)}
.gi.ok{background:var(--okbg);color:var(--ok)}
.gi.no{background:var(--nobg);color:var(--no)}
.gi.did{background:color-mix(in srgb,var(--c1) 12%,transparent);color:var(--c1)}
.gi.cur{box-shadow:0 0 0 2px var(--c1);color:var(--c1);font-weight:800}
.gi.none{opacity:.35;pointer-events:none}
.legend{display:flex;gap:14px;padding:11px 18px 16px;font-size:11px;color:var(--mut);flex-wrap:wrap;flex:0 0 auto;
  background:var(--card);border-top:1px solid var(--line)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* 二维码弹层 */
.qrmask{position:fixed;inset:0;z-index:60;background:rgba(18,26,24,.55);backdrop-filter:blur(6px);display:none;place-items:center;padding:24px}
.qrmask.on{display:grid;animation:fade .22s}
.qrbox{background:var(--card);border-radius:22px;padding:22px 22px 18px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);max-width:320px;width:100%;animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(18px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.qrbox h4{font-size:15px;font-weight:700;letter-spacing:.8px;margin-bottom:3px}
.qrbox p{font-size:11.5px;color:var(--mut);margin-bottom:14px}
.qrbox img{width:100%;max-width:220px;border-radius:10px;display:block;margin:0 auto}
.qrbox .url{margin-top:12px;font-size:10.5px;color:var(--mut);word-break:break-all;line-height:1.6;background:rgba(27,36,34,.04);padding:7px 9px;border-radius:8px;font-family:ui-monospace,Menlo,monospace}
.qrbox .cbtn2{margin-top:12px;width:100%;height:42px;border-radius:11px;background:var(--c1);color:#fff;font-size:14px;font-weight:700;letter-spacing:.6px}
.qrbox .close{margin-top:9px;font-size:12px;color:var(--mut);padding:6px}

/* ============ 结果页 ============ */
#result{padding:calc(24px + env(safe-area-inset-top)) 0 calc(40px + env(safe-area-inset-bottom))}
.rhd{text-align:center;padding:12px 24px 4px}
.rhd .ttl{font-size:12px;letter-spacing:2.4px;color:var(--mut);text-transform:uppercase}
.ringwrap{position:relative;width:186px;height:186px;margin:18px auto 0}
.ringwrap svg{transform:rotate(-90deg)}
.ringwrap .bgc{stroke:rgba(27,36,34,.075);fill:none}
.ringwrap .fgc{stroke:url(#rg);fill:none;stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.3,1)}
.ringtxt{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ringtxt b{font-size:42px;font-weight:800;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums}
.ringtxt b i{font-size:16px;font-weight:600;font-style:normal;color:var(--mut);margin-left:2px}
.ringtxt span{font-size:11.5px;color:var(--mut);letter-spacing:1.6px;margin-top:8px}
.rsum{display:flex;justify-content:center;gap:0;margin:22px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 0;box-shadow:var(--sh)}
.rsum div{flex:1;text-align:center;position:relative}
.rsum div+div::before{content:"";position:absolute;left:0;top:12%;height:76%;width:1px;background:var(--line)}
.rsum b{display:block;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.rsum span{font-size:11px;color:var(--mut)}
.rsum .g{color:var(--ok)}
.rsum .r{color:var(--no)}

.block{margin:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 15px;box-shadow:var(--sh)}
.block h5{font-size:12.5px;font-weight:700;letter-spacing:.9px;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.block h5::before{content:"";width:3px;height:12px;border-radius:2px;background:var(--c1)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:flex;align-items:center;gap:9px;font-size:12px}
.bar .n{width:112px;flex:0 0 auto;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .t{flex:1;height:6px;border-radius:3px;background:rgba(27,36,34,.07);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--c2),var(--c1));width:0;transition:width .8s cubic-bezier(.2,.8,.3,1)}
.bar .v{width:52px;text-align:right;color:var(--mut);font-variant-numeric:tabular-nums;font-size:11px;flex:0 0 auto}
.racts{display:flex;flex-direction:column;gap:9px;margin:18px 16px 0}
.acts{display:flex;gap:9px;margin:18px 16px 0}
.acts .fbtn{flex:1}
.empty{text-align:center;color:var(--mut);font-size:13px;padding:28px 0}

.toast{
  position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,12px);
  background:rgba(24,32,30,.92);color:#fff;font-size:13px;padding:9px 16px;border-radius:10px;

'use strict';

var BANK = {"slug":"zhenduan","name":"中医诊断学","py":"Zhongyi Zhenduanxue","c1":"#a4432a","c2":"#cf6b4a","questions":[{"t":1,"s":"下列属于“病”概念的是","o":["高热","胸闷","内风","内痔","气滞"],"a":"D","e":"中医对疾病的命名，有的以主症为主要依据，如咳嗽、泄泻等；有的以病位为主要依据，如肠痈、肺痈等；有的以病因为主要依据，如伤寒、温病等；还有的以季节为主要依据，如冬温、春温等。病名是对该疾病全过程的特点与规律所做的概括，要注意与证名区别。","k":"绪论"},{"t":1,"s":"下列不属于“证”概念的是","o":["心阳虚","肝血虚","湿温","卫分证","肝火盛"],"a":"C","e":"“证”是中医学的一个特有概念，是对疾病过程中某一阶段的病因、病位、病性、病势的病理概括，既是该疾病这一阶段的本质反应，也是这一阶段的主要矛盾，将其概括成一个诊断名称，这就是“证名”，如痰热壅肺证、卫分证。考试中往往将具体的病名、证名同时出现，需注意区分。","k":"绪论"},{"t":2,"s":"下列属于中医诊断基本原则的是","o":["整体审察","诊法合参","以常衡变","病证结合","舍脉从症"],"a":"ABD","e":"在中医诊断学中，“原理”通常指基本道理，是事物产生发展变化所具有普遍意义的基本规律。“原则”是指导人们认知、思想、言论和行为的规定或准则。中医学中对人体生理病理的认识，是以直观的方法从总体方面看待其关系，构成了天人相应、神形相合、表里相关的整体观点。医生要在千变万化、错综复杂的临床表现中对病、证做出正确判断，就必须遵循中医诊断的基本原则，做到整体审察、诊法合参、病证结合。","k":"绪论"},{"t":1,"s":"若患者面色淡白消瘦，精神不振，动作迟缓，气短懒言，声低气怯，此属","o":["无神","得神","少神","失神","假神"],"a":"C","e":"少神的表现为两目晦滞，目光乏神，面色少华，暗淡不荣，精神不振，思维迟钝，少气懒言，肌肉松软，动作迟缓。提示精气不足，见于虚证患者或疾病恢复期患者。","k":"望诊"},{"t":1,"s":"若患者阳气暴脱，面色特征多为","o":["满面通红","淡白","惨白","苍白","两颧潮红"],"a":"D","e":"阳气暴脱的面色特征为苍白，即青白。淡白面色多见于血虚和失血患者。","k":"望诊"},{"t":1,"s":"虚阳上越可见","o":["面目俱黄","两颧潮红","满面通红","泛红如妆","面色青黄"],"a":"D","e":"实热证的面色特征为满面通红，虚热证的面色特征为两颧潮红，虚阳上越的面色特征为泛红如妆，黄疸的面色特征为面目俱黄，肝郁脾虚的面色特征为面色青黄。","k":"望诊"},{"t":1,"s":"小儿惊风的面色特点是","o":["阵发性面青","眉间、鼻柱、唇周发青","青紫","青黑","青黄"],"a":"B","e":"小儿于眉间、鼻柱、口唇四周出现青灰色，是惊风先兆或发作。由于外感寒邪，寒性凝滞，气血不畅；或阳气亏虚，气血瘀滞，经脉不利，面色多见青白、青紫或青黑晦暗。肝郁脾虚可见面色青黄相间。","k":"望诊"},{"t":1,"s":"患者有水饮，面色黑主要是","o":["黑而干焦","黧黑","眼眶周围发黑","口周黑","青黑"],"a":"C","e":"面色黧黑、肌肤甲错见于血瘀；面黑而干焦见于肾阴虚。水饮、肾虚为黑色主病，眼眶周围发黑多属肾虚水饮内停。","k":"望诊"},{"t":1,"s":"面目肌肤俱黄，黄而晦暗如烟熏属于","o":["萎黄","黄胖","阴黄","阳黄","淡黄"],"a":"C","e":"萎黄见于脾胃虚弱，气血亏虚，肌肤失养。黄而晦暗如烟熏为阴黄，寒湿内盛所致。","k":"望诊"},{"t":1,"s":"若患者阳气不足，面色特征多为","o":["苍白","㿠白而虚浮","淡白","面色黄而虚浮","目眶周围晦黑"],"a":"B","e":"患者阳气不足，水湿不化而见虚浮，阳虚无力推动气血上养面部而见面白，故㿠白而虚浮。","k":"望诊"},{"t":1,"s":"脏腑阳热亢盛的实热证，面色多为","o":["面色稍红","满面通红","两颧潮红，色泽鲜艳","面色苍白，时而泛红如妆","以上都不是"],"a":"B","e":"实热证的面色特征为满面通红，虚热证的面色特征为两颧潮红，虚阳上越的面色特征为面色苍白，时而泛红如妆。","k":"望诊"},{"t":1,"s":"气虚的面色特征为","o":["青白","淡白","苍白","黄白","青黄"],"a":"B","e":"气虚不能推动血行上养头面，可见面色淡白，故选B。","k":"望诊"},{"t":1,"s":"湿热郁蒸、胆汁外溢，常表现为","o":["苍黄","萎黄","阳黄","黄胖","阴黄"],"a":"C","e":"湿热郁蒸、胆汁外溢为阳黄的病机表达，故选C。","k":"望诊"},{"t":1,"s":"颧部潮红者属于","o":["真热假寒","阳明实热","阴虚内热","心火亢盛","真寒假热"],"a":"C","e":"实热证的面色特征为满面通红，虚热证的面色特征为两颧潮红，颧部潮红属阴虚内热。","k":"望诊"},{"t":1,"s":"小儿头形过小的原因主要是","o":["脾气虚弱","肝血不足","心血亏损","肾气不足","肾精不足"],"a":"E","e":"脾胃虚弱、后天失养可导致解颅。肾藏精生髓上通于脑，肾精不足，先天发育不良，可致小儿头形过小。","k":"望诊"},{"t":1,"s":"囟填的形成主要由于","o":["肾气不足","气血不足","吐泻伤津","温病火邪上攻","肾精不足"],"a":"D","e":"囟填指囟门突起，常见成因有温病火邪上攻、脑髓有病、颅内水液停聚。","k":"望诊"},{"t":1,"s":"若患者出现圆形或椭圆形片状脱发，并见光亮的头皮，常因","o":["脾胃虚弱","肾气亏虚","精血不足","血虚受风","血热"],"a":"D","e":"患者出现圆形或椭圆形片状脱发，并见光亮的头皮为斑秃的表现，而斑秃的形成原因为血虚受风。","k":"望诊"},{"t":1,"s":"患者出现苦笑貌，可见于","o":["麻风病","肝风内动","破伤风","狂犬病","白喉"],"a":"C","e":"破伤风因肌肉痉挛而出现苦笑貌。","k":"望诊"},{"t":1,"s":"根据目与五脏的对应关系，白睛属","o":["肺","脾","心","肝","肾"],"a":"A","e":"《黄帝内经》谓“气之精为白眼”，故白睛属肺。","k":"望诊"},{"t":1,"s":"小儿昏睡露睛属","o":["肝虚","肾虚","肺虚","脾虚","心虚"],"a":"D","e":"五轮学说中胞睑属脾，小儿昏睡露睛为脾虚所致。","k":"望诊"},{"t":1,"s":"颈侧颔下肿块累累如串珠，称为","o":["瘰疬","瘿瘤","发颐","痰核","梅核气"],"a":"A","e":"肺肾阴虚，虚火灼津结成痰核，或感受风热时毒，气血壅滞，结于颈项肿块累累如串珠，为瘰疬。颈部结喉处有肿块突起，可随吞咽而上下移动为瘿瘤。","k":"望诊"},{"t":1,"s":"面色黧黑而肌肤甲错属于","o":["瘀血","肾虚","水饮","肾绝","脾虚"],"a":"A","e":"血瘀日久，肌肤失养，可出现面色黧黑而肌肤甲错的表现。","k":"望诊"},{"t":1,"s":"疮疡患者，见体表局部范围较大、红肿、根盘紧束，伴有焮热疼痛者，属于","o":["痈","疖","疔","疽","以上都不是"],"a":"A","e":"痈的特点为红肿热痛。肌肤局部红肿高起，根盘紧束，伴有焮热疼痛者为痈，属阳证，多因热毒内蕴，致营卫不和，经络阻塞，气血壅滞不通，热盛肉腐成痈。","k":"望诊"},{"t":1,"s":"初起如粟，根脚坚硬较深、麻木、顶白而痛者为","o":["痈","疔","疽","疖","以上均不是"],"a":"B","e":"疔的特点为患部形小如粟，根深如钉，漫肿灼热，麻木疼痛，多发于颜面和手足。疖的特点为起于浅表，形小而圆，红肿热痛，容易化脓，根浅、脓出即愈。","k":"望诊"},{"t":1,"s":"疹的特征为","o":["平铺于皮下，抚之不碍手","高出于皮肤，抚之碍手","晶莹如粟的透明小疱疹","如粟，根脚坚硬，顶白而痛","生于皮肤浅表，红肿热痛不甚"],"a":"B","e":"疹的特点为形小如粟粒，高出肌肤，抚之碍手。斑则平铺于皮下，抚之不碍手。","k":"望诊"},{"t":1,"s":"皮肤漫肿无头，肤色不变，不热少痛者为","o":["痈","疖","疔","疽","丹毒"],"a":"D","e":"疽的特点为患部漫肿无头，皮色不变，难消、难溃、难敛，溃后易伤筋骨，属阴证，见于气血亏虚、阴寒凝滞。","k":"望诊"},{"t":1,"s":"心肺在舌的分属部位是（  ）","o":["舌尖","舌中","舌根","舌边","舌面"],"a":"A","e":"以五脏划分，舌尖属心肺。","k":"望诊"},{"t":1,"s":"下列不属于正常舌象的是（  ）","o":["舌苔较润","舌体柔软","舌质娇嫩","舌质淡红","舌苔薄白"],"a":"C","e":"娇嫩舌的特征为舌质纹理细腻，浮胖娇嫩，舌色浅淡，见于虚证，不属于正常舌象。其余各项的描述皆为正常舌象的特征。舌苔润泽是正常舌象中舌苔的特征之一。","k":"望诊"},{"t":1,"s":"下列既可见于热证，又可见于寒证的舌象是（  ）","o":["淡红舌","红舌","绛舌","淡白舌","紫舌"],"a":"E","e":"淡紫舌，见于阴寒凝滞，阳气虚衰；紫红舌、绛紫舌见于热毒炽盛，内入营血。","k":"望诊"},{"t":1,"s":"歪斜舌常见于（  ）","o":["阳虚","气虚","血虚","邪热亢盛","肝风夹痰"],"a":"E","e":"歪斜舌见于中风或中风先兆、喑痱。","k":"望诊"},{"t":1,"s":"舌淡白而胖嫩可见于（  ）","o":["气血凝滞","气血亏虚","阳气亏虚","风寒表证","阴寒内盛"],"a":"C","e":"本题主要考查舌色与舌质的综合分析。淡白舌见于气血两虚、阳虚；嫩舌见于虚证；胖舌见于痰（湿）邪。阳气亏虚可导致水液代谢障碍，气血亏虚不出现胖舌。","k":"望诊"},{"t":1,"s":"舌尖红赤可见于（  ）","o":["肝胆湿热","心火亢盛","肝胆火旺","胃肠热极","下焦热盛"],"a":"B","e":"红舌主热，包括实热和虚热，本题中选项皆为实热证，因而应根据舌面脏腑分属的内容进行判断，舌尖属心肺。","k":"望诊"},{"t":1,"s":"舌苔有根、无根主要用来辨别（  ）","o":["正邪盛衰","气血盛衰","胃气存亡","津液存亡","脏腑虚实"],"a":"C","e":"舌苔紧贴舌面，刮之不净，为有根之苔，即真苔；舌苔似浮涂于舌面，刮之即净，为无根之苔，即假苔。真苔提示胃气尚存，假苔多为胃气匮乏。","k":"望诊"},{"t":1,"s":"苔白厚如积粉多由于（  ）","o":["湿热蕴结","痰湿内阻","外感秽浊之邪","表邪不解，津液已伤","邪初入里，热未伤津"],"a":"C","e":"苔白厚如积粉，称为积粉苔，见于瘟疫、内痈。瘟疫的形成原因为外感秽浊之邪。","k":"望诊"},{"t":1,"s":"辨病邪深浅与性质、胃气的存亡，重在察（  ）","o":["舌质","舌色","舌形","舌苔","舌态"],"a":"D","e":"舌苔与舌质相比重在辨病邪深浅与性质，而舌苔由胃气化生，观察舌苔可了解胃气的存亡。","k":"望诊"},{"t":1,"s":"湿热蕴结的舌苔特征为（  ）","o":["白厚而腻","黄薄而干","黄白相兼","薄黄而滑润","苔黄而腻"],"a":"E","e":"黄主热，腻主湿。若只关注湿邪，或没有掌握黄主热，则易错选A。","k":"望诊"},{"t":1,"s":"久病舌红少苔多见于（  ）","o":["湿热内蕴","邪热蕴肺","胃热亢盛","肝胆火盛","阴虚内热"],"a":"E","e":"阴虚内热的典型舌象特征为舌红少苔。B、C、D皆为实热证，可见红舌，往往同时见黄苔，湿热内蕴可见黄厚腻苔。","k":"望诊"},{"t":1,"s":"下列不是热证表现的是（  ）","o":["舌绛","舌淡而青紫湿润","舌红","苔灰黑而干","苔黄"],"a":"B","e":"A、C、D、E皆可见于热证。灰黑苔既可见于热证，也可见于寒证。寒热属性要结合舌苔的润燥进行判断，其中干燥者为热证。","k":"望诊"},{"t":1,"s":"下列不属于血虚舌象的是（  ）","o":["薄白苔","淡白舌","瘦薄舌","裂纹舌","强硬舌"],"a":"E","e":"强硬舌常见于热入心包、高热伤津、风痰阻络，不见于血虚，并且血虚不会影响舌苔出现变化。","k":"望诊"},{"t":1,"s":"小儿食指络脉诊法适用于（  ）","o":["7岁以下","10岁以下","1岁以内","3岁以内","2岁以内"],"a":"D","e":"小儿食指络脉诊法适用于3岁以内。","k":"望诊"},{"t":1,"s":"若小儿外感风寒，则其食指纹色常表现为（  ）","o":["嫩红","淡红","鲜红","紫红","淡白"],"a":"C","e":"鲜红色多数情况下主热证，但在小儿食指络脉中主外感风寒。","k":"望诊"},{"t":1,"s":"小儿食指络脉色紫红的主病为（  ）","o":["里热证","表热证","血瘀证","惊风证","里寒证"],"a":"A","e":"里热证者小儿食指络脉多见紫红。","k":"望诊"},{"t":1,"s":"痰少而黏、难咯出者多属（  ）","o":["热痰","风痰","寒痰","燥痰","湿痰"],"a":"D","e":"痰白清稀为寒痰，痰黄稠有块为热痰，痰少而黏为燥痰，痰白滑量多易咯出为湿痰，痰中带血色鲜红为咯血。","k":"望诊"},{"t":1,"s":"肺痈常表现为（  ）","o":["痰白清稀","痰稀多泡沫","咳脓血腥臭痰","干咳痰少，夹有血丝","痰多色黄而稠"],"a":"C","e":"肺痈典型的表现为咳脓血腥臭痰，为热盛肉腐的表现。痰多色黄而稠为热痰的表现。","k":"望诊"},{"t":2,"s":"有神的患者可表现为","o":["肌肉不削","目光精彩","神志清楚","面红如妆","语言清亮"],"a":"ABCE","e":"面色苍白，时而见面红如妆，为戴阳证表现，属阴盛格阳于外，非有神。得神表现为神志清楚、语言清亮、目光精彩、肌肉不削。","k":"望诊"},{"t":2,"s":"假神多见于","o":["精气极度衰弱者","久病重病者","脾气虚弱者","肝气郁结者","痰迷心窍者"],"a":"AB","e":"久病重病患者，精气极度衰弱，出现假神，表现出突然的5种改变，即突然目似有光，但却浮光外露；突然面似有华，但为两颧泛红如妆；突然意识似清，但精神烦躁不安；忽思起床活动，但并不能自己转动；突然索食，且食量大增。","k":"望诊"},{"t":2,"s":"以下不属于恶色的是","o":["青如草兹","白如枯骨","黑如乌羽","赤如衃血","黄如蟹腹"],"a":"CE","e":"黑如乌羽、黄如蟹腹为仍有光泽的表现，属于善色。青如草兹、白如枯骨、赤如衃血皆为枯槁晦暗的恶色。","k":"望诊"},{"t":2,"s":"五色主病中，青色所主的病证有","o":["惊风证","寒证","痛证","失血证","瘀血证"],"a":"ABCE","e":"失血证可见面色淡白，为白色的主病之一。青色主寒证、气滞、血瘀、疼痛、惊风。","k":"望诊"},{"t":2,"s":"望面色中，属于黑色主病的是","o":["惊风","寒证","水饮","瘀血","气滞"],"a":"BCD","e":"惊风、气滞为青色主病。寒证、痛证、瘀血为黑色与青色共同见证。水饮、肾虚为黑色主病。","k":"望诊"},{"t":2,"s":"阴黄的病因病机是","o":["脾阳被困","湿热内蕴","寒湿内盛","痰湿内盛","肝胆失疏，胆汁外溢"],"a":"ACE","e":"湿热内蕴为阳黄的病因病机。阴黄为寒湿内盛、脾阳被困、肝胆失疏胆汁外溢所致。","k":"望诊"},{"t":2,"s":"病态表现为动、强、仰、伸者","o":["多热","多实","属阴","属阳","多寒"],"a":"ABD","e":"动、强、仰、伸多属阳证、热证、实证；静、弱、俯、屈多属阴证、寒证、虚证。","k":"望诊"},{"t":2,"s":"望发可以判断","o":["肝的病变","肾气充足与否","津液的盛衰","精血的盛衰","肺气的盛衰"],"a":"BD","e":"肾藏精，其华在发，发又为血之余，故头发色黑润泽浓密者，是肾气充盛，精血充足的表现；头发稀疏，色黄干枯者，是肾气亏虚，精血不足所致。","k":"望诊"},{"t":2,"s":"若患者出现鼻翼煽动，可见于","o":["脾气下陷","肺热","肺肾精气虚衰","阴虚内热","燥邪犯肺"],"a":"BC","e":"鼻翼煽动见于呼吸出现困难时，肺热、肺肾精气虚衰皆可致。","k":"望诊"},{"t":2,"s":"望咽喉主要可以诊断哪些脏腑的病变","o":["心","肺","胃","肝","肾"],"a":"BCE","e":"喉为肺之门户，咽内通于胃，肾之经脉循咽喉，故望咽喉可知肺、胃与肾之病变。","k":"望诊"},{"t":2,"s":"正常舌象可以出现（  ）","o":["润苔","淡红舌","齿痕舌","裂纹舌","薄白苔"],"a":"ABCDE","e":"正常舌象的特征为淡红舌、薄白而润的舌苔，而齿痕舌、裂纹舌均可见部分正常人群。","k":"望诊"},{"t":2,"s":"绛舌的主病为（  ）","o":["表热","湿热","肺热壅盛","阴虚火旺","热入营血"],"a":"CDE","e":"绛舌的主病为热盛，即脏腑热盛、阴虚火旺、热入营血。表热证不会引起舌质颜色的明显改变，湿热证多见红舌。","k":"望诊"},{"t":2,"s":"痿软舌的主病是（  ）","o":["阴亏已极","热灼津伤","气血俱虚","肝风内动","痰热阻络"],"a":"ABC","e":"痿软舌多由阴血亏虚，舌肌失养所致。舌淡白而渐痿者，属气血两亏；舌红绛而渐痿者，属肝肾阴亏已极；新病舌干红而暴痿，属热灼津伤。","k":"望诊"},{"t":2,"s":"黄腻苔的常见临床意义为（  ）","o":["热入营血","湿热蕴结","痰饮化热","食积化腐","外感风寒"],"a":"BCD","e":"黄苔见于热证，腻苔见于食积、痰湿等，而热入营血可见舌红绛。","k":"望诊"},{"t":2,"s":"胃阴亏虚的舌象可见（  ）","o":["黄厚苔","红舌","胖舌","瘦薄舌","剥落苔"],"a":"BDE","e":"胃阴亏虚的舌象需综合判断，阴虚产生虚热可见舌红，舌体失养可见瘦薄舌，舌苔的形成与胃气、胃阴关系密切，胃阴亏虚可见舌苔剥落。","k":"望诊"},{"t":2,"s":"阳气虚弱者可见（  ）","o":["淡白舌","齿痕舌","芒刺舌","苍老舌","胖嫩舌"],"a":"ABE","e":"阳气亏虚不能运血上养于舌而见淡白舌，阳虚不能温化水湿而见胖嫩舌，同时可见齿痕舌，而芒刺舌见于热证，苍老舌见于实证。","k":"望诊"},{"t":1,"s":"外感风寒或风热之邪，或痰湿壅肺，肺失宣肃，导致的音哑或失音，称为（  ）","o":["子喑","金破不鸣","金实不鸣","少气","短气"],"a":"C","e":"外感风寒或风热之邪，或痰湿壅肺，肺失清肃，邪闭清窍所致的音哑或失音，即为\"金实不鸣\"。若阴虚火旺，肺肾精气内伤所致的音哑或失音，即为\"金破不鸣\"。子喑是指妇女妊娠后期出现的音哑或失音。","k":"闻诊"},{"t":1,"s":"与语言异常关系最密切的脏腑是（  ）","o":["心","肺","肾","肝","脾"],"a":"A","e":"言为心声，语言的异常主要是心神的病变，故与心关系最为密切。肺、肾等脏腑主要与发声关系密切。","k":"闻诊"},{"t":1,"s":"神识不清，语言重复，时断时续，声音低弱，属于（  ）","o":["谵语","郑声","错语","独语","夺气"],"a":"B","e":"郑声是在患者神识不清的情况下，出现语言重复，时断时续，语声低弱模糊的表现。","k":"闻诊"},{"t":1,"s":"谵语的病机是（  ）","o":["心气大伤","热扰心神","瘀阻心窍","风痰阻络","心气虚弱"],"a":"B","e":"语言的异常，多与心的病变有关。谵语患者神志不清，语无伦次，声高有力，属实证，见于外感热病，温邪内入心包或阳明实热证。心气大伤是郑声的病机。","k":"闻诊"},{"t":1,"s":"独语、错语的共同病因是（  ）","o":["风痰阻络","热扰心神","心气大伤","心气不足","痰火扰心"],"a":"D","e":"独语是在无人时独自言语，喃喃不休，见人则止，首尾不续，多因心气虚弱或痰蒙心神所致。错语是指语后自知言错，有虚实之分，虚证多因心气虚弱所致。两者共同的病因病机为心气虚弱或痰阻心窍。","k":"闻诊"},{"t":1,"s":"语言謇涩的病因多属（  ）","o":["热扰心神","痰火扰心","风痰阻络","心气不足","心气大伤"],"a":"C","e":"语言謇涩的病因多为风痰阻络所致，乃中风之先兆或后遗症，并非心气不足。","k":"闻诊"},{"t":1,"s":"呼吸气急而短促，数而不相接续的是（  ）","o":["少气","夺气","气粗","短气","气微"],"a":"D","e":"呼吸气急而短促，气短不足以息，数而不相接续为短气的表现，要注意与少气区别。少气主要以气少不足以息，言语无力为表现。","k":"闻诊"},{"t":1,"s":"下列与虚喘发作关系最密切的是（  ）","o":["心、肺","肝、肺","肺、肾","脾、肺","脾、肾"],"a":"C","e":"喘可分虚实，根据发作的缓急、呼吸的深长或短浅、声音的高低来区分，多与肺、心病变有关，也与脾、肾有关。实喘多与肺失宣肃有关，而虚喘多由肺肾亏虚，气失摄纳，或心阳气虚所致。","k":"闻诊"},{"t":1,"s":"咳声重浊，痰稀色白者，辨证属（  ）","o":["风寒","痰湿","燥热","脾虚","肺气虚"],"a":"A","e":"咳声重浊，多属实证，可见于寒痰湿浊停聚于肺，痰稀色白多为风寒所致咳嗽。痰湿所致的咳嗽，其痰的特征应为量多色白，易于咯出。燥邪所致咳嗽，多为干咳无痰或少痰。肺气虚所致的咳嗽，其咳声应为轻清低微，而且痰稀量少。","k":"闻诊"},{"t":1,"s":"咳声不扬，痰稠色黄，不易咯出者，证属（  ）","o":["风热袭表","寒邪客肺","热邪犯肺","寒痰阻肺","阴虚肺燥"],"a":"C","e":"咳声不扬，痰稠色黄，不易咯出，多属热证，因热邪犯肺所致。阴虚肺燥者，多见干咳无痰或少痰。寒痰阻肺者，多见咳有痰声，痰多易咯。","k":"闻诊"},{"t":1,"s":"干咳无痰或痰少而黏者，证属（  ）","o":["热邪犯肺","燥邪犯肺","风热犯肺","痰湿阻肺","肺肾阴虚"],"a":"B","e":"干咳无痰或痰少而黏，多见于燥邪犯肺或阴虚肺燥。热邪犯肺者，咳声不扬，痰稠色黄，不易咯出。痰湿阻肺者，咳嗽，痰多易咯。","k":"闻诊"},{"t":1,"s":"呕吐物秽浊有酸臭味者，多属于（  ）","o":["寒呕","热呕","伤食","痰饮","肝胆郁热"],"a":"C","e":"呕吐物秽浊有酸臭味者，多有暴饮暴食病史，致食滞胃脘，胃失和降，胃气上逆。呕吐物清稀，多数寒呕；呕吐物黏稠，多属热呕。","k":"闻诊"},{"t":1,"s":"水逆证的呕吐特点是（  ）","o":["吐利并作","饮后即吐","朝食暮吐","呕吐酸腐","呕吐如喷"],"a":"B","e":"口干欲饮，饮后则吐，即为水逆证。吐利并作多为霍乱。朝食暮吐为胃反。呕吐酸腐为伤食。呕吐如喷为热扰神明。","k":"闻诊"},{"t":1,"s":"嗳气频作连续，兼脘腹冷痛者，辨证属（  ）","o":["寒邪客胃","湿困脾胃","肝气犯胃","宿食内停","胃虚气逆"],"a":"A","e":"嗳气频作连续，兼脘腹冷痛，得温痛减者，多为寒邪犯胃或胃阳亏虚。嗳气声低沉断续，无酸腐气味，兼纳呆食少，多为胃虚气逆。嗳气酸腐，兼脘腹胀满，多因宿食内停。","k":"闻诊"},{"t":1,"s":"嗳气频作响亮，常因情志变化而增减者，证属（  ）","o":["胃虚气逆","寒邪客胃","食滞胃脘","肝气犯胃","胃肠实热"],"a":"D","e":"嗳气频作响亮，嗳气后胀减，常因情志变化而增减者，多见于肝气犯胃。嗳气频作，兼脘腹冷痛，得温痛减者，多为寒邪犯胃。","k":"闻诊"},{"t":1,"s":"胃有宿食者，可闻到（  ）","o":["口气臭秽","口气酸臭","口气酒臭","口气腐臭","口中散发烂苹果气味"],"a":"B","e":"口气酸臭，多属食积胃肠；口气臭秽，多属胃热；口气腐臭，多是内有溃腐脓疡；口气臭秽难闻，牙龈腐烂者，为牙疳。口中散发烂苹果气味可见于消渴重症，口气酒臭可见于饮酒。","k":"闻诊"},{"t":1,"s":"病室有烂苹果样气味提示（  ）","o":["溃腐疮疡","有机磷中毒","消渴病危重期","失血","脏腑衰败"],"a":"C","e":"病室气味是由病体本身或排出物所散发的。临床上通过嗅病室气味，可作为推断病情及诊断特殊疾病的参考。腐臭气见于溃腐疮疡；有蒜臭味见于有机磷中毒；病室有烂苹果样气味见于消渴病危重期酮症；有血腥味见于失血；有尸臭见于脏腑衰败。","k":"闻诊"},{"t":2,"s":"新病音哑或失音的病因有（  ）","o":["风寒袭肺","风热袭肺","肺肾精气内伤","痰湿壅肺","气阴耗伤"],"a":"ABD","e":"新病音哑或失音，多属实证，多因外感风寒或风热袭肺，或痰湿壅肺，肺失清肃所致。气阴耗伤、肺肾精气内伤多见于久病音哑或失音者。","k":"闻诊"},{"t":2,"s":"错语是指（  ）","o":["语言错乱","说后自知","笑骂无常","喃喃不休","以上都不是"],"a":"AB","e":"错语是指患者神识清楚而语言时有错乱，语后自知言错的症状。喃喃不休是独语的表现。","k":"闻诊"},{"t":2,"s":"独语可见于（  ）","o":["心气不足","气郁痰结","温病热入心包","阳明腑实证","伤寒蓄血证"],"a":"AB","e":"独语可见于心气虚弱，气郁痰阻。温病热入心包或阳明腑实证者，可见谵语。伤寒蓄血证者可出现狂言。","k":"闻诊"},{"t":2,"s":"喘证常见于（  ）","o":["风寒袭肺","痰热壅肺","肺肾亏虚","痰火扰心","心气不足"],"a":"ABC","e":"喘证有虚实之分。实证多与肺有关，分为外感与内伤，外感风寒袭肺，或内有痰热壅肺，饮停于肺、水气凌心等所致；虚证多与肺、肾及心有关，多是肺肾亏虚，心阳气虚所致。","k":"闻诊"},{"t":2,"s":"嗳气的病因有（  ）","o":["宿食停滞","胃虚气逆","寒邪客胃","肝气犯胃","风寒袭肺"],"a":"ABCD","e":"嗳气多由宿食内停，肝气犯胃，寒邪犯胃，胃阳亏虚，胃虚气逆等导致胃气上逆而出现。风寒袭肺一般不见嗳气，但偶感风寒，一时胃气上逆动膈可出现呃逆。","k":"闻诊"},{"t":2,"s":"呃逆的病因为（  ）","o":["寒邪客胃","热邪客胃","胃气衰败","肝郁脾虚","肝胃不和"],"a":"ABC","e":"引起呃逆的原因有寒邪或热邪客胃，胃气衰败，饮食刺激等。久病、重病呃逆不止多是胃气衰败。而肝胃不和可出现嗳气。","k":"闻诊"},{"t":2,"s":"胃反的临床特点是（  ）","o":["食后即吐","朝食暮吐","暮食朝吐","呕吐如喷","干呕无物"],"a":"BC","e":"胃反多为脾胃阳虚所致，其表现为朝食暮吐，暮食朝吐。","k":"闻诊"},{"t":1,"s":"如果寒邪直中内脏，患者可见到的症状是（  ）","o":["恶寒重发热轻","但寒不热","发热轻而恶风","但热不寒","寒热往来"],"a":"B","e":"但寒不热是患者只觉怕冷而无发热的表现。若寒邪直中脏腑，可见但寒不热的里寒之征。","k":"问诊"},{"t":1,"s":"风寒表证的寒热症状特点是（  ）","o":["但热不寒","但寒不热","发热轻而恶风","恶寒重发热轻","寒热往来"],"a":"D","e":"恶寒重发热轻是外感寒邪所致表寒证的特征。因为寒为阴邪，易伤阳气，又可阻遏阳气的宣散，故见此症。","k":"问诊"},{"t":1,"s":"午后和夜间有低热形成的病因是（  ）","o":["阴虚","阳虚","营分有热","阳明腑实证","气虚"],"a":"A","e":"阴虚潮热的特点为午后和夜间有低热；温病热入营分，潮热特点为发热以夜间为甚，两者需要重点鉴别。","k":"问诊"},{"t":1,"s":"可出现自汗与盗汗并见的是（  ）","o":["气虚证","血瘀证","气阴两虚证","血虚证","气血两虚证"],"a":"C","e":"自汗常见于气虚证、阳虚证，盗汗常见于阴虚证，而气阴两虚证可自汗与盗汗并见。","k":"问诊"},{"t":1,"s":"里实热证的汗出特点为（  ）","o":["冷汗淋漓","日间汗出，活动尤甚","战栗而后汗出","蒸蒸发热，汗出不已","睡则汗出，醒则汗止"],"a":"D","e":"A项为亡阳的特点，B项为自汗的特点，C项为战汗的特点，E项为盗汗的特点。只有D项的表述为里实热证的汗出特点，由阳气盛蒸腾津液外达而导致。","k":"问诊"},{"t":1,"s":"出现战汗多提示（  ）","o":["邪去正安","邪胜正衰","邪正相争剧烈","阴阳离决","阴虚"],"a":"C","e":"邪去正安、邪胜正衰为战汗后的两类不同结果。","k":"问诊"},{"t":1,"s":"出现半身汗出的原因是（  ）","o":["风痰阻滞经络","中焦郁热","阳气虚损","阴虚火旺","以上都不是"],"a":"A","e":"半身汗出的病机是气血运行不畅，而且健侧有汗，患侧无汗，患侧气血不畅，营卫不通，津液皆通于另一侧。","k":"问诊"},{"t":1,"s":"脾胃虚弱而致脘腹疼痛的特点是（  ）","o":["隐隐作痛","痛如刀绞","冷痛喜温","胀满疼痛","走窜不定"],"a":"A","e":"脾胃虚弱而致脘腹疼痛属于虚证疼痛，症见隐痛，脾胃虚寒的寒证疼痛则可见冷痛喜温。","k":"问诊"},{"t":1,"s":"厥阴头痛的部位特点是（  ）","o":["前额疼痛连及眉棱骨","后头痛连项","两侧太阳穴附近痛","巅顶头痛","头痛连齿"],"a":"D","e":"足厥阴肝经上达巅顶，故头两侧痛为少阳头痛。","k":"问诊"},{"t":1,"s":"胸闷，壮热，鼻翼扇动者，多属（  ）","o":["心阳不足","痰饮停肺","痰热壅肺","寒邪客肺","肺肾气虚"],"a":"C","e":"壮热提示患者有肺热，B项与C项的相同之处都有痰邪，不同之处为一寒一热。","k":"问诊"},{"t":1,"s":"耳鸣渐生，声小时止者，辨证属（  ）","o":["瘀血阻滞","肝胆火盛","痰浊上蒙","肾气虚弱","风邪上袭"],"a":"D","e":"肾开窍于耳，肾气虚弱，耳失充养，故有耳鸣渐生，声小时止，常兼重听之症。","k":"问诊"},{"t":1,"s":"突发耳鸣，声大如潮声，按之不减者，多因（  ）","o":["肝胆火盛","阴虚火旺","肝肾阴虚","肾精亏损","心火亢盛"],"a":"A","e":"手足少阳经脉分布于耳，肝胆火盛可见突发耳鸣，答错原因往往是只记得病性不清楚病位。","k":"问诊"},{"t":1,"s":"耳鸣，以手按之可减轻者，多属（  ）","o":["肝胆火盛","肾虚精亏","痰湿内蕴","外感风邪","肝火上炎"],"a":"B","e":"耳之虚证多责之肾。\"以手按之可减轻\"提示病证为虚证。","k":"问诊"},{"t":1,"s":"饭后嗜睡，少气懒言，神疲倦怠，食少纳呆者，多属（  ）","o":["肝郁犯脾","痰湿困脾","心肾阳气虚衰","热入心包","脾气亏虚"],"a":"E","e":"痰湿困脾、脾气亏虚皆可见嗜睡，食少纳呆，但痰湿困脾可见头目昏沉、肢体困重等湿邪的症状，脾气亏虚可见气虚的表现，如少气懒言、神疲倦怠。","k":"问诊"},{"t":1,"s":"症见渴喜热饮者，其病机是（  ）","o":["寒湿内盛","湿热内蕴","痰饮内停","瘀血阻滞","胃阴不足"],"a":"C","e":"渴喜热饮为痰饮内停的表现，由于津液停聚，化为痰饮，不能上承口腔而导致，寒湿不出现渴的症状。","k":"问诊"},{"t":1,"s":"温病热入营分可见（  ）","o":["口渴喜饮","渴喜热饮","渴不冷饮","渴不多饮","但欲漱水不欲咽"],"a":"D","e":"热入营分，热伤津液出现口渴，但又因为热进入营分，可蒸腾营阴上腾于口，故不多饮。","k":"问诊"},{"t":1,"s":"但欲漱水不欲咽者，其病机是（  ）","o":["湿热内蕴","寒湿内盛","痰饮内停","瘀血阻滞","胃阴不足"],"a":"D","e":"渴不多饮可见4种情况，其中，若瘀血阻滞，气不化津，可见但欲漱水而不欲下咽的症状。","k":"问诊"},{"t":1,"s":"胃阴不足可见（  ）","o":["厌食","消谷善饥","食欲不振","饥不欲食","食量减少"],"a":"D","e":"饥不欲食是指患者有饥饿感但不欲进食或进食不多，常由胃阴不足，虚火内扰而致，饥不欲食的一个方面为\"饥\"。","k":"问诊"},{"t":1,"s":"口酸是因为（  ）","o":["胃气上逆","脾胃气虚","脾胃湿热","燥热伤津","肝胃不和"],"a":"E","e":"口酸多见于伤食、肝胃郁热。形成口酸的原因为食滞胃脘，化腐生酸；酸味入肝，肝郁化热犯胃，胃失和降，则泛吐酸水。","k":"问诊"},{"t":1,"s":"肝郁脾虚时的粪便特点是（  ）","o":["完谷不化","便下脓血","下注黄糜","时干时稀","先干后稀"],"a":"D","e":"肝郁脾虚所致的便质异常特点是时干时稀，其与先干后稀同属溏结不调中的内容，先干后稀的病机为脾虚。","k":"问诊"},{"t":1,"s":"大便中夹杂有脓血黏液者，辨证属（  ）","o":["脾肾阳虚","肝郁脾虚","食积肠胃","脾气不足","湿热蕴结"],"a":"E","e":"由于湿热蕴结大肠，肠道脉络受损，故大便中夹杂有脓血黏液，为湿热痢疾的主要见症。","k":"问诊"},{"t":1,"s":"大便夹有不消化食物，酸腐臭秽者，多因（  ）","o":["大肠湿热","肝胃不和","伤食积滞","脾胃虚弱","肝郁乘脾"],"a":"C","e":"D、E两项也可出现大便夹有不消化食物，但酸腐臭秽多由伤食而引起。","k":"问诊"},{"t":1,"s":"小便频数，色黄而急迫者，病机为（  ）","o":["消渴病","瘀血阻滞","肾气不固","肾阳不足","膀胱湿热"],"a":"E","e":"膀胱的功能为贮尿和排尿，湿热侵袭膀胱，膀胱气化不利时，可见小便频数，尿少色黄而急迫。","k":"问诊"},{"t":1,"s":"若月经推迟7天以上，量少、色淡而质稀者，辨证属（  ）","o":["血寒","血虚","血热","血瘀","气滞"],"a":"B","e":"血虚可导致冲任空虚，胞宫失养，故见月经推迟，且血量少，色淡而质稀。","k":"问诊"},{"t":1,"s":"妇女月经先期而来，量多，色深而质稠，其辨证多属（  ）","o":["气虚不能摄血","肝气郁滞","血热内迫","瘀血积滞","寒凝血滞"],"a":"C","e":"血热迫血妄行，月经可提前而至；气虚不能摄血，同样可导致月经可提前而至，但气虚者色淡质稀。","k":"问诊"},{"t":1,"s":"妇女带下色白，清稀如涕，无臭味，其病机为（  ）","o":["湿热下注","冲任亏虚","肝经郁热","脾肾阳虚","脾胃阳虚"],"a":"D","e":"冲任亏虚多引起月经病变，一般不引起带下病。","k":"问诊"},{"t":1,"s":"带下状如凝乳或豆腐渣者，多因（  ）","o":["冲任亏虚","湿浊下注","肝经郁热","脾虚湿盛","肾精亏虚"],"a":"B","e":"带下量多常因湿邪，色黄多为有热，色白则为寒，凝乳或豆腐渣多为湿浊。","k":"问诊"},{"t":2,"s":"引起心悸的主要原因是（  ）","o":["心胆气虚","胆郁痰扰","心阳不足","心血不足","肝胃郁热"],"a":"ABCD","e":"心胆气虚、胆郁痰扰、心阳不足、心血不足皆是引起心悸的常见原因，而肝胃郁热一般不直接引起心悸。","k":"问诊"},{"t":2,"s":"引起头晕的常见原因是（  ）","o":["气血亏虚","肝阳上亢","湿热蕴脾","痰湿内阻","肾虚精亏"],"a":"ABDE","e":"气血亏虚、肝阳上亢、肝火上炎、痰湿内阻、肾虚精亏是引起头晕的常见原因。","k":"问诊"},{"t":2,"s":"厌食的常见病机是（  ）","o":["湿热蕴脾","食滞胃脘","肝胆湿热","脾胃虚弱","妊娠恶阻"],"a":"ABCE","e":"湿热蕴脾、食滞胃脘、肝胆湿热、妊娠恶阻是引起厌食的常见病机，脾胃虚弱一般不见于厌食，其饮食方面的改变为食欲减退、食量减少。","k":"问诊"},{"t":2,"s":"泄泻的病因是（  ）","o":["肾阳虚衰","肾阴亏损","肠胃积滞","大肠湿热","脾胃虚弱"],"a":"ACDE","e":"脾肾阳虚、肠胃积滞、大肠湿热、肝郁乘脾、外感风寒和湿热疫毒之邪是引起泄泻的常见原因。","k":"问诊"},{"t":2,"s":"下列属于排便感异常的是（  ）","o":["排便不爽","里急后重","肛门气坠","完谷不化","大便失禁"],"a":"ABCE","e":"完谷不化为便质异常中的内容。","k":"问诊"},{"t":2,"s":"引起尿量减少的主要原因是（  ）","o":["热盛伤津","水液内停","湿热蕴结膀胱","汗吐下伤津","心气亏虚"],"a":"ABCD","e":"引起尿量减少的主要原因有热、泻、汗、吐、下导致尿液化源不足，肺、脾、肾功能失常导致水液内停，湿热、瘀血、结石等导致水道不利。","k":"问诊"},{"t":2,"s":"引起痛经的原因是（  ）","o":["气滞血瘀","湿热蕴结","寒凝胞宫","气血两虚","痰湿内阻"],"a":"ABCD","e":"痛经指经期或行经前后，周期性发生下腹部疼痛，或痛引腰骶，甚至剧痛难忍。其常见病因有气滞血瘀、湿热蕴结、寒凝胞宫、阳虚、气血两虚、肾精不足等。","k":"问诊"},{"t":1,"s":"左右手寸关尺分候脏腑，目前一般是（  ）","o":["左：心，肝，肾；右：肺，脾，肾","左：心，脾，肾；右：肺，肝，肾","左：肺，脾，肾；右：心，肝，肾","左：脾，肺，肾；右：心，肝，肾","左：心，肺，肾；右：肝，脾，肾"],"a":"A","e":"关于寸口分候脏腑，最易出错的是左关和右关，肝和脾的对应位置出错。记住一句话：\"左手心肝肾，右手肺脾肾\"。","k":"切诊"},{"t":1,"s":"与脉象形成的相关脏器中最重要的是（  ）","o":["心","肺","脾胃","肝","肾"],"a":"A","e":"脉象的形成与各个脏腑都有关系，但与心的关系最为密切。","k":"切诊"},{"t":1,"s":"医生手指用力较重，甚至按到筋骨以体察脉象的方法，称为（  ）","o":["举法","寻法","按法","总按","单按"],"a":"C","e":"举法是指三指轻放，触及脉的皮肤的方法（浮取）；按法用力较重，甚至按到筋骨以体察脉象（沉取）；寻法指中等用力，按至肌肉，调节指力，左右推寻，体察脉象。总按是指三指同时用大小相等的指力诊脉的方法，从总体上辨别寸、关、尺三部和左、右两手脉象的形态、脉位、脉力等。单按是指用一个手指诊察一部脉象的方法。","k":"切诊"},{"t":1,"s":"下列不属于平脉生理变异的是（  ）","o":["瘦人脉常浮","婴儿每分钟脉搏可达120次","饭后脉多缓而乏力","运动员脉多缓而有力","运动后脉多弦硬"],"a":"C","e":"正常人的脉象不尽相同，在学习中除了需要掌握正常人脉象的一般特点，还要掌握脉象会受其他因素影响而发生变化，此时发生变化的脉象并非说明有相应的病证出现，所以对于脉象需特别加以注意区分是病理变异还是生理变异导致的。","k":"切诊"},{"t":1,"s":"\"四季平脉\"应是（  ）","o":["春钩、夏弦、秋石、冬毛","春弦、夏钩、秋毛、冬石","春毛、夏石、秋钩、冬弦","春弦、夏钩、秋石、冬毛","春石、夏弦、秋毛、冬钩"],"a":"B","e":"季节气候的变化影响着人体的生理活动，故脉象上也会出现变化。平人脉象与四季气候相应，形成了四季脉象。《素问·脉要精微论》总结为\"春胃微弦\"\"夏胃微钩\"\"秋胃微毛\"\"冬胃微石\"。","k":"切诊"},{"t":1,"s":"脉象出现于寸口背侧者，称为（  ）","o":["六阴脉","太素脉","六阳脉","反关脉","斜飞脉"],"a":"D","e":"脉象出现于寸口背部，而不见于寸口，这是反关脉，为生理特异的脉位，不属于病脉。","k":"切诊"},{"t":1,"s":"浮脉的脉象特征是（  ）","o":["举之有余，按之不足","举之有余，按之则无","轻取即得，来盛去衰","轻取即得，细软无力","轻取即得，中空外坚"],"a":"A","e":"浮脉，轻按即得，重按稍减而不空，即举之有余，按之不足。轻取即得，中空外坚，如按鼓皮，此乃革脉脉象特征。","k":"切诊"},{"t":1,"s":"脉浮而大，来盛去衰的脉象是（  ）","o":["浮脉","大脉","散脉","芤脉","洪脉"],"a":"E","e":"洪脉的脉象特征为浮大有力，来盛去衰，状如波涛汹涌。大脉脉体宽大，但无来盛去衰，状如波涛汹涌之势。","k":"切诊"},{"t":1,"s":"沉脉的脉象特征是（  ）","o":["轻取不应，重按着骨始得","轻取不应，沉而实大弦长","轻取不应，重按始得","轻取不应，沉而细软","轻取不应，沉取坚着不移"],"a":"C","e":"沉脉，轻取不应，重按始得，即举之不足，按之有余。轻取不应，重按着骨始得，为伏脉的脉象特征。轻取不应，沉而实大弦长，为牢脉的脉象特征。","k":"切诊"},{"t":1,"s":"脉来实大弦长，轻取中取均不应，唯重取始得的脉象是（  ）","o":["沉脉","长脉","实脉","伏脉","牢脉"],"a":"E","e":"沉脉、伏脉、牢脉都属于沉脉类的脉象，但唯有牢脉沉取实大弦长，坚牢不移。伏脉的特征是重按着骨始得，甚则暂伏不显。","k":"切诊"},{"t":1,"s":"以脉位深沉为特征的脉象是（  ）","o":["沉脉、伏脉、涩脉","沉脉、牢脉、细脉","沉脉、伏脉、细脉","沉脉、弱脉、牢脉","沉脉、伏脉、紧脉"],"a":"D","e":"沉脉、弱脉、牢脉均属于沉脉类。涩脉属于迟脉类的脉象；细脉属于虚脉类脉象；紧脉属于实脉类的脉象。","k":"切诊"},{"t":1,"s":"数脉的脉象特征是（  ）","o":["脉来一息七八至","脉来一息四五至","脉来一息五至以上而不满七至","脉来一息五至以上，时而一止","脉来一息五至以上"],"a":"C","e":"数脉，脉来急促，一息五六至，即一息五至以上而不满七至。脉来一息七八至，为疾脉。脉来一息四五至，为平脉。脉来一息五至以上，时而一止，为促脉。脉来一息五至以上，表述不够准确，可能是数脉，也可能是疾脉。","k":"切诊"},{"t":1,"s":"数脉的主病是（  ）","o":["气滞","血瘀","寒凝","虚证","痰湿"],"a":"D","e":"数脉多见于热证，亦可见于里虚证。这里的虚证多是指气血不足的虚证，特别是心气不足、心血不足证更多见数脉。若人体气血亏虚，为满足身体各个脏腑、组织、器官生理功能的需要，心气勉其力而行之，则表现为心动变快而脉动加速，脉率增宽，但必数而无力。故数脉主虚，这一点比较特殊，值得注意。","k":"切诊"},{"t":1,"s":"三部脉举之无力，按之空虚的脉象是（  ）","o":["散脉","芤脉","虚脉","革脉","浮脉"],"a":"C","e":"三部脉举按皆无力，按之空虚是虚脉，属于虚脉类。散脉、芤脉、浮脉、革脉均为浮脉类脉象。散脉，浮取散漫而无根；芤脉，浮大中空，如按葱管；革脉，浮而搏指，中空边坚。","k":"切诊"},{"t":1,"s":"脉来脉去俱盛，三部举按均有力的脉象是（  ）","o":["洪脉","滑脉","紧脉","弦脉","实脉"],"a":"E","e":"实脉的脉象特征为脉来去俱盛，三部举按均有力。洪脉，脉形宽大，来盛去衰。弦脉，端直以长，如按琴弦。滑脉，往来流利，应指圆滑。紧脉，绷急弹指，状如转索。","k":"切诊"},{"t":1,"s":"病理性缓脉常见于（  ）","o":["水饮停聚","湿邪困阻","气机阻滞","阴寒积聚","瘀血阻滞"],"a":"B","e":"缓脉有两种，一种是脉来和缓，一息四至（每分钟60～70次），见于正常人，亦称为平缓脉，是脉有胃气的一种表现，属生理性脉象；二是脉势纵缓，缓怠无力，属病理性脉象。病理性缓脉主湿病，脾胃虚弱。","k":"切诊"},{"t":1,"s":"结脉、代脉、促脉的共同点是（  ）","o":["脉来较缓","脉来时止","止无定数","脉来缓慢","止有定数"],"a":"B","e":"结脉、代脉、促脉都属于歇止脉，即脉来时止。","k":"切诊"},{"t":1,"s":"下列不属于复合脉的是（  ）","o":["散脉","疾脉","微脉","结脉","洪脉"],"a":"B","e":"凡是由两种或两种以上的单因素脉同时出现，复合构成的脉象即称为\"相兼脉\"或\"复合脉\"。临床上所见的脉象基本上都是复合脉。在28脉中，有的脉象属于单因素脉，有的脉象是由几种单因素合成。浮、沉、迟、数、长、短、大、小等便是单因素脉。疾脉只有脉率快一个因素。","k":"切诊"},{"t":1,"s":"芤脉的脉象特征为（  ）","o":["轻取搏指，中空外坚","浮大无力，按之中空","脉位浅表，细软无力","浮大无根","三部脉举之无力，按之空虚"],"a":"B","e":"芤脉的脉象特征为浮大中空，如按葱管。轻取搏指，中空外坚，为革脉。三部脉举之无力，按之空虚，为虚脉。","k":"切诊"},{"t":1,"s":"脉率迟缓，时见一止，止无定数的脉象是（  ）","o":["代脉","结脉","促脉","涩脉","散脉"],"a":"B","e":"促脉、代脉、结脉三者均有歇止的脉象。促脉的脉象特征为数而时止，止无定数；代脉的脉象特征为脉来一止，止有定数；结脉的脉象特征为缓而时止，止无定数；涩脉的脉象特征为形细而行迟，往来艰涩不畅，脉势不匀；散脉浮而无根。","k":"切诊"},{"t":1,"s":"弱脉与濡脉的共同特点是（  ）","o":["脉细如线","脉来无力","细而无力","浮而无力","沉而无力"],"a":"C","e":"弱脉者，极软而沉细；濡脉者，浮细而软。故两者的共同特点是细软而无力。","k":"切诊"},{"t":1,"s":"弦脉的脉象特征是（  ）","o":["端直以长","脉来绷急","浮而搏指","沉按实大","状如波涛"],"a":"A","e":"弦脉的脉象特征为端直以长，如按琴弦。紧脉的脉象特征为脉来绷急，紧张有力。","k":"切诊"},{"t":1,"s":"患病时出现大脉提示","o":["病情加重","脏腑衰败","真实假虚","正气增强","真虚假实"],"a":"A","e":"大脉是指脉体宽大，但无脉来汹涌之势，见于健康人，或病进。脉大而数实为邪实；脉大而无力则为正虚。","k":"切诊"},{"t":1,"s":"弦细脉的主病为","o":["血虚肝郁","寒滞肝脉","肝郁气滞","肝胆湿热","水饮内停"],"a":"A","e":"弦脉主肝胆病、诸痛、痰饮，细脉主气血俱虚、诸虚劳损，主湿，故弦细脉主肝肾阴虚，或血虚肝郁，或肝郁脾虚。","k":"切诊"},{"t":1,"s":"促脉与结脉的区别是","o":["脉位的不同","至数的不同","脉势的不同","节律的不同","长短的不同"],"a":"D","e":"促脉与结脉都属于歇止脉，但促脉数而时一止，止无定数；结脉迟而时一止，止无定数。两者的区别在于一个是数而一止，一个是迟而一止。","k":"切诊"},{"t":1,"s":"弦脉与紧脉的共同点是","o":["脉位","脉形","脉势","流利度","紧张度"],"a":"E","e":"从脉象要素来看，弦脉和紧脉属于脉势中脉紧张度增高的脉象。","k":"切诊"},{"t":1,"s":"以下属于细脉相似脉的是","o":["微、弱、散脉","濡、微、伏脉","微、濡、虚脉","微、弱、濡脉","虚、弱、微脉"],"a":"D","e":"根据脉象要素进行脉象分类，细脉类的脉象有细、微、弱、濡脉。散脉属于浮脉类，伏脉属于沉脉类，虚脉属于虚脉类。","k":"切诊"},{"t":1,"s":"弱脉与濡脉的区别是","o":["脉体的大与小","脉位的深与浅","脉力的强与弱","脉率的数与迟","脉律的齐与乱"],"a":"B","e":"弱脉软而沉细，濡脉浮细而软，故两者的区别在于脉位，一沉一浮。","k":"切诊"},{"t":1,"s":"下列均主痛证的脉象是","o":["紧脉、弦脉、短脉","紧脉、伏脉、动脉","弦脉、动脉、革脉","伏脉、代脉、长脉","弦脉、伏脉、短脉"],"a":"B","e":"紧脉、伏脉、动脉的主病均可见疼痛。伏脉主闭、厥证、痛极；革脉主亡血、失精、半产、漏下；长脉主阳气有余、阳证、热证、实证，或平人；代脉主脏气衰、疼痛、惊恐、跌仆损伤。","k":"切诊"},{"t":1,"s":"芤脉与革脉的主要不同点是","o":["脉体的软硬","脉力的大小","脉形的长短","脉率的快慢","脉律的齐否"],"a":"A","e":"芤脉与革脉皆浮大中空，一如葱管，一如鼓皮。","k":"切诊"},{"t":1,"s":"下列与痰饮无关的脉象是","o":["滑脉","结脉","紧脉","弦脉","濡脉"],"a":"C","e":"濡脉主诸虚或湿证。滑脉主痰饮、食滞、实热诸证。结脉多见于阴盛气结，寒痰血瘀，气血虚衰。紧脉见于实寒证、疼痛和宿食。弦脉主肝胆病、疼痛、痰饮等。","k":"切诊"},{"t":1,"s":"下列脉象指下无脉气紧张之感觉的是","o":["弦脉","紧脉","长脉","革脉","牢脉"],"a":"C","e":"脉紧张度增加的脉象有弦、紧、革、牢脉。长脉属于长脉类。革脉，浮而中空，如按鼓皮。用鼓皮形容亦说明革脉的紧张度增加。","k":"切诊"},{"t":1,"s":"下列不属于气血不足证常见脉象的是","o":["虚脉","细脉","弱脉","微脉","结脉"],"a":"E","e":"结脉属于迟脉类脉象，主阴盛气结，寒痰瘀血。虚、细、微、弱脉均为无力脉象，故主病多为虚证，均可见气血两虚。","k":"切诊"},{"t":1,"s":"妊娠脉的特点是","o":["脉来滑数冲和","脉来洪大","脉来弦紧","脉来结代","脉来和缓"],"a":"A","e":"妊娠脉脉来滑数冲和。","k":"切诊"},{"t":1,"s":"脘腹部膨满，痞闷不舒，但按之柔软，满而不痛者，属于","o":["食积","水饮","痰饮","鼓胀","虚满"],"a":"E","e":"腹满有虚实之别，凡脘腹部按之手下饱满充实而有弹性、有压痛者，多为实满；若脘腹部虽然膨满，但按之手下虚软而缺乏弹性、无压痛者，多属虚满。脘部按之有形而胀痛，推之辘辘有声者，为胃中有水饮。","k":"切诊"},{"t":1,"s":"腹胀满，无压痛，叩之作空声者，可见于","o":["水鼓","气胀","痰饮","积聚","内痈"],"a":"B","e":"腹胀满，无压痛者，多属虚满；叩之声空，如击鼓之膨膨然者，则为气胀。","k":"切诊"},{"t":1,"s":"虚里按之微弱而无虚证表现者，多见于","o":["宗气内虚","宗气外泄","孕妇产后","劳瘵","饮停心包"],"a":"E","e":"按虚里可了解宗气盛衰、疾病虚实、预后吉凶。按之动而微弱不及，为宗气内虚，或饮停心包之支饮。宗气内虚者，多为危重患者可见。而支饮者，虽虚里\"其动欲绝\"，但无危候。动而应手，为宗气外泄。","k":"切诊"},{"t":1,"s":"虚里按之其动微弱者，多为","o":["宗气外泄","心阳不足","中气不守","宗气内虚","心胃气绝"],"a":"D","e":"虚里按之动而微弱，为宗气内虚，或饮停心包之支饮。搏动迟弱，或久病体虚而动数，为心阳不足。虚里动高，聚而不散，为热盛。虚里脉动数急，时有一止，为中气不守。按之弹手，洪大而搏，或绝而不应，为心胃气绝，证属危候。","k":"切诊"},{"t":1,"s":"腹痛灼热，拒按，按之痛甚，伴有腹部硬满者，属于","o":["阳明腑实证","气胀","内痈","鼓胀","阳明经证"],"a":"A","e":"腹痛，喜按者为虚，拒按并伴有腹部满硬者为实，如饮食积滞、阳明腑实证、瘀血肿块等。按之局部灼热，痛不可忍者，为内痈。","k":"切诊"},{"t":1,"s":"能够判断疼痛虚实的方法是","o":["痛处喜温或喜凉","疼痛时的姿势","疼痛喜按或拒按","疼痛的部位","疼痛部位的颜色"],"a":"C","e":"腹痛，喜按者为虚，拒按者为实。腹壁冷而喜暖者，属虚寒证；腹壁灼热，喜冷物按放者，属实热证。","k":"切诊"},{"t":1,"s":"右少腹部按之疼痛，重按突然放手后痛剧者，多见于","o":["燥屎","虫积","血瘀","肠痈","水鼓"],"a":"D","e":"右少腹部按之疼痛，重按突然放手后痛剧者，常见于肠痈。腹痛拒按且部位固定不移者，多为瘀血。","k":"切诊"},{"t":1,"s":"患者，男，38岁。腹中肿块时聚时散，按之无形，痛无定处。其诊断是","o":["癥积","瘕聚","虫积","水鼓","痞证"],"a":"B","e":"腹部肿块推之可移，痛无定处，或按之无形，聚散不定者，为瘕聚，病属气分；肿块推之不移，痛有定处者，为癥积，病属血分。","k":"切诊"},{"t":1,"s":"腹部肿块，推之不移，痛有定处者，属于","o":["瘕聚","癥积","食积","鼓胀","痞满"],"a":"B","e":"肿块推之不移，痛有定处者，为癥积；腹部肿块推之可移，痛无定处，为瘕聚；腹部胀大，如鼓之状，为鼓胀。","k":"切诊"},{"t":1,"s":"患者，男，60岁。腹胀大如鼓，按之如囊裹水，有波动感。其诊断是","o":["水饮","痞满","积聚","水鼓","气鼓"],"a":"D","e":"腹部胀大，如鼓之状者，为鼓胀。鼓胀可分水鼓与气鼓。按之如囊裹水，有波动感，为水鼓；以手叩之如鼓，无波动感，为气鼓。","k":"切诊"},{"t":1,"s":"患者叩诊腹大而胀，叩之如鼓者为","o":["水鼓","气鼓","食积","癥积","瘕聚"],"a":"B","e":"腹部胀大，如鼓之状，叩之如鼓者，为气鼓。","k":"切诊"},{"t":1,"s":"足三里穴有压痛者，可诊断为","o":["肺病","脾病","大肠病","肾病","胃病"],"a":"E","e":"胃病多在胃俞和足三里有压痛。肺病多在肺俞穴摸到结节，或中府穴有压痛。肝病多在肝俞和期门穴有压痛。","k":"切诊"},{"t":1,"s":"按上巨虚穴有显著压痛者，多为","o":["肺痈","肠痈","胃脘痛","虫积","泄泻"],"a":"B","e":"肠痈多在上巨虚（阑尾穴）有压痛；肺痈多在中府穴有压痛；胃脘痛多在胃俞和足三里有压痛。","k":"切诊"},{"t":2,"s":"寸口部位所指的三部九候包括（  ）","o":["天、人、地","寸、关、尺","浮、中、沉","上、中、下","人迎、寸口、趺阳"],"a":"BC","e":"寸口脉左右两手各有寸、关、尺三部，寸、关、尺三部又可施行浮、中、沉三候。寸口诊法的三部九候和遍诊法的三部九候名同而实异。","k":"切诊"},{"t":2,"s":"与脉象形成有关的是（  ）","o":["气血的运行","心脏的搏动","肺朝百脉","肝藏血","脾统血"],"a":"ABCDE","e":"脉象的形成与心脏的搏动、心气的盛衰、脉管的舒缩和气血的盈亏直接有关，同时与整体脏腑功能活动的关系密切。肺主气，朝百脉；脾为气血生化之源，脾统血，使血液不溢于脉外；肝藏血，指肝有贮藏血液、调节血量的作用；肾藏精，是脏腑功能的动力源泉，肾气充盛则脉搏重按不绝，尺脉有力。","k":"切诊"},{"t":2,"s":"医生诊脉时常用的指法包括（  ）","o":["举法","按法","寻法","单按","总按"],"a":"ABCDE","e":"医生诊脉时，布指之后通常采用举、按、寻、总按和单按等指法交替变化以体察脉象。","k":"切诊"},{"t":2,"s":"脉象要素包括（  ）","o":["脉搏","脉位","至数","脉宽","脉长"],"a":"BCDE","e":"脉象要素包括位、次、形、势。脉位是指脉动显现的部位和长度，诊脉时应诊察脉搏显现部位的浅深、长短。脉次是指脉搏跳动的至数和节律，诊脉时应诊察脉搏的频率快慢和节律是否均匀。脉形是指脉搏跳动的宽度等形态，诊脉时应诊察脉搏的大小、软硬等形状。脉势是指脉搏应指得强弱、流畅等趋势。","k":"切诊"},{"t":2,"s":"脉有胃气的表现是（  ）","o":["不浮不沉","不疾不徐","节律一致","不大不小","从容和缓"],"a":"ABCE","e":"脉有胃气是指脉象不浮不沉，不疾不徐，从容和缓，节律一致。","k":"切诊"},{"t":2,"s":"脉之有神的主要表现为（  ）","o":["不浮不沉","柔和有力","尺脉有力","沉取不绝","节律整齐"],"a":"BE","e":"脉有神是指脉象柔和有力，节律一致。","k":"切诊"},{"t":2,"s":"滑脉的临床意义为","o":["主痰饮","主实热","主瘀血","主食滞","主痛证"],"a":"ABD","e":"滑脉主痰湿、食积、实热，亦可见于青壮年、孕妇。","k":"切诊"},{"t":2,"s":"节律不齐的脉象有","o":["结脉","代脉","动脉","散脉","促脉"],"a":"ABDE","e":"脉律不均类的脉象包括结脉、代脉、促脉、散脉、涩脉。其中，散脉容易遗漏，需注意。而动脉特征为短而滑数，无脉率异常。","k":"切诊"},{"t":2,"s":"弦脉的临床意义为","o":["主痰饮","主实热","主肝病","主食滞","主痛证"],"a":"ACE","e":"弦脉主肝胆病、诸痛、痰饮。","k":"切诊"},{"t":2,"s":"\"真脏脉\"的临床意义是","o":["多见于疾病危重期","主大实大热之证","属阴阳离绝之候","表示脏腑精气衰竭","为胃气败绝之兆"],"a":"ACDE","e":"真脏脉是疾病危重期出现的脉象，其特征是无胃、无神、无根，临床意义为病邪深重，元气衰竭，胃气已败的征象。阴阳离绝亦是疾病危候，可见真脏脉。","k":"切诊"},{"t":2,"s":"痛证常见的脉象有","o":["滑脉","动脉","弦脉","伏脉","紧脉"],"a":"BCDE","e":"动脉主疼痛、惊恐；弦脉主肝胆病、诸痛、痰饮；伏脉主邪闭、厥证、痛极；紧脉主寒证、疼痛、宿食；滑脉主痰湿、食积、实热，亦可见于青壮年、孕妇。","k":"切诊"},{"t":2,"s":"涩脉的主病有","o":["气滞血瘀","痰积胶固","精伤血少","湿邪阻滞","元气离散"],"a":"ABC","e":"涩脉，形细而行迟，往来艰涩不畅，脉势不匀。其主病，因艰涩不畅，可主\"滞\"，即气滞、血滞（血瘀）、痰滞；因形细行迟，可主\"少\"，即精伤、血少。","k":"切诊"},{"t":2,"s":"脉位浮的脉象有","o":["弱脉","洪脉","细脉","革脉","牢脉"],"a":"BD","e":"洪脉脉位表浅，而弱脉、牢脉属沉脉类，细脉属虚脉类。","k":"切诊"},{"t":2,"s":"脉位较沉的脉象有","o":["伏脉","牢脉","濡脉","弱脉","散脉"],"a":"ABD","e":"散脉、濡脉均属浮脉类。伏脉、牢脉、弱脉属沉脉类。","k":"切诊"},{"t":2,"s":"按肌肤诊察的内容包括","o":["肌肤的润燥","肌肤的寒热","局部的肿胀或疮疡","肌肤的滑涩","肌肤的颜色"],"a":"ABCD","e":"肌肤按诊主要是从肌肤寒热、润燥、滑涩、疼痛、肿胀、皮疹、疮疡等情况，以分析病情的寒热虚实以及气血阴阳盛衰。","k":"切诊"},{"t":1,"s":"八纲辨证是","o":["各种辨证方法的总纲","外感病的辨证方法","各种辨证方法的基础","内伤杂病的辨证方法","以上都不是"],"a":"A","e":"根据病情资料，以辨别疾病现阶段病变部位的浅深、病情性质的寒热、邪正斗争的盛衰和病证类别的阴阳，以作为辨证纲领的方法，称为八纲辨证。八纲是从各种具体证候的个性中抽象出来的带有普遍规律的共性，因此，八纲辨证是中医辨证的总纲，是用于分析各种疾病共性的辨证方法。如果说到辨证方法的基础，还应包括气血津液辨证、六淫辨证等内容，这些都是脏腑辨证、六经辨证、卫气营血辨证等具体辨证方法的基础内容。","k":"八纲辨证"},{"t":1,"s":"鉴别表证和里证最主要的要点是","o":["脉浮或沉","舌苔白或黄","有无头身疼痛","有无恶寒发热","有无咳嗽咯痰"],"a":"D","e":"表证和里证的辨别，主要是审察寒热的表现，内脏证候是否明显，并参照舌象、脉象等变化。其中，关键是寒热，恶寒发热并见的多是表证，但寒或但热的多是里证，这也是最常用的鉴别点。而脉的浮、沉变化受其他影响因素较多，如胖瘦、季节、体质等。","k":"八纲辨证"},{"t":1,"s":"下列不属于里证特点的是","o":["病因复杂","证候多样","治法较多","病程较长","预后不良"],"a":"E","e":"里证的范围广泛，可表现为不同的证候，所以治法也较多，但其基本特征是一般病情较重，病位较深，病程较长。里证的病位虽然同属于“里”，但也有浅深、轻重之别，一般病变在腑、在上、在气者，较为轻浅；病变在脏、在下、在血者，较为深重。因此，里证的预后必须结合具体病情。","k":"八纲辨证"},{"t":1,"s":"辨别表证和里证首先应审察","o":["寒热","头痛","腹痛","咳嗽","身痛"],"a":"A","e":"参考单选题第5题的答案分析。注意咳嗽在表证、里证中皆可出现，但以里证为主。","k":"八纲辨证"},{"t":1,"s":"下列属于里证范畴的是","o":["太阳病证","少阳病证","卫分证","气分证","表热证"],"a":"D","e":"六经辨证中，太阳病主表，阳明病主里，少阳病主半表半里。卫气营血辨证中，卫分证主表，气分证主里，注意区分。","k":"八纲辨证"},{"t":1,"s":"表证发热的特点是","o":["壮热","寒热往来","恶寒发热","微热","但热不寒"],"a":"C","e":"恶寒发热是表证的主症，也是表证发热的特点。壮热属里实热证，多见于伤寒阳明经证和温病气分阶段。","k":"八纲辨证"},{"t":1,"s":"“寒热”在辨证中最主要的意义是","o":["是辨病因的纲领","是辨邪正的纲领","是辨病位的纲领","是辨病性的纲领","是辨标本的纲领"],"a":"D","e":"寒热是辨别疾病性质的两个纲领。由于寒热较突出地反映了疾病中机体阴阳的偏盛偏衰、病邪属性的属阴属阳，而阴阳是决定疾病性质的根本，所以寒热是辨别疾病性质的纲领。而且，在治疗上病性决定着药性寒热温凉的选择，正所谓“寒者热之，热者寒之”。虽然病因中也有寒热，但非病因的纲领。","k":"八纲辨证"},{"t":1,"s":"患者寒热往来，胸胁苦满，心烦喜呕，善太息，脉弦。其常见于","o":["表寒证","真寒假热证","半表半里证","表寒里热证","表热里寒证"],"a":"C","e":"半表半里证指病变既非完全在表，又未完全入里，病位处于表里进退变化之中，以寒热往来等为主要表现的证候。半表半里证在六经辨证中通常称为少阳病证，是外感病邪由表入里的过程中，邪正相争，少阳枢机不利所表现的证候。","k":"八纲辨证"},{"t":1,"s":"“实”的病机最根本的方面是","o":["邪气亢盛","正气旺盛","气血瘀滞","水液蓄积","痰浊壅滞"],"a":"A","e":"实证多为感受外邪，或疾病过程中阴阳气血失调，体内病理产物蓄积，表现为有余、亢盛、停聚特征的各种证候。虽然实证以邪气盛、正气不虚为基本病机，但“实”的内涵是针对邪气而言，即“邪气盛则实”。","k":"八纲辨证"},{"t":1,"s":"所谓“虚”的含义首选","o":["气血亏虚","虚邪中人","正气不足","阴液亏虚","邪气不盛"],"a":"C","e":"虚证指人体阴阳、气血、津液、精髓等正气亏虚，而邪气不著，表现为不足、松弛、衰退特征的各种证候。其中“虚”是指正气亏虚，即“精气夺则虚”。“气血亏虚”选项不全面。","k":"八纲辨证"},{"t":1,"s":"阴证的舌象应为","o":["舌质苍老","舌质胖嫩","舌质红绛","舌有芒刺","舌上生痈"],"a":"B","e":"阴阳是八纲中的总纲，由于阴、阳分别代表事物相互对立的两个方面，它无所不指，也无所定指，所以疾病的性质、临床的证候一般都可归属于阴或阳的范畴。八纲中的表里、寒热、虚实六纲，可以从不同侧面概括病情，但只能说明疾病某一方面的特征，不能反映疾病的全貌，而阴阳两纲则可以对病情进行总的归纳，即表、实、热属阳，里、虚、寒属阴。舌质苍老为实证属阳；舌质胖嫩为阳虚属阴。","k":"八纲辨证"},{"t":1,"s":"真热假寒证最突出的证候是","o":["胸腹灼热","口渴引饮","高热肢厥","神昏息粗","脉沉有力"],"a":"C","e":"真热假寒证指内有真热而外见某些假寒的“热极似寒”证候。其外有四肢凉甚至厥冷，恶寒甚或寒战，神识昏沉，面色紫暗，脉沉迟（或细数）等似为阴寒证的表现，但其本质为热，必有四肢冷而胸腹灼热，口鼻气灼，口臭息粗，口渴引饮，小便短赤，大便燥结或热痢下重，舌红苔黄而干，脉搏有力等实热证的表现。胸腹灼热既可见于真寒假热证又可见于实热证，并非最突出的表现。","k":"八纲辨证"},{"t":1,"s":"阳盛格阴是指","o":["真热假寒","表寒里热","热证转寒","真寒假热","表热里寒"],"a":"A","e":"真热假寒指内有真热而外见某些假寒表现的证候，即所谓“热深厥亦深”，古代又称为阳盛格阴证，多由阳热内盛，格阴于外，阳气内闭而不能布达所致。","k":"八纲辨证"},{"t":1,"s":"真寒假热证的病机是","o":["阴盛格阳","阳气暴脱","阴盛阳虚","阴阳俱衰","阳盛格阴"],"a":"A","e":"真寒假热的实际是阳虚阴盛而阳气浮越，故又称虚阳浮越证，古代亦有称阴盛格阳证、戴阳证者。其病机为阴盛格阳，由于阳气虚衰，阴寒内盛，逼迫虚阳浮游于上、格越于外所致。","k":"八纲辨证"},{"t":1,"s":"下列不属于虚实真假鉴别要点的是","o":["脉有力无力","舌质的老嫩","语声的高低","怕冷的轻重","体质的强弱"],"a":"D","e":"虚实真假之辨，关键在于脉象的有力无力、有神无神，其中尤以沉取之象为真谛；其次是舌质的嫩胖与苍老，言语呼吸的高亢粗壮与低怯微弱；患者的体质状况、病之新久、治疗经过等，也是辨析的依据。","k":"八纲辨证"},{"t":1,"s":"久病患者，纳食减少，疲乏无力，腹部胀满，但时有缓减，腹痛而喜按，舌胖嫩而苔润，脉细弱而无力。其病机是","o":["真实假虚","真实病证","真虚假实","真虚病证","虚中夹实证"],"a":"D","e":"从腹部胀满、腹痛等表现来看像是实证，但该患者腹部胀满，时有缓减，腹痛而喜按，且患者病程较长，纳食少，疲乏无力，舌胖嫩而苔润，脉细弱而无力，均是典型的虚证表现，故选D。","k":"八纲辨证"},{"t":1,"s":"寒热真假与虚实真假中所说的“真”，最主要是指","o":["患者真实的临床表现","临床上常见的证候","真实的病理本质","患者的病情完全真实","以上都不是"],"a":"C","e":"寒热真假与虚实真假均属于八纲证候间的证候真假。所谓“真”，是指与疾病内在本质相符的证候；所谓“假”，是指疾病表现出某些不符合常规认识的假象，即与病理本质所反映的常规证候不相应的某些表现。对于证候的真假，必须认真辨别，才能去伪存真，抓住疾病的本质，对病情做出准确判断。","k":"八纲辨证"},{"t":1,"s":"实寒证的临床表现是","o":["精神不振","面色苍白","舌质淡嫩","大便溏薄","小便清长"],"a":"B","e":"实寒证属于八纲辨证中的证候相兼。其临床表现同时可见到实证和寒证的表现。精神不振、舌质淡嫩多见于虚证；大便溏薄、小便清长可见于虚寒证。面色苍白为实寒证的典型表现之一。","k":"八纲辨证"},{"t":1,"s":"虚热证与实热证的鉴别要点是","o":["发热口干","盗汗颧红","大便干结","小便短赤","舌红而干"],"a":"B","e":"虚热证与实热证均属于八纲辨证中的证候相兼。两者的共同点为均可见热证，如发热口干、大便干结、小便短赤、舌红而干。但在面色上，实热证多满面通红，虚热证多可出现两颧潮红。盗汗也是虚热（阴虚）证的主要表现。","k":"八纲辨证"},{"t":1,"s":"患者面赤身热，口渴，喜饮冷水，神昏谵语，腹胀满痛拒按，尿黄赤，大便干，舌红苔黄而干，脉洪数。其证属","o":["里实热证","里虚热证","戴阳证","亡阴证","以上都不是"],"a":"A","e":"该患者面赤身热，舌红苔黄，脉洪数等多为阳热偏盛所致；口渴，喜饮冷水，尿黄赤，大便干，舌干多为热盛伤津所致；神昏谵语多为热扰心神所致。腹胀满痛拒按多由大便秘结所致，属实证。","k":"八纲辨证"},{"t":1,"s":"患者胸中烦热，频欲呕吐，腹痛喜暖，大便稀溏。其证属","o":["表热里寒","真热假寒","上热下寒","真寒假热","表寒里热"],"a":"C","e":"本题主要考查八纲证候间的证候错杂。证候错杂是指疾病某一阶段同时出现表里病位、寒热、虚实病性相反的证候。根据题目所述，胸中烦热，频欲呕吐，属里热；腹痛喜暖，大便稀溏，属里寒。一寒、一热，两个性质相反的证候同时存在于里，符合证候错杂的特点。胸属上焦、腹属下焦，故此证候错杂为上热下寒。","k":"八纲辨证"},{"t":1,"s":"患者身热反欲盖衣被，口渴、喜热饮，下利清谷，小便清长，舌淡苔白，脉大无力。其证属","o":["表寒里热证","表热里寒证","真寒假热证","真热假寒证","热证转化为寒证"],"a":"C","e":"身热、口渴、脉大等表现似热证，但身热反欲盖衣被，口渴却喜热饮，下利清谷，小便清长，舌淡苔白，脉大而无力为典型的寒证表现，故选C。本题要注意辨别寒热证候的真假，以表现于内部、中心的症状为准、为真；肢末、外部的症状是现象，多为假象。","k":"八纲辨证"},{"t":1,"s":"患者身热不恶寒，反恶热，烦渴喜冷饮，神昏谵语，便秘溲赤，手足逆冷，舌红苔黄而干，脉沉数有力。其证候是","o":["表寒里热","表热里寒","真热假寒","真寒假热","上热下寒"],"a":"C","e":"肢末、外部的症状可见手足逆冷、似寒；但内部、中心的症状有身热、烦渴喜冷饮、便秘溲赤、舌红苔黄而干、脉沉数有力，不是真寒，而是真热。故选C。","k":"八纲辨证"},{"t":1,"s":"“至虚有盛候”是指","o":["虚中夹实","实中夹虚","真虚假实","真实假虚","虚实转化"],"a":"C","e":"《内经知要》中的“至虚有盛候”是指本质为虚证，反见某些盛实现象的证候，即真虚假实证。","k":"八纲辨证"},{"t":1,"s":"证候的“表里出入”主要说明","o":["证候的性质","邪正的关系","病变的趋势","疾病的转归","病变的部位"],"a":"D","e":"表里出入是指病情表与里的相互转化，或病情由表入里而转化为里证，或病邪由里出表，邪有出路。一般而言，这种病位上的变化，由表入里多提示病情转重，由里出表多预示病情减轻。掌握病势的表里出入变化，对于预测疾病的发展与转归，及时改变治法，及时截断、扭转病势，或因势利导，均具有重要意义。","k":"八纲辨证"},{"t":1,"s":"下列属于里邪出表的是","o":["麻疹发热3天，疹出烦热渐退","久咳久喘，今见咳血量多、色鲜红","肝病胁痛5年，腹壁青筋显露","胃脘疼痛，昨见恶寒发热、脉浮紧","以上都是"],"a":"A","e":"里邪出表是指在里之病邪，有向外透达之势，是邪有出路的表现，而不是里证转化为表证。如麻疹患儿热毒内闭，则疹不出而见发热、咳喘、烦躁，若麻毒外透，则疹出而烦热咳喘除。","k":"八纲辨证"},{"t":1,"s":"寒证与热证相互转化的关键因素是","o":["邪气的性质","阴液的盈亏","阳气的盛衰","邪气的进退","以上都不是"],"a":"C","e":"寒证与热证的相互转化是由邪正力量对比所决定的，其关键在于机体阳气的盛衰。寒证转化为热证，是人体正气尚强，阳气较为旺盛，进而邪气从阳化热，提示人体正气尚能抗御邪气；热证转化为寒证，是邪气虽衰而正气不支，阳气耗伤并处于衰败状态，提示正不胜邪，病情加重。","k":"八纲辨证"},{"t":2,"s":"表证和里证的鉴别要点有","o":["表证起病急，里证起病缓","表证寒热并见，里证寒热独见","表证脉多浮，里证脉多沉","表证多为新病，里证多为久病","以上都不是"],"a":"ABCD","e":"发热恶寒同时并见者，属表证；但热不寒或但寒不热者，属里证；寒热往来者，属半表半里证。表证以头身疼痛、鼻塞流涕等为常见症状，内脏证候不明显；里证以内脏证候如咳喘、心悸、腹痛等表现为主症。表证及半表半里证的舌苔变化不明显，里证的舌苔多有变化；表证多见浮脉，里证多见沉脉或其他多种脉象。表证因起病急而多新病，里证因起病缓而多久病。","k":"八纲辨证"},{"t":2,"s":"下列属于热证表现的有","o":["尿黄便干","舌红苔黄","恶热喜冷","口渴","恶寒喜温"],"a":"ABCD","e":"口渴多因津液损伤，而热邪最易伤津，故见口渴。","k":"八纲辨证"},{"t":2,"s":"寒证的特征是","o":["不渴不饮","小便清长","恶心欲呕","经常畏冷","脉象弦滑"],"a":"ABD","e":"恶心欲呕的原因有虚、实、寒、热之分，需结合呕吐物及四诊分析。","k":"八纲辨证"},{"t":2,"s":"下述一般可归属于阳证范畴的是","o":["病势向上","病势向内","病变较快","阳邪致病","症难发现"],"a":"ACD","e":"凡见兴奋、躁动、亢进、明亮等符合阳的属性的证及症状均属阳证。表证、热证、实证，以及症状表现于外的、向上的、容易发现的，或病邪性质为阳邪致病、病情变化较快等，均为阳证范畴，反之则为阴证。","k":"八纲辨证"},{"t":2,"s":"下列属于阴证的是","o":["实证","热证","寒证","阴虚证","阳虚证"],"a":"CE","e":"凡见抑制、沉静、衰退、晦暗等符合阴的属性的证及症状均属阴证。里证、寒证、虚证，以及症状表现于内的、向下的、不易发现的，或病邪性质为阴邪致病、病情变化较慢等，均属阴证范畴。阴虚证为阴少而阳亢之证，表现为虚热，符合阳的属性，所以属阳证，同理阳虚证属阴证。不要因为带有“阴”或“阳”字就属阴证或阳证，亡阴证和亡阳证也可以如此分析。","k":"八纲辨证"},{"t":2,"s":"下列属于真热假寒证的是","o":["阳盛格阴","戴阳证","寒极似热","热极似寒","热深厥深"],"a":"ADE","e":"真热假寒证指内有真热而外见某些假寒的“热极似寒”证候，常有热深厥亦深的特点，故可称为热极肢厥证，古代亦称为阳盛格阴证。寒极似热、戴阳证乃真寒假热证。","k":"八纲辨证"},{"t":2,"s":"下列对真热假寒的认识，正确的是","o":["证候本质为阳热内盛","实际属于寒热错杂症","阳盛于内而格阴于外","正气已虚不能与邪争","阳气内闭而不能达外"],"a":"ACE","e":"真热假寒多由阳热内盛，格阴于外，阳气内闭而不能布达所致。","k":"八纲辨证"},{"t":2,"s":"下列属于证候真假的是","o":["大实有羸状","至虚有盛候","里邪出表","阳盛格阴","阴盛格阳"],"a":"ABDE","e":"证候真假是指某些疾病在病情危重阶段，可以出现一些与疾病本质相反的“假象”，以掩盖病情的“真象”，包括寒热真假、虚实真假。大实有羸状、至虚有盛候是指证候的虚实真假。阳盛格阴、阴盛格阳是指证候的寒热真假。","k":"八纲辨证"},{"t":2,"s":"辨别虚实真假的要点是","o":["病程","腹胀与否","大便是否秘结","舌象","脉象"],"a":"ADE","e":"虚实真假之辨，关键在于脉象；其次是舌质的嫩胖与苍老，言语呼吸的高亢粗壮与低怯微弱；此外，患者体质状况、病之新久、治疗经过等，也可作为辨析依据。","k":"八纲辨证"},{"t":1,"s":"患者突发皮肤瘙痒，红疹发无定处，此起彼伏。其病因是感受","o":["寒邪","湿邪","火邪","暑邪","风邪"],"a":"E","e":"辨六淫证候，是根据患者的症状、体征等，对照六淫病邪的致病特点，通过分析，辨别疾病当前病理本质中是否存在六淫证候。该患者突发皮肤瘙痒，红疹发无定处，此起彼伏，符合风邪善行数变的特性，故选E。","k":"病性辨证"},{"t":1,"s":"寒淫证的临床表现是","o":["肢体麻木","四肢抽搐","角弓反张","手足拘急","皮肤瘙痒"],"a":"D","e":"寒淫证是指寒邪侵袭机体，阳气遏阻，以恶寒甚、无汗、头身或胸腹疼痛、苔白、脉弦等为主要表现的实寒证候。寒性凝滞、收引，阻碍气血运行，则可见手足拘急冷痛；角弓反张、四肢抽搐，多为肝风内动，筋脉拘急所致；皮肤瘙痒多为风邪侵袭肌表，邪与卫气搏击于肌表所致；肢体麻木，可因气血亏虚、风寒入络、肝风内动、风痰阻络、痰湿或瘀血阻络，肌肤、筋脉失养所致。","k":"病性辨证"},{"t":1,"s":"腹痛肠鸣，呕吐泄泻脉紧者，可见于","o":["风淫证","寒淫证","暑淫证","湿淫证","火淫证"],"a":"B","e":"寒淫证中若寒滞胃肠，使胃肠气机失调，运化不利，则可见脘腹疼痛、肠鸣腹泻、呕吐。湿邪易阻滞气机，使脾胃运化失调，可见腹泻，但一般无呕吐且脉象多濡、缓。","k":"病性辨证"},{"t":1,"s":"寒邪致病出现的症状是","o":["发热恶风，汗出，脉浮缓","恶寒发热，无汗，脉浮紧","头胀而痛，胸闷身重，脉濡","恶热汗出，口渴，脉虚数","壮热，口渴，面红目赤，脉洪数"],"a":"B","e":"寒邪致病即为寒淫证，临床表现为恶寒重，或伴发热，无汗，头身疼痛，鼻塞或流清涕，脉浮紧；或见咳嗽、哮喘、咯稀白痰，或脘腹疼痛、肠鸣腹泻、呕吐，或肢体厥冷、局部拘急冷痛等，口不渴，小便清长，面色白甚或青，舌苔白，脉弦紧或脉伏。","k":"病性辨证"},{"t":1,"s":"暑淫证候的表现是","o":["头昏沉，嗜睡，胸脘痞闷","口渴饮水，口唇鼻咽干燥","发热恶热，汗出，气短神疲","突发皮肤瘙痒、丘疹","肠鸣腹泻，脘腹拘急冷痛"],"a":"C","e":"暑淫证是夏月炎暑之季，外感暑热邪气而导致的证候。其发病具有季节性，即夏至之后，立秋之前方为暑病。暑淫证的临床表现为发热恶热，汗出，口渴喜饮，气短，神疲，肢体困倦，小便短赤，舌红，苔黄或白，脉虚数；或发热，猝然昏倒，汗出不止，气喘，甚至昏迷、惊厥、抽搐等；或高热，无汗，胸闷，腹痛，呕恶，无汗等。","k":"病性辨证"},{"t":1,"s":"患者身热恶热，汗多，尿黄，口渴，疲乏，舌红苔白，脉虚数。其诊断为","o":["风淫证","实火证","虚火证","暑淫证","燥淫证"],"a":"D","e":"根据该患者的表现，应诊断为暑淫证。暑淫证的表现易与火热之邪引起的火热证混淆，要注意鉴别。暑为阳邪，具有炎热升散、耗气伤津、易夹湿邪等致病特点。暑性炎热升散，可见身热恶热、汗多，暑邪耗气伤津，可见口渴、疲乏、尿黄。舌红苔白、脉虚数为夏月炎暑感受暑邪之征。","k":"病性辨证"},{"t":1,"s":"下列不属于湿邪为病主要表现的是","o":["困重","闷胀","酸楚","无汗","舌苔腻浊"],"a":"D","e":"湿为阴邪，具有阻遏气机、损伤阳气、黏滞缠绵、重浊趋下等特点。根据湿邪的特性，可知湿邪为病可出现困重、闷胀、酸楚、舌苔腻浊等表现。无汗多为寒邪致病的表现。","k":"病性辨证"},{"t":1,"s":"患者发热恶风，咽干咽痛，干咳少痰，痰黏难咳，甚则痰中带血。其病因是感受","o":["风邪","寒邪","暑邪","火邪","燥邪"],"a":"E","e":"本题主要考查燥邪的临床表现。燥淫证指外感燥邪，耗伤津液，以口鼻、咽喉、皮肤干燥等为主要表现。其临床表现为皮肤干燥甚至皲裂、脱屑，口唇、鼻孔、咽喉干燥，口渴饮水，舌苔干燥，大便干燥，或干咳少痰、痰黏难咯，小便短黄，脉象偏浮。咽干、干咳少痰均为干燥的表现，故选E。","k":"病性辨证"},{"t":1,"s":"下列不属于火热证与阴虚证区别点的是","o":["病程的长短","热势的高低","病势的缓急","口渴与不渴","脉象的虚实"],"a":"D","e":"火为热之极，火与热皆为阳盛之象，属实热证，而阴虚证属虚热证，故两者的区别可从虚实进行区别，但无论火热证还是阴虚证均为热证，热会伤津，均可出现口渴。故选D。","k":"病性辨证"},{"t":1,"s":"阳虚证最主要的表现是","o":["舌质淡苔薄白","口不渴或少饮","面色白而无华","脉沉细无力","经常畏寒肢凉"],"a":"E","e":"阳虚证的临床表现为畏寒肢凉，口淡不渴或渴喜热饮，面色白，神疲乏力，气短自汗，大便溏薄，小便清长或尿少身肿，或脘腹冷痛喜按，舌淡胖嫩，舌苔白滑，脉沉迟无力。","k":"病性辨证"},{"t":1,"s":"阴虚证典型的舌、脉是","o":["舌红，脉数有力","舌淡，脉细无力","舌红少苔，脉细数","舌红苔黄，脉细数","舌红而干，脉滑数"],"a":"C","e":"阴虚证是由于阴液不足，虚热内生而导致的证候。其临床表现为五心烦热，潮热盗汗，两颧潮红，口燥咽干，形体消瘦，小便短黄，大便干结，舌红少津或少苔，脉细数。","k":"病性辨证"},{"t":1,"s":"亡阳证的表现是","o":["畏冷肢凉，口淡不渴，或喜热饮，或小便清长或尿少不利，大便稀薄，面色㿠白，舌淡胖，苔白滑，脉沉迟（或为细数）无力","形体消瘦，口燥咽干，两颧潮红，五心烦热，潮热盗汗，小便短黄，大便干结，舌红少津或少苔，脉细数","冷汗淋漓、汗质稀淡，神情淡漠，肌肤不温，手足厥冷，呼吸气弱，面色苍白，舌淡而润，脉微欲绝","汗热味咸而黏、如珠如油，身灼肢温，虚烦躁扰，恶热，口渴饮冷，皮肤皱瘪，小便极少，面赤颧红，呼吸急促，唇舌干燥，脉细数疾","以上都不是"],"a":"C","e":"亡阳证乃阳之功能衰竭而出现寒的表现，故B、D可排除。亡阳证还是一种危重证候，A虽为寒证的表现，但未有危重的表现，故选C。","k":"病性辨证"},{"t":1,"s":"亡阳证的汗出特点是","o":["汗多壮热","汗出恶风","汗出肢冷","汗出肢温","动则汗出"],"a":"C","e":"亡阳证由于阳气极度衰微而欲脱，失去温煦、固摄、推动之能，可见冷汗、肢厥。","k":"病性辨证"},{"t":1,"s":"患者高热烦渴，汗出如油、热而黏手，脉疾无力。其属于","o":["暑伤津气","亡阳","亡阴","湿热郁蒸","阴阳俱亡"],"a":"C","e":"高热烦渴、脉疾无力多由于阴液欲绝，阴不能制阳而致；汗出如油、热而黏手多为阳热逼迫欲绝之阴津外泄所致。故选C。","k":"病性辨证"},{"t":1,"s":"根据汗出鉴别亡阳与亡阴的要点是","o":["汗出时间","汗出颜色","汗量多少","汗出部位","汗出冷热"],"a":"E","e":"亡阴证为阴之功能衰竭，不能制约于阳，阳亢而出现热的表现。亡阳证乃阳之功能衰竭而出现寒的表现。两证可从汗、寒热、四肢、面色、口渴、气息、舌象、脉象等方面进行鉴别。亡阳者，其汗的特点是冷、稀、淡；亡阴者，其汗的特点是热、黏、咸。","k":"病性辨证"},{"t":1,"s":"患者神疲乏力，少气懒言，常自汗出，头晕目眩，舌淡苔白，脉虚无力。其证候是","o":["气虚","气陷","气逆","气微","气滞"],"a":"A","e":"气虚证的临床表现为气短声低，少气懒言，精神疲惫，体倦乏力，脉虚，舌质淡嫩，或有头晕目眩，自汗，动则诸症加重。","k":"病性辨证"},{"t":1,"s":"气虚证与气陷证的鉴别点在于有无","o":["神疲乏力","内脏下垂","少气懒言","头晕目眩","自汗"],"a":"B","e":"气虚证以病体虚弱、神疲、乏力、气短、脉虚为主要表现。气陷一般由气虚发展而来，可兼有气虚证的表现，但气陷证以气坠、脏器下垂为主要表现。","k":"病性辨证"},{"t":1,"s":"阳虚证与气虚证最主要的区别是","o":["有无少气懒言","有无神疲乏力","寒象是否明显","小便是否清长","舌质是否淡嫩"],"a":"C","e":"阳虚证是以畏冷肢凉为主要表现的虚寒证候。气虚证是以气短、乏力、神疲、脉虚等为主要表现的虚弱证候。阳虚证易与气虚同存，即阳气亏虚证，但阳虚则寒，必有寒象。","k":"病性辨证"},{"t":1,"s":"患者头晕眼花，少气倦怠，腹部有坠胀感，脱肛，舌淡苔白，脉弱。其证候是","o":["气滞","气虚","气陷","气脱","气逆"],"a":"C","e":"气陷证以头晕眼花、耳鸣、疲乏、气短、自觉气坠感，或内脏位置下垂，或脱肛、阴挺等症为主要表现。该患者有腹部有坠胀感的表现，故选C。","k":"病性辨证"},{"t":1,"s":"患者，女，31岁。神疲乏力，少气懒言，形体消瘦，劳累则月经漏下不止，舌质淡白，脉弱。其证候是","o":["气虚","血虚","气血两虚","气不摄血","气随血脱"],"a":"D","e":"该患者神疲乏力、少气懒言、舌质淡、脉弱，均为气虚的表现；劳则气耗，劳累则月经漏下不止，是气虚不能摄血所致，有气虚的一般证候，并有血、大小便、精液、胎元不固的证候。故选D。","k":"病性辨证"},{"t":1,"s":"气滞证的特征是","o":["头昏眼花","手足发麻","嗳气恶心","腹部坠胀","胀闷疼痛"],"a":"E","e":"气滞证又称气郁证、气结证，是指人体某一部分，或某一脏腑经络的气机阻滞，运行不畅所表现的证候，以胸胁脘腹或损伤部位的胀闷、胀痛、窜痛为主要表现。腹部坠胀多为气陷证的表现；嗳气恶心多为气逆证的表现。","k":"病性辨证"},{"t":1,"s":"下述不属于气滞痛、胀特点的是","o":["部位多不固定","矢气觉舒","按之一般有形","症状时轻时重","随情绪而增减"],"a":"C","e":"气滞证的临床表现为胸胁脘腹等处胀闷、疼痛，时轻时重，走窜不定，一般按之无形，痛胀常随嗳气、肠鸣、矢气后而减轻，或随情绪的忧思恼怒与喜悦而加重或减轻，脉多弦，可无明显舌象变化。","k":"病性辨证"},{"t":1,"s":"肝气上逆的临床表现有","o":["咳嗽","喘息","嗳气","呃逆","眩晕"],"a":"E","e":"气逆证主要指肺胃之气不降而上逆，或肝气升发太过而上逆，故临床有肺气上逆、胃气上逆、肝气上逆的不同。肺气上逆证可由外邪、痰饮等犯肺，致肺失肃降而气逆，可见咳嗽、喘息等症。胃气上逆证可由寒、热、水饮、食积、瘀血等致胃失和降而气机上逆，可见呃逆、嗳气、恶心、呕吐等症。肝气上逆证多因情志不遂、郁怒惊恐等，致使肝气失调，升发太过而无制，可见头痛、眩晕、呕血或咯血等。","k":"病性辨证"},{"t":1,"s":"患者恶心、呕吐、呃逆、嗳气等症频作。其病机是","o":["痰浊上壅","肺气上逆","肝气上逆","胃气上逆","奔豚气逆"],"a":"D","e":"恶心、呕吐、呃逆、嗳气均为胃气上逆的表现。","k":"病性辨证"},{"t":1,"s":"气闭证的代表症状是","o":["突发昏厥或绞痛","头痛眩晕","咳嗽喘促","胸闷胀痛","昏厥呕血"],"a":"A","e":"气闭证指因大怒、暴惊、忧思过度等过极的情志刺激，或因砂石、虫、痰等阻塞脉络、管腔等，导致气机闭塞，而表现出气的实证类急性重证，以突发昏厥或绞痛、二便闭塞、息粗、脉实为主要表现。","k":"病性辨证"},{"t":1,"s":"血虚必见的特征性证候是","o":["健忘失眠","颜色淡白","心悸多梦","经少或闭","肢体麻木"],"a":"B","e":"血虚证主要指心血虚证和肝血虚证。心悸多梦、健忘失眠多见于心血虚证，经少或闭、肢体麻木多见于肝血虚证。只有颜色淡白为肝血虚证和心血虚证共有的表现。","k":"病性辨证"},{"t":1,"s":"患者面色无华，头晕眼花，心悸，肢麻，失眠，舌淡脉细。其诊断为","o":["气虚证","津液亏虚证","血虚证","阳虚证","阴虚证"],"a":"C","e":"血虚证的临床表现为面色淡白或萎黄，口唇、眼睑、爪甲色淡白，头晕眼花，心悸多梦，手足发麻，妇女经血量少色淡、衍期甚或经闭，舌质淡，脉细无力。","k":"病性辨证"},{"t":1,"s":"血脱证的典型表现是","o":["心悸失眠","面色淡白","舌淡脉细","头晕眼花","面色苍白"],"a":"E","e":"血脱证是指因大量失血以致血液突然耗失，或因血虚而进一步发展，血脉空虚，以面色苍白、脉微欲绝或芤为主症的危重证候。血脱常伴随气脱、亡阳，其临床表现为面色苍白，头晕眼花，心悸，气短，四肢逆冷，舌色枯白，脉微或芤。但血脱以面色苍白、脉微或芤为主要辨证依据。","k":"病性辨证"},{"t":1,"s":"斑疹吐衄、心烦、身热口渴、舌红绛者，辨证为","o":["气滞证","血瘀证","气虚证","血热证","血虚证"],"a":"D","e":"血热迫血妄行，可见各种出血，如斑疹、吐衄；血热内扰心神，可见心烦；血分有热，血行加速，脉道扩张，可见身热、口渴，舌红绛。","k":"病性辨证"},{"t":1,"s":"患者行经前下水劳作，月经未至，少腹疼痛，喜温喜按，苔白脉沉弦。其诊断为","o":["血瘀证","伤寒证","中寒证","血寒证","虚寒证"],"a":"D","e":"血寒证是指寒邪客于血脉，凝滞气机，血行不畅，以患处冷痛拘急、畏寒、唇舌青紫，妇女月经后期、经色紫暗夹块等为主要表现的实寒证候。患者行经前下水劳作，有感受寒邪致使寒凝胞宫的病史，月经未至，少腹疼痛，喜温喜按，苔白脉沉弦，均为寒象的表现。","k":"病性辨证"},{"t":1,"s":"患者，女，32岁。胸胁、乳房胀痛，闷闷不乐，经来腹部刺痛，经色紫暗，量少，夹有血块，舌质紫暗，脉弦涩。其证候是","o":["气虚血瘀","肝气郁结","气滞血少","气滞血瘀","寒滞肝脉"],"a":"D","e":"气和血具有相互依存、相互为用的密切关系，因而当气病或血病发展到一定程度，往往会影响另一方的生理功能而发生病变，从而表现为气血同病的证候。此时的临床表现，既有气病证候，又有血病证候，二者相合而同时存在，称为气血同病。该患者胸胁、乳房胀痛，闷闷不乐，脉弦，多见于气滞证；经来腹部刺痛，经色紫暗、量少、夹有血块，舌质紫暗，脉涩，多见于血瘀证。故选D。","k":"病性辨证"},{"t":1,"s":"患者积块软而不坚，固定不移，胀与痛并存，舌苔薄，脉沉实。其证候是","o":["气机阻滞","血瘀气结","气滞血阻","气滞湿阻","湿热蕴结"],"a":"C","e":"该患者积块软而不坚且胀，符合气滞的特点；积块痛且固定不移，符合血瘀的特点；脉沉实是里实证之征。","k":"病性辨证"},{"t":1,"s":"患者，女，28岁，已婚。产后2小时，阴道出血量多，突然昏晕，渐至昏不知人，四肢厥冷，冷汗淋漓，舌淡，脉微欲绝。其证候是","o":["阳虚","血虚气脱","气虚","寒凝","瘀阻气闭"],"a":"B","e":"该患者有大出血，大出血时突然昏晕，渐至昏不知人，四肢厥冷，冷汗淋漓，舌淡，脉微欲绝，为大出血引起气随血脱的证候，故选B。","k":"病性辨证"},{"t":1,"s":"与津液的生成与输布关系最密切的脏腑是","o":["脾、胃、肺","肺、脾、肾","肺、三焦、肝","肺、肝、膀胱","三焦、膀胱、肺"],"a":"B","e":"津液是体内各种正常水液的总称。津液是血液的组成部分，属于阴的范畴，与血、阴等概念的关系密切，具有滋润、濡养和平衡阴阳等作用。津液的代谢与病变与肺、脾、肾等脏腑关系密切。","k":"病性辨证"},{"t":1,"s":"患者水肿而以头面眼睑先肿，起病急骤。其诊断为","o":["脾肾阳虚证","风湿犯表证","肾虚水泛证","风水相搏证","湿溢肌肤证"],"a":"D","e":"水肿以头面眼睑先肿，起病急骤者，多为阳水。由于风邪外袭，使肺气宣降失司，通调水道失常而致的水停证，称为风水相搏证。肾虚水泛证为阴水，以水肿下肢肿甚为主要特征。","k":"病性辨证"},{"t":1,"s":"患者呕吐多为清水痰涎，胸闷食少，头眩心悸，舌苔白腻，脉滑。其证候是","o":["饮食停滞","寒邪客胃","痰饮内阻","脾胃虚弱","脾阳不振"],"a":"C","e":"痰是由水液内停而凝聚形成的病理性产物，质黏稠。该患者痰浊停阻于脏腑组织之间，或见于某些局部，或流窜全身而表现的证候，为痰证。胸闷食少、呕吐清水痰涎，多由于痰浊中阻，胃失和降所致；痰随气升降，流窜全身，痰蒙清窍，故见头晕；痰阻心脉，故见心悸；舌苔白腻、脉滑为痰浊内阻的表现。故选C。","k":"病性辨证"},{"t":1,"s":"对诊断饮停胸胁证最有意义的表现是胸胁胀闷与","o":["咳唾引痛","咳逆倚息不得卧","心悸气短","痛彻肩背","脉沉弦"],"a":"A","e":"饮是指体内水液停聚而转化成的病理性产物，质较痰清稀，流动性较大。饮邪停聚于胃肠、心肺、胸胁等脏腑组织之间形成的证候，称为饮证。饮邪停聚的部位不同，可见不同的症状。饮邪停于胃肠，气机传化不畅，可见痞满闷，或水声辘辘，泛吐稀涎或清水，为狭义的痰饮；饮停于心肺膈间，气机受阻，宣降失职，可见咳嗽气喘，甚则喘不得平卧，痰多而质稀色白，胸闷心悸，甚或喉中有哮鸣声，为支饮；饮停于胸胁，可见胸胁饱满，支撑胀痛，呼吸、咳嗽、转侧时牵扯疼痛，为悬饮；饮溢四肢肌肤，可见肢体浮肿，沉重酸痛，小便不利，为溢饮；饮阻清阳，可见头晕目眩；饮阻气机，可见舌淡嫩、苔白滑、脉弦。","k":"病性辨证"},{"t":1,"s":"患者脘腹痞胀，胃中有振水声，呕吐清水痰涎，口淡不渴，眩晕，舌苔白滑，脉沉弦。其诊断为","o":["脾虚湿阻证","阴水证","痰饮证","肾虚水泛证","水湿困脾证"],"a":"C","e":"根据该患者的临床表现，为饮于停胃肠，阻滞气机，胃失和降的表现，故诊断为痰饮证（狭义）。","k":"病性辨证"},{"t":2,"s":"火热证候的表现有","o":["谵妄","吐血","痈脓","烦躁","口渴喜饮"],"a":"ABCDE","e":"火淫证（火热证）的临床表现为发热恶热，烦躁，口渴喜饮，汗多，大便秘结，小便短黄，面色赤，舌红或绛，苔黄干燥或灰黑，脉数有力（洪数、滑数、弦数等），甚者或见神昏、谵语，惊厥、抽搐，痈肿疮疡等。由于热迫血行可致吐血、衄血，故B正确。","k":"病性辨证"},{"t":2,"s":"暑淫证不同于火热证的是","o":["病情更为严重","发病更急更快","不出现动风神昏","有季节性","只有外感无内生"],"a":"DE","e":"暑淫证是夏月炎暑之季，外感暑热邪气而导致的证候。其发病具有季节性，即夏至之后，立秋之前方为暑病。暑为阳邪，具有炎热升散、耗气伤津、易夹湿邪等致病特点；火为热之极，火与热皆为阳盛之象，其性燔灼迫急，伤津耗气，具有炎上、生风动血、易致疮疡的特点。暑闭心神，引动肝风，可出现神昏等表现，故C错误。","k":"病性辨证"},{"t":2,"s":"火热证常导致的病理改变有","o":["寒湿内生","伤津耗液","生风动血","形成肿疡","闭扰心神"],"a":"BCDE","e":"火热证导致的病理变化，最为常见的是伤津耗液，甚至亡阴；火热迫血妄行可见各种出血；火热使局部气血壅聚，灼血腐肉而形成痈肿疡；火热炽盛可致肝风内动，则见抽搐、惊厥；火热闭扰心神，则见神昏谵语等，其中不少为危重证候。","k":"病性辨证"},{"t":2,"s":"阴虚证的临床表现有","o":["畏寒肢冷","形体消瘦","口燥咽干","五心烦热","潮热盗汗"],"a":"BCDE","e":"本题主要考查阴虚证的表现。畏寒肢凉为寒证的表现。B、C、D、E均为阴虚证的表现。","k":"病性辨证"},{"t":2,"s":"亡阳证的临床表现是","o":["面赤如妆","冷汗质稀","脉微欲绝","呼吸气微","肢冷肤凉"],"a":"BCDE","e":"除面赤如妆多见于戴阳证（真寒假热证）。B、C、D、E均是亡阳证的表现。","k":"病性辨证"},{"t":2,"s":"气陷证的临床表现是","o":["头晕眼花","神疲乏力","少气倦怠","腹部坠胀","内脏下垂"],"a":"ABCDE","e":"气陷证一般以头晕眼花，耳鸣，疲乏，气短，自觉气坠感，或内脏位置下垂，或脱肛、阴挺等症为主要表现。气陷多是气虚的发展，故其表现有气虚证的一般表现，同时还有气陷升举无力的表现。","k":"病性辨证"},{"t":2,"s":"可见气逆证的脏腑是","o":["肺","脾","胃","肝","肾"],"a":"ACD","e":"气逆证是在气滞的基础上形成的一种表现形式，主要指肺胃之气不降而上逆，或肝气升发太过而上逆，故临床气逆证可见于肺、胃、肝。","k":"病性辨证"},{"t":2,"s":"引起气滞的原因主要有","o":["情志不舒","外伤闪挫","脏气虚弱","脾虚失运","瘀血阻塞"],"a":"ABCE","e":"引起气滞的原因很多，如情志不舒，饮食失调，感受外邪，或外伤闪挫等。痰饮、瘀血、宿食、蛔虫、砂石等病理物质的阻塞，也可阻碍气的运行而致气滞。阳气虚弱，阴寒凝滞，亦可使脏腑经络之气机不畅而气滞。","k":"病性辨证"},{"t":2,"s":"血虚证的表现为","o":["疲倦乏力","眼睑、爪甲色淡白","声音嘶哑","遗尿","面色淡白或萎黄"],"a":"BE","e":"血液亏虚，脉络空虚，形体组织缺乏濡养荣润，可见眼睑、爪甲色淡白，面色淡白或萎黄。疲倦乏力多由于气虚，脏腑功能衰退导致；声音嘶哑有虚实之分；遗尿多因禀赋不足，肾气亏虚或脾气下陷、膀胱虚寒所致。","k":"病性辨证"},{"t":2,"s":"血瘀证的主要表现为","o":["出血","面色黧黑","瘀血脉征","肿块","固定刺痛"],"a":"ABCDE","e":"血瘀证主要有疼痛、肿块、出血、色脉改变等表现。①疼痛：状如针刺刀割，痛处不移而固定，常在夜间加重。②肿块：在体表者，常呈青紫色包块；在腹内者，可触及较坚硬而推之不移的肿块（称为癥积）。③出血：血色紫暗或夹有血块，或大便色黑如柏油状，妇女可见经闭，或为血崩、漏下。④色脉改变：面色黧黑，或唇甲青紫，或皮下紫斑，或肌肤甲错，或腹部青筋显露，或皮肤出现丝状红缕（皮肤显露红色脉络）；舌质紫暗或见紫斑、紫点，或舌下脉络曲张，或舌边有青紫色条状线；脉多细涩，或结、代，或无脉。","k":"病性辨证"},{"t":2,"s":"血热证的临床表现为","o":["身热口渴","心烦失眠","烦躁谵语","斑疹吐衄","舌绛脉数"],"a":"ABCDE","e":"血热证的临床表现可见血热迫血妄行所致出血的表现以及血分有热的热象表现。斑疹吐衄多由血热迫血妄行所致；身热口渴、心烦失眠、烦躁谵语、舌绛脉数均为热盛的表现。","k":"病性辨证"},{"t":2,"s":"血寒证的临床表现为","o":["冷痛拘急","月经衍期","肤色紫暗发凉","脉沉迟弦涩","唇舌青紫"],"a":"ABCDE","e":"血寒证的临床表现为畏寒，手足或少腹等患处冷痛拘急、得温痛减，肤色紫暗发凉，或为痛经、月经衍期、经色紫暗、夹有血块，唇舌青紫，苔白滑，脉沉迟弦涩等。","k":"病性辨证"},{"t":2,"s":"津液不足证的审证依据是","o":["口燥咽干","大量饮水","皮肤干燥","溲少便结","小便清长"],"a":"ACD","e":"津液不足证即津液亏虚证，其辨证依据是以口渴尿少，口、鼻、唇、舌、皮肤、大便干燥等为主要表现。大量饮水亦可见于热证等。","k":"病性辨证"},{"t":2,"s":"临床常见的津液亏虚证有","o":["胃燥津亏证","肠燥津亏证","肾虚津伤证","肺燥津伤证","脾虚液亏证"],"a":"ABD","e":"津液亏虚的常见证候有肺燥津伤证、胃燥津亏证、肠燥津亏证等，均有干燥见症，并表现出各自脏器的证候重点。","k":"病性辨证"},{"t":2,"s":"痰证的辨证依据是","o":["胸闷","眩晕","泛吐清水","舌苔腻","脉滑"],"a":"ABDE","e":"痰证的辨证依据是以咳吐痰多、胸闷、呕恶、眩晕、体胖，或局部有圆滑包块，苔腻、脉滑等为主要表现。","k":"病性辨证"},{"t":1,"s":"患者心痛剧烈，突见冷汗淋漓，四肢厥冷，面色苍白，脉微欲绝。其诊断为（  ）","o":["心脉痹阻证","心阳虚脱证","心阳虚证","心肾阳虚证","脾肾阳虚证"],"a":"B","e":"本题主要考查心阳虚脱证与心脉痹阻证的鉴别。心阳虚脱证是在心的疾患的基础上出现亡阳证的表现，虽然有时可见心胸剧痛，但主要表现是亡阳的症状。而心脉痹阻证的主要表现是心胸疼痛。","k":"病位辨证"},{"t":1,"s":"心气虚、心阳虚、心阳虚脱三证的相同点为（  ）","o":["脉微","舌胖","肢冷","面色苍白","汗出"],"a":"E","e":"心阳虚脱证是亡阳的证候，常见冷汗淋漓。心气虚、心阳虚由于气虚、阳虚，卫外不固，可见自汗。因此，三证的共同点是汗出。脉微是心阳虚脱证的表现，肢冷是心阳虚、心阳虚脱的表现，面色苍白主要见于心阳虚脱证。","k":"病位辨证"},{"t":1,"s":"患者，男，70岁。神志痴呆，表情淡漠，举止失常，面色晦滞，胸闷泛恶，舌苔白腻，脉滑。其辨证为（  ）","o":["痰蒙心神证","痰火扰心证","心血瘀阻证","肾精不足证","肝郁气滞证"],"a":"A","e":"心藏神、主神明，痰蒙心神证、痰火扰心证均可出现神志、意识的异常，而痰蒙心神证表现为神昏、癫证、痫证，痰火扰心证表现为狂证。该患者的表现为癫证，故选A。肾精不足证可导致老年痴呆，肝郁气滞证可导致精神抑郁。","k":"病位辨证"},{"t":1,"s":"心气虚证与心阳虚证的共有症状是（  ）","o":["心悸怔忡","畏寒肢冷","心痛入夜加剧","舌淡胖，苔白滑","脉沉迟无力"],"a":"A","e":"本题主要考查心气虚证与心阳虚证的鉴别诊断。二者均可出现心悸怔忡，但心阳虚证有寒象，有时可有胸痛，而心气虚证一般无胸痛。","k":"病位辨证"},{"t":1,"s":"痰浊蒙蔽心窍的神志改变特点是（  ）","o":["狂言、谵语","神昏、痴呆","悲伤欲哭","烦躁不安","疑虑不定"],"a":"B","e":"痰浊蒙蔽心窍导致的神志改变，主要表现为神昏、痴呆、癫证、痫证等。而痰火扰心证可见狂言、谵语、烦躁不安等。肝气郁结证易见悲伤欲哭、疑虑不定等。","k":"病位辨证"},{"t":1,"s":"患者咳嗽，咯痰黄稠，口干咽痛，发热微恶风寒，舌红苔薄黄，脉数。其证候是（  ）","o":["风热表证","风热犯肺证","肺热炽盛证","痰热壅肺证","燥邪犯肺证"],"a":"B","e":"风热表证与风热犯肺证均可出现咳嗽、咯吐黄痰，均有表热的症状，但是风热表证以卫表症状为主，而风热犯肺证以咳嗽为主。痰热壅肺证为里热证，不兼有卫表症状。","k":"病位辨证"},{"t":1,"s":"下列不属于痰热壅肺证表现的是（  ）","o":["痰多色黄","鼻流清涕","气喘息粗","舌苔黄腻","小便短赤"],"a":"B","e":"鼻流清涕多为风寒犯肺证的表现，而痰热壅肺证为里热证，一般不出现鼻流清涕。痰热壅肺证为里实热证，故有小便短赤的热象。","k":"病位辨证"},{"t":1,"s":"患者恶风发热，口干咽燥，咳痰少而黏，不易咳出。其诊断为（  ）","o":["风热犯肺证","风热表证","燥邪犯肺证","肺热炽盛证","肺阴虚证"],"a":"C","e":"该患者既有口干咽燥、咳痰少而黏、不易咳出等津伤肺燥的表现，又有恶风发热等卫表症状，符合燥邪犯肺证的表现。","k":"病位辨证"},{"t":1,"s":"燥邪犯肺证与肺阴虚证的主要鉴别要点是（  ）","o":["有无发热恶寒","有无胸痛咳血","有无口干咽燥","痰量的多少","咯痰的难易"],"a":"A","e":"本题主要考查燥邪犯肺证与肺阴虚证的鉴别。二者均有津伤肺燥的表现，即胸痛咳血、口干咽燥、痰量少、难咯吐。燥邪犯肺证属于外燥，兼有发热恶寒等卫表的症状；而肺阴虚证为内燥，兼有阴虚的表现，没有卫表的症状。","k":"病位辨证"},{"t":1,"s":"对鉴别风寒犯肺证和风寒表证最有意义的是（  ）","o":["咳嗽的轻重","口渴或不渴","是否发热恶寒","是否舌苔薄白","有汗或无汗"],"a":"A","e":"风寒犯肺证与风寒表证均可出现咳嗽和卫表的症状。风寒犯肺证的主要病机是肺气失宣，以咳嗽为主症，卫表症状轻微；而风寒表证的主要病机是卫气失调，恶寒发热为主症，兼有咳嗽，或不咳。","k":"病位辨证"},{"t":1,"s":"脾气虚弱与寒湿困脾的鉴别要点是（  ）","o":["不思饮食","口淡不渴","便溏腹胀","苔白厚腻","脉缓"],"a":"D","e":"两证均有不思饮食、腹胀、便溏等脾失健运的表现，无燥热之象（无口渴），都可见缓脉。二者只有舌象不同，脾气虚弱为虚证，舌苔不厚，而寒湿困脾证为舌苔白厚腻。","k":"病位辨证"},{"t":1,"s":"患者皮下紫斑，月经量多，伴食少、便溏、乏力，舌淡脉弱。其辨证为（  ）","o":["脾气虚证","脾不统血证","血瘀证","气血两虚证","脾虚气陷证"],"a":"B","e":"该患者有出血现象，并有脾气虚弱的表现，符合脾不统血证。若概念不明确，则易错选A、D。","k":"病位辨证"},{"t":1,"s":"脾气虚证与脾阳虚证的主要鉴别症状是（  ）","o":["食欲不振","气短懒言","面色萎黄","大便稀溏","腹痛喜暖"],"a":"E","e":"两证均有食欲不振、大便稀溏等脾失健运的表现，也都有脾气虚的表现，如气短懒言。二者不同的是脾阳虚证是虚寒证，有寒象，可见腹痛喜暖，而脾气虚证无寒象。阳虚证是阳气虚衰的证候，其表现就是在气虚的基础上有寒象，所以气短懒言不是二者的鉴别症状。","k":"病位辨证"},{"t":1,"s":"患者出现黄疸，厌食油腻，脘闷呕恶，腹胀，舌苔黄腻。其辨证属（  ）","o":["脾胃湿热证","肝胆湿热证","食滞胃脘证","脾气虚证","胆郁痰扰证"],"a":"A","e":"该患者有黄疸，并有脾胃症状、舌苔黄腻，可辨证为脾胃湿热证。胆郁痰扰证、食滞胃脘证一般不出现黄疸。","k":"病位辨证"},{"t":1,"s":"下列对诊断脾气下陷证最有意义的是（  ）","o":["食少腹胀，便溏乏力","面色萎黄，食少神疲","头晕目眩，舌淡脉细","久泄脱肛，食少体倦","食少腹泻，畏寒肢冷"],"a":"D","e":"脾虚气陷证是脾气虚弱，致中气下陷，内脏下垂的证候。A、B、C是脾气虚的表现，无内脏下垂的表现。E为脾阳虚的表现。","k":"病位辨证"},{"t":1,"s":"脾虚气陷证一般不出现（  ）","o":["食少腹胀，便溏乏力","面色萎黄，食少神疲","食少腹泻，脘腹坠胀","久泄脱肛，食少体倦","食少脘痞，呃逆嗳气"],"a":"E","e":"脾虚气陷证是脾气虚弱，导致中气下陷，内脏下垂的证候。E为胃气上逆的表现。A、B、C、D为脾气虚的表现，或有脾气虚内脏下垂的表现，均可见于脾虚气陷证。","k":"病位辨证"},{"t":1,"s":"脾气虚、脾阳虚、脾气下陷、脾不统血的共同见症是（  ）","o":["畏寒肢冷，肢体水肿","食少便溏，少气乏力","腹部疼痛，喜温喜按","脘腹重坠，食后益甚","便血、鼻出血，月经量多"],"a":"B","e":"脾阳虚证可见A、C；脾气下陷证可见D；脾不统血证可见E。四证的共同病理变化是脾气虚弱，只有B为脾气虚的表现。","k":"病位辨证"},{"t":1,"s":"胃阴虚证最具诊断意义的症状是（  ）","o":["饥不欲食","腹胀脘痞不舒","干呕呃逆","口燥咽干","五心烦热"],"a":"A","e":"胃阴虚证最主要的表现是饥不欲食。口燥咽干、五心烦热为阴虚内热的表现，其他脏腑阴虚均可出现，而且胃阴虚证全身阴虚的表现一般不太突出。","k":"病位辨证"},{"t":1,"s":"患者胃脘冷痛喜按，吐清水，口淡不渴，舌淡嫩，脉沉迟无力。其诊断为（  ）","o":["寒湿困脾证","脾阳虚证","胃阳虚证","寒滞胃脘证","胃气虚证"],"a":"C","e":"脾胃同位于中焦，病证易于混淆，但二者不同，胃脘疼痛、呕吐为胃病的常见表现。冷痛、口不渴、吐清水为寒象。C、D均有胃病表现和寒象，但该患者的舌脉提示为虚证，故选C。","k":"病位辨证"},{"t":1,"s":"鉴别胃气虚证与脾气虚证最有意义的症状是（  ）","o":["是否面色萎黄","有无少气懒言","有无神疲肢倦","是否大便稀溏","是否舌淡脉弱"],"a":"D","e":"胃气虚证与脾气虚证均有气虚表现，故A、B、C、E不是二者鉴别的依据。脾胃虽然同位于中焦，但表现不同。胃的病证表现为恶心、呕吐等，而脾的病证表现为腹痛、泄泻等，故D对二证的鉴别最有意义。","k":"病位辨证"},{"t":1,"s":"胃火炽盛证与胃阴虚证的鉴别应除外（  ）","o":["胃脘灼痛或隐痛","渴而喜饮或口燥咽干","大便秘结或便溏","舌红苔黄或少苔","消谷善饥或饥不欲食"],"a":"C","e":"胃火炽盛证与胃阴虚证分别为实热证、虚热证，二者表现有所不同，故A、B、D、E为二者鉴别的依据。而胃的病证一般不出现腹泻便溏，故C不是二者鉴别的依据。","k":"病位辨证"},{"t":1,"s":"肝阳上亢与肝阴不足均可见（  ）","o":["头目胀痛","失眠健忘","腰膝酸软","手足蠕动","眩晕耳鸣"],"a":"E","e":"肝阳上亢证由于肝阳亢逆，升发太过，上扰清窍，可出现眩晕耳鸣；肝阴虚证由于肝阴不足，头目失养，亦可出现眩晕耳鸣。头目胀痛为肝阳上亢证与肝火上炎证的共同见症，而肝阴不足一般不出现头目胀痛。","k":"病位辨证"},{"t":1,"s":"患者突然昏倒，口眼歪斜，半身不遂，语言不利，面赤，脉弦劲有力。其诊断为（  ）","o":["肝阳上亢证","热极生风证","肝阳化风证","阴虚动风证","痰热扰心证"],"a":"C","e":"该患者为肝阳化风证的临床表现。肝阳化风证常常由肝阳上亢证进一步发展而来，肝阳上亢证亦常见眩晕。","k":"病位辨证"},{"t":1,"s":"心血虚证与肝血虚证的主要鉴别症状是（  ）","o":["面色萎黄","唇睑淡白","月经量少","舌质淡白","脉细无力"],"a":"C","e":"心血虚证与肝血虚证均可见面色淡白、唇睑淡白、舌淡脉细等血虚的一般表现。月经量少是肝血亏虚，冲任失养的表现，一般心血虚证不出现。","k":"病位辨证"},{"t":1,"s":"对诊断肝血虚证最有意义的是眩晕和（  ）","o":["面白舌淡","心悸脉细","胁肋隐痛","肢体麻木","以上都不是"],"a":"A","e":"在肝的病证中肝血虚、肝阴虚、肝火上炎、肝阳上亢、肝阳化风等均可出现眩晕。眩晕只有与面白无华、舌色淡并见，才提示为肝血虚证。胁肋隐痛、肢体麻木可见于肝血虚证，但只是肝的病症，眩晕与之共见只提示病位在肝，并不能提示为血虚证，所以对诊断肝血虚证无意义。","k":"病位辨证"},{"t":1,"s":"热极生风证的主要临床特点是（  ）","o":["手足麻木","半身不遂","口眼歪斜","四肢抽搐","头晕耳鸣"],"a":"D","e":"热极生风证是邪热炽盛，燔灼心肝二经，引动肝风的证候，以高热、神昏、抽搐为主要临床表现。其他选项多见于肝阳化风证，不是热极生风证的临床特点。","k":"病位辨证"},{"t":1,"s":"患者厌食油腻，胁肋胀痛，口苦，苔黄腻。其辨证属（  ）","o":["湿热蕴脾","食滞胃脘","肝胆湿热","肝气犯胃","胆郁痰扰"],"a":"C","e":"该患者的临床表现提示为肝胆湿热。湿热蕴脾会有厌食油腻和湿热症状，但不出现胁肋胀痛。胆郁痰扰虽有口苦、舌苔黄腻等表现，但主症常常为失眠，一般不出现胁肋疼痛。肝气犯胃会出现胁肋胀痛，但更有胃气上逆等胃的病症。","k":"病位辨证"},{"t":1,"s":"一般不出现眩晕症状的证候是（  ）","o":["肝气郁结证","肝阳化风证","肝阴虚证","肝血虚证","肝阳上亢证"],"a":"A","e":"在肝的病证中，肝血虚证、肝阴虚证、肝阳上亢证、肝阳化风证均可出现眩晕。而肝气郁结证是肝失疏泄，气机郁滞的证候，主要表现为胁肋及肝经循行部位胀痛，一般不出现眩晕。","k":"病位辨证"},{"t":1,"s":"肝阴不足的表现是（  ）","o":["胸闷善太息，易怒，五心烦热","口干口苦，胸胁或少腹胀闷窜痛","面部烘热，口咽干燥，胁肋隐痛","手足蠕动，眩晕耳鸣，夜寐多梦","以上都不是"],"a":"C","e":"肝阴不足证既有肝的病症，又有阴虚的病症。手足蠕动、眩晕耳鸣、夜寐多梦可出现于肝阴虚证中，但这些症状本身不足以提示阴虚。B提示肝气郁结并兼有热象；A提示肝气郁结，并兼有阴虚症状。","k":"病位辨证"},{"t":1,"s":"患者头晕目眩，口苦，呕恶，烦躁不寐，惊悸不宁，胸闷喜太息，苔黄腻，脉弦滑。其诊断为（  ）","o":["胆郁痰扰","脾胃湿热","肝胆湿热","肝火上炎","心肾不交"],"a":"A","e":"该患者的临床表现为胆郁痰扰证的症状。胆郁痰扰证为痰热内盛的证候，可见舌苔黄腻，脉弦滑。若掌握不准确，易错选B、C。","k":"病位辨证"},{"t":1,"s":"患者未老先衰，头发枯萎、早脱、早白。其病机是（  ）","o":["肝失疏泄","肾精不足","肾气不固","脾虚不运","肺气虚衰"],"a":"B","e":"肾主藏精，肾中精气的盛衰决定了人的生长壮老。该患者为成年人早衰的表现，其病机为肾精不足。","k":"病位辨证"},{"t":1,"s":"患者月经淋漓不尽，色淡，小便频数，腰膝酸软，神疲乏力，舌淡脉弱。其诊断为（  ）","o":["脾不统血证","心脾两虚证","肾气不固证","肾精不足证","心肝血虚证"],"a":"C","e":"根据该患者的临床表现，为肾气虚弱、冲任不固而致月经异常，符合肾气不固证。脾不统血证、心脾两虚证虽然可见慢性失血、月经异常，但常兼见脾气虚的症状，而无肾的病证。肾精不足证虽有肾虚的表现，但一般不出现月经淋漓不断。","k":"病位辨证"},{"t":1,"s":"肾精不足证的临床表现有（  ）","o":["畏寒肢冷","健忘耳聋","遗精早泄","遗尿失禁","水肿"],"a":"B","e":"肾精不足证是肾精亏虚，导致小儿生长发育迟缓、成年人早衰、生育功能低下的虚弱证候。肾中精气亏虚，脑失充养则健忘，耳失充养则耳聋。遗精早泄、遗尿失禁多见于肾的病证，但多为肾气不固的表现，肾精不足一般不出现。","k":"病位辨证"},{"t":1,"s":"肾气不固的主要表现是（  ）","o":["久病咳喘，呼多吸少","男子阳痿，女子经闭","五更泄泻，完谷不化","男子滑精早泄，女子带下清稀","大汗淋漓，四肢厥冷"],"a":"D","e":"肾气不固证是肾气虚弱，下元固摄失职，以精关、带脉、冲任、胎元、膀胱不固为主要临床表现的证候，可见男子滑精早泄，女子带下清稀。久病咳喘、呼多吸少为肾不纳气证的表现，若概念不清，将肾气不固与肾不纳气二者混淆，易误选A。五更泄泻、完谷不化为大便不固；大汗淋漓、四肢厥冷为阳气亡脱，津液不固。二者虽然存在不固的病机，但不属于肾气不固的范围。","k":"病位辨证"},{"t":1,"s":"肾虚水泛证最突出的表现是（  ）","o":["腰膝酸冷","水肿尿少","夜尿频多","小便失禁","动则喘息"],"a":"B","e":"肾虚水泛证的主要病机是肾阳虚弱，故可见腰膝酸冷。但是肾虚水泛证是肾阳虚弱，气化无权，水液泛溢，以小便不利、水肿为主要临床表现的证候。因此腰膝酸冷不是其主要表现，其突出症状是尿少水肿。","k":"病位辨证"},{"t":1,"s":"尿道灼痛，尿频尿急，尿有砂石者，属于（  ）","o":["小肠实热","大肠湿热","脾胃湿热","肝胆湿热","膀胱湿热"],"a":"E","e":"小肠实热、膀胱湿热都可出现小便异常，但小肠实热是在心火炽盛的基础上出现小便异常。","k":"病位辨证"},{"t":1,"s":"下列关于肺肾阴虚证和肝火犯肺证的说法，错误的是","o":["均可见大量咯血","均见舌红脉数之象","均见咳嗽","均可见烦热口苦","均可见声音嘶哑"],"a":"D","e":"肺肾阴虚证和肝火犯肺证均可出现咳嗽、咯血、舌红、脉数。虽然两者均可见热象，但是烦热口苦为肝火犯肺证的表现，而不是肺肾阴虚证的表现。","k":"病位辨证"},{"t":1,"s":"患者不易入睡，兼见心烦多梦，心悸不安，腰膝酸软，潮热盗汗。其辨证属","o":["心肾不交证","心脾两虚证","心阴虚证","肾阴虚证","肝肾阴虚证"],"a":"A","e":"该患者有心、肾的病症，还有阴虚症状，因而符合心肾不交证。","k":"病位辨证"},{"t":1,"s":"患者形寒肢冷，脘腹冷痛，纳呆呕恶，大便稀溏，肢体水肿，腰膝酸软，舌淡苔白滑。其辨证属","o":["脾气虚","脾阳虚","脾肾阳虚","寒湿困脾","寒滞胃肠"],"a":"C","e":"脾阳虚、脾肾阳虚、寒湿困脾、寒滞胃肠均可见泄泻和寒象。但该患者还有腰膝酸软，故选C。","k":"病位辨证"},{"t":1,"s":"肾不纳气最突出的表现为","o":["小便失禁","久泻不止","呼多吸少","耳鸣腰酸","胎动易滑"],"a":"C","e":"肾不纳气证是肺肾两脏气虚，摄纳无权，气不归元的证候，主要表现是久病咳喘，呼多吸少。","k":"病位辨证"},{"t":1,"s":"心脾两虚证可见","o":["面浮肢肿","腹胀如鼓","咳嗽痰少","面色萎黄","舌淡暗"],"a":"D","e":"心脾两虚证是心血亏虚，脾气虚弱的证候，可见面色萎黄。浮肿、腹胀虽然也为脾的病症，但心脾两虚证不会出现腹胀如鼓，亦较少见水肿。","k":"病位辨证"},{"t":1,"s":"太阳中风证可见","o":["恶风汗出，脉象浮缓","自汗少气，畏寒肢冷","恶寒脉浮，无汗而喘","猝然昏仆，不省人事","牙关紧闭，四肢抽搐"],"a":"A","e":"太阳中风证是指外邪侵袭肌表和太阳经，使营卫失调的证候。临床以恶风汗出、脉象浮缓为特征。太阳中风证与脑血管病中风不同。","k":"病位辨证"},{"t":1,"s":"患者日晡潮热，腹胀痛拒按，大便秘结，狂乱谵语，舌苔黄厚干燥，脉沉迟。其辨证属","o":["真寒假热证","真热假寒证","阳明经证","阳明腑实证","寒热错杂证"],"a":"D","e":"根据该患者的临床表现，可辨证为阳明腑实证。脉沉迟虽然多见于寒证，但是邪热与燥屎搏结于内，阻碍气血的运行，亦可见脉沉迟，不可因此而认为是真热假寒证、寒热错杂证。","k":"病位辨证"},{"t":1,"s":"太阴病证的临床表现有","o":["脉微细","饥不欲食","四肢厥冷","时腹自痛","下利清谷"],"a":"D","e":"太阴病为里虚寒证，少阴寒化证亦为里虚寒证，但是二者病机有所不同。太阴病是脾阳虚衰，寒湿内盛的证候，可见时腹自痛。而少阴寒化证是心肾阳虚，阴寒内盛的证候，可见脉微细、四肢厥冷、下利清谷。","k":"病位辨证"},{"t":1,"s":"患者发热，不恶寒反恶热，心烦口渴，舌红苔黄，脉数。其诊断为","o":["少阴热化证","卫分证","气分证","营分证","血分实热证"],"a":"C","e":"该患者为里热证的表现，口渴、舌红苔黄、脉数提示为里实热证。营分证、血分实热证的表现为舌红绛，脉细数。血分实热证并不完全是实证，存在营阴灼伤、阴血受损的病机。","k":"病位辨证"},{"t":1,"s":"温病血分证主要累及的脏腑是","o":["心、肝、肾","心、肝、肺","肝、肾、肺","心、肺、肾","以上都不是"],"a":"A","e":"温热病血分证主要累及心、肝、肾。","k":"病位辨证"},{"t":1,"s":"在温病的辨证中，斑疹隐现属于","o":["卫分证候","气分证候","中焦证候","营分证候","血分证候"],"a":"D","e":"温热病营分证、血分证可出现斑疹。营分证为邪热入营，窜扰血络，灼伤血络，可见斑疹隐现。而血分证为邪热迫血妄行，可见斑疹显露。","k":"病位辨证"},{"t":1,"s":"患者持续低热，暮热早凉，形瘦，手足蠕动，舌绛无苔，脉细数。其辨证属","o":["血分虚热","血分实热","营分证候","热扰胸膈","热在肺卫"],"a":"A","e":"本题根据舌光无苔、脉细数，可排除D、E。营分证、血分实证均可见斑疹、出血等，故选A。","k":"病位辨证"},{"t":2,"s":"心血虚证与心阴虚证的共同症状有（  ）","o":["心悸","胸闷","失眠","舌淡","心烦"],"a":"AC","e":"本题主要考查心血虚证与心阴虚证的异同。二者均可见心悸、失眠。心血虚证有血虚表现，可见舌淡；而心阴虚证有热象，可见舌红、心烦。胸闷为心气虚、心阳虚的表现。","k":"病位辨证"},{"t":2,"s":"心阴虚证的表现是（  ）","o":["心烦失眠","头晕健忘","心悸多梦","面白无华","舌红少苔"],"a":"ACE","e":"本题主要考查心血虚证与心阴虚证的鉴别。心阴虚证由于心阴亏虚，心神失养，所以可见心悸、失眠、多梦；由于阴虚生内热，所以有热象，见心烦、面红、舌红。心血虚证虽然与心阴虚证同属于一类，但有不同。血虚头面失养，可见头晕健忘、面白无华。","k":"病位辨证"},{"t":2,"s":"风寒犯肺证、风热犯肺证、燥邪犯肺证的鉴别要点是（  ）","o":["咳痰性质","发热恶寒的轻重","舌苔的变化","病程的长短","有无胸闷、胸痛"],"a":"ABC","e":"三者病程都不长，一般胸闷也都不明显。在咳痰性质上，风寒犯肺证咳痰色白清稀；风热犯肺证咳痰色黄；燥邪犯肺证痰少而黏，难以咯吐。在发热恶寒轻重方面，风寒犯肺证恶寒明显，发热轻；风热犯肺证发热重，恶寒略轻；燥邪犯肺证发热恶寒均较轻微。在舌苔方面，风寒犯肺证舌苔薄白；风热犯肺证舌苔薄黄；燥邪犯肺证舌苔干燥明显。","k":"病位辨证"},{"t":2,"s":"痰热壅肺证的临床表现有（  ）","o":["咳嗽气喘","咯痰黄稠量多","发热口渴","舌红苔黄腻","脉滑数"],"a":"ABCDE","e":"痰热壅肺证有咳、喘、痰等肺的病状，有发热、口渴等实热证的表现，有痰多黄稠、舌红苔黄腻、脉滑数等痰热盛的表现。","k":"病位辨证"},{"t":2,"s":"肺气虚证的表现有（  ）","o":["久病咳喘","咳痰清稀","易于感冒","鼻流清涕","自汗"],"a":"ABCE","e":"肺气虚证多因久病咳喘，耗伤肺气而致。肺主表，外合皮毛，由于肺气虚，卫表不固，可见自汗、易于感冒。","k":"病位辨证"},{"t":2,"s":"中气下陷证可见（  ）","o":["久泻久痢","头晕目眩","便中夹血","小便混浊如米泔","大便秘结"],"a":"ABD","e":"脾虚气陷，清阳不升，可导致久泻久痢、头晕目眩、小便混浊如米泔。若理解、掌握不全面，易漏选B、D。","k":"病位辨证"},{"t":2,"s":"寒湿困脾证与湿热蕴脾证的鉴别要点是（  ）","o":["腹胀的程度","面目发黄的色泽","大便的稠稀","舌苔的颜色","小便的长短"],"a":"BD","e":"寒湿困脾证与湿热蕴脾证均有湿邪中阻的表现，均可出现腹胀、便溏。湿邪中阻，气化不利，均可见小便短少不利。故A、C、E不是二证鉴别的依据。二证均可出现身目发黄，但寒湿困脾证表现为阴黄，湿热蕴脾证表现为阳黄；二证均可见苔，但是寒湿困脾证舌苔白腻，湿热蕴脾证舌苔黄腻。故选BD。","k":"病位辨证"},{"t":2,"s":"下列与湿热蕴脾有关的是（  ）","o":["脘腹痞满","口腻身重","身热不扬","肛门灼热","下痢脓血"],"a":"ABC","e":"湿热蕴脾证湿热蕴蒸，可见身热不扬；湿热中阻，气机不畅，可见脘腹痞满、口腻身重。而肛门灼热、下痢脓血为大肠湿热的表现，不属湿热蕴脾。","k":"病位辨证"},{"t":2,"s":"脾气虚证与脾阳虚证的共有症状是（  ）","o":["下利清谷","畏寒肢冷","肢体浮肿","气短乏力","头晕目眩"],"a":"CD","e":"脾阳虚证是脾阳气虚衰的证候，故有脾气虚的表现。由于脾失健运，水湿不化，故二者均可出现浮肿。因此，二证的共有症状是C、D。畏寒肢冷为寒象，见于脾阳虚证，而不见于脾气虚证。虽然二证均可有腹泻下利，但脾阳虚证由于阳气虚，无法腐熟水谷，可见下利清谷、完谷不化，而脾气虚证不会出现此症。","k":"病位辨证"},{"t":2,"s":"胃阴虚证与胃火炽盛证的共同表现有（  ）","o":["胃脘灼痛","饥不欲食","消谷善饥","舌红","下利清谷"],"a":"AD","e":"胃阴虚证与胃火炽盛证均为胃热证，A、D为二者的共同表现。胃阴虚证多见饥不欲食，胃火炽盛证多见消谷善饥。","k":"病位辨证"},{"t":2,"s":"肝阳上亢证与肝火上炎证的共同表现有（  ）","o":["头晕耳鸣","口苦咽干","面红目赤","舌红","头重脚轻"],"a":"ACD","e":"肝火上炎证是由于火热之邪上扰清窍，肝阳上亢证是由于阳气亢逆上扰清窍，二者均可出现头晕目眩、面红目赤、头重脚轻。肝阳上亢证为阴虚阳亢的证候，肝火上炎证为实热证，故二证皆可见舌红。而口苦咽干多为肝胆实热的表现，肝阳上亢一般不出现。","k":"病位辨证"},{"t":2,"s":"阳亢化风可见（  ）","o":["眩晕头痛","半身不遂","舌强语涩","角弓反张","口苦咽干"],"a":"ABC","e":"阳亢化风是指肝阳化风，本题主要考查肝阳化风证的临床表现。肝阳化风，风阳上扰则眩晕头痛，风阳窜扰舌络则舌强语涩，风痰阻滞经络则半身不遂。而角弓反张多为热极生风证高热抽搐时的表现以及痫证的表现。口苦咽干多为肝胆实热的表现。","k":"病位辨证"},{"t":2,"s":"形成肝风内动的原因有（  ）","o":["邪热炽盛","阴虚阳亢","阴血亏耗","外感风邪","饮食不节"],"a":"ABC","e":"肝风内动证具体包括肝阳化风、热极生风、阴虚动风、血虚生风，属于风气内动，为内风，其形成与邪热炽盛、阴虚阳亢、阴血亏虚关系密切，一般不是外感风邪、饮食不节所导致。","k":"病位辨证"},{"t":2,"s":"肾阳虚证可出现（  ）","o":["小便多而清长","尿少","久泻","夜尿频多","阳痿"],"a":"ABCDE","e":"肾阳虚衰，不能温化水液，可致小便多而清长、夜尿频多；不能温化水谷，可致久泻；气化无力，可致小便不利、尿少；性功能减退，可致阳痿。","k":"病位辨证"},{"t":2,"s":"肾阴虚的主要临床表现有（  ）","o":["腰膝酸软","骨蒸盗汗","耳鸣遗精","形体消瘦","崩漏"],"a":"ABCDE","e":"肾阴虚可见阴虚和腰府失养的症状。同时阴虚火旺，虚火内扰，可致遗精、崩漏等。若掌握不全面，易漏选D、E。","k":"病位辨证"},{"t":2,"s":"肾阴虚证与肾精不足证的共同表现有（  ）","o":["腰膝酸软","遗精","女子经少经闭","男子精少不育","盗汗"],"a":"ACD","e":"肾阴虚证与肾精不足证都有腰府失养和阴精不足的症状，故选ACD。而遗精、盗汗多见于肾阴虚证，由阴虚火旺，虚火内扰而致，肾精不足证一般不出现。","k":"病位辨证"},{"t":2,"s":"肺肾阴虚证的临床表现有","o":["失眠多梦","声音嘶哑","男子遗精","心悸咳喘","健忘"],"a":"BC","e":"肺阴亏虚，声门失于濡润，可出现声音嘶哑；肾阴亏虚，虚火内扰，可出现遗精；心阴亏虚，心神不安，可出现失眠多梦、健忘。","k":"病位辨证"},{"t":2,"s":"阳明经证与阳明腑证的共有表现是","o":["发热","汗出","腹痛","苔黄","盗汗"],"a":"ABD","e":"阳明经证与阳明腑证均为实热证，可见发热、苔黄。阳明经证可见大汗出，阳明腑证可见手足濈然汗出，故二者均有汗出。","k":"病位辨证"},{"t":2,"s":"气分证的脏腑病位是","o":["大肠","胸膈","肺","胆","肝"],"a":"ABCD","e":"气分证是温热病邪内传脏腑，正盛邪实的证候。温热病邪侵犯的脏腑有肺、胸膈、肠、胆等。","k":"病位辨证"},{"t":2,"s":"血分证的临床表现主要有","o":["暮热朝凉","神昏谵语","烦渴下利","舌上少津","心烦口渴"],"a":"ABD","e":"温热病血分证分为血分实热证和血分虚热证。心烦口渴多见于营分证。若概念不清，认为血分证为温热病的最后阶段，都是虚证，则易漏选B。","k":"病位辨证"},{"t":1,"s":"痰热、湿热，或食积生热应见","o":["弦数","洪数","滑数","浮数","沉数"],"a":"C","e":"滑脉多见于痰湿、食积和实热等病证。数脉多见于热证，亦见于里虚证。因此，滑数脉可见痰热、湿热或食积生热。","k":"模拟试卷A卷"},{"t":1,"s":"表虚证的主要临床表现为","o":["恶寒、发热、汗出、脉浮缓","恶寒、发热、汗出、脉浮数","恶寒、发热、无汗、脉浮紧","恶寒、发热、无汗、脉浮数","发热、汗出、口渴、脉洪大"],"a":"A","e":"太阳主表，统摄营卫，风邪外袭，营卫失调，肌表失于温煦则恶风；风为阳邪，邪正交争于表，则发热；风性开泄，卫外不固，腠理疏松，营阴不能内守，则自汗出；汗出肌腠疏松，营阴不足，脉道松弛，故脉浮缓。","k":"模拟试卷A卷"},{"t":1,"s":"表证之恶寒是由于","o":["风性开泄，腠理疏松","阳气不足","外邪束表，卫阳失宣","肺气不足","表气不固"],"a":"C","e":"外邪侵袭肌表，卫阳被遏，肌腠失于温煦，则恶寒。","k":"模拟试卷A卷"},{"t":1,"s":"心肾不交证的脉象为","o":["细脉","数脉","濡数脉","细数脉","洪数脉"],"a":"D","e":"心肾不交的原因之一为劳神太过，或情志忧郁化火伤阴，心火内炽，不能下交于肾，则出现便结尿黄，舌红，少苔，脉细数，为阴虚火旺之征。","k":"模拟试卷A卷"},{"t":1,"s":"脾阳虚证口渴饮水的特点为","o":["口干欲饮","口干不欲饮","口干饮冷","口淡不渴","口干但欲漱水不欲咽"],"a":"D","e":"因脾胃阳气亏虚，运化腐熟功能低下，或寒湿内停，阴不耗液，故口淡不渴。","k":"模拟试卷A卷"},{"t":1,"s":"患者右上腹突然剧痛，阵阵发作，面白汗出，四肢厥冷，恶心、呕吐，并吐出蛔虫。其辨证属","o":["寒邪内积","气滞腹痛","虫积肠道","湿热壅滞","蛔厥"],"a":"E","e":"右上腹突然剧痛，阵阵发作，面白汗出，四肢厥冷，恶心、呕吐，并吐出蛔虫，此属蛔厥。","k":"模拟试卷A卷"},{"t":1,"s":"灰黑苔辨寒热的关键是观察","o":["舌苔之厚薄","舌苔之腐腻","舌形之胖瘦","舌苔之润燥","舌之老嫩"],"a":"D","e":"苔质的润燥是辨别灰黑苔寒热属性的重要指征。在寒湿病中出现灰黑苔，多由白苔转化而成，其舌苔灰黑必湿润多津；在热性病中出现，多由黄苔转变而成，其舌苔灰黑必干燥无津液。","k":"模拟试卷A卷"},{"t":1,"s":"下列不属于膀胱湿热证特征的是","o":["尿频","尿急","遗尿","尿痛","尿黄赤"],"a":"C","e":"膀胱湿热证是指湿热侵袭，蕴结膀胱，以小便频急、灼涩疼痛，尿频，尿急，尿道灼痛，小便短黄或混浊等为主要表现的证。","k":"模拟试卷A卷"},{"t":1,"s":"患者，男，60岁。头晕目眩，常发生昏仆，昨日因恼怒而眩晕加重，自觉身摇欲仆，头颠顶胀痛，耳鸣，心烦寐少，阵发性肢端麻木，手足心热，纳食不佳。舌质红，脉细数。血压为150/110mmHg。其辨证为","o":["肝阳上亢证","肝阴虚证","肝阳化风证","肝血虚证","肝火炽盛证"],"a":"C","e":"肝阳化风证表现为眩晕欲仆，头摇而痛，言语謇涩，手足震颤，肢体麻木，步履不正，或猝然昏倒，不省人事，口眼歪斜，半身不遂，喉中痰鸣，舌红苔腻，脉弦。其多因素体肝肾阴液不足，或久病阴亏，或肝火内伤营阴等，阴亏不能制阳，肝阳亢逆化风，导致肝风内动。","k":"模拟试卷A卷"},{"t":1,"s":"痿证的特征是","o":["手足软弱无力，行动不灵","关节肿痛，肢体动作困难","四肢不用，麻木不仁","四肢震颤，独头动摇","四肢抽搐，项背强直"],"a":"A","e":"首先，痿证为肢体力弱，无疼痛症状；其次，观察肢体的活动障碍，痿证是无力运动，痹证是因痛而影响活动；再者，部分痿证病初即有肌肉萎缩，而痹证则是由于疼痛甚或关节僵直不能活动，日久废而不用导致肌肉萎缩。","k":"模拟试卷A卷"},{"t":1,"s":"痹证的特征是","o":["手足软弱无力，行动不灵","关节肿痛，肢体动作困难","四肢不用，麻木不仁","四肢震颤，独头动摇","四肢抽搐，项背强直"],"a":"B","e":"痹证是由风、寒、湿、热之邪留注肌腠经络，痹阻筋脉关节而致。其与痿证的鉴别要点首先在于痛与不痛，痹证以关节疼痛为主。","k":"模拟试卷A卷"},{"t":1,"s":"恶寒发热，头身疼痛，无汗，脉浮紧者属","o":["表证","里证","半表半里证","表里同病","由表入里"],"a":"A","e":"表证是指六淫、疫疠等邪气，经皮毛、口鼻侵入机体的初期阶段，正气抗邪于肌表，以新起恶寒发热为主要表现的证。","k":"模拟试卷A卷"},{"t":1,"s":"寒热往来，口苦咽干，脉弦者属","o":["表证","里证","半表半里证","表里同病","由表入里"],"a":"C","e":"半表半里证是指病变既非完全在表，又未完全入里，病位处于表里进退变化之中，以寒热往来等为主要表现的证。","k":"模拟试卷A卷"},{"t":1,"s":"壮热恶热，大汗，脉洪大者属","o":["表证","里证","半表半里证","表里同病","由表入里"],"a":"B","e":"里证是指病变部位在内，脏腑、气血、骨髓等受病，以脏腑受损或功能失调症状为主要表现的证。","k":"模拟试卷A卷"},{"t":1,"s":"亡阳证为","o":["面色苍白，冷汗淋漓，手足厥冷，脉微欲绝","潮热盗汗，五心烦热，口干咽燥，大便干结，脉细数","形寒肢冷，口淡不渴，小便清长，大便稀溏，脉迟无力","汗出而黏，口渴欲饮，燥扰不宁，手足温，脉疾无力","发热，腹痛拒按，烦躁不安，大便秘结，脉滑无力"],"a":"A","e":"亡阳证是指人体阳气极度衰微而欲脱，以冷汗、肢厥、面白、脉微等为主要表现的危重证。","k":"模拟试卷A卷"},{"t":1,"s":"亡阴证为","o":["面色苍白，冷汗淋漓，手足厥冷，脉微欲绝","潮热盗汗，五心烦热，口干咽燥，大便干结，脉细数","形寒肢冷，口淡不渴，小便清长，大便稀溏，脉迟无力","汗出而黏，口渴欲饮，燥扰不宁，手足温，脉疾无力","发热，腹痛拒按，烦躁不安，大便秘结，脉滑无力"],"a":"D","e":"亡阴证是指人体阴液严重耗损而欲竭，以汗出如油、身热烦渴、面赤、唇焦、脉数疾为主要表现的危重证。","k":"模拟试卷A卷"},{"t":1,"s":"血虚生风证可见","o":["手足蠕动","肌肉瞤动","角弓反张","半身不遂","烦躁不安"],"a":"B","e":"血虚生风证可见手足震颤，头晕眼花，夜盲，失眠多梦，肢体麻木，肌肉瞤动，皮肤瘙痒，爪甲不荣，面唇淡白，舌淡苔白，脉细或弱。","k":"模拟试卷A卷"},{"t":1,"s":"阴虚动风证可见","o":["手足蠕动","肌肉瞤动","角弓反张","半身不遂","烦躁不安"],"a":"A","e":"阴虚动风证可见手足震颤或蠕动，眩晕耳鸣，两目干涩，视物模糊，五烦热，潮热盗汗，舌红少苔，脉弦细数。","k":"模拟试卷A卷"},{"t":1,"s":"肝阳化风证可见","o":["手足蠕动","肌肉瞤动"
