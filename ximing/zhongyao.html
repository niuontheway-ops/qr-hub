<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3d7a3f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>中药学 · 西学中题库</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --c1:#3d7a3f;
  --c2:#63a05f;
  --paper:#f6f3ec;
  --card:#fffdf8;
  --ink:#1b2422;
  --ink2:#3f4c48;
  --mut:#8b9793;
  --line:rgba(27,36,34,.09);
  --ok:#2e8f63;
  --okbg:#e8f5ee;
  --no:#c5463a;
  --nobg:#fbe9e6;
  --r:16px;
  --sh:0 2px 10px rgba(27,36,34,.05);
  --sh2:0 8px 28px rgba(27,36,34,.10);
}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--paper);color:var(--ink);
  font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
#app{max-width:720px;margin:0 auto;min-height:100vh;position:relative;overflow-x:hidden}
.screen{display:none}
.screen.on{display:block;animation:fade .28s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ============ 首页 ============ */
.hero{
  position:relative;overflow:hidden;
  padding:calc(18px + env(safe-area-inset-top)) 20px 44px;
  background:linear-gradient(158deg,var(--c1) 0%,var(--c2) 100%);
  color:#fff;border-radius:0 0 30px 30px;
}
.hero::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(60% 70% at 88% 8%,rgba(255,255,255,.22),transparent 62%),
    radial-gradient(50% 60% at 4% 96%,rgba(0,0,0,.16),transparent 60%);
}
.hero::after{
  content:"";position:absolute;right:-46px;top:-52px;width:190px;height:190px;
  border-radius:50%;border:1px solid rgba(255,255,255,.20);
  box-shadow:0 0 0 22px rgba(255,255,255,.05),0 0 0 46px rgba(255,255,255,.035);
}
.htop{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brandline{font-size:11.5px;letter-spacing:1.6px;opacity:.84;font-weight:500}
.qrbtn{
  width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);
  backdrop-filter:blur(4px);transition:transform .16s,background .16s;
}
.qrbtn:active{transform:scale(.92);background:rgba(255,255,255,.26)}
.qrbtn svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.7}
.hname{position:relative;font-size:27px;font-weight:800;letter-spacing:1.5px;margin-top:20px;line-height:1.28}
.hname small{display:block;font-size:12px;font-weight:500;letter-spacing:2.6px;opacity:.62;margin-top:7px;text-transform:uppercase}
.hmeta{position:relative;display:flex;align-items:center;gap:9px;margin-top:15px;font-size:12px;opacity:.9;flex-wrap:wrap}
.hmeta i{width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.55);font-style:normal}

.statcard{
  position:relative;margin:-28px 16px 0;padding:16px 16px 14px;
  background:var(--card);border-radius:var(--r);box-shadow:var(--sh2);
  border:1px solid var(--line);
}
.statrow{display:flex}
.st{flex:1;text-align:center;position:relative}
.st+.st::before{content:"";position:absolute;left:0;top:14%;height:72%;width:1px;background:var(--line)}
.st b{display:block;font-size:21px;font-weight:800;letter-spacing:.4px;font-variant-numeric:tabular-nums}
.st span{font-size:11.5px;color:var(--mut);letter-spacing:.6px}
.pbar{height:5px;border-radius:4px;background:rgba(27,36,34,.07);margin-top:14px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--c2),var(--c1));transition:width .6s cubic-bezier(.2,.8,.3,1)}

.cta{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  margin:14px 16px 0;padding:16px 18px;width:calc(100% - 32px);
  background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;
  border-radius:var(--r);box-shadow:0 10px 24px -10px var(--c1);
  transition:transform .14s ease;
}
.cta:active{transform:scale(.985)}
.cta span{font-size:16px;font-weight:700;letter-spacing:.6px}
.cta em{font-style:normal;font-size:12px;opacity:.8;font-weight:400}
.cta .arw{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;opacity:.85;flex:0 0 auto}

.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:26px 20px 11px}
.sec h2{font-size:14px;font-weight:700;letter-spacing:1.1px;color:var(--ink)}
.sec .hint{font-size:11.5px;color:var(--mut)}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.mode{
  display:flex;align-items:center;gap:11px;padding:15px 13px;min-height:74px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  text-align:left;box-shadow:var(--sh);transition:transform .14s,border-color .18s,box-shadow .18s;
}
.mode:active{transform:scale(.97)}
.mode .ic{
  flex:0 0 auto;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--c1) 10%,transparent);
}
.mode .ic svg{width:17px;height:17px;stroke:var(--c1);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mode b{display:block;font-size:14.5px;font-weight:700;letter-spacing:.3px;line-height:1.35}
.mode span{display:block;font-size:11px;color:var(--mut);margin-top:2px;letter-spacing:.2px}

.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px}
.chip{
  padding:8px 13px;border-radius:10px;background:var(--card);border:1px solid var(--line);
  font-size:12.5px;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;
  transition:transform .14s,border-color .16s,color .16s;
}
.chip:active{transform:scale(.95)}
.chip b{font-weight:700;font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.chip.hot{border-color:color-mix(in srgb,var(--c1) 34%,transparent);color:var(--c1);background:color-mix(in srgb,var(--c1) 6%,var(--card))}
.chip.hot b{color:var(--c2)}

.foot{padding:28px 20px calc(38px + env(safe-area-inset-bottom))}
.switch{display:flex;align-items:center;gap:10px;padding:13px 15px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:13px;color:var(--ink2)}
.switch input{display:none}
.switch i{position:relative;width:38px;height:22px;border-radius:20px;background:rgba(27,36,34,.14);flex:0 0 auto;transition:background .2s}
.switch i::after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch input:checked+i{background:var(--c1)}
.switch input:checked+i::after{transform:translateX(16px)}
.brand{margin-top:22px;text-align:center;font-size:11px;color:var(--mut);letter-spacing:.6px;line-height:1.9}

/* ============ 答题页 ============ */
#quiz{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.tbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
}
.ibtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;transition:background .16s,transform .14s;flex:0 0 auto}
.ibtn:active{transform:scale(.9);background:rgba(27,36,34,.06)}
.ibtn svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tprog{flex:1;min-width:0}
.tprog .t1{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin-bottom:5px;font-variant-numeric:tabular-nums}
.tprog .t1 b{color:var(--ink);font-weight:700}
.tline{height:4px;border-radius:3px;background:rgba(27,36,34,.08);overflow:hidden}
.tline i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c2),var(--c1));border-radius:3px;transition:width .35s cubic-bezier(.2,.8,.3,1)}
.timer{font-size:12px;font-weight:700;color:var(--c1);font-variant-numeric:tabular-nums;letter-spacing:.5px;padding:5px 9px;border-radius:8px;background:color-mix(in srgb,var(--c1) 9%,transparent);flex:0 0 auto}
.timer.warn{color:var(--no);background:var(--nobg);animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.45}}

.qwrap{padding:18px 16px 0}
.qcard{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:18px 17px 16px;box-shadow:var(--sh);
}
.qcard.cin{animation:cin .3s cubic-bezier(.2,.85,.3,1)}
@keyframes cin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.qcard.cin.rev{animation-direction:reverse}
.qhead{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.8px;padding:3px 8px;border-radius:6px;background:color-mix(in srgb,var(--c1) 11%,transparent);color:var(--c1)}
.tag.multi{background:rgba(160,120,40,.11);color:#9a7328}
.kptag{font-size:10.5px;letter-spacing:.3px;padding:3px 8px;border-radius:6px;background:rgba(27,36,34,.05);color:var(--mut);max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qnum{margin-left:auto;font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.stem{font-size:16.5px;line-height:1.78;letter-spacing:.2px;color:var(--ink);font-weight:500;word-break:break-word}
.opts{margin-top:16px;display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
  padding:12px 13px;background:#fff;border:1.4px solid var(--line);border-radius:13px;
  transition:border-color .16s,background .16s,transform .12s,box-shadow .16s;
  position:relative;
}
.opt:active{transform:scale(.988)}
.ob{
  flex:0 0 auto;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;font-weight:700;color:var(--mut);background:rgba(27,36,34,.05);
  transition:background .16s,color .16s,transform .16s;margin-top:1px;
}
.ot{font-size:15px;line-height:1.6;color:var(--ink2);letter-spacing:.2px;word-break:break-word}
.opt.sel{border-color:var(--c1);background:color-mix(in srgb,var(--c1) 5%,#fff)}
.opt.sel .ob{background:var(--c1);color:#fff}
.opt.sel .ot{color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .ob{background:var(--ok);color:#fff;animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
.opt.right .ot{color:#1e6b47;font-weight:600}
.opt.bad{border-color:var(--no);background:var(--nobg);animation:shake .32s}
.opt.bad .ob{background:var(--no);color:#fff}
.opt.bad .ot{color:#9c3428}
.opt.dim{opacity:.55}
.opt.lock{cursor:default}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}22%{transform:translateX(-6px)}45%{transform:translateX(5px)}70%{transform:translateX(-3px)}}
.opt .mk{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:15px;font-weight:800;opacity:0}
.opt.right .mk{opacity:1;color:var(--ok);animation:pop .34s .05s both}
.opt.bad .mk{opacity:1;color:var(--no)}

.exp{
  margin-top:14px;border-radius:14px;padding:0 14px;
  background:color-mix(in srgb,var(--c1) 5%,#fff);
  border:1px solid color-mix(in srgb,var(--c1) 15%,transparent);
  max-height:0;overflow:hidden;opacity:0;padding-top:0;padding-bottom:0;
  transition:max-height .34s cubic-bezier(.2,.85,.3,1),opacity .26s,padding .3s;
}
.exp.on{max-height:1400px;opacity:1;padding-top:13px;padding-bottom:13px;margin-top:15px}
.exphead{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.exphead .lbl{font-size:11px;color:var(--mut);letter-spacing:.6px}
.exphead .ans{font-size:15px;font-weight:800;color:var(--c1);letter-spacing:1px}
.exphead .verd{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.5px}
.verd.ok{color:var(--ok);background:var(--okbg)}
.verd.no{color:var(--no);background:var(--nobg)}
.exptxt{font-size:14px;line-height:1.85;color:var(--ink2);letter-spacing:.2px;word-break:break-word;white-space:pre-wrap}
.expfoot{display:flex;align-items:center;gap:8px;margin-top:11px;padding-top:10px;border-top:1px dashed color-mix(in srgb,var(--c1) 18%,transparent);font-size:11px;color:var(--mut)}

.qfoot{
  position:fixed;left:0;right:0;bottom:0;z-index:22;
  max-width:720px;margin:0 auto;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--paper) 92%,transparent);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:flex;gap:9px;
}
.fbtn{
  flex:1;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;gap:7px;
  font-size:15px;font-weight:700;letter-spacing:.6px;transition:transform .14s,opacity .2s,background .2s;
}
.fbtn:active{transform:scale(.98)}
.fbtn.pri{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;box-shadow:0 8px 18px -8px var(--c1)}
.fbtn.gh{background:rgba(27,36,34,.06);color:var(--ink2);flex:0 0 88px}
.fbtn[disabled]{opacity:.38;box-shadow:none}
.fbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ============ 答题卡 / 弹层 ============ */
.mask{
  position:fixed;inset:0;z-index:40;background:rgba(18,26,24,.42);
  opacity:0;pointer-events:none;transition:opacity .26s;backdrop-filter:blur(2px);
}
.mask.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:720px;margin:0 auto;
  background:var(--card);border-radius:22px 22px 0 0;
  transform:translateY(100%);transition:transform .34s cubic-bezier(.2,.85,.3,1);
  padding-bottom:env(safe-area-inset-bottom);max-height:82vh;display:flex;flex-direction:column;
}
.sheet.on{transform:none}
.shead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;flex:0 0 auto}
.shead h3{font-size:15px;font-weight:700;letter-spacing:.6px}
.shead .cbtn{font-size:12.5px;color:var(--mut);padding:5px 9px;border-radius:8px}
.sfilters{display:flex;gap:7px;padding:0 18px 12px;flex:0 0 auto}
.sf{font-size:12px;padding:6px 12px;border-radius:8px;background:rgba(27,36,34,.05);color:var(--ink2);transition:background .16s,color .16s}
.sf.on{background:var(--c1);color:#fff}
.grid{
  display:grid;grid-template-columns:repeat(8,1fr);gap:8px;
  padding:4px 18px 22px;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;
}
.gi{
  aspect-ratio:1;border-radius:9px;display:grid;place-items:center;
  font-size:12.5px;font-weight:700;color:var(--ink2);
  background:rgba(27,36,34,.055);transition:transform .12s,background .16s;font-variant-numeric:tabular-nums;
}
.gi:active{transform:scale(.9)}
.gi.ok{background:var(--okbg);color:var(--ok)}
.gi.no{background:var(--nobg);color:var(--no)}
.gi.did{background:color-mix(in srgb,var(--c1) 12%,transparent);color:var(--c1)}
.gi.cur{box-shadow:0 0 0 2px var(--c1);color:var(--c1);font-weight:800}
.gi.none{opacity:.35;pointer-events:none}
.legend{display:flex;gap:14px;padding:0 18px 16px;font-size:11px;color:var(--mut);flex-wrap:wrap;flex:0 0 auto}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* 二维码弹层 */
.qrmask{position:fixed;inset:0;z-index:60;background:rgba(18,26,24,.55);backdrop-filter:blur(6px);display:none;place-items:center;padding:24px}
.qrmask.on{display:grid;animation:fade .22s}
.qrbox{background:var(--card);border-radius:22px;padding:22px 22px 18px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);max-width:320px;width:100%;animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(18px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.qrbox h4{font-size:15px;font-weight:700;letter-spacing:.8px;margin-bottom:3px}
.qrbox p{font-size:11.5px;color:var(--mut);margin-bottom:14px}
.qrbox img{width:100%;max-width:220px;border-radius:10px;display:block;margin:0 auto}
.qrbox .url{margin-top:12px;font-size:10.5px;color:var(--mut);word-break:break-all;line-height:1.6;background:rgba(27,36,34,.04);padding:7px 9px;border-radius:8px;font-family:ui-monospace,Menlo,monospace}
.qrbox .cbtn2{margin-top:12px;width:100%;height:42px;border-radius:11px;background:var(--c1);color:#fff;font-size:14px;font-weight:700;letter-spacing:.6px}
.qrbox .close{margin-top:9px;font-size:12px;color:var(--mut);padding:6px}

/* ============ 结果页 ============ */
#result{padding:calc(24px + env(safe-area-inset-top)) 0 calc(40px + env(safe-area-inset-bottom))}
.rhd{text-align:center;padding:12px 24px 4px}
.rhd .ttl{font-size:12px;letter-spacing:2.4px;color:var(--mut);text-transform:uppercase}
.ringwrap{position:relative;width:186px;height:186px;margin:18px auto 0}
.ringwrap svg{transform:rotate(-90deg)}
.ringwrap .bgc{stroke:rgba(27,36,34,.075);fill:none}
.ringwrap .fgc{stroke:url(#rg);fill:none;stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.3,1)}
.ringtxt{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ringtxt b{font-size:42px;font-weight:800;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums}
.ringtxt b i{font-size:16px;font-weight:600;font-style:normal;color:var(--mut);margin-left:2px}
.ringtxt span{font-size:11.5px;color:var(--mut);letter-spacing:1.6px;margin-top:8px}
.rsum{display:flex;justify-content:center;gap:0;margin:22px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 0;box-shadow:var(--sh)}
.rsum div{flex:1;text-align:center;position:relative}
.rsum div+div::before{content:"";position:absolute;left:0;top:12%;height:76%;width:1px;background:var(--line)}
.rsum b{display:block;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.rsum span{font-size:11px;color:var(--mut)}
.rsum .g{color:var(--ok)}
.rsum .r{color:var(--no)}

.block{margin:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 15px;box-shadow:var(--sh)}
.block h5{font-size:12.5px;font-weight:700;letter-spacing:.9px;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.block h5::before{content:"";width:3px;height:12px;border-radius:2px;background:var(--c1)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:flex;align-items:center;gap:9px;font-size:12px}
.bar .n{width:112px;flex:0 0 auto;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .t{flex:1;height:6px;border-radius:3px;background:rgba(27,36,34,.07);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--c2),var(--c1));width:0;transition:width .8s cubic-bezier(.2,.8,.3,1)}
.bar .v{width:52px;text-align:right;color:var(--mut);font-variant-numeric:tabular-nums;font-size:11px;flex:0 0 auto}
.racts{display:flex;flex-direction:column;gap:9px;margin:18px 16px 0}
.acts{display:flex;gap:9px;margin:18px 16px 0}
.acts .fbtn{flex:1}
.empty{text-align:center;color:var(--mut);font-size:13px;padding:28px 0}

.toast{
  position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,12px);
  background:rgba(24,32,30,.92);color:#fff;font-size:13px;padding:9px 16px;border-radius:10px;

var BANK = {"slug":"zhongyao","name":"中药学","py":"Zhongyaoxue","c1":"#3d7a3f","c2":"#63a05f","questions":[{"t":1,"s":"道地药材产于四川的是","o":["黄连","薄荷","五味子","阿胶","地黄"],"a":"A","e":"黄连的道地药材产于四川，薄荷的道地药材产于江苏，五味子的道地药材产于东北，阿胶的道地药材产于山东，地黄的道地药材产于河南，故正确答案应选A项。","k":"中药的产地、采集与贮藏"},{"t":1,"s":"二、八月最宜采集的药材是","o":["叶类","花类","全草类","果实类","根及根茎"],"a":"E","e":"根及根茎一般以早春及深秋，即二月、八月采收最佳，现代研究也证明，早春及深秋时植物的根茎中有效成分含量较高，此时采集产量和质量都较高，故答案应选E项。","k":"中药的产地、采集与贮藏"},{"t":1,"s":"道地药材产于甘肃的是","o":["枸杞","当归","阿胶","牛膝","党参"],"a":"B","e":"道地药材产于甘肃的是当归，枸杞的道地产地是宁夏，阿胶的道地产地是山东，牛膝的道地产地是河南，党参的道地产地是山西，所以正确答案是B项。","k":"中药的产地、采集与贮藏"},{"t":1,"s":"枳实的采收应在","o":["花蕾含苞欲放时","果实成熟后","果实未成熟时","深秋时","清明期间采收"],"a":"C","e":"果实类药物一般在果实成熟时采收，而枳实是酸橙的干燥幼果入药，因而在果实未成熟时采集，故答案是C项。","k":"中药的产地、采集与贮藏"},{"t":1,"s":"桑叶的采收应在","o":["花蕾含苞欲放时","果实成熟后","枝叶茂盛时","深秋时","清明期间采收"],"a":"D","e":"叶类药物一般在花蕾将放或正盛开时采收，此时叶片茂盛。而桑叶需在深秋或初冬经霜后采集，故答案是D项。","k":"中药的产地、采集与贮藏"},{"t":2,"s":"确定道地药材的主要因素有","o":["产地","品种","质量","产量","疗效"],"a":"ABCDE","e":"道地药材是指历史悠久、产地适宜、品种优良、产量宏丰、炮制考究、疗效突出、带有地域特点的药材，因此道地药材的确定与产地、品种、质量、产量、疗效都有关系，故答案应选ABCDE。","k":"中药的产地、采集与贮藏"},{"t":1,"s":"醋炙香附的目的是","o":["增强疗效","减低毒性","改变药性","便于服用","有利贮藏"],"a":"A","e":"醋炙香附可增强其疏肝止痛的功效，故答案应选A项。","k":"中药的炮制"},{"t":1,"s":"为了增强药物的活血作用，宜采用","o":["蜜炙","酒炙","醋炙","姜炙","盐炙"],"a":"B","e":"酒也是中药，具有温通经脉的作用，酒炙可增强药物的活血之功，故答案应选B项。","k":"中药的炮制"},{"t":1,"s":"为了增强药物的补肾作用，宜采用","o":["蜜炙","酒炙","醋炙","姜炙","盐炙"],"a":"E","e":"盐是咸味，可下行入肾，盐炙可引药入肾和增强补肾作用，故答案应选E项。","k":"中药的炮制"},{"t":1,"s":"巴豆制霜的目的是","o":["消除毒性","增强药效","改变药性","便于贮藏","纯净药材"],"a":"A","e":"巴豆有较强的毒副作用，压油取霜能降低其毒副作用，故答案应选A项。","k":"中药的炮制"},{"t":1,"s":"将药物用猛火直接或间接煅烧，使质地松脆，易于粉碎，便于有效成分的煎出，以充分发挥疗效。这种炮制方法是","o":["烫法","煅法","煨法","炙法","炒法"],"a":"B","e":"煅法与烫法都是用于炮制质地较硬的矿物或贝壳，煅法是将药物在猛火上煅烧，而烫法是加入中间物体以烫炙药物，其优点在于受热均匀。这两种炮制方法容易混淆。故答案应选B项。","k":"中药的炮制"},{"t":2,"s":"常用的炮制方法有","o":["修制","水制","火制","水火共制","其他制法"],"a":"ABCDE","e":"中药常用的炮制方法有修制、水制、火制、水火共制、其他制法五大类型，故答案应选ABCDE。","k":"中药的炮制"},{"t":2,"s":"水火共制法有","o":["炙","蒸","淬","燀","煨"],"a":"BCD","e":"水火共制法包括蒸、煮、炖、燀、淬等，而炙、煨则属于火制法，故答案应选BCD。","k":"中药的炮制"},{"t":1,"s":"善治阳明经头痛的药物是","o":["白芷","柴胡","吴茱萸","羌活","细辛"],"a":"A","e":"羌活善治太阳经头痛，柴胡善治少阳经头痛，吴茱萸善治厥阴经头痛，细辛善治少阴经头痛，白芷善治阳明经头痛，故答案应选A项。","k":"中药的性能"},{"t":1,"s":"苦味药的作用是","o":["能和能缓","能燥能泄","能下能软","能收能涩","能行能散"],"a":"B","e":"苦味药的作用是“能泄、能燥、能坚”，即具有清泄火热、泄降气逆、通泄大便、燥湿、坚阴等作用，故答案应选B项。","k":"中药的性能"},{"t":1,"s":"淡味药的作用是","o":["能和能缓","能下能软","能燥能泄","能收能涩","能渗能利"],"a":"E","e":"淡味药的作用是“能渗、能利”，即具有渗湿，利小便的作用，故答案应选E项。","k":"中药的性能"},{"t":1,"s":"治疗筋脉拘急疼痛的药物多具有","o":["辛味","甘味","酸味","苦味","咸味"],"a":"B","e":"甘味药的作用是“能补、能和、能缓”，即具有补益、和中、调和药性和缓急止痛的作用，故答案应选B项。辛散药具有行气活血作用，可用治血瘀气滞所致疼痛，因而A项是常见的错误选项。","k":"中药的性能"},{"t":1,"s":"具有收敛固涩作用的是","o":["酸味","咸味","辛味","苦味","淡味"],"a":"A","e":"酸味药“能收、能涩”，具有收敛、固涩的作用，故答案应选A项。","k":"中药的性能"},{"t":1,"s":"涩味药多用于治疗","o":["胃热消渴","水肿、小便不利","胸胁苦满","恶心呕吐","虚汗、遗精滑精"],"a":"E","e":"涩味与酸味作用相似，均具有收敛固涩之功，多用治虚汗、遗精、滑精、尿频等体虚不固，滑脱不禁之证，故答案应选E项。","k":"中药的性能"},{"t":1,"s":"具有沉降性质的性味是","o":["苦温","辛温","苦寒","甘寒","咸温"],"a":"C","e":"一般来讲，味属苦、酸、咸，性属寒、凉的药物，大多为沉降药，故答案应选C项。","k":"中药的性能"},{"t":1,"s":"具有升浮性质的性味是","o":["甘、辛、凉","辛、苦、热","辛、甘、温","淡、甘、寒","以上都不是"],"a":"C","e":"一般来讲，味属辛、甘，性属温、热的药物，大多为升浮药，故答案应选C项。而B项是出题设计的陷阱，是常见的错误选项。","k":"中药的性能"},{"t":1,"s":"治疗胁痛易怒、抽搐惊悸等证当选用","o":["归心经的药物","归肝经的药物","归肺经的药物","归肾经的药物","归脾经的药物"],"a":"B","e":"肝的主要生理功能是主疏泄，主藏血，其经脉布于两胁，且肝主筋。若肝失疏泄，气机不通，可见两胁胀痛，烦躁易怒；若肝血不足，筋失所养，可见抽搐；肝血不足，心血亏损，则神不守舍，可见惊悸等证，一般选用归肝经的药物治疗，故答案为B项。","k":"中药的性能"},{"t":1,"s":"属于“疗寒以热药”治疗原则的是","o":["用附子、干姜治疗腹中冷痛、脉沉无力","用猪苓、茯苓治疗水肿、小便不利","用黄芩、板蓝根治疗发热口渴、咽痛","用山茱萸、五味子治疗虚汗、遗精","用麻黄、薄荷治疗表证"],"a":"A","e":"““疗寒以热药”是指用温热药治疗阴寒疾病，五个备选项中附子、干姜是温热药，腹中冷痛、脉沉无力是寒性疾病，因而附子、干姜治疗腹中冷痛、脉沉无力是“疗寒以热药”的代表案例，因而答案是A项，误解“疗寒以热药”的含义常误选C项。","k":"中药的性能"},{"t":1,"s":"朱砂能治疗心悸失眠，具有重镇安神之功，其归经为","o":["归心经","归肝经","归脾经","归肺经","归肾经"],"a":"A","e":"确定药物归经的依据是所治的病证，因为心主神明，用于治疗心神不安所致的心悸失眠的药物，多归于心经，故答案是A项。","k":"中药的性能"},{"t":1,"s":"甘味药的作用是","o":["发散、行气、行血","收敛固涩","软坚散结、泻下","补益、和中、缓急","渗湿利水"],"a":"D","e":"甘味药的作用是“能补、能和、能缓”，即具有补益、和中、调和药性和缓急止痛的作用，故答案是D项。淡味“能渗，能利”，虽然淡附于甘味，但甘味无渗湿利水作用。故E项是常见的错误选项。","k":"中药的性能"},{"t":1,"s":"关于四气正确的说法是","o":["从人体的感官感觉出来的","从疾病的性质中总结出来的","从药物作用于人体所发生的反应和所获得的不同疗效中概括出来的","从季节的不同变化总结出来的","以上都不是"],"a":"C","e":"四气是由药物作用于人体所产生的不同反应和所获得的不同疗效而总结出来的，它与所治疾病的寒热性质是相对而言的，故答案应选C项。","k":"中药的性能"},{"t":2,"s":"中药性能的基本内容包括","o":["四气","五味","升降浮沉","归经","毒性"],"a":"ABCDE","e":"中药性能的基本内容包括：四气、五味、升降浮沉、归经、毒性等，故答案应选ABCDE。","k":"中药的性能"},{"t":2,"s":"苦味药的作用有哪些","o":["清泄火热","坚阴","通泄大便","泄降气逆","燥湿"],"a":"ABCDE","e":"苦味药“能泄、能燥、能坚”，具有清泄火热、泄降气逆、通泄大便、燥湿、坚阴等作用，故答案应选ABCDE。","k":"中药的性能"},{"t":2,"s":"影响升降浮沉的主要因素有哪些","o":["四气","五味","药物质地","配伍","炮制"],"a":"ABCDE","e":"影响药物升降浮沉的因素主要与四气五味、药物质地有密切关系，并受到炮制和配伍的影响，故答案应选ABCDE。","k":"中药的性能"},{"t":2,"s":"升浮药物的作用有哪些","o":["升阳发表","消导积滞","温里散寒","涌吐","开窍"],"a":"ACDE","e":"一般升浮药物的作用有疏散解表、宣毒透疹、解毒消疮、宣肺止咳、温里散寒、暖肝散结、温通经脉、通痹散结、行气开郁、活血消癥、开窍醒神、升阳举陷、涌吐等，而消导积滞为沉降药所具有的作用，故答案应选ACDE。","k":"中药的性能"},{"t":2,"s":"沉降药物的作用有哪些","o":["泻下","清热","重镇安神","收敛","止咳平喘"],"a":"ABCDE","e":"一般沉降药的作用有清热泻火、泻下通便、利水渗湿、重镇安神、平肝潜阳、息风止痉、降逆平喘、止呕、止呃、消积导滞、固表止汗、敛肺止咳、涩肠止泄、固崩止带、涩精止遗、收敛止血、收湿敛疮等，故答案应选ABCDE。","k":"中药的性能"},{"t":1,"s":"黄芪与茯苓配伍，茯苓能增强黄芪补气利水的功效，这种配伍关系属于","o":["相须","相使","相畏","相杀","相恶"],"a":"B","e":"黄芪配茯苓治脾虚水肿，黄芪为健脾益气、利尿消肿的主药，茯苓淡渗利湿，可增强黄芪益气利尿的作用，这种配伍关系属于相使，故答案应选B项。","k":"中药的配伍"},{"t":1,"s":"两种中药合用，一种中药能降低另一种中药的功效，这种配伍关系属于","o":["相反","相使","相畏","相杀","相恶"],"a":"E","e":"相恶是指两种中药合用，一种中药能够消除另一种中药的功效，故答案应选E项。","k":"中药的配伍"},{"t":1,"s":"两种中药配伍能产生剧烈的毒性反应或副作用，这种配伍关系属于","o":["相须","相使","相反","相杀","相恶"],"a":"C","e":"相反是指两种中药同用能产生剧烈的毒副作用，故答案应选C项。","k":"中药的配伍"},{"t":1,"s":"人参配莱菔子，莱菔子能削弱人参的补气作用，这种配伍关系属于","o":["相须","相使","相畏","相恶","相杀"],"a":"D","e":"人参恶莱菔子，是指人参与莱菔子配伍同用，莱菔子能削弱人参的补气作用，这种配伍关系属于相恶，故答案应选D项。","k":"中药的配伍"},{"t":1,"s":"生姜可以抑制半夏的毒副作用，这种配伍关系属于","o":["相须","相使","相畏","相恶","相杀"],"a":"E","e":"一种中药能消除另一种中药的毒副作用，这种配伍关系属于相杀，故答案应选E项。相畏与相杀是一种配伍关系的两种说法，常常把相杀与相畏的概念搞混，因而C项是常见的错误选项。\"生姜杀半夏\"，可以结合药物便于记忆。","k":"中药的配伍"},{"t":1,"s":"半夏的毒副作用能被生姜所降低或消除，这种配伍关系属于","o":["相须","相使","相畏","相恶","相杀"],"a":"C","e":"一种中药的毒性或副作用能被另一种中药所降低或消除。故答案应选C项。相畏与相杀是一种配伍关系的两种说法，常常把相杀与相畏的概念搞混，因而E项是常见的错误选项。\"半夏畏生姜\"，可以结合药物便于记忆。","k":"中药的配伍"},{"t":2,"s":"中药配伍的目的是","o":["增强疗效","减轻毒性","扩大治疗范围","适应复杂病情","改变药物的味"],"a":"ABCD","e":"中药配伍应用能适应复杂病情，增强疗效，减轻毒性，扩大治疗范围，但不能改变药物的味，故答案应选ABCD。","k":"中药的配伍"},{"t":2,"s":"使用毒副作用较强的药物应考虑的配伍方法是","o":["相须","相使","相畏","相杀","相反"],"a":"CD","e":"相畏、相杀可以减轻或消除毒副作用，以确保用药安全，是使用毒副作用较强药物的配伍方法，也可用于有毒中药的炮制及中毒解救，故答案应选CD。","k":"中药的配伍"},{"t":2,"s":"属于相使的配伍关系是","o":["金钱草与雷公藤","石膏与牛膝","生姜与黄芩","黄连与木香","枸杞与菊花"],"a":"BDE","e":"金钱草可杀雷公藤毒，属于相杀的配伍关系；生姜配黄芩，黄芩能削弱生姜的温胃止呕的作用，属于相恶的配伍关系。石膏与牛膝配伍，牛膝引火下行，可增强石膏清火止痛的作用；黄连与木香配伍，木香能增强黄连清热燥湿之功；菊花清肝明目，可增强枸杞的补虚明目作用，这些药物属于相使的配伍关系，故答案应选BDE。","k":"中药的配伍"},{"t":1,"s":"与乌头相反的药物应除外的是","o":["玄参","白及","贝母","瓜蒌","半夏"],"a":"A","e":"乌头反贝母、瓜蒌、半夏、白及、白蔹，而玄参不与乌头相反，故答案应选A项。误解题目的要求，常误选其他答案。","k":"中药的用药禁忌"},{"t":1,"s":"属于十八反的配伍药对是","o":["甘草与海藻","丁香与郁金","人参与五灵脂","三棱与莪术","川芎与牛膝"],"a":"A","e":"甘草与海藻配伍属于十八反的内容，而丁香与郁金、人参与五灵脂的配伍属于十九畏的内容，而三棱与莪术、川芎与牛膝配伍不属于配伍禁忌，故答案应选A项。","k":"中药的用药禁忌"},{"t":1,"s":"属于十九畏的配伍药对是","o":["川乌与草乌","桃仁与红花","官桂与赤石脂","乌头与贝母","甘草与甘遂"],"a":"C","e":"官桂与赤石脂配伍属于十九畏内容，而乌头与贝母、甘草与甘遂配伍属于十八反内容，川乌与草乌、桃仁与红花配伍不属于配伍禁忌，故答案应选C项。","k":"中药的用药禁忌"},{"t":1,"s":"胸痹患者最应忌食的是","o":["鱼、虾、蟹等腥膻发物","肥肉、脂肪、动物内脏","食盐过多的食物","咖啡、茶","胡椒、辣椒、大蒜"],"a":"B","e":"胸痹患者最应忌食肥肉、脂肪、动物内脏，答案应选B项。","k":"中药的用药禁忌"},{"t":1,"s":"不宜与瓜蒌同用的药物是","o":["乌头","甘草","三棱","芒硝","藜芦"],"a":"A","e":"十八反中，乌头反瓜蒌，故正确答案是A项。","k":"中药的用药禁忌"},{"t":2,"s":"与藜芦相反的药物有","o":["人参","细辛","玄参","沙参","丹参"],"a":"ABCDE","e":"十八反中，藜芦反人参、丹参、玄参、沙参、细辛、芍药，故答案应选ABCDE。","k":"中药的用药禁忌"},{"t":2,"s":"妊娠慎用药有哪些","o":["牛膝","白术","大黄","红花","附子"],"a":"ACDE","e":"牛膝、大黄、红花、附子属于妊娠慎用药，白术具有健脾益气安胎之功，不属于妊娠用药禁忌，故答案应选ACDE。","k":"中药的用药禁忌"},{"t":1,"s":"入汤剂需先煎的药物是","o":["薄荷、白豆蔻","蒲黄、海金沙","人参、阿胶","磁石、牡蛎","车前子、蒲黄"],"a":"D","e":"磁石、牡蛎为有效成分难溶于水的矿物、介壳类药物，应打碎先煎，故答案应选D项。人参是贵重药物须另煎久煎，阿胶入汤剂须烊化。","k":"中药的剂量与用法"},{"t":1,"s":"入汤剂需后下的药物是","o":["磁石、牡蛎","蒲黄、海金沙","薄荷、白豆蔻","人参、鹿茸","芒硝、阿胶"],"a":"C","e":"薄荷、白豆蔻属气味芳香的药物，久煎其有效成分易于挥发而降低药效，故答案应选C项。蒲黄、海金沙是粉末状药物，须包煎，也是常见的错误选项。","k":"中药的剂量与用法"},{"t":1,"s":"蒲黄、旋覆花等药物入煎剂宜","o":["包煎","后下","先煎","烊化","冲服"],"a":"A","e":"蒲黄为花粉入药，质轻，煎煮时易漂浮于药液表面，或成糊状，不便于煎煮及服用；旋覆花为花序入药，带有绒毛，易刺激咽喉引起咳嗽，故两药入煎剂时宜包煎，故答案应选A项。","k":"中药的剂量与用法"},{"t":1,"s":"钩藤入汤剂宜","o":["先煎","后下","包煎","另煎","烊化"],"a":"B","e":"钩藤的有效成分高温易破坏，因而入煎剂，不宜久煎，故答案是B项。","k":"中药的剂量与用法"},{"t":1,"s":"鹿角胶服用应","o":["烊化","冲服","后下","先煎","另煎"],"a":"A","e":"鹿角胶入煎剂，为避免入煎粘锅，宜烊化，故答案是A项。","k":"中药的剂量与用法"},{"t":2,"s":"临床上确定中药用量的主要依据是","o":["服药的季节","所用药物的性质","患者年龄、体质、病情","剂型","配伍"],"a":"ABCDE","e":"一般来讲，确定中药的剂量，应考虑到药物性质、剂型、配伍、年龄、体质、病情及季节变化等方面的因素，故答案应选ABCDE。","k":"中药的剂量与用法"},{"t":2,"s":"下列哪些药物入汤剂宜先煎","o":["西洋参","龟甲","龙骨","牛黄","附子"],"a":"BCE","e":"质地坚硬的矿物、介壳类或有毒的药物入汤剂须久煎，龟甲、龙骨、附子须久煎，故答案是BCE。西洋参、牛黄入汤剂需冲服。","k":"中药的剂量与用法"},{"t":2,"s":"下列哪些药物入汤剂宜后下","o":["麝香","木香","钩藤","沉香","乌头"],"a":"BCD","e":"芳香药物木香、沉香不宜久煎，钩藤也宜后下。乌头是有毒药物，入汤剂须久煎。麝香虽是芳香药物，但不宜入煎剂，多冲服或入丸散，是常见的错误选项。","k":"中药的剂量与用法"},{"t":2,"s":"下列哪些药物入汤剂宜包煎","o":["辛夷","滑石","朱砂","砂仁","车前子"],"a":"ABE","e":"辛夷有细小绒毛、车前子黏性较强、滑石是粉末状，所以宜包煎，正确答案是ABE。砂仁是芳香药物，宜后下。朱砂不宜入煎剂，宜冲服，都是常见的错误选项。","k":"中药的剂量与用法"},{"t":1,"s":"解表药的性味是什么","o":["酸味","甘味","辛味","苦味","咸味"],"a":"C","e":"部分解表药具有苦味，故能燥湿，具有祛风湿等功效。因而经常错误地选择D项。结合五味学说中辛味\"能散，能行\"的知识点，解表药大多辛散轻扬，味辛发散，使客于肌表之外邪由汗出而解。所以解表药以辛味为主。","k":"解表药"},{"t":1,"s":"解表药的归经是什么","o":["肺、肝经","肺、膀胱经","肺、胃经","脾、胃经","肝、胃经"],"a":"B","e":"容易错误地将B项的膀胱经理解为脏腑之膀胱，故舍B项而选其他。外邪袭人，客于肌表，因肺主皮毛，故解表药归于肺经，这点很好理解且记忆。而这里的膀胱经指的是足太阳膀胱经，主表，为一身之藩篱，故遵循经络辨证，解表药也应归于膀胱经。","k":"解表药"},{"t":1,"s":"患者外感风寒，恶寒发热，头身疼痛，无汗，喘咳，脉浮紧。治疗宜首选用的药物是","o":["麻黄","桂枝","细辛","杏仁","白前"],"a":"A","e":"桂枝、细辛是治疗外感风寒的常用药物。桂枝无止咳作用，不宜首选。细辛有温肺化饮功效，可治喘咳，但解表散寒作用不强，因而常错选C项。分析患者症状，恶寒、发热、无汗是典型的风寒表实证，也是麻黄发汗解表的适应证。风寒外束，腠理密闭，肺气不宣而咳喘，麻黄又能宣肺平喘，所以首选A项。","k":"解表药"},{"t":1,"s":"患者外感风寒，恶寒发热，头痛身重，无汗，腹痛吐泻，舌苔白腻。治疗宜选用的药物是","o":["麻黄","桂枝","香薷","防风","白芷"],"a":"C","e":"本题与上题非常相似。用治恶寒发热无汗，常习惯选用麻黄、桂枝等药物，考虑苔白腻，常错选白芷，白芷虽有燥湿的功效，但多用治湿浊带下。本题的关键在于后面的症状，分析腹痛、吐泻、苔白腻的表现，可诊断患者为外感风寒兼脾胃湿阻的证型。香薷既能解表散寒，又能化湿和中，所以最为适宜。香薷功能化湿和中，常是香薷的考点，也是记忆的难点。","k":"解表药"},{"t":1,"s":"患者外感风寒，恶寒发热，胸脘满闷，恶心呕逆或咳嗽痰多。治疗宜选用的药物是","o":["麻黄","桂枝","陈皮","紫苏叶","荆芥"],"a":"D","e":"分析本题患者的临床表现，可诊断为外感风寒，兼有脾胃气滞。紫苏叶外能解表散寒，内能行气宽中，且略兼化痰止咳之功，故选D项。麻黄、桂枝等药解表散寒之力虽强，但无行气作用，故不宜首选。","k":"解表药"},{"t":1,"s":"治疗肺气壅遏所致喘咳的要药是","o":["杏仁","白前","川贝母","瓜蒌","麻黄"],"a":"E","e":"提到治疗咳喘，常常首先想到是各种止咳平喘药，如杏仁、贝母，给正确选择带来干扰。麻黄功能开宣肺气而止咳平喘，所以擅于治疗肺气不宣所致的各种咳喘，堪称要药。故答案是E项。","k":"解表药"},{"t":1,"s":"不宜用于治疗虚喘的药物是","o":["沉香","蛤蚧","冬虫夏草","麻黄","核桃仁"],"a":"D","e":"由于对非重点药物沉香、冬虫夏草、核桃仁的功效了解不深，做题时猜测的成分偏多。本题测试的知识点是麻黄的使用注意。麻黄辛温耗散，易耗气伤阴，因此肺肾虚喘的患者慎用，以免加重肺气的虚损。故答案是D项。","k":"解表药"},{"t":1,"s":"患者风湿痹痛，尤以上半身肩痛肢节疼痛为甚，治疗宜首选的药物是","o":["防风","独活","荆芥","羌活","川乌"],"a":"D","e":"羌活与独活的功效相似，其区别在于羌活是解表药，偏于升浮，向上向外发散风寒，故擅于解表，善治上半身风湿痹痛。而独活性偏下行，故善治下半身的风湿痹痛。故答案是D项。独活是常见的错误选项。","k":"解表药"},{"t":1,"s":"既能发散风寒，又能疏散风热的药物是","o":["荆芥","麻黄","生姜","紫苏","桂枝"],"a":"A","e":"桂枝解表的功效特点是无论表实无汗、表虚有汗及阳虚受寒均可使用，前提是外感风寒表证。本题测试的考点是具有发散风寒与发散风热两种功效的药物。在解表药中，荆芥与防风具有这样的解表特点，长于发表散风，无论风寒表证及风热表证均可使用。故答案选A项。","k":"解表药"},{"t":1,"s":"治疗疮疡肿痛，宜选用的药物是","o":["羌活","白芷","藁本","细辛","防风"],"a":"B","e":"细辛与白芷的功效相似，容易产生混淆。二者共同具有解表散寒、宣通鼻窍和祛风止痛的功效，不同的是细辛还有温肺化饮的作用，治疗肺寒咳喘。而白芷温燥之性较强，具有燥湿止带、消肿排脓的功效，用治带下证与疮疡肿痛，所以本题选B项。","k":"解表药"},{"t":1,"s":"细辛入煎剂，用量是多少","o":["0.5~1g","1~3g","3~9g","0.3~0.5g","0.3~1g"],"a":"B","e":"A项0.5~1g为细辛入散剂的用量，而题目要求的是入煎剂的用量。C项3~9g是一般药物的常用剂量，若不知细辛的用量特殊，常选此项。细辛有小毒，自古有\"细辛不过钱\"之说。按现代度量衡折算，一钱为3g，所以细辛入汤剂的用量为1~3g。故答案是B项。","k":"解表药"},{"t":1,"s":"功能解表祛风，透疹，消疮的药物是","o":["羌活","荆芥","桂枝","细辛","防风"],"a":"B","e":"荆芥和防风均能祛风解表，用治外感表证，均能透疹，用治风疹瘙痒。荆芥还能消疮，所以本题选B项荆芥。混淆二者功效，常常误选E项防风。","k":"解表药"},{"t":1,"s":"既能疏散风热，又可息风止痉的药物是","o":["薄荷","牛蒡子","蝉蜕","桑叶","葛根"],"a":"C","e":"在疏散风热药中，功能息风止痉的药物只有蝉蜕。因蝉蜕的来源是蝉脱落的皮壳，故同样具有类似蝉的平息内风的功效。而其他药物没有息风的作用。故本题答案应选择C项蝉蜕。","k":"解表药"},{"t":1,"s":"患者肺燥咳嗽，痰少黏稠，咽干咽痒，治疗宜选用的药物是","o":["麻黄","桑叶","菊花","牛蒡子","柴胡"],"a":"B","e":"本题测试的知识点是桑叶的润肺燥功效，多用治肺燥咳嗽。麻黄的宣肺、牛蒡子的化痰功效均不适宜。故本题答案应选择B项桑叶。","k":"解表药"},{"t":1,"s":"既能疏散风热，又能清热解毒的药物是","o":["桑叶、菊花","薄荷、牛蒡子","柴胡、葛根","升麻、牛蒡子","升麻、桑叶"],"a":"D","e":"发散风热药中具有清热解毒功效的药物有菊花、升麻、牛蒡子三味药物。故本题答案应选择D项。","k":"解表药"},{"t":1,"s":"患者外感发热重，恶寒轻，头痛无汗，项背强痛，苔薄黄，治疗宜选用下列哪味药物","o":["麻黄","荆芥","羌活","防风","葛根"],"a":"E","e":"葛根辛散性凉以退热，又长于缓解外邪郁阻、经气不利、筋脉失养所致的项背强痛。项背强痛是葛根治疗表证的重要指征。而羌活辛温发散，善入足太阳膀胱经，故外感风寒上半身肩背肢节疼痛多用，常常误选羌活。本题答案应选择E项。","k":"解表药"},{"t":1,"s":"患者风热感冒，咽喉肿痛，声音嘶哑，治疗宜选用功能利咽开音的药物是","o":["薄荷","桑叶","菊花","蝉蜕","牛蒡子"],"a":"D","e":"疏散风热药中，功能利咽的药物有薄荷、牛蒡子、蝉蜕等药，而具有开音功效的只有蝉蜕。另外，诃子也具有开音的功效，用治肺虚失音。本题答案应选择D项蝉蜕。本题测试的关键词是开音，阅读题干不仔细，常误选择薄荷、牛蒡子。","k":"解表药"},{"t":1,"s":"柴胡、升麻均具有的功效是","o":["解表退热","透发疹毒","升举阳气","疏肝解郁","清热解毒"],"a":"C","e":"柴胡和升麻都具有的功效是升阳举陷，用治气虚下陷证，如补中益气汤。此外，柴胡还有疏肝解郁的功效，升麻有清热解毒的作用，D、E均不是二者的共同功效。可结合方剂补中益气汤记忆，故本题答案应选择C项。","k":"解表药"},{"t":1,"s":"蔓荆子具有的功效是","o":["疏散风热，清利头目","疏散风热，利咽透疹","疏散风热，清肝明目","疏散风热，升阳止泻","疏散风热，清热解毒"],"a":"A","e":"蔓荆子性善上行，偏于清利头目、疏散头面之风热，其功效是疏散风热，清利头目，故选A项。而多数的疏散风热药都具有利咽透疹的作用，故B项是常见的错误选项。","k":"解表药"},{"t":1,"s":"蝉蜕的归经是","o":["归肺、脾经","归肺、肾经","归肺、心经","归肺、肝经","归肺、膀胱经"],"a":"D","e":"结合蝉蜕的功效，既能疏散肺经风热，透疹，利咽，故归肺经；又能疏散肝经风热，明目退翳，息风止痉，故又归肝经。故蝉蜕主归肺、肝经。答案应选D项。区别大多数解表药的归经为归肺、膀胱经，故E项是常见错误。","k":"解表药"},{"t":1,"s":"患者风热郁闭，咽喉肿痛，大便秘结，治疗宜首选的药物是","o":["薄荷","蝉蜕","菊花","蔓荆子","牛蒡子"],"a":"E","e":"功能疏散风热、通利咽喉的药物有薄荷、蝉蜕、牛蒡子，而只有牛蒡子兼滑肠通便作用，所以用治本证E项牛蒡子最为适宜。","k":"解表药"},{"t":1,"s":"患者胃火炽盛，牙龈肿痛，口舌生疮，大便秘结，治疗宜首选的药物是","o":["薄荷","柴胡","桑叶","葛根","升麻"],"a":"E","e":"升麻为清热解毒的良药，尤善清解阳明热毒，用治胃火炽盛所致的各种病证，其他药物没有清热解毒的作用，故而选E项升麻。升麻的清热解毒作用是其记忆的难点，也是常常出题的考点。","k":"解表药"},{"t":2,"s":"既能发汗解表，又能利水消肿的药物有哪些","o":["麻黄","桂枝","羌活","香薷","白芷"],"a":"AD","e":"本题测试的知识点是麻黄与香薷的相同功效，均能发汗解表和利水消肿。香薷亦被称为\"夏月解表之药，如冬月之用麻黄\"。","k":"解表药"},{"t":2,"s":"具有宣通鼻窍功效的药物有哪些","o":["桂枝","白芷","细辛","辛夷","苍耳子"],"a":"BCDE","e":"发散风寒药中具有宣通鼻窍功效的药物有白芷、细辛、辛夷、苍耳子。桂枝功效为发汗解肌、温通经脉、助阳化气、平冲降逆。故答案应选择BCDE。","k":"解表药"},{"t":2,"s":"葛根具有的功效有哪些","o":["清肺胃热","升阳止泻","透疹","解肌退热","生津止渴"],"a":"BCDE","e":"葛根的功效有解肌退热，透疹，生津止渴，升阳止泻。区别芦根，葛根没有清肺胃热的作用，故选BCDE。","k":"解表药"},{"t":2,"s":"功能疏肝解郁的药物有哪些","o":["蝉蜕","薄荷","升麻","柴胡","葛根"],"a":"BD","e":"解表药中功能疏肝解郁，常用治肝气郁结的药物，有柴胡、薄荷两味药。故答案应选择BD。","k":"解表药"},{"t":1,"s":"既能清热泻火，又能除烦止渴的药物是","o":["夏枯草","决明子","淡豆豉","石膏","玄参"],"a":"D","e":"夏枯草、决明子均能清热泻火，但无除烦止渴功效；玄参具有清热泻火、生津作用，但无除烦之功，淡豆豉功效为除烦，却是疏散风热药。只有石膏既能清热泻火，又能除烦止渴，故正确答案是D项。","k":"清热药"},{"t":1,"s":"既能清热生津，又能滋阴润燥的药物是","o":["石膏","芦根","知母","葛根","决明子"],"a":"C","e":"本题提问与上题相似，经常混淆。石膏、芦根、葛根均能生津止渴，但无滋阴作用，决明子无滋阴及生津止渴作用；只有知母既能清热生津，又能滋阴润燥，故正确答案是C项。石膏与知母功效相似，共同具有清热泻火、生津止渴的作用。本题测试的知识点是知母的滋阴功效，而上题测试的是石膏的除烦功效。","k":"清热药"},{"t":1,"s":"石膏的性味是","o":["辛、甘，温","甘、苦，温","苦、辛，大寒","甘、辛，大寒","甘、咸，寒"],"a":"D","e":"石膏是清热泻火药，性寒清热，辛散透热解肌，味甘生津止渴，故甘辛大寒才是其性味，因此答案应选D项。","k":"清热药"},{"t":1,"s":"患者胃热呕逆，治疗宜选用的药物是","o":["石膏","知母","芦根","天花粉","夏枯草"],"a":"C","e":"石膏、知母、芦根、天花粉均能清胃热，用治胃热消渴等证。但只有芦根兼有止呕作用，用治胃热呕逆最为适宜，故答案选C项。","k":"清热药"},{"t":1,"s":"芦根、淡竹叶的共同功效，除清热泻火外，还有其他功效是","o":["利尿","止呕","生津","排脓","凉血"],"a":"A","e":"具有生津止渴的药物是石膏、知母、芦根、天花粉，而淡竹叶没有生津作用，C项是常见的错误。芦根与淡竹叶的共同作用是利尿，故答案选A项。","k":"清热药"},{"t":1,"s":"功能生津止渴，消肿排脓的药物是","o":["石膏","天花粉","知母","牛蒡子","菊花"],"a":"B","e":"石膏、知母均能生津止渴，但无消肿排脓作用；牛蒡子、菊花功能解毒消肿，但无生津止渴作用；只有天花粉既能生津止渴，又能消肿排脓，故答案B是正确的。天花粉的消肿排脓也是记忆的难点。","k":"清热药"},{"t":1,"s":"淡竹叶具有的功效是","o":["清热泻火，滋阴","除烦止渴，凉血","清热燥湿，利尿","生津润燥，除烦","清热泻火，利尿"],"a":"E","e":"淡竹叶的功效特点是上清心火，下利小便，故答案E是正确的。","k":"清热药"},{"t":1,"s":"患者肝火上炎，目赤肿痛，治疗宜选用的药物是","o":["石膏","知母","栀子","天花粉","夏枯草"],"a":"E","e":"石膏、知母、天花粉均清泄肺胃之热，主治肺胃热证；栀子清泄三焦之热，可治火热所致的一切病证。而夏枯草主入肝经，善清肝火，用治肝火上炎证，因此E项是为首選。","k":"清热药"},{"t":1,"s":"患者痰火郁结，瘰疬痰核，治疗宜选用的药物是","o":["石膏","知母","栀子","天花粉","夏枯草"],"a":"E","e":"夏枯草主入肝经，功能清泄肝火；辛散苦泄，故能散结消肿，善治肝郁化火，痰火郁结之瘰疬痰核。本题测试的知识点是夏枯草的消肿散结，所以正确答案是E项。天花粉具有消肿排脓功效，用治疮疡肿毒，与夏枯草的消肿散结功效相似，但应用不同，因而天花粉是出题陷阱，也是常见的错误选项。","k":"清热药"},{"t":1,"s":"善去脾胃大肠湿热，为治湿热泻痢要药的是","o":["黄芩","葛根","黄柏","苦参","黄连"],"a":"E","e":"黄连清热燥湿力胜，主入中焦，为治湿热泻痢之要药，故正确答案是E项。","k":"清热药"},{"t":1,"s":"既能清热燥湿，又能泻火除蒸的药物是","o":["黄柏","黄芩","苦参","龙胆","知母"],"a":"A","e":"黄芩、苦参、龙胆均有清热燥湿的功效，但无泻火除蒸作用；知母虽能泻火除蒸，但质润滋阴，不能清热燥湿；只有黄柏既能清热燥湿，又能泻火除蒸，故正确答案是A项。","k":"清热药"},{"t":1,"s":"患者胃火炽盛，消谷善饥，烦渴多饮，舌红苔黄腻，治疗宜首选用的药物是","o":["黄柏","栀子","黄连","黄芩","苦参"],"a":"C","e":"上述药物中，只有黄连善清胃火而用治胃火炽盛证，所以正确答案是C项。而栀子虽可清泄三焦之火，不如黄连清胃火作用强，故不作首选，是常见的错误。","k":"清热药"},{"t":1,"s":"功能清热燥湿，收涩止痢，止带的药物是","o":["秦皮","龙胆","黄芩","苦参","黄柏"],"a":"A","e":"秦皮性苦寒清热燥湿之外，兼有涩性故能收敛固涩，具有收涩止痢、止带作用，故A项为正确答案。","k":"清热药"},{"t":1,"s":"功能清热燥湿，杀虫的药物是","o":["秦皮","龙胆","黄芩","苦参","黄柏"],"a":"D","e":"在清热燥湿药中，黄连、黄柏、龙胆等均可用治湿疹、湿疮，但具有杀虫功效的只有苦参。故答案是D项。","k":"清热药"},{"t":1,"s":"具有清热解毒，凉血消斑功效的药物是","o":["大青叶","板蓝根","穿心莲","射干","山豆根"],"a":"A","e":"大青叶与板蓝根功效相似，具有清热解毒、凉血作用，而大青叶善于消斑，板蓝根长于利咽，是二者的不同，也是出题时测试的考点。","k":"清热药"},{"t":1,"s":"患者肺痈吐脓，痰热喘咳，治疗宜首选的药物是","o":["红藤","白头翁","鱼腥草","蒲公英","射干"],"a":"C","e":"鱼腥草主入肺经，善清肺热，故为治肺痈之要药，这是鱼腥草的功效特点，也是其考点。需要重点区别的是，蒲公英功能清热解毒，善于治疗乳痈，这是蒲公英的考点，也是二药常常混淆错选之处。","k":"清热药"},{"t":1,"s":"功能清热解毒，消肿散结，善治乳痈药物是","o":["红藤","白头翁","鱼腥草","蒲公英","射干"],"a":"D","e":"蒲公英功能清热解毒，主归肝、胃经，故而善于治疗乳痈，这是蒲公英的功效特点，也是其考点。鱼腥草主入肺经，善清肺热，故为治肺痈之要药，需要重点区别的是，也是二药常常混淆错选之处。","k":"清热药"},{"t":1,"s":"既可用治咽喉肿痛，又能用于痰盛咳喘的药物是","o":["山豆根","射干","马勃","薄荷","蝉蜕"],"a":"B","e":"备选的五味药物均具有利咽作用，可用治咽喉肿痛，而只有射干具有消痰作用，可用治痰盛咳喘。故答案是B项。","k":"清热药"},{"t":1,"s":"善于治疗疔毒的药物是","o":["鱼腥草","紫花地丁","大血藤","金银花","蒲公英"],"a":"B","e":"本题的五个备选药物均有清热解毒之功，均可用治热毒疮痈。而紫花地丁尤以治疗疔毒为其特长，总结为\"地丁治疗\"，故答案应选择B项。","k":"清热药"},{"t":1,"s":"山豆根具有的功效是","o":["清热解毒，利咽","清热解毒，杀虫","清热解毒，燥湿","清热解毒，凉血","清热解毒，利尿"],"a":"A","e":"山豆根的功效是清热解毒，利咽消肿，为治疗咽喉肿痛的要药，凡热毒蕴结之咽喉肿痛者均可用之。因此正确答案应选择A项。","k":"清热药"},{"t":1,"s":"患者热毒血痢，发热腹痛，里急后重，宜选用的药物是","o":["苦参","葛根","白头翁","穿心莲","黄柏"],"a":"C","e":"备选答案中，五味药物均可用治泻痢，葛根长于升阳止泻；苦参、黄柏长于清热燥湿；穿心莲长于清热解毒而燥湿，诸药多用于湿热泻痢。而白头翁功能清热解毒，凉血止痢，既善于清胃肠湿热，又长于解血分热毒，正确答案应选择C项。","k":"清热药"},{"t":1,"s":"患者肠痈腹痛，治疗宜选用的药物是","o":["金银花、连翘","鱼腥草、金荞麦","蒲公英、漏芦","紫花地丁、野菊花","败酱草、大血藤"],"a":"E","e":"备选答案的五组药物，均可用于热毒疮痈，但其功用各有特长。金银花、连翘可用于一切痈肿疮毒；鱼腥草、金荞麦长于治疗肺痈；蒲公英、漏芦长于治疗乳痈；紫花地丁、野菊花长于治疗疔疮。败酱草具有清热解毒，消痈排脓，祛瘀止痛功效；大血藤具有清热解毒，活血，祛风，止痛功效，二者又入大肠经，善散肠中瘀滞，故为治疗肠痈腹痛的首选药物。本题答案应选择E项。","k":"清热药"},{"t":1,"s":"既能清热凉血，又能养阴生津的药物是","o":["知母","天花粉","生地黄","芦根","牡丹皮"],"a":"C","e":"知母、天花粉、芦根虽能生津止渴，但无清热凉血作用；牡丹皮虽能清热凉血，但不能养阴生津；只有生地黄既能清热凉血，又能养阴生津，故正确答案是C项。","k":"清热药"},{"t":1,"s":"玄参具有的功效是","o":["清热凉血、祛瘀","泻火解毒、透疹","清热凉血、止呕","泻火解毒、滋阴","清热解毒、利尿"],"a":"D","e":"玄参具有清热凉血、泻火解毒的功效，但无祛瘀、透疹、止呕、利尿等作用，玄参甘寒质润，除泻火解毒外，还善滋阴润燥，故答案D是正确的。","k":"清热药"},{"t":1,"s":"紫草具有的功效是","o":["清热凉血、化湿","清热凉血、燥湿","清热解毒、利咽","解毒透疹、活血","清热燥湿、透疹"],"a":"D","e":"在备选答案中，化湿、燥湿、清热燥湿、利咽等功效均不是紫草的功效，紫草除清热凉血外，尚具有解毒透疹、活血作用，故答案D项是正确的。","k":"清热药"},{"t":1,"s":"既能清热凉血，又能定惊的药物是","o":["栀子","水牛角","生地黄","穿心莲","龙胆"],"a":"B","e":"栀子、生地黄、穿心莲均有清热凉血功效，但无定惊作用；龙胆能泻肝火以定惊搐，但无清热凉血作用。只有水牛角既能清热凉血，又能定惊，故答案B项是正确的。","k":"清热药"},{"t":1,"s":"既能清热凉血，又能活血祛瘀的药物是","o":["牡丹皮","地骨皮","生地黄","白薇","玄参"],"a":"A","e":"地骨皮、生地黄、白薇、玄参四药均能清热凉血，但均无活血祛瘀之功，只有牡丹皮既能清热凉血，又能活血祛瘀，故正确答案是A项。","k":"清热药"},{"t":1,"s":"既能退虚热，又可解毒疗疮的药物是","o":["胡黄连","地骨皮","白薇","连翘","青蒿"],"a":"C","e":"胡黄连、地骨皮、青蒿均能清退虚热，而白薇具有解毒作用。连翘具有清热解毒作用，但无清虚热作用。故正确答案应为C项。","k":"清热药"},{"t":1,"s":"既善清虚热，又可清泄肺热的药物是","o":["黄芩","地骨皮","穿心莲","石膏","鱼腥草"],"a":"B","e":"本题五个备选药物均有清泄肺热的作用，同可用于肺热咳喘。但只有地骨皮兼能清虚热，具有凉血除蒸、清肺降火之功效。故答案应选择B项。","k":"清热药"},{"t":1,"s":"小儿疳积发热，治疗宜选用的药物是","o":["黄连","白薇","胡黄连","地骨皮","丹皮"],"a":"C","e":"可用治小儿疳积发热的是胡黄连、银柴胡，所以C项是正确答案。从药名上区分黄连，故常误选A项。","k":"清热药"},{"t":2,"s":"栀子的功效有哪些","o":["清热利湿","清热泻火","清热凉血","清热燥湿","清热解毒"],"a":"ABCE","e":"栀子的清热功效的特点是针对热邪的范围广泛，无论是热毒、血热、湿热还是单纯的火热之邪都有治疗作用，因而具有清热解毒、清热凉血、清热利湿和清热泻火作用。栀子虽为苦寒之品，但燥湿作用不强，而重在清热利湿以祛除体内湿热之邪。栀子的功效是清热利湿，不是清热燥湿，这是栀子功效的难点，也是考试的考点。","k":"清热药"},{"t":2,"s":"具有清热燥湿、泻火解毒功效的药物有哪些","o":["栀子","黄连","知母","黄芩","黄柏"],"a":"BDE","e":"栀子功能泻火解毒利湿，不是清热燥湿；知母性寒质润，不能燥湿解毒，故A、C不是正确答案。而清热燥湿、泻火解毒正是黄连、黄柏、黄芩的功效，故正确答案应是B、D、E。栀子的利湿功能是记忆的难点，也是出题常设计的陷阱。","k":"清热药"},{"t":2,"s":"黄芩的主治证有哪些","o":["痈肿疮毒","血热吐衄","肺热咳嗽","胎动不安","湿温暑湿"],"a":"ABCDE","e":"黄芩功能清热燥湿，长于清上中焦之湿热，常用治湿温暑湿。外感湿温暑湿，归属上焦湿热证，亦是黄芩应用区别于黄连黄柏的不同之处。黄芩又能清热解毒，善治痈肿疮毒。黄芩善泻上焦肺火，常用治肺热咳嗽。又能止血、安胎，用治火毒炽盛迫血妄行之吐血、衄血以及血热胎动不安，故A、B、C、D、E均是正确答案。","k":"清热药"},{"t":2,"s":"既能清实热，又能退虚热的药物有哪些","o":["黄芩","黄连","黄柏","知母","苦参"],"a":"CD","e":"黄芩、黄连、苦参均无清虚热作用，故A、B、E不是正确答案。只有黄柏、知母功能清退虚热，而黄柏是清热燥湿药，知母是清热泻火药，注意区分二者。","k":"清热药"},{"t":2,"s":"生地黄的主治证有哪些","o":["热入营血","血热吐衄","阴虚内热","内热消渴","津伤便秘"],"a":"ABCDE","e":"生地黄是清热凉血药，常用治温热病热入营血，身热神昏及血热吐衄、便血等证。又生地黄长于养阴生津、清退虚热，可用治阴虚内热骨蒸、内热消渴以及肠燥便秘，因此，答案ABCDE都是正确的。一般认为，用治肠燥便秘的药物，像郁李仁一样具有润肠通便作用，肠燥便秘是生地记忆的难点，常见的错误是漏选E项。","k":"清热药"},{"t":2,"s":"赤芍的主治证有哪些","o":["血瘀痛经","肝郁胁痛","温毒发斑","血热吐衄","癥瘕腹痛"],"a":"ABCDE","e":"赤芍为清热凉血常用药，主治温毒发斑、血热吐衄；又本品专入肝经而长于散瘀止痛，可用治血瘀痛经、肝郁胁痛、癥瘕腹痛等病证，故答案是ABCDE正确的。","k":"清热药"},{"t":2,"s":"青蒿具有的功效有哪些","o":["清虚热","凉血除蒸","通淋","解暑","截疟"],"a":"ABDE","e":"青蒿的功效是清虚热、凉血除蒸、解暑、截疟，青蒿没有利尿通淋之功，故本题的答案应选ABDE。","k":"清热药"},{"t":2,"s":"患者阴虚发热、骨蒸潮热，可选择下列哪些药物用于治疗","o":["地骨皮","知母","牡丹皮","胡黄连","白薇"],"a":"ABCDE","e":"地骨皮功效凉血退蒸，能清肝肾之虚热，为退虚热、疗骨蒸之佳品；知母功能清热泻火，滋阴润燥，泻肾火而除骨蒸；牡丹皮善于清透阴分伏热，除无汗骨蒸；胡黄连功能退虚热、除疳热，主治阴虚发热及小儿疳积发热。黄柏善泻相火、退骨蒸，主治阴虚火旺、骨蒸劳热。以上五味药均可用于虚热证，故答案应选ABCDE。本题经常出错的选项是C项，牡丹皮善清虚热的功效特点是记忆难点。","k":"清热药"},{"t":1,"s":"大黄用以攻下通便，应选择的用法是","o":["生大黄后下","生大黄先煎","熟大黄","酒炙大黄","大黄炭"],"a":"A","e":"大黄生用泻下力强，故治疗便秘应生用，且入汤剂后下，或开水泡服。而生大黄久煎或熟用，泻下力均减弱；酒炙大黄作用偏上；熟大黄活血力强；大黄炭偏于止血，故答案应选择A项。","k":"泻下药"},{"t":1,"s":"既可润肠通便，又能利水消肿的药物是","o":["决明子","生地黄","火麻仁","郁李仁","松子仁"],"a":"D","e":"本题中的五个备选药物中，均具有润肠通便的作用，但只有郁李仁尚具有利水消肿之功，故答案选D项。","k":"泻下药"},{"t":1,"s":"下列除哪项外，均为巴豆霜的功效","o":["峻下冷积","逐水退肿","豁痰利咽","破血消癥","外用蚀疮"],"a":"D","e":"巴豆霜辛热善除冷积，有较强的逐水退肿作用，并能祛痰利咽以利呼吸；外用有蚀腐肉、疗疮毒的作用，而无破血消癥作用，故答案选D项。","k":"泻下药"},{"t":2,"s":"大黄具有哪些功效","o":["泻下攻积","清热泻火","凉血解毒","化痰止咳","逐瘀通经"],"a":"ABCE","e":"大黄的功效是泻下攻积，清热泻火，凉血解毒，逐瘀通经。故答案应选择ABCE。大黄与虎杖的功效相似，虎杖具有化痰止咳的作用，而大黄没有化痰止咳作用，出题时常用虎杖的功效来做陷阱，常错选D项。","k":"泻下药"},{"t":2,"s":"芒硝的功效有哪些","o":["泻下攻积","泻下逐水","润燥软坚","润肺止咳","清火消肿"],"a":"ACE","e":"芒硝味咸软坚，苦寒泻下，功效具有泻下攻积、润燥软坚、清热消肿之力。故答案应选择ACE。","k":"泻下药"},{"t":2,"s":"下列属于峻下逐水药的药物有哪些","o":["牵牛子","巴豆霜","甘遂","京大戟","芫花"],"a":"ABCDE","e":"上述备选药物均属峻下逐水药。故答案选择ABCDE。","k":"泻下药"},{"t":1,"s":"患者风寒湿痹，腰膝疼痛，尤以下肢关节疼痛为甚，治疗宜首选的药物是","o":["威灵仙","乌梢蛇","羌活","海风藤","独活"],"a":"E","e":"独活主入肾经，性善下行，故善治腰膝、腿足关节疼痛属下部寒湿者，故答案应为E项。羌活的药名、功效与独活相似，但羌活入足太阳膀胱经，善治上半身风湿痹痛，C项是常见的错误选项。","k":"祛风湿药"},{"t":1,"s":"既能祛风湿，又能消骨鲠的药物是","o":["防己","蚕沙","威灵仙","桑寄生","秦艽"],"a":"C","e":"本题测试的是威灵仙的功效，祛风湿、消骨鲠，故答案宜选C项。","k":"祛风湿药"},{"t":1,"s":"患者风寒湿痹，关节疼痛，不可屈伸，遇寒加重，治疗风寒湿痹寒邪偏盛者宜首选的药物是","o":["狗脊","防己","威灵仙","川乌","独活"],"a":"D","e":"本题测试的是川乌的功效特点，其味辛、苦，性热，善于祛风湿、温经散寒、止痛，故对风湿痹证寒邪偏盛者尤宜，答案宜选D项。","k":"祛风湿药"},{"t":1,"s":"患者湿痹，筋脉拘挛，关节酸重，吐泻转筋，治疗最宜选用的药物是","o":["木瓜","防己","豨莶草","秦艽","伸筋草"],"a":"A","e":"木瓜功能舒筋活络，为治湿痹、筋脉拘挛的要药。又能和胃化湿，用治湿阻中焦所致吐泻转筋，故答案宜选A项。","k":"祛风湿药"},{"t":1,"s":"五加皮具有的功效是","o":["祛风湿，补肝肾，安胎","祛风湿，补肝肾，强腰膝","祛风湿，补肝肾，利水","祛风湿，强筋骨，补肾阳","祛风湿，强筋骨，止血"],"a":"C","e":"本题测试的是五加皮的功效祛风湿，补肝肾，同时兼有利水作用。故正确答案为C项。","k":"祛风湿药"},{"t":1,"s":"功能祛风，通络，止痉的药物是","o":["威灵仙","蕲蛇","防风","秦艽","独活"],"a":"B","e":"蕲蛇具有走窜通络之性，既能祛外风，又能息内风，善于止痉，因此本题正确答案是B项。防风可祛风止痉但无通络作用，秦艽可祛风通络但无止痉作用，均是常见的错误选项。","k":"祛风湿药"},{"t":1,"s":"功能祛风湿，利水消肿，善治湿热痹证的药物是","o":["秦艽","防己","五加皮","桑枝","豨莶草"],"a":"B","e":"本题测试防己的功效特点，祛风湿，利水消肿，其性苦寒，又能清热，善治湿热痹证。五加皮功能祛风湿，利水消肿，但无清热作用，不是治疗湿热痹证的要药。","k":"祛风湿药"},{"t":1,"s":"被称为\"风药中之润剂\"的药物是","o":["威灵仙","防己","蕲蛇","川乌","秦艽"],"a":"E","e":"秦艽味辛、苦，辛散而不峻烈，味苦而不燥热，质润性平而无伤阴之弊，对风湿痹证，寒热新久均可配伍应用，故有\"风药中之润剂\"之称。威灵仙、蕲蛇、川乌性偏温燥，防己性偏苦燥，均不是正确答案。","k":"祛风湿药"},{"t":2,"s":"桑寄生具有的功效是哪些","o":["补肝肾","强筋骨","祛风湿","安胎","活血舒筋"],"a":"ABCD","e":"桑寄生的功效是祛风湿，补肝肾，强筋骨，安胎。可治疗风湿痹证，崩漏经多，妊娠漏血，胎动不安。故答案应是ABCD。","k":"祛风湿药"},{"t":2,"s":"下列具有补肝肾，强筋骨功效的药物是哪些","o":["桑寄生","杜仲","续断","五加皮","狗脊"],"a":"ABCDE","e":"祛风湿药中的桑寄生、五加皮、狗脊，兼有补肝肾，强筋骨作用，补虚药中的杜仲、续断功能补肝肾，强筋骨，所以本题的正确答案是ABCDE。狗脊的功效是记忆的难点，也是常出错的选项。","k":"祛风湿药"},{"t":2,"s":"木瓜可用治下列哪些病证","o":["风湿痹证","脚气水肿","跌打损伤","风疹湿疹","吐泻转筋"],"a":"ABE","e":"木瓜功能舒筋活络，祛湿除痹，可用治风湿痹证；药性芳香，化湿和中，可用治湿阻中焦所致吐泻转筋，湿邪下注所致的脚气水肿，所以答案是ABE。","k":"祛风湿药"},{"t":1,"s":"化湿药的归经是","o":["肺、膀胱经","肺、脾经","脾、肾经","脾、胃经","心、肝经"],"a":"D","e":"化湿药功能运脾化湿，主治湿浊困脾证，所以主入脾、胃经，D项是正确答案。","k":"化湿药"},{"t":1,"s":"既可燥湿健脾，又能祛风散寒的药物是","o":["藿香","佩兰","苍术","厚朴","砂仁"],"a":"C","e":"备选五味药物均具有芳香化湿之功，用治湿浊中阻证。只有苍术苦燥力强，且味辛性温，在内燥湿健脾，在外祛风散寒。故答案选C项。","k":"化湿药"},{"t":1,"s":"患者食积气滞，脘腹胀满，呕吐泄泻，治疗宜选用善于下气除满，为消除胀满的要药是","o":["苍术","厚朴","砂仁","豆蔻","藿香"],"a":"B","e":"本题测试的是厚朴的功效特点，善于降气除满，为消除胀满的要药。故答案选B项。","k":"化湿药"},{"t":1,"s":"患者脾经湿热，口中甜腻，口臭，多涎，治疗脾瘅症的良药是","o":["藿香","苍术","厚朴","砂仁","佩兰"],"a":"E","e":"脾瘅为脾经湿热，口中甜腻多涎之证。佩兰性平，芳香善化湿浊，去陈腐，为治脾瘅之良药。故答案选E项。","k":"化湿药"},{"t":2,"s":"藿香具有的功效是哪些","o":["化湿","燥湿","止呕","安胎","解暑"],"a":"ACE","e":"藿香芳香性温，具有良好的化湿、止呕之功，并可解暑，故答案选ACE。","k":"化湿药"},{"t":2,"s":"下列具有止呕作用的药物是哪些","o":["苍术","生姜","豆蔻","藿香","厚朴"],"a":"BCD","e":"生姜为\"呕家圣家\"，藿香、豆蔻均能化湿止呕，苍术、厚朴无止呕作用，所以答案是BCD。藿香具有止呕作用，是记忆的难点，也是常出错的选项。","k":"化湿药"},{"t":2,"s":"厚朴具有哪些功效","o":["燥湿","补脾","消积","下气","平喘"],"a":"ACDE","e":"厚朴味苦燥湿，辛散消痰平喘，并可下气消积。厚朴没有补益作用，故答案选ACDE。","k":"化湿药"},{"t":1,"s":"可治疗寒热虚实各种水肿的药物是","o":["泽泻","猪苓","茯苓","车前子","薏苡仁"],"a":"C","e":"本题五味药物皆能利水消肿，治疗水肿，但只有茯苓既可祛邪，又可扶正，利水而不伤正气，为利水渗湿之要药，药性平和，可用治寒热虚实各种水肿，故正确答案是C项。薏苡仁既能利水，又能健脾，但药性寒凉，适用于热性水肿，E项薏苡仁是常见的错误选项，也是出题设计的陷阱。","k":"利水渗湿药"},{"t":1,"s":"患者肾阴不足，相火偏亢所致遗精、潮热，治疗宜选用的药物是","o":["车前子","泽泻","蝼蛄","冬瓜皮","泽漆"],"a":"B","e":"利水渗湿药中，泽泻药性寒凉，能泄肾经之虚火，主治肾阴不足，相火偏亢之遗精、潮热之证，故答案应选择B项。车前子具有清热作用，可用治肺热咳喘、肝热目赤，但不能清虚热，A项是常见的错误选项。","k":"利水渗湿药"},{"t":1,"s":"患者外感暑湿，脘闷呕吐，大便水泻，小便不利，治疗尤首选的药物是","o":["滑石","木通","荠菜","车前子","金钱草"],"a":"A","e":"本题测试滑石的应用特点，外能清热解暑，治疗暑湿外感，内能利尿通淋，分清浊而止泻，尤宜于小便不利之水泻。故答案应选择A项。车前子亦能利尿以渗湿止泻，用治小便不利之水泻，但无外解暑湿功效，不如滑石更适宜，常常误选D项车前子。","k":"利水渗湿药"},{"t":1,"s":"功能利尿通淋，清热解暑，收湿敛疮的药物是","o":["滑石","车前子","石膏","木通","石韦"],"a":"A","e":"本题测试滑石的功效，利尿通淋、清热解暑、收湿敛疮，故答案应选择A项。车前子、木通、石韦虽能利水渗湿，但无清热解暑作用；石膏虽能收湿敛疮，但无利尿通淋作用，是常见的错误选项。","k":"利水渗湿药"},{"t":1,"s":"功能利尿通淋，尤善止尿道疼痛，为治诸淋涩痛之要药的是","o":["地肤子","海金沙","车前草","蝼蛄","冬葵子"],"a":"B","e":"本题测试海金沙的功效特点。备选的五味药物，皆可利水通淋，用治淋证，只有海金沙善止尿道疼痛，为治诸淋涩痛之要药，故应选择B项。","k":"利水渗湿药"},{"t":1,"s":"患者石淋，热淋涩痛，治疗宜首选的药物是","o":["萆薢","木通","石韦","滑石","金钱草"],"a":"E","e":"本题测试金钱草的功效特点。金钱草功能利尿通淋，善消结石，尤宜于治疗石淋，故答案应选择E项。","k":"利水渗湿药"},{"t":1,"s":"患者血淋，小便淋漓，治疗宜首选的药物是","o":["萆薢","木通","石韦","滑石","金钱草"],"a":"C","e":"本题测试石韦的功效特点，石韦药性寒凉，清利膀胱而通淋，兼可凉血止血，尤宜于血淋，故答案应选择C项。","k":"利水渗湿药"},{"t":1,"s":"患者膏淋，小便混浊，白如米泔，治疗宜首选的药物是","o":["萆薢","木通","石韦","滑石","金钱草"],"a":"A","e":"本题测试萆薢的功效特点，萆薢善利湿而分清去浊，为治膏淋要药，用于膏淋，小便混浊，白如米泔，故答案应选择A项。","k":"利水渗湿药"},{"t":1,"s":"茵陈具有的功效是","o":["利湿退黄，利尿通淋","利尿通淋，清热解暑","利水消肿，清热解暑","利尿通淋，破血通经","清利湿热，利胆退黄"],"a":"E","e":"本题测试茵陈的功效，清利湿热、利胆退黄，故答案应选择E项。","k":"利水渗湿药"},{"t":1,"s":"功能利湿退黄，利尿通淋的药物是","o":["茵陈","车前子","金钱草","虎杖","滑石"],"a":"C","e":"茵陈和虎杖具有利湿退黄作用，车前子和滑石具有利尿通淋作用。而只有金钱草兼有利湿退黄和利尿通淋的两个功效，其他药物无此特点，故正确答案选C项。","k":"利水渗湿药"},{"t":2,"s":"茯苓常用治哪些病证","o":["脾虚泄泻","水肿尿少","痰饮眩悸","心神不安","惊悸失眠"],"a":"ABCDE","e":"茯苓的功效是利水渗湿，健脾，宁心。主治水肿尿少、痰饮眩悸、脾虚泄泻、心悸失眠，故答案应选择ABCDE。茯苓具有安神作用，可用治心悸、失眠等证，是其记忆难点，也是常出现的错误。","k":"利水渗湿药"},{"t":2,"s":"虎杖具有哪些功效","o":["利尿通淋","利湿退黄","清热解毒","散瘀止痛","化痰止咳"],"a":"BCDE","e":"虎杖药性苦寒，具有利湿退黄、清热解毒的作用，又能化痰止咳；其入血分，可散瘀止痛。因而答案应选择BCDE。虎杖无利尿通淋作用，因与利湿退黄相似，是出题设计的陷阱，也是常见的错误。","k":"利水渗湿药"},{"t":2,"s":"车前子具有哪些功效","o":["利尿通淋","渗湿止泻","清肝明目","利胆退黄","清肺祛痰"],"a":"ABCE","e":"车前子功能利水通淋，分清浊而止泻，性寒可清肝热而明目，清肺热而化痰止痰，因而答案应选择ABCE。车前子无利胆退黄作用，D项是出题设计的陷阱。","k":"利水渗湿药"},{"t":2,"s":"滑石可用治下列哪些病证","o":["热淋","石淋","黄疸","暑湿","湿疹湿疮"],"a":"ABDE","e":"滑石功能利尿通淋，可治热淋、石淋；又能清热解暑，可治暑湿；又能收湿敛疮，可治湿疹湿疮。故答案选ABDE。滑石无利胆退黄作用，不用治黄疸，常错选C项。","k":"利水渗湿药"},{"t":1,"s":"下列药物中，善于上助心阳、中温脾阳、下补肾阳的是","o":["附子","干姜","丁香","吴茱萸","小茴香"],"a":"A","e":"本题测试的附子的功效特点，善补心、脾、肾三脏之阳气。故答案选A项。","k":"温里药"},{"t":1,"s":"温里药中具有温肺化饮功效的药物是","o":["附子","干姜","肉桂","吴茱萸","丁香"],"a":"B","e":"备选五种药物均能温里散寒，但唯有干姜能温肺化饮，故选择B项。","k":"温里药"},{"t":1,"s":"具有温中止痛、杀虫止痒功效的药物是","o":["胡椒","花椒","荜茇","荜澄茄","苦参"],"a":"B","e":"前四种药物均能温中止痛，B项与E项可杀虫止痒，而E项为清热燥湿药，故答案选择B项。","k":"温里药"},{"t":1,"s":"患者厥阴巅顶头痛，干呕吐涎沫，苔白脉迟，治疗宜选用下列哪味药物","o":["白芷","藁本","细辛","吴茱萸","葛根"],"a":"D","e":"白芷善治阳明头痛，藁本善治巅顶头痛，细辛善治少阴头痛，吴茱萸善治厥阴头痛，葛根善治项背强痛，故答案选D项。","k":"温里药"},{"t":1,"s":"功能暖肝散寒止痛，善治寒凝肝经诸痛证的药物是","o":["附子","干姜","肉桂","吴茱萸","花椒"],"a":"D","e":"本题测试的是吴茱萸的功效特点，善入肝经，功能暖肝散寒，用治寒凝肝经所致的各种病证，如厥阴头痛、寒疝腹痛、少腹冷痛等，故选D项。","k":"温里药"},{"t":1,"s":"功能引火归原的药物是","o":["附子","干姜","肉桂","吴茱萸","鹿茸"],"a":"C","e":"本题测试的是肉桂的功效，引火归原，故答案选C项。","k":"温里药"},{"t":1,"s":"患者重病体虚，阳气衰微，四肢逆冷，脉微欲绝，治疗宜选用下列哪组药物回阳救逆","o":["附子、干姜","干姜、肉桂","附子、肉桂","吴茱萸、附子","肉桂、吴茱萸"],"a":"A","e":"功能回阳救逆的药物有附子，干姜可助附子的回阳作用并能解附子之毒，因而用治亡阳证时，附子与干姜常相须为用，如四逆汤。肉桂无回阳作用，附子与肉桂均能补火助阳。故答案选A项。","k":"温里药"},{"t":1,"s":"小茴香善治下列哪种病证","o":["阳明头痛","寒疝腹痛","风湿痹痛","脘腹冷痛","虫积腹痛"],"a":"B","e":"小茴香功能暖肝温肾、散寒止痛，用治寒凝肝经所致的寒疝腹痛、少腹冷痛等证，故正确答案是B项。","k":"温里药"},{"t":1,"s":"患者胃寒冷痛，呕吐嗳气，治疗宜选用哪味药物散寒止痛、温中止呕","o":["高良姜","附子","肉桂","小茴香","花椒"],"a":"A","e":"高良姜、小茴香、花椒均能温中散寒，而高良姜主入脾、胃经，善于温中止呕，主治胃寒呕吐诸证，所以答案是A项。","k":"温里药"},{"t":2,"s":"肉桂具有的功效是哪些","o":["补火助阳","散寒止痛","温肺化饮","温经通脉","引火归原"],"a":"ABDE","e":"肉桂功效为补火助阳、散寒止痛、温经通脉、引火归原，无温肺化饮之功，故答案应选ABDE。","k":"温里药"},{"t":2,"s":"吴茱萸的适应证有哪些","o":["虚寒泄泻","胃寒呕吐","厥阴头痛","寒疝腹痛","寒湿脚气"],"a":"ABCDE","e":"吴茱萸可散寒止呕，用治胃寒呕吐；可助阳止泻，可用治虚寒泄泻；可暖肝散寒，用治寒凝肝经所致的各种病证，如厥阴头痛、寒疝腹痛、寒湿脚气等，所以答案是ABCDE。本题的难点在于理解厥阴头痛、寒疝腹痛、寒湿脚气等病证皆属于寒凝肝经诸痛证，所以均可用吴茱萸治疗。常见的错误是漏选C、D、E项。","k":"温里药"},{"t":2,"s":"附子具有的功效有哪些","o":["回阳救逆","温通经脉","散寒止痛","补火助阳","引火归原"],"a":"ACD","e":"附子具有回阳救逆的作用，是其他药物不可取代的；又可补火助阳，与肉桂类似，常相须为用；其散寒止痛功效，与川乌类似，用治风湿痹证、心腹冷痛等证。故答案是ACD。","k":"温里药"},{"t":1,"s":"患者脾胃气滞，脘腹胀痛及泻痢里急后重，宜选用的药物是","o":["陈皮","枳壳","佛手","木香","大腹皮"],"a":"D","e":"木香辛行苦降，善行大肠之气滞，为治湿热泻痢里急后重之要药，故选D项。","k":"理气药"},{"t":1,"s":"既能破气消积，又能化痰除痞的药物是","o":["枳实","青皮","陈皮","川楝子","绿萼梅"],"a":"A","e":"备选答案中，功能破气消积的药物只有枳实和青皮，二者之中具备化痰和除痞功效的只有枳实，故答案应选A项。B项青皮是经常出错的选项。","k":"理气药"},{"t":1,"s":"患者，女，29岁，因肝气郁结，月经不调，痛经，乳房胀痛，治疗宜首选的药物是","o":["木香","香附","沉香","枳实","陈皮"],"a":"B","e":"香附主入肝经，具有疏肝解郁、调经止痛之功，主治肝气郁结、月经不调、痛经、乳房胀痛等，故答案应选B项。沉香、枳实、陈皮没有疏肝作用，肝郁气滞证一般不用。A项木香善于行气止痛，可用治肝郁之胁痛、疝气痛、黄疸等，但不用治肝郁之痛经，却是常见错误和出题设计的陷阱。","k":"理气药"},{"t":1,"s":"陈皮不具有的功效是","o":["理气","化痰","除痞","健脾","燥湿"],"a":"C","e":"本题测试陈皮的功效，即理气健脾、燥湿化痰，不具有除痞作用，因而正确答案是C项。陈皮行气宽中，且芳香燥湿故能健脾，健脾是陈皮功效记忆的难点。","k":"理气药"},{"t":1,"s":"患者，男，68岁，胸痛心痛，治疗用药选取薤白哪方面的功效","o":["通阳散结","理气健脾","化痰宽胸","宣肺化痰","破气除痞"],"a":"A","e":"胸痹证主要病机为寒痰，瘀血阻闭，胸阳不振所致。薤白辛散苦降，温通滑利，善散阴寒之凝滞，通胸阳之闭结，为治胸痹之要药。故答案应选A项。","k":"理气药"},{"t":1,"s":"具有行气散结，散寒止痛功效的药物是","o":["乌药","橘核","荔枝核","沉香","檀香"],"a":"C","e":"荔枝核具有理气散结、散寒止痛的功效，故答案应选C项。乌药、沉香、檀香功能行气止痛且能散寒，但无散结作用。橘核功能理气散结、止痛，但无散寒之功。","k":"理气药"},{"t":1,"s":"既能行气宽中，又能利水消肿的药物是","o":["大腹皮","青木香","天仙藤","川楝子","甘松"],"a":"A","e":"大腹皮的功效正是行气宽中、利水消肿，故答案应选A项。","k":"理气药"},{"t":1,"s":"既能行气止痛，又可杀虫的药物是","o":["木香","苦参","川楝子","檀香","青皮"],"a":"C","e":"苦参、川楝子均有杀虫作用，但苦参无行气作用，因而正确答案是C项川楝子。川楝子的来源是苦楝树的果实，可联系杀虫药的苦楝皮，易于记忆其杀虫的作用。","k":"理气药"},{"t":1,"s":"既能行气止痛，又能温肾纳气的药物是","o":["乌药","木香","檀香","沉香","枳实"],"a":"D","e":"本题测试沉香的功效，沉香质重沉降，性温散寒，故能温肾纳气平喘，答案是D项。沉香与木香均能行气止痛、温肾散寒，而沉香偏于纳气，木香是出题设计的陷阱，也是常见的错误选项。","k":"理气药"},{"t":1,"s":"木香具有的功效是","o":["行气止痛，散寒调中","行气健脾，燥湿化痰","下气除满，化痰消积","行气止痛，温中止呕","行气止痛，健脾消食"],"a":"E","e":"本题测试木香的功效，即行气止痛，健脾消食。故正确答案是E项。","k":"理气药"},{"t":1,"s":"既能疏肝破气，又能消积化滞的药物是","o":["橘皮","青皮","枳实","木香","香附"],"a":"B","e":"本题测试青皮的功效，即疏肝破气、消积化滞。故正确答案是B项。枳实同样行气力峻，功能破气，是经常出错的选项。","k":"理气药"},{"t":1,"s":"功能疏肝解郁，理气宽中的药物是","o":["川芎","延胡索","柴胡","香附","木香"],"a":"D","e":"本题测试香附的功效，疏肝解郁、理气宽中，故正确答案是D项。柴胡功能疏肝解郁，但无理气宽中之效；木香功能行气健脾，但无疏肝之用，故C、E均是经常出错的选项。","k":"理气药"},{"t":2,"s":"理气药具有的功效是哪些","o":["理气健脾","行气止痛","疏肝解郁","破气散结","理气宽胸"],"a":"ABCDE","e":"五个备选答案均为理气药的功效，故答案应选ABCDE。","k":"理气药"},{"t":2,"s":"枳实可用于治疗下列哪些病证","o":["结胸","湿痰咳嗽","胸痹","脏器下垂","湿热泻痢"],"a":"ACDE","e":"枳实功能破气除痞、化痰消积，用治脾胃气滞、湿热泻痢。又可用治脏器下垂，是其主治证的难点。其化痰作用，用治广义之痰证，如胸痹、结胸证，而不用治湿痰咳嗽，因此B项不是正确答案。","k":"理气药"},{"t":2,"s":"患者因情志不遂，肝郁气滞，胸胁胀痛，脉弦，治疗宜选用的药物有哪些","o":["枳实","香附","青皮","香橼","佛手"],"a":"BCDE","e":"具有疏肝解郁作用的药物是香附、青皮、香橼、佛手。枳实不入肝经，其功效是破气除痞、化痰消积，无疏肝解郁之功。故答案应选BCDE。","k":"理气药"},{"t":2,"s":"沉香具有的功效有哪些","o":["行气止痛","温中止呕","温肺散寒","疏肝解郁","纳气平喘"],"a":"ABE","e":"沉香具有行气止痛作用，其温性较强，可温胃降逆而止呕，温肾纳气而平喘。可联系沉香的药名\"沉\"字的含义，沉香性属沉降，偏于降气，故能降逆止呕，降气平喘。","k":"理气药"},{"t":1,"s":"善于消化油腻肉食积滞的药物是","o":["山楂","麦芽","莱菔子","鸡内金","厚朴"],"a":"A","e":"本题测试山楂的功效特点，最宜于消化油腻肉食积滞，故答案是A项。","k":"消食药"},{"t":1,"s":"善治米面薯芋类积滞的药物是","o":["六神曲","麦芽","莱菔子","鸡内金","山楂"],"a":"B","e":"本题测试麦芽的功效特点，故宜于米面薯芋类食物积滞。故正确答案是B项。本题常与上题混淆，易错选E项山楂。","k":"消食药"},{"t":1,"s":"患儿，男，5岁，外感风寒，兼有饮食积滞，恶寒发热，脘腹胀痛，治疗宜选用的药物是","o":["山楂","六神曲","麦芽","鸡内金","紫苏"],"a":"B","e":"六神曲在其制作工艺内加用青蒿、苍耳等兼有解表作用的药物，故有解表作用，因而正确答案为B项。紫苏虽能解表散寒，但无消食化积功效，是出题设计的陷阱，也是常出错的选项。","k":"消食药"},{"t":1,"s":"患者因食积气滞所致的脘腹胀满或疼痛，嗳气吞酸，治疗应首选的药物是","o":["山楂","麦芽","莱菔子","鸡内金","鸡矢藤"],"a":"C","e":"备选各药皆能消食积，只有莱菔子能降气除胀，故食积兼气滞者当选用C项莱菔子。","k":"消食药"},{"t":1,"s":"山楂具有的功效是","o":["消食化积，行气散瘀","消食健胃，理气止痛","消食健胃，回乳消胀","消食化积，清热解毒","消食健胃，温中散寒"],"a":"A","e":"本题测试山楂的功效，既能消食化积，又能行气散瘀，故答案是A项。山楂的行气活血功效是记忆的难点，因而常错选B、C项。","k":"消食药"},{"t":1,"s":"麦芽具有的功效是","o":["消食和中，健脾开胃","消食健胃，理气止痛","消食化积，行气散瘀","消食健胃，回乳消胀","消食化积，温中散寒"],"a":"D","e":"本题测试麦芽的功效，既能消食健胃，又能回乳消胀，故答案是D项。若混淆麦芽与稻芽的功效，常错选A项。","k":"消食药"},{"t":1,"s":"莱菔子具有的功效是","o":["消食健胃，理气止痛","消食化积，清热化痰","消食除胀，降气化痰","消食化积，温中止泻","消食化积，软坚散结"],"a":"C","e":"本题测试莱菔子的功效，既能消食化积，又能降气化痰，故答案是C项。莱菔子的降气化痰功效是记忆的难点，常出错而选A项理气止痛。","k":"消食药"},{"t":1,"s":"鸡内金具有的功效是","o":["消食健胃，收敛固涩","消食健胃，涩精止遗","消食健胃，固表止汗","消食健胃，利尿通淋","消食健胃，利胆退黄"],"a":"B","e":"本题测试鸡内金的功效，既能消食健胃，又能涩精止遗，故答案选B项。鸡内金的涩精止遗功效是记忆的难点，常出错而选D、E项。","k":"消食药"},{"t":2,"s":"山楂可用治下列哪些病证","o":["饮食积滞","泻痢腹痛","疝气腹痛","高脂血症","瘀阻腹痛"],"a":"ABCDE","e":"山楂功能消食化积，可用治饮食积滞。且入肝经，能行气散结止痛，炒用兼能止泻止痢，故用治疝气腹痛、泻痢腹痛。山楂又能活血祛瘀止痛，用治瘀阻腹痛。又能化浊降脂，故能治高脂血症。因此答案是ABCDE，其中疝气腹痛、高脂血症等是常漏选的难点。","k":"消食药"},{"t":1,"s":"患儿蛔虫病，治疗宜选用的药物是","o":["使君子","苦楝皮","槟榔","南瓜子","鹤草芽"],"a":"A","e":"使君子气味香甜，既有良好的驱杀蛔虫作用，又有缓慢的滑利通肠之性，故为驱蛔要药，可单独炒香，有利于小儿嚼服，故答案选A项。苦楝皮、槟榔也可用于小儿蛔虫病，却是常见的错误选项。苦楝皮有毒，槟榔最善治绦虫，二者治疗小儿蛔虫病，一般均需配伍使用。","k":"驱虫药"},{"t":1,"s":"苦楝皮具有的功效是","o":["杀虫，行气","杀虫，疗癣","杀虫，燥湿","杀虫，解毒","杀虫，凉血"],"a":"B","e":"本题测试苦楝皮的功效，既能杀虫，又能疗癣。故答案是B项。若混淆苦楝皮与川楝子的功效，则错选A项行气作用。有些清热燥湿药，也兼有杀虫作用，因而C项也是经常出错的选项，也是出题设计的陷阱。","k":"驱虫药"},{"t":1,"s":"下列哪组药物常配伍治疗绦虫病","o":["使君子、苦楝皮","槟榔、南瓜子","鹤草芽、雷丸","鹤虱、榧子","芜荑、槟榔"],"a":"B","e":"本题测试槟榔与南瓜子的主治特点，故答案宜选B项。","k":"驱虫药"},{"t":1,"s":"雷丸用治下列何种虫病最佳","o":["蛔虫病","钩虫病","脑囊虫病","蛲虫病","绦虫病"],"a":"E","e":"雷丸可用治上述五种虫病，但以驱杀绦虫疗效最佳。因其所含蛋白酶能使绦虫虫体蛋白质分解破坏，故答案宜选E项。","k":"驱虫药"},{"t":2,"s":"槟榔具有的功效有哪些","o":["杀虫消积","化痰","截疟","行气","利水"],"a":"ACDE","e":"本题测试槟榔的功效，即杀虫消积、行气、利水、截疟，故答案选ACDE。","k":"驱虫药"},{"t":2,"s":"驱虫药中，含有毒性的药物有哪些","o":["苦楝皮","鹤草芽","雷丸","鹤虱","芜荑"],"a":"AD","e":"苦楝皮有毒，鹤虱有小毒，两药在使用时均当注意，答案应选AD。鹤虱是了解药物，若不知其毒性，常漏选D项。","k":"驱虫药"},{"t":2,"s":"可用治蛲虫病的药物有哪些","o":["使君子","槟榔","雷丸","鹤虱","榧子"],"a":"ABCDE","e":"五种药物均可用治蛲虫病，故答案选择ABCDE。鹤虱、榧子是了解药物，若不知其主治特点，常漏选D、E项。","k":"驱虫药"},{"t":1,"s":"既能凉血止血，又能解毒敛疮的药物是","o":["小蓟","地榆","侧柏叶","白茅根","苎麻根"],"a":"B","e":"备选药物均能凉血止血，但地榆味酸涩，又能收敛疮痈，故正确答案应选B项。A项是常见的错误选项，也是出题设计的陷阱。小蓟与地榆功效相似，功能凉血止血，又能解毒，不同在于小蓟兼能散瘀，而地榆兼能敛疮。","k":"止血药"},{"t":1,"s":"功能凉血止血，尤善治尿血、血淋的药物是","o":["大蓟","小蓟","侧柏叶","槐花","地榆"],"a":"B","e":"本题测试小蓟的功效特点，功能凉血止血，兼能利尿通淋，以治尿血、血淋最宜，故正确答案应选B项。大蓟虽与小蓟非常相似，但无利尿作用。槐花、地榆善治便血、痔血，是常见的错误选项。","k":"止血药"},{"t":1,"s":"功能温经止血，散寒调经的药物是","o":["红花","炮姜","川芎","益母草","艾叶"],"a":"E","e":"本题测试艾叶的功效，温经止血，善入下焦，而调经止痛，故答案是E项。","k":"止血药"},{"t":1,"s":"患者血热所致之痔血、便血，治疗宜首选的药物是","o":["小蓟","艾叶","槐花","灶心土","白及"],"a":"C","e":"本题测试槐花的功效特点，善清泄大肠火热而凉血止血，故善治血热所致之痔血、便血，故正确答案是C项。小蓟善治尿血、血淋，白及善治肺胃出血证，各药止血的功效特点不同，是易于混淆的知识点。","k":"止血药"},{"t":1,"s":"素有伤科要药之称的药物是","o":["大蓟","艾叶","三七","花蕊石","棕榈炭"],"a":"C","e":"三七既能化瘀止血，又能活血定痛，有止血不留瘀，化瘀不伤正的特点。若跌打损伤者，是为首选，且单用有效，为伤科要药。故正确答案应是C项。","k":"止血药"},{"t":1,"s":"治疗肺胃出血，宜首选的药物是","o":["槐花","小蓟","地榆","白及","白茅根"],"a":"D","e":"本题测试白及的止血特点，尤善治肺胃出血证，故正确答案是D项。地榆、槐花善治血热所致便血、痔血，小蓟、白茅根善治血热所致血尿、血淋。","k":"止血药"},{"t":1,"s":"止血药中，功能清肝泻火的药物是","o":["白茅根","侧柏叶","槐花","炮姜","灶心土"],"a":"C","e":"槐花长于清肝泻火，可用治肝火上炎证，故正确答案应选C项。白茅根、侧柏叶性属寒凉，偏于清肺热；炮姜、灶心土性属温热，无清热作用。","k":"止血药"},{"t":1,"s":"苎麻根具有的功效是","o":["凉血止血，安胎","凉血止血，杀虫","凉血止血，利尿","凉血止血，清肝","凉血止血，化瘀"],"a":"A","e":"本题测试苎麻根的功效，既能凉血止血，又能清热安胎，故答案是A项。","k":"止血药"},{"t":1,"s":"白及具有的功效是","o":["收敛止血，清热解毒","收敛止血，消肿生肌","散瘀止血，消肿定痛","化瘀止血，消肿生肌","收敛止血，利尿通淋"],"a":"B","e":"白及为收敛止血之要药，味涩质黏，亦能消肿生肌，故答案是B项。白及与三七的功效易于混淆，经常错选C项。","k":"止血药"},{"t":1,"s":"三七具有的功效是","o":["散瘀止血，凉血通经","化瘀止血，活血利尿","收敛止血，消肿生肌","散瘀止血，消肿定痛","收敛止血，活血定痛"],"a":"D","e":"本题测试三七的功效，既能散瘀止血，又能消肿定痛，故正确答案是D项。三七止血偏于活血化瘀，白及止血偏于黏腻收敛，是二者的不同之处。","k":"止血药"},{"t":1,"s":"既能凉血止血，又能化痰止咳的药物是","o":["半夏","侧柏叶","大蓟","桃仁","白茅根"],"a":"B","e":"本题测试侧柏叶的功效，既能凉血止血，又能化痰止咳，故正确答案是B项。桃仁功能化痰止咳，又能活血化瘀，是易于混淆的选项。","k":"止血药"},{"t":1,"s":"下列哪味药物是水火烫伤之要药","o":["大蓟","三七","白及","乳香","地榆"],"a":"E","e":"地榆苦寒能泻火解毒，味酸涩能敛疮，为治水火烫伤之要药，故答案是E项。三七、乳香为伤科之常用药，是经常出错的选项。","k":"止血药"},{"t":1,"s":"功能凉血，化瘀，止血，通经的药物是","o":["小蓟","三七","大黄","丹皮","茜草"],"a":"E","e":"茜草善走血分，既能凉血止血，又能活血通经，故正确答案是E项。","k":"止血药"},{"t":1,"s":"蒲黄具有的功效是","o":["化瘀止血，清热","凉血止血，通经","化瘀止血，通淋","凉血止血，利尿","化瘀止血，凉血"],"a":"C","e":"本题测试蒲黄的功效，即止血，化瘀，通淋，故答案是C项。混淆凉血止血与化瘀止血，常误选D项。","k":"止血药"},{"t":2,"s":"白及常用治下列哪些病证","o":["肺胃出血","痈肿疮疡","水火烫伤","手足皲裂","疟疾寒热"],"a":"ABCD","e":"白及功能收敛止血，善治各种出血证，尤多用于肺胃出血之证。又能消肿生肌，对于痈肿疮疡，水火烫伤，手足皲裂皆宜。故答案应选ABCD。水火烫伤、手足皲裂是白及适应证的难点，也是经常出错的知识点。","k":"止血药"},{"t":2,"s":"具有凉血止血作用的药物有哪些","o":["大蓟","小蓟","地榆","槐花","侧柏叶"],"a":"ABCDE","e":"备选药物均能凉血止血，治疗血热出血之证，故答案是ABCDE。","k":"止血药"},{"t":2,"s":"功能收敛止血的药物有哪些","o":["仙鹤草","白及","艾叶","茜草","血余炭"],"a":"ABE","e":"仙鹤草、白及、血余炭是收敛止血药，艾叶是温经止血药，茜草是凉血止血药，故答案是ABE。","k":"止血药"},{"t":1,"s":"川芎具有的功效是","o":["活血行气，祛风止痛","活血止痛，化瘀调经","活血化瘀，利水消肿","活血行气，通经下乳","活血调经，补血养阴"],"a":"A","e":"本题测试川芎的功效，功能活血行气止痛，善行头面，长于祛风，故答案是A项。","k":"活血化瘀药"},{"t":1,"s":"\"行血中气滞，气中血滞，专治一身上下诸痛\"的药物是","o":["川芎","郁金","延胡索","姜黄","乳香"],"a":"C","e":"此句为《本草纲目》中关于延胡索的论述，既能活血止痛，又能行气止痛，故正确答案为C项。","k":"活血化瘀药"},{"t":1,"s":"既能行血补血，又能舒筋活络的药物是","o":["红花","益母草","丹参","鸡血藤","桃仁"],"a":"D","e":"鸡血藤既能活血，又能补血，且善于疏通经络，故答案选D项。红花、桃仁、益母草功能活血，但无补血之力，丹参功能活血补血，但无舒筋活络之功，均不是正确答案。","k":"活血化瘀药"},{"t":1,"s":"红花具有的功效是","o":["活血通经，利水消肿","活血止痛，行气通经","活血通经，消肿生肌","活血止痛，止咳平喘","活血通经，祛瘀止痛"],"a":"E","e":"本题测试红花的功效，即活血化瘀以止痛、调经，故答案是E项。红花无行气作用，常错选B项。","k":"活血化瘀药"},{"t":1,"s":"具有活血行气、通络止痛作用，长于行肢臂而除痹痛的药物是","o":["丹参","姜黄","乳香","红花","川芎"],"a":"B","e":"本题测试姜黄功效特点，外散风寒湿邪，内行气血而通络止痛，而长于行肢臂经脉而除痹痛。故答案为B项。","k":"活血化瘀药"},{"t":1,"s":"功能活血消癥，消肿排脓的药物是","o":["乳香","五灵脂","丹参","穿山甲","斑蝥"],"a":"D","e":"穿山甲功能活血消癥，消肿排脓，可使脓未成者消散，已成脓者速溃，为治疗疮疡肿痛之要药。故本题答案选D项。","k":"活血化瘀药"},{"t":1,"s":"在十八反中，与丹参不宜同用的药物是","o":["五灵脂","莱菔子","藜芦","甘草","甘遂"],"a":"C","e":"在十八反中，\"诸参辛芍叛藜芦\"，其中的\"参\"也包括了丹参，不能与藜芦同用。故本题答案选C项。","k":"活血化瘀药"},{"t":1,"s":"性善\"上行头目\"，为治头痛的要药是","o":["羌活","川芎","细辛","白芷","吴茱萸"],"a":"B","e":"川芎既能活血行气，又能祛风止痛，善\"上行头目\"，是治疗头痛的要药。故答案应选B项。","k":"活血化瘀药"},{"t":1,"s":"功能活血定痛，消肿生肌的药物是","o":["姜黄","五灵脂","乳香","丹参","川芎"],"a":"C","e":"本题测试乳香的功效，既能活血定痛，又能消肿生肌，故答案是C项。","k":"活血化瘀药"},{"t":1,"s":"桃仁具有而杏仁不具有的功效是","o":["行气止痛","润肠通便","活血化瘀","止咳平喘","利水消肿"],"a":"C","e":"桃仁与杏仁均能止咳平喘和润肠通便，但桃仁还具有活血化瘀作用，杏仁无此作用，是二者的区别。故答案是C项。误解本题的含义，常误选B、D项。","k":"活血化瘀药"},{"t":1,"s":"益母草具有的功效是","o":["活血调经，祛瘀止痛","活血行气，祛风止痛","活血化瘀，下乳消痈","活血化瘀，利尿通淋","活血调经，利水消肿"],"a":"E","e":"本题测试益母草的功效，即活血调经、利水消肿、清热解毒，故正确答案是E项。D项利尿通淋与利水消肿易于混淆，是常见的错误选项。","k":"活血化瘀药"},{"t":1,"s":"功能引血下行的药物是","o":["川芎","独活","肉桂","丹参","牛膝"],"a":"E","e":"本题测试牛膝的功效特点，本品酸苦降泄，性善下行，故能引血下行，主治气火上逆，上焦出血证，故正确答案是牛膝。B项独活同样性善下行，但不能入血分，多用治下半身风湿。C项肉桂功能引火归原，其功效表达与引血下行相似，易于混淆，故B、C项均是常见的错误选项，需重点区分。","k":"活血化瘀药"},{"t":1,"s":"功能破血行气，消积止痛，性能偏于破血的药物是","o":["没药","三棱","莪术","穿山甲","乳香"],"a":"B","e":"本题测试莪术与三棱的功效特点的差异，二者均能破血行气、消积止痛，但莪术偏于破气，三棱偏于破血，故正确答案是三棱。乳香与没药同样是一对功效相似的药物，功能活血定痛、消肿生肌，但乳香偏于行气，没药偏于活血，二者的活血作用相比莪术、三棱和缓，不能称为破血。常常误选A项没药，或者C项莪术。","k":"活血化瘀药"},{"t":1,"s":"功能破血逐瘀，续筋接骨的药物是","o":["马钱子","土鳖虫","自然铜","苏木","血竭"],"a":"B","e":"备选药物均能活血疗伤，只有土鳖虫是虫体入药，活血作用峻猛，称为破血，故本题选B项。","k":"活血化瘀药"},{"t":1,"s":"莪术具有的功效是","o":["破血行气，消积止痛","活血化瘀，调经止痛","破血逐瘀，攻毒蚀疮","破血通经，逐瘀消癥","活血消癥，消肿排脓"],"a":"A","e":"莪术活血作用峻猛，故称破血，又兼有行气功效，故能消积止痛，本题选A项。其他选项没有行气作用，因而不选。","k":"活血化瘀药"},{"t":2,"s":"郁金具有的功效有哪些","o":["利尿通淋","清心凉血","活血止痛","行气解郁","利胆退黄"],"a":"BCDE","e":"郁金既入血分，又入气分，功能活血行气止痛。主入肝经，故能行气解郁、利胆退黄。药性寒凉，故能凉血、清心，故答案选BCDE。","k":"活血化瘀药"},{"t":2,"s":"具有活血行气止痛作用的药物有哪些","o":["丹参","乳香","川芎","牛膝","姜黄"],"a":"BCE","e":"丹参、牛膝只入血分，长于活血调经。乳香、川芎和姜黄既入血分又入气分，能活血行气止痛，故选答案BCE。","k":"活血化瘀药"},{"t":2,"s":"丹参具有的功效有哪些","o":["除烦安神","凉血消痈","祛瘀止痛","行气解郁","活血调经"],"a":"ABCE","e":"丹参功能活血化瘀而止痛、调经，药性寒凉，故能凉血而清热消痈、清心安神，故答案是ABCE。丹参无行气作用，是区别活血止痛药的特点。","k":"活血化瘀药"},{"t":2,"s":"红花可用治下列哪些病证","o":["瘀滞斑疹色暗","跌打损伤","胸痹心痛","癥瘕积聚","血滞经闭"],"a":"ABCDE","e":"红花功能活血化瘀，从而止痛、调经、疗伤、消癥，可用治一切瘀血证，如瘀血经闭、胸痹心痛、跌打损伤、癥瘕积聚。红花功能活血通脉以化滞消斑，可用于瘀热郁滞之斑疹色暗。故答案ABCDE。","k":"活血化瘀药"},{"t":2,"s":"牛膝具有的功效有哪些","o":["活血通经","引血下行","利水通淋","清热解毒","补肝肾，强筋骨"],"a":"ABCE","e":"本题测试牛膝的功效，即活血通经、补肝肾、强筋骨、利水通淋、引血下行。牛膝具有诸多功效，是记忆的难点，又是考试的重点。","k":"活血化瘀药"},{"t":1,"s":"功能燥湿化痰，善治脏腑湿痰证的药物是","o":["天南星","半夏","川贝母","桔梗","芥子"],"a":"B","e":"半夏味辛温燥，为燥湿化痰，温化寒痰之要药，尤善治脏腑之湿痰。故答案是B项。天南星善治风痰证，是常见的错误选项。","k":"化痰止咳平喘药"},{"t":1,"s":"具有燥湿化痰，祛风解痉功效的药物是","o":["半夏","胆南星","天南星","芥子","皂荚"],"a":"C","e":"天南星入肝经，走经络，善祛风痰而止痉厥，故答案是C项。而胆南星为天南星用牛胆汁拌制而成的加工品，功能清热化痰、息风定惊，故常误选B项。","k":"化痰止咳平喘药"},{"t":1,"s":"功能祛风痰解痉，善治头面部疾患的药物是","o":["半夏","皂荚","白附子","芥子","胆南星"],"a":"C","e":"白附子既祛风痰，又能止痛，其性上行，尤擅治头面部诸疾，故答案是C项。","k":"化痰止咳平喘药"},{"t":1,"s":"芥子具有的功效是","o":["温化寒痰，解毒散结","温肺化痰，利气散结","燥湿化痰，消痞散结","温化寒痰，消肿散结","燥湿化痰，祛风解痉"],"a":"B","e":"本题测试芥子的功效，能散肺寒，利气机，通经络，化寒痰，逐水饮，温通经络，又能散结通络止痛，故正确答案为B项。","k":"化痰止咳平喘药"},{"t":1,"s":"桔梗可用治癃闭、便秘，主要是因其","o":["有利尿通便之功","有通淋润肠之功","有开宣肺气之功","有肃降肺气之功","有加强肾与膀胱气化之功"],"a":"C","e":"肺主宣发而司二便，桔梗性散上行，可开宣肺气而通二便，故答案是C项。","k":"化痰止咳平喘药"},{"t":1,"s":"瓜蒌具有的功效是","o":["燥湿化痰，消痞散结","清热化痰，润肺止咳","清热化痰，祛风止痉","清热化痰，润燥滑肠","燥湿化痰，宽胸散结"],"a":"D","e":"瓜蒌具有的功效是清热涤痰，宽胸散结，润燥滑肠，故答案是D项。瓜蒌性寒清热，非燥湿化痰，常误选E项。","k":"化痰止咳平喘药"},{"t":1,"s":"竹茹善治下列哪种呕吐","o":["胃阴虚呕吐","胃气虚呕吐","食积呕吐","胃热呕吐","胃寒呕吐"],"a":"D","e":"竹茹微寒能清热降逆止呕，为治热性呕逆之要药，故治胃热呕吐最宜。","k":"化痰止咳平喘药"},{"t":1,"s":"百部治咳喘，是取其何种功效","o":["宣肺止咳","化痰止咳","清肺止咳","润肺止咳","温肺止咳"],"a":"D","e":"对止咳平喘药的学习，关键是掌握药物止咳平喘的机理。百部甘润苦降，微温不燥，功专润肺止咳，无论外感、内伤、新咳、久嗽，皆可用之。故答案是D项。","k":"化痰止咳平喘药"},{"t":1,"s":"功能降气化痰，止咳平喘的药物是","o":["桔梗","紫苏子","百部","紫菀","白果"],"a":"B","e":"本题测试紫苏子的功效。紫苏子性主降，长于降肺气，化痰涎，气降痰消则咳喘自平，故答案是B项。","k":"化痰止咳平喘药"},{"t":1,"s":"紫菀具有的功效是","o":["清肺化痰止咳","温肺化饮平喘","敛肺止咳平喘","润肺化痰止咳","宣肺止咳平喘"],"a":"D","e":"紫菀辛散苦泄，质润而不燥，长于润肺下气，故正确答案是D项。","k":"化痰止咳平喘药"},{"t":1,"s":"具有清肺化痰，止咳平喘之功的药物是","o":["苏子","马兜铃","瓜蒌","旋覆花","白果"],"a":"B","e":"本题测试马兜铃的功效，马兜铃性寒质轻，味苦泄降，善清肺热，降肺气，又能化痰而止咳平喘。","k":"化痰止咳平喘药"},{"t":1,"s":"患者痰涎壅盛，喘咳不得平卧，痰多，胸胁胀满，治疗宜首选药物是","o":["紫苏子","葶苈子","白芥子","桑白皮","白果"],"a":"B","e":"桑白皮与葶苈子均能泻肺平喘，利水消肿，葶苈子力峻，重在泻肺中水气、痰涎，对邪盛喘满不得卧者尤宜，故其为首选。","k":"化痰止咳平喘药"},{"t":1,"s":"具有敛肺定喘化痰之功的药物是","o":["苏子","葶苈子","桑白皮","马兜铃","白果"],"a":"E","e":"本题测试白果的功效。白果性涩而收，能敛肺定喘，且兼有一定化痰之功，具有敛肺定喘化痰之功。","k":"化痰止咳平喘药"},{"t":1,"s":"善治\"皮里膜外之痰\"的药物为","o":["半夏","天南星","白附子","芥子","旋覆花"],"a":"D","e":"本题测试芥子的功效特点，功能温通经络，善散\"皮里膜外之痰\"，故答案是D项。","k":"化痰止咳平喘药"},{"t":1,"s":"川贝母具有功效是","o":["清热化痰，除烦止呕","燥湿化痰，润肠通便","清热化痰，润肺止咳","清热化痰，清心定惊","清热化痰，利咽开音"],"a":"C","e":"川贝母功能清泄肺热化痰，又味甘质润能润肺止咳，尤宜于内伤久咳，燥痰、热痰之证。故答案是C项。","k":"化痰止咳平喘药"},{"t":1,"s":"竹茹具有的功效是","o":["燥湿化痰，散结消肿","清热化痰，除烦止呕","清热化痰，润肠通便","清热化痰，润肺止咳","燥湿化痰，降逆止呕"],"a":"B","e":"竹茹善于清化热痰，又能清热止呕，为治热性呕逆之要药，故答案是B项。","k":"化痰止咳平喘药"},{"t":1,"s":"桑白皮具有的功效是","o":["清肺止咳，除烦止呕","敛肺止咳，化痰平喘","清热化痰，润肺止咳","泻肺平喘，利水消肿","降气化痰，止咳平喘"],"a":"D","e":"桑白皮功能清泻肺火兼泻肺中水气而平喘，又能肃降肺气，通调水道而利水消肿，故答案是D项。","k":"化痰止咳平喘药"},{"t":1,"s":"枇杷叶具有的功效是","o":["清热化痰，润肺止咳","燥湿化痰，散结止痛","降气化痰，止咳平喘","清肺止咳，清肝明目","清肺止咳，降逆止呕"],"a":"E","e":"枇杷叶功能清降肺气，又能清胃热，降胃气而止呕吐、呃逆，故答案是E项。","k":"化痰止咳平喘药"},{"t":2,"s":"具有降气化痰功效的药物是有哪些","o":["白前","前胡","旋覆花","紫苏子","苦杏仁"],"a":"ABCDE","e":"白前的功效是降气化痰；前胡的功效是降气化痰，宣散风热；旋覆花的功效是降气化痰，降逆止呕；紫苏子的功效是降气化痰，止咳平喘，润肠通便；苦杏仁的功效是止咳平喘，润肠通便，其止咳平喘是通过宣降肺气而起效的。故答案是ABCDE。","k":"化痰止咳平喘药"},{"t":2,"s":"下列药物中，善治热痰证的是","o":["竹茹","浙贝母","瓜蒌","胆南星","白附子"],"a":"ABCD","e":"竹茹、浙贝母、瓜蒌性寒，功能清化热痰，胆南星为天南星经牛胆汁拌制而成的加工品，药性由温转为凉，功效能清热化痰、息风定惊，因此答案为ABCD。白附子性温，为温化寒痰药。本题的难点在于胆南星，若误解为温化寒痰的天南星，常漏选D项。","k":"化痰止咳平喘药"},{"t":2,"s":"半夏具有的功效有哪些","o":["消痞散结","燥湿化痰","祛风止痉","降逆止呕","润肺止咳"],"a":"ABD","e":"半夏为燥湿化痰，温化寒痰之要药，尤善治脏腑之湿痰。又能降逆和胃，为止呕要药。半夏化痰而能消痞散结。半夏无祛风痰作用，常错选C项。","k":"化痰止咳平喘药"},{"t":2,"s":"芥子的主治证有哪些","o":["寒痰喘咳","悬饮","阴疽流注","关节肿痛","水肿"],"a":"ABCD","e":"白芥子功能温肺化痰，用治寒痰咳喘、悬饮。又能温通经络，善散\"皮里膜外之痰\"，消肿散结止痛，主治痰湿流注所致的阴疽肿毒、关节肿痛、肢体麻木。故答案是ABCD。","k":"化痰止咳平喘药"},{"t":1,"s":"朱砂具有的功效是","o":["重镇安神，清心解毒","重镇安神，平肝潜阳","重镇安神，活血化瘀","重镇安神，降逆止呕","重镇安神，燥湿化痰"],"a":"A","e":"朱砂既可重镇安神，又能清心安神，为镇心、清火、安神定志之药。故答案是A项。朱砂虽质地沉重，但无平肝潜阳作用，是易于混淆的功效。","k":"安神药"},{"t":1,"s":"龙骨入煎剂应","o":["先煎","后入","另煎","包煎","冲服"],"a":"A","e":"龙骨为药用动物骨骼化石，生用质地坚硬，不容易煎出有效成分，故入煎剂宜先煎，答案应选择A项。混淆先煎与后下的概念，常误选B项。","k":"安神药"},{"t":1,"s":"患者心悸失眠，健忘多梦，体虚多汗，治疗宜选用的药物是","o":["朱砂","酸枣仁","柏子仁","合欢皮","远志"],"a":"B","e":"酸枣仁功能养心益肝安神，且能酸收敛汗。治疗心悸失眠，健忘多梦，体虚多汗者，宜用B项酸枣仁。","k":"安神药"},{"t":1,"s":"患者因心肾不交所致的失眠多梦，健忘惊悸，治疗宜选用的药物是","o":["朱砂","磁石","龙骨","远志","琥珀"],"a":"D","e":"本题测试远志的安神特点，既能开心气而宁心安神，又能通肾气而强志不忘，适宜于心肾不交之失眠多梦，宜选用D项远志。","k":"安神药"},{"t":1,"s":"患者因心火亢盛，阴血不足所致失眠多梦，惊悸怔忡，心中烦热，治疗宜选用的药物是","o":["远志","酸枣仁","琥珀","朱砂","磁石"],"a":"D","e":"本题测试朱砂的安神特点，功能清心重镇安神，故善治心火亢盛，阴血不足之失眠，宜选用朱砂。酸枣仁善治心血亏虚之失眠，是出题设计的陷阱，常常误选B项。","k":"安神药"},{"t":1,"s":"琥珀具有的功效是","o":["清心镇惊，安神解毒","镇惊安神，平肝潜阳","镇惊安神，活血散瘀","养血安神，润肠通便","养血安神，祛风通络"],"a":"C","e":"本题测试琥珀的功效，琥珀具有镇惊安神功效，也能活血通经，散瘀消癥，故选C项。琥珀无重镇平肝作用，常误选B项。","k":"安神药"},{"t":1,"s":"朱砂内服的用量是","o":["15~30g","10~15g","1~3g","1.5~3g","0.1~0.5g"],"a":"E","e":"朱砂药用虽为质重的矿石药，但因其有毒，内服过量易引起中毒，用量应控制在0.1~0.5g之间，故答案应选择E项。","k":"安神药"},{"t":1,"s":"酸枣仁具有的功效是","o":["镇惊安神，清心解毒","养心益肝，安神敛汗","养心安神，润肠通便","养血安神，祛风通络","镇惊安神，清心化痰"],"a":"B","e":"酸枣仁功能养心阴，益肝血而有安神之效，味酸能收敛止汗，故答案是B项。酸枣仁药名带有\"仁\"字，却没有润肠通便作用，常误选C项。","k":"安神药"},{"t":1,"s":"柏子仁具有的功效是","o":["养血安神，祛风通络","养心益肝，安神敛汗","镇惊安神，润肠通便","镇惊安神，清心解毒","养心安神，润肠通便"],"a":"E","e":"柏子仁主入心经，具有养心安神之功效，多用于心阴不足、心血亏虚以致心神失养之心悸怔忡，且富含油脂，能润肠通便，故答案是E项。","k":"安神药"},{"t":1,"s":"患者因情志不遂，愤怒忧郁，烦躁失眠，心神不宁，治疗宜选用的药物是","o":["合欢皮","首乌藤","远志","酸枣仁","柏子仁"],"a":"A","e":"合欢皮善解肝郁，悦心安神，适宜于情志不遂，愤怒忧郁所致失眠。故答案是A项。","k":"安神药"},{"t":1,"s":"首乌藤具有的功效是","o":["镇惊安神，清心解毒","养心益肝，安神敛汗","养心安神，祛痰开窍","养血安神，祛风通络","养心安神，活血消肿"],"a":"D","e":"首乌藤功能补养阴血，养心安神，可用治阴虚血少之失眠多梦，且能祛风通经，活络止痛，故答案是D项。","k":"安神药"},{"t":2,"s":"具有镇惊安神功效的药物有哪些","o":["朱砂","磁石","龙骨","琥珀","柏子仁"],"a":"ABCD","e":"朱砂、磁石、龙骨、琥珀均有镇惊安神功效，柏子仁具有养心安神功效。故答案应选择ABCD。","k":"安神药"},{"t":2,"s":"龙骨具有的功效有哪些","o":["平肝潜阳","软坚散结","镇惊安神","化痰开窍","收敛固涩"],"a":"ACE","e":"龙骨功能镇静安神，质重沉降，有较强的平肝潜阳作用。味涩能敛，亦有收敛固涩功效，故答案是ACE。","k":"安神药"},{"t":1,"s":"既能清热平肝，又能息风定惊的药物是","o":["夏枯草","刺蒺藜","钩藤","白菊花","决明子"],"a":"C","e":"本题测试钩藤的功效，既能清肝热，又能平肝阳，又能息肝风，故答案应选择C项。夏枯草、决明子能清肝热，刺蒺藜能平肝阳，白菊花既能清肝热，又能平肝阳，D、E项是常见的错误选项。","k":"平肝息风药"},{"t":1,"s":"患者热极生风，惊痫抽搐，治疗宜首选的要药是","o":["地龙","羚羊角","钩藤","天麻","全蝎"],"a":"B","e":"本题测试羚羊角的特点，善能清泄肝热，平肝息风，镇惊解痉。故为治惊痫抽搐之要药，尤宜于热极生风所致者，故答案应选择B项。","k":"平肝息风药"},{"t":1,"s":"治疗肝风内动，惊痫抽搐，无论寒热虚实皆可配伍应用的药物是","o":["钩藤","天麻","牛黄","地龙","蜈蚣"],"a":"B","e":"天麻味甘质润，药性平和，可用治各种病因之肝风内动，惊痫抽搐，不论寒热虚实，均可配伍应用，故答案应选择B项。","k":"平肝息风药"},{"t":1,"s":"治疗眩晕头痛，不论虚证、实证皆可应用的药物是","o":["全蝎","蜈蚣","天麻","钩藤","僵蚕"],"a":"C","e":"天麻味甘质润，药性平和，既息肝风，又平肝阳，为治眩晕头痛之要药，不论虚证、实证皆可应用，故答案应选择C项。","k":"平肝息风药"},{"t":1,"s":"既能平肝潜阳，又能息风止痉的药物是","o":["石决明","羚羊角","磁石","僵蚕","地龙"],"a":"B","e":"羚羊角既能平肝潜阳，又能息风止痉，答案应选择B项。石决明、磁石功能平肝潜阳，僵蚕、地龙功能息风止痉。","k":"平肝息风药"},{"t":1,"s":"既能凉肝息风，又能豁痰开窍的药物是","o":["羚羊角","天麻","钩藤","牛黄","僵蚕"],"a":"D","e":"本题测试牛黄的功效。牛黄既能凉肝息风，又能清心豁痰，开窍醒神，故答案应选择D项。","k":"平肝息风药"},{"t":1,"s":"既能平肝潜阳，又能清肝明目的药物是","o":["夏枯草","决明子","石决明","刺蒺藜","青葙子"],"a":"C","e":"本题测试石决明的功效，既能平肝潜阳，又能清肝明目，故答案应选择C项。其他药物均有清肝明目之功效，但无平肝潜阳作用。","k":"平肝息风药"},{"t":1,"s":"患者因温热病热痰阻闭心窍所致神昏谵语，高热烦躁，治疗宜首选的药物是","o":["羚羊角","钩藤","僵蚕","牛黄","天麻"],"a":"D","e":"本题测试牛黄的功效特点，既能清心祛痰，又能开窍醒神，善治温热病热入心包及中风等痰热阻闭证。羚羊角善治热极生风之要药，是常见的错误选项。","k":"平肝息风药"},{"t":1,"s":"全蝎具有的功效是","o":["息风止痉，平抑肝阳","化痰开窍，凉肝息风","息风止痉，攻毒散结","清热定惊，通络平喘","平抑肝阳，清热利尿"],"a":"C","e":"本题测试全蝎的功效，既能息风镇痉，又能攻毒散结，故答案是C项。全蝎有毒，以毒攻毒，用以解毒散结。","k":"平肝息风药"},{"t":1,"s":"僵蚕具有的功效是","o":["息风止痉，化痰散结","平肝潜阳，软坚散结","平肝息风，清肝明目","化痰开窍，凉肝息风","息风止痉，攻毒散结"],"a":"A","e":"本题测试僵蚕的功效，既能息风止痉，祛风止痛，又能化痰散结，故答案是A项。化痰散结是僵蚕功效的难点，也是区别其他药物的要点。","k":"平肝息风药"},{"t":2,"s":"具有平肝潜阳功效的药物是","o":["石决明","代赭石","龙骨","珍珠","磁石"],"a":"ABCE","e":"石决明、代赭石、龙骨、磁石均能平肝潜阳，故选ABCE。珍珠无平肝潜阳作用，与珍珠母混淆，常误选D项。","k":"平肝息风药"},{"t":2,"s":"僵蚕可治疗的病证有哪些","o":["惊痫抽搐","风中经络","风热头痛","高热惊厥","痰核瘰疬"],"a":"ABCE","e":"僵蚕既能息风止痉，又能化痰定惊，故治惊风、癫痫；又能祛风化痰通络，故治风中经络；又有祛外风、散风热、止痛、止痒之功，用治肝经风热之头痛；又能软坚散结，又兼可化痰，故可用治痰核、瘰疬。故答案是ABCE。","k":"平肝息风药"},{"t":2,"s":"地龙可治疗的病证有哪些","o":["高热惊痫","中风半身不遂","风湿痹痛","肺热喘咳","小便不利"],"a":"ABCDE","e":"地龙既能息风止痉，又善于清热定惊，故适用于高热神昏谵语、痉挛抽搐；善于通行经络，用治中风后气虚血滞，经络不利，半身不遂；长于通络止痛，适用于多种原因导致的经络阻滞、血脉不畅，肢节不利；性寒降泄，长于清肺平喘，用治邪热壅肺，肺失肃降之喘息不止；又能清热结而利水道，用于热结膀胱，小便不通。故答案是ABCDE。","k":"平肝息风药"},{"t":2,"s":"地龙具有的功效有哪些","o":["清热定惊","通络","平喘","攻毒散结","利尿"],"a":"ABCE","e":"地龙功能息风止痉，又善于清热平喘，其性走窜，善于通行经络，又能通利水道，故选ABCE。地龙本身无毒，不能以毒攻毒，故不选D项攻毒散结。其平喘、利水作用，是记忆的难点，常遗漏该选项。","k":"平肝息风药"},{"t":1,"s":"具有开窍醒神，活血通经作用的药物是","o":["苏合香","冰片","麝香","石菖蒲","牛黄"],"a":"C","e":"备选药物均有开窍醒神作用，具有活血通经作用的药物只有麝香，故答案应选C项。","k":"开窍药"},{"t":1,"s":"患者因痰湿蒙蔽清窍所致的神志昏乱，治疗宜首选的药物是","o":["石菖蒲","冰片","天竺黄","竹茹","郁金"],"a":"A","e":"石菖蒲、冰片同为开窍药，石菖蒲化湿豁痰开窍，冰片清热开窍。故最适合治疗痰湿蒙蔽、神志昏迷的药物是石菖蒲，答案选A项。","k":"开窍药"},{"t":1,"s":"具有开窍、辟秽、止痛之功，用治冠心病心绞痛的首选药物是","o":["石菖蒲","冰片","苏合香","丹参","红花"],"a":"C","e":"冰片、苏合香具有止痛功效，常用治冠心病心绞痛，但同时具有开窍、辟秽、止痛功效，治疗冠心病心绞痛首选的应是苏合香，故答案选C项。","k":"开窍药"},{"t":1,"s":"外用有清热止痛、消肿之功，为五官科常用药的是","o":["苏合香","石菖蒲","菊花","冰片","生石膏"],"a":"D","e":"冰片外用有清热止痛、消肿之功，为五官科常用药，故答案是D项。生石膏有清热消肿功效，可治胃火上攻牙龈肿痛，但用法为内服。","k":"开窍药"},{"t":1,"s":"既可治疗寒闭昏迷，又能治疗热闭神昏的最佳药物是","o":["麝香","苏合香","牛黄","冰片","石菖蒲"],"a":"A","e":"本题涉及各味开窍药的特点。麝香为开窍醒神之要药，可用于各种原因所致之闭证神昏，无论寒闭、热闭皆可应用，为闭证神昏的首选药，故答案应选A项。苏合香辛散温通，为治寒闭神昏之要药，不用于热闭神昏。牛黄性寒清热，化痰开窍，适用于治痰热闭阻神昏。冰片开窍醒神、清热止痛，性偏寒凉，为凉开之品，虽可用治寒闭神昏，但必须配伍温开药物方可；石菖蒲开窍醒神、化湿、豁痰，多用治痰浊、痰热、湿浊蒙蔽之神昏。","k":"开窍药"},{"t":2,"s":"下列药物中有开窍醒神作用的药物是","o":["冰片","苏合香","牛黄","郁金","石菖蒲"],"a":"ABCDE","e":"冰片、牛黄清热解毒、开窍醒神，苏合香温通辟秽、开窍醒神，郁金解郁清心、开窍醒神，石菖蒲化湿豁痰、开窍醒神。故答案应选ABCDE。","k":"开窍药"},{"t":1,"s":"患者因重病所致气虚欲脱，气息微弱，汗出不止，肢冷脉微，治疗宜首选的药物是","o":["太子参","人参","党参","山药","黄芪"],"a":"B","e":"人参功能大补元气以益气救脱，故选B项人参。党参可以代替人参，治疗肺脾气虚证，但不治元气虚脱，是常见的错误选项。","k":"补虚药"},{"t":1,"s":"患者心气虚，心悸怔忡，失眠多梦，脉虚，治疗宜选用的药物是","o":["黄芪","甘草","党参","白术","人参"],"a":"E","e":"人参功能补心气以安心神，用治心气虚，心悸、失眠多梦证，故答案是E项。党参无补心气作用，不能用治心气虚证。甘草虽能补心气，但无安神作用，是常见的错误选项。","k":"补虚药"},{"t":1,"s":"患者心气虚，心动悸，脉结代，治疗宜首选的药物是","o":["黄芪","甘草","党参","白术","人参"],"a":"B","e":"补气药中，功能补心气的药物，有人参和甘草。甘草补心气以复心脉，用治心动悸，脉结代，故本题选B项。本题题干的关键词是心气虚证，与上题相似，混淆人参与甘草的功效与应用，常误选E项。","k":"补虚药"},{"t":1,"s":"功能补气，托疮毒的药物是","o":["人参","鹿茸","黄芪","甘草","白术"],"a":"C","e":"黄芪功能补气而托毒生肌，故答案是C项。鹿茸亦能托疮毒，但功能补肾阳，是常见的错误选项。甘草功能补气而清热解毒，也是出题设计的陷阱。","k":"补虚药"},{"t":1,"s":"患者因卫气不固，表虚自汗，易感风邪，治疗宜选用的药物是","o":["人参","太子参","党参","白芍","黄芪"],"a":"E","e":"黄芪不但功能补气益卫，而且能够固表止汗，故应选择E项黄芪。人参、太子参、党参均可补气，但无固表止汗功效。","k":"补虚药"},{"t":1,"s":"患者血虚脏躁，精神恍惚，心中烦乱，失眠多梦，治疗宜首选的药物是","o":["大枣","山药","白术","人参","党参"],"a":"A","e":"脏躁为血虚而心神不宁之证，大枣可养心血安心神，故为正确选项。人参、白术、山药无补心血作用。党参虽能补血，但无安神作用，常常误选此项。","k":"补虚药"},{"t":1,"s":"功能调和药性的药物是","o":["白扁豆","人参","党参","黄芪","甘草"],"a":"E","e":"甘能和，药味甘甜的药物能调和药性，如甘草、大枣等，故答案是E项。","k":"补虚药"},{"t":1,"s":"淫羊藿具有的功效是","o":["补肾壮阳，纳气平喘","补肾壮阳，祛风除湿","补益肝肾，固精缩尿","补益肝肾，聪耳明目","补肾壮阳，润肠通便"],"a":"B","e":"本题测试淫羊藿的功效，功能补肾壮阳，祛风除湿，故选B项。","k":"补虚药"},{"t":1,"s":"杜仲具有的功效是","o":["补肾壮阳，疗伤续断","补肾壮阳，祛风除湿","补肾壮阳，固精缩尿","补益肝肾，温脾止泻","补益肝肾，强壮筋骨"],"a":"E","e":"本题测试杜仲的功效，功能补益肝肾，强壮筋骨，故选E。续断的功效是A项补肾壮阳，疗伤续断，混淆杜仲与续断的功效常误选A项。","k":"补虚药"},{"t":1,"s":"续断能治而杜仲不治的病证是","o":["胎动不安","肾虚腰痛","筋伤骨折","风湿久痹","肾虚阳痿"],"a":"C","e":"两药均能补肝肾，强筋骨，安胎。续断兼能疗伤续折，故答案应选择C项。","k":"补虚药"},{"t":1,"s":"具有温补肾阳，温脾摄唾功效的药物是","o":["炮姜","附子","肉豆蔻","佩兰","益智仁"],"a":"E","e":"本题测试益智仁的功效特点，开胃摄唾是益智仁独有的功效，故答案是E项。益智仁用于脾肾阳虚，统摄无权而见涎唾自流。佩兰所治之症，为湿浊中阻多涎而见口甘。","k":"补虚药"},{"t":1,"s":"肉苁蓉具有的功效是","o":["补肾助阳，祛风除湿","补肾助阳，润肠通便","补肾温肺，纳气平喘","补肾助阳，固精缩尿","滋补肝肾，强壮筋骨"],"a":"B","e":"本题测试肉苁蓉的功效，功能温补肾阳，质润入大肠，可润肠通便。","k":"补虚药"},{"t":1,"s":"既能补血，又能活血，润肠的药物是","o":["鸡血藤","何首乌","当归","阿胶","丹参"],"a":"C","e":"本题测试当归的功效，补血，活血，润肠通便。鸡血藤功能补血，活血，舒筋活络。丹参功能活血，凉血，养血。与当归的功效相似，常常误选A、E项。","k":"补虚药"},{"t":1,"s":"熟地黄具有的功效是","o":["补血养阴，填精益髓","养血敛阴，柔肝止痛","补血养阴，滋阴润肺","养血滋肾，清肝明目","补益心脾，养血安神"],"a":"A","e":"熟地黄功能滋补肾阴以养血，填精益髓以补虚，故答案是A项。","k":"补虚药"},{"t":1,"s":"既能补血，又能止血的药物是","o":["当归","三七","小蓟","大蓟","阿胶"],"a":"E","e":"本题测试阿胶的功效，既能补血又能止血，故答案应选择E项阿胶。当归能补血，但无止血作用。小蓟、大蓟、三七功能止血，而无补血作用。","k":"补虚药"},{"t":1,"s":"阿胶的用法是","o":["先煎","后下","烊化","另煎","包煎"],"a":"C","e":"阿胶是胶类，入汤剂宜烊化，故答案是C项。混淆另煎的概念，常误选D项。","k":"补虚药"},{"t":1,"s":"主要用于治疗肺胃阴虚证的药物是","o":["北沙参","天冬","石斛","墨旱莲","女贞子"],"a":"A","e":"对于补阴药物功效的学习，关键在于把握药物的归经，记住了药物的归经，也就记住了药物的适应证。用治肺胃阴虚证的药物，归于肺胃经，有北沙参、南沙参和玉竹，故A项北沙参为正确答案。","k":"补虚药"},{"t":1,"s":"患者阴虚有热，心烦，失眠，治疗宜选用的药物是","o":["南沙参","北沙参","石斛","百合","大枣"],"a":"D","e":"补阴药中归于心经，有百合与麦冬，用治心阴虚证，故D项是正确答案。大枣功能养血安神，用治血虚所致的心烦、失眠，故E项大枣是常见的错误选项，也是出题设计的陷阱。","k":"补虚药"},{"t":1,"s":"患者肾阴亏虚，骨蒸潮热，口渴，治疗宜选用的药物是","o":["天冬","麦冬","百合","南沙参","北沙参"],"a":"A","e":"备选药物中，只有天冬可归肾经，能滋肾阴，降虚火，故应选择A项天冬。","k":"补虚药"},{"t":1,"s":"既能益胃生津，又能滋肾降火的药物是","o":["百合","麦冬","北沙参","南沙参","石斛"],"a":"E","e":"从功效来看，益胃生津，滋肾降火，药物是归于胃、肾经，故正确答是E项。百合、麦冬归于肺胃心经，南北沙参归于肺胃经，均不是正确答案。","k":"补虚药"},{"t":1,"s":"阴虚之体外感风温，治疗宜选用的药物是","o":["天冬","石斛","玉竹","墨旱莲","黄精"],"a":"C","e":"本题测试玉竹的功效特点，滋阴而不碍邪，较宜于素体阴虚而外感风温者，故C项玉竹为正确答案。","k":"补虚药"},{"t":1,"s":"既能补气，又能补阴的药物是","o":["玉竹","黄精","麦冬","天冬","百合"],"a":"B","e":"本题测试黄精的功效（与山药相似），气阴双补，肺脾肾三脏同补，故正确答案是B项。而其他备选药物均为补阴药，常常误选。","k":"补虚药"},{"t":1,"s":"患者精血不足，视力减退，目涩昏花，治疗宜选用的药物是","o":["枸杞子","墨旱莲","黄精","玉竹","百合"],"a":"A","e":"枸杞子和墨旱莲均能补肝肾，但枸杞子长于益精明目，故A项为正确选项。玉竹、百合、黄精不具有补肝肾、益精血作用，可首先排除。","k":"补虚药"},{"t":1,"s":"患者因阴虚血热的鼻衄，治疗宜选用的药物是","o":["枸杞子","墨旱莲","丹皮","小蓟","地榆"],"a":"B","e":"用治阴虚血热出血的药物，应有滋阴、凉血、止血的功效，备选答案中只有墨旱莲滋补肝肾兼有凉血止血的功效，故以B项为正确答案。小蓟、地榆是凉血止血药，无滋阴作用，是常见的错误答案，也是出题设计的陷阱。","k":"补虚药"},{"t":1,"s":"枸杞子具有的功效是","o":["滋阴潜阳，养血补心","滋补肝肾，乌须明目","滋补肝肾，益精明目","滋补肝肾，凉血止血","滋阴补血，生津润燥"],"a":"C","e":"枸杞子功能滋补肝肾之阴，为平补肝肾之品，治疗精血不足所致的视力减退、内障目昏等证，故正确答案是C项。","k":"补虚药"},{"t":1,"s":"墨旱莲具有的功效是","o":["滋阴潜阳，养血补心","滋补肝肾，乌须明目","滋补肝肾，益精明目","滋补肝肾，凉血止血","滋阴补血，生津润燥"],"a":"D","e":"本题测试墨旱莲的功效，滋补肝肾，凉血止血，故正确答案是D项。墨旱莲与女贞子功效相似，用治肝肾阴虚证，相须为用，常误选B项。","k":"补虚药"},{"t":1,"s":"女贞子具有的功效是","o":["滋阴潜阳，养血补心","滋补肝肾，乌须明目","滋补肝肾，益精明目","滋补肝肾，凉血止血","滋阴补血，生津润燥"],"a":"B","e":"本题测试女贞子的功效，滋补肝肾，乌须明目，故正确答案是B项。本题与上题相似，常误选D项墨旱莲。","k":"补虚药"},{"t":2,"s":"人参具有的功效有哪些","o":["补气","补血","补阴","生津","安神"],"a":"ABDE","e":"人参的功效是大补元气、补脾益肺、生津养血、安神增智，不具有补阴功效，故答案为ABDE。","k":"补虚药"},{"t":2,"s":"黄芪具有的功效有哪些","o":["生津养血","补气升阳","止汗固表","补气养阴","托毒生肌"],"a":"ABCE","e":"黄芪补气善于升阳举陷，又能固表止汗，托毒生肌，故答案是ABCE。黄芪没有养阴功效，常误选D项。","k":"补虚药"},{"t":2,"s":"白术具有的功效是哪些","o":["健脾益气","止汗","燥湿","安胎","利水"],"a":"ABCDE","e":"白术补气，以健脾、燥湿为主要作用，被前人誉之为脾脏补气健脾第一要药。亦能固表止汗，益气安胎。白术安胎与止汗的功效，是记忆的难点，常常漏选。","k":"补虚药"},{"t":2,"s":"续断具有的功效有哪些","o":["疗伤续折","补益肝肾","固精缩尿","止崩漏","强筋骨"],"a":"ABDE","e":"本题测试续断的功效，补肝肾，强筋骨，止崩漏，联系续断的药名，可记忆其疗伤续断的功效。","k":"补虚药"},{"t":2,"s":"功能补肾阳，强筋骨的药物有哪些","o":["鹿茸","淫羊藿","杜仲","桑寄生","狗脊"],"a":"ABCDE","e":"本题意在测试考生的归纳总结能力。补肾阳药物中的鹿茸、淫羊藿、巴戟天、杜仲、续断均能补肾阳，强筋骨，易于遗漏的药物是A项鹿茸。祛风湿药物中也有一些药物功能补肾阳，强筋骨，五加皮、桑寄生、狗脊，常常被忽视。E项狗脊是记忆的难点。","k":"补虚药"},{"t":2,"s":"当归可用治下列哪些病证","o":["月经不调","痈疽疮疡","阴虚发热","跌打损伤","肠燥便秘"],"a":"ABDE","e":"当归功能补血、活血止痛、润肠通便。可用于治疗血虚血瘀之月经不调，痈疽疮疡，跌打损伤，及肠燥便秘，却无清虚热的作用。其中，润肠通便是功效的难点，常常漏选E项。用治痈疽疮疡的药物，大多具有清热解毒作用，当归无解毒作用，常配伍清热解毒药，活血消肿止痛以治疮疡，B项是本题的难点。","k":"补虚药"},{"t":2,"s":"白芍具有的功效有哪些","o":["润肠通便","养血敛阴","平抑肝阳","柔肝止痛","养血安神"],"a":"BCD","e":"本题测试白芍的功效，养血敛阴，柔肝止痛，平抑肝阳，故答案是BCD。其中，柔肝止痛，平抑肝阳是白芍功效的难点。","k":"补虚药"},{"t":2,"s":"功能补肝肾之阴的药物有哪些","o":["墨旱莲","女贞子","龟甲","鳖甲","百合"],"a":"ABCD","e":"功能补肝肾之阴的药物有墨旱莲、女贞子、龟甲、鳖甲。百合只能补心肺之阴，不作用于肝肾。故排除E项百合外，其余四项都应当选择。","k":"补虚药"},{"t":2,"s":"龟甲具有的功效有哪些","o":["固经止崩","滋阴潜阳","益肾健骨","退热除蒸","养血补心"],"a":"ABCE","e":"本题测试龟甲的功效，功能滋补肝肾之阴，兼能潜阳，又能健骨，养血补心，固经止崩，故选ABCE。混淆龟甲与鳖甲的功效，常错选D项。","k":"补虚药"},{"t":1,"s":"具有敛汗、除热作用的药物是","o":["麻黄根","五味子","浮小麦","山茱萸","金樱子"],"a":"C","e":"本题测试浮小麦的功效，固表止汗，益气除热。麻黄根功能敛汗，但无除热作用，常常误选A项。","k":"收涩药"},{"t":1,"s":"患者肺虚久咳，咽痛，音哑失音，治疗宜选用的药物是","o":["苏子","罂粟壳","蝉蜕","诃子","川贝母"],"a":"D","e":"诃子既能敛肺下气止咳，又能清肺利咽开音，为治肺虚久咳失音之要药。蝉蜕也能开音，是治风热、热毒上攻所致的失音，属于实证。C项是出题设计的陷阱，常常误选。","k":"收涩药"},{"t":1,"s":"既能固精缩尿，又能明目的药物是","o":["覆盆子","桑螵蛸","金樱子","补骨脂","鸡内金"],"a":"A","e":"本题测试覆盆子的功效，固精缩尿，益肝肾明目。桑螵蛸、金樱子虽能固精缩尿，但无明目作用，常常误选。","k":"收涩药"},{"t":1,"s":"山茱萸具有的功效是","o":["收敛固涩，补益肝肾","收敛固涩，补血养阴","收敛固涩，益气健脾","收敛固涩，宁心安神","收敛固涩，温补肾阳"],"a":"A","e":"山茱萸功能补益肝肾，又能固精缩尿，于补益之中又具封藏之功，为固精止遗之要药。D项收敛固涩，宁心安神是五味子的功效，常常误选D项。","k":"收涩药"},{"t":1,"s":"肉豆蔻具有的功效是","o":["温脾止呕，散寒止痛","涩肠止泻，温中行气","化湿止呕，温中行气","涩肠止泻，收敛止血","化湿止泻，益胃生津"],"a":"B","e":"本题测试肉豆蔻的功效，涩肠止泻，温中行气。肉豆蔻与白豆蔻药名、功效相似，白豆蔻功能化湿止呕、温中行气，常误选C项。","k":"收涩药"},{"t":1,"s":"既能固精，又能补肾助阳的药物是","o":["煅牡蛎","桑螵蛸","巴戟天","海螵蛸","金樱子"],"a":"B","e":"本题测试桑螵蛸的功效，固精缩尿，补肾助阳。桑螵蛸与海螵蛸药名、功效相似，常误选D项海螵蛸，巴戟天功能补肾助阳，但无固精作用，亦会误选。","k":"收涩药"},{"t":1,"s":"肉豆蔻的用法是","o":["先煎","后下","煨用","炒用","包煎"],"a":"C","e":"肉豆蔻内服须煨熟去油用，因为多余的油脂可刺激肠道引起腹泻。肉豆蔻与白豆蔻药名相似，白豆蔻是芳香药物，入汤剂须后下，易于混淆，常常误选B项后下。","k":"收涩药"},{"t":1,"s":"乌梅具有的功效是","o":["敛肺涩肠，安蛔生津","敛肺涩肠，利咽开音","涩肠止泻，固精止遗","涩肠止泻，收敛止血","涩肠止泻，温中行气"],"a":"A","e":"乌梅是典型的敛肺涩肠药，功能敛肺止咳，涩肠止泻，味酸又能安蛔止痛，生津止渴。","k":"收涩药"},{"t":2,"s":"功能敛肺涩肠的药物有哪些","o":["石榴皮","赤石脂","五倍子","金樱子","肉豆蔻"],"a":"ABCE","e":"石榴皮、赤石脂、五倍子、肉豆蔻是敛肺涩肠药，其中石榴皮、赤石脂是了解药物，较为生疏，会被漏选。金樱子是固精缩尿止带药，易于误选。","k":"收涩药"},{"t":2,"s":"五味子具有的功效有哪些","o":["补益肝肾","收敛固涩","收敛止血","益气生津","补肾宁心"],"a":"BDE","e":"五味子功能收敛固涩，益气生津，补肾宁心。其中益气生津、补肾宁心是记忆的难点。","k":"收涩药"},{"t":2,"s":"莲子具有的功效有哪些","o":["敛肺止咳","益肾涩精","养心安神","收敛止血","补脾止泻"],"a":"BCE","e":"莲子平补心脾肾三脏，功能补肾固精，补心安神，补脾止泻止带。其中益肾养心是莲子功效的难点，易于遗漏。","k":"收涩药"},{"t":1,"s":"既能涌吐痰涎，又能截疟的药物是","o":["槟榔","青蒿","常山","生首乌","胆矾"],"a":"C","e":"常山既能涌吐痰涎，又能截疟，二者兼备。槟榔、青蒿、生首乌均能截疟，但无涌吐痰涎之功，常误选A、B项。","k":"涌吐药"},{"t":1,"s":"胆矾作内服使用，其用法是","o":["先煎","后下","另煎","包煎","温水化服"],"a":"E","e":"胆矾主含含水硫酸铜，易在水中溶化，故作内服使用宜用温水化服。","k":"涌吐药"},{"t":1,"s":"外用杀虫主治疥疮，内服可助阳通便的药物是","o":["雄黄","硫黄","蛇床子","樟脑","土荆皮"],"a":"B","e":"外用杀虫疗疮，善治疥疮，内服又能温肾阳通大便的只有硫黄。蛇床子虽可内服温补肾阳，却无通便之功，常常误选C项。","k":"攻毒杀虫止痒药"},{"t":1,"s":"下列主治痈肿疔疮、湿疹、蛇伤的药物是","o":["雄黄","硫黄","白矾","蟾酥","木鳖子"],"a":"A","e":"雄黄外用内服皆可解毒杀虫；其余四药虽均能解毒疗疮，但很少用于治蛇虫咬伤。","k":"攻毒杀虫止痒药"},{"t":1,"s":"功能解毒疗疮，又能开窍醒神的药物是","o":["雄黄","蜂房","蟾酥","木鳖子","朱砂"],"a":"C","e":"五个备选药物皆可解毒疗疮，但具有开窍醒神功效的药物只有蟾酥。","k":"攻毒杀虫止痒药"},{"t":1,"s":"具有攻毒杀虫，祛风止痛功效的药物是","o":["蟾酥","樟脑","雄黄","木鳖子","蜂房"],"a":"E","e":"本题测试蜂房的功效，攻毒杀虫，又能祛风止痛，用治风湿痹痛。","k":"攻毒杀虫止痒药"},{"t":1,"s":"主治阳痿、阴痒、湿疹、带下的药物是","o":["肉苁蓉","续断","硫黄","白矾","蛇床子"],"a":"E","e":"蛇床子既杀虫止痒，用治阴痒湿疹，又能温肾壮阳，用治肾虚阳痿，又能燥湿散寒，用治寒湿带下。硫黄虽能补火助阳，用治肾虚阳痿，又能杀虫止痒，外治疥癣、湿疹，但无燥湿止带作用，是出题设计的陷阱，常常误选C项。","k":"攻毒杀虫止痒药"},{"t":2,"s":"白矾具有的功效有哪些","o":["消散痈肿","解毒杀虫","开窍醒神","燥湿止痒","止血止泻"],"a":"BDE","e":"白矾的功效为外用解毒杀虫，燥湿止痒；内服止血，止泻，化痰。却无消散痈肿，开窍醒神作用。","k":"攻毒杀虫止痒药"},{"t":2,"s":"既能燥湿，又杀虫止痒的药物是","o":["白矾","蛇床子","地肤子","大蒜","苦参"],"a":"ABE","e":"功能燥湿、杀虫止痒的药物是白矾、蛇床子、苦参。地肤子功能止痒及利水，但无燥湿作用；大蒜善杀虫，却无燥湿及止痒之功，常常误选C、D项。","k":"攻毒杀虫止痒药"},{"t":1,"s":"功能解毒明目退翳，且为眼科常用外用药物的是","o":["石决明","蝉蜕","轻粉","炉甘石","硼砂"],"a":"D","e":"本题测试炉甘石的功效。除轻粉外，备选药物皆可明目，但石决明、蝉蜕均无解毒之功，而硼砂可解毒，但明目退翳之功不强，常常误选E项。","k":"拔毒化腐生肌药"},{"t":1,"s":"外用可攻毒杀虫，蚀疮去腐，内服劫痰平喘的药物是","o":["巴豆","红粉","轻粉","砒石","铅丹"],"a":"D","e":"本题测试砒石的功效。升药外用蚀疮去腐之力更强，但不能内服。轻粉、铅丹、巴豆也均有一定蚀疮去腐作用，但此三药均无内服劫痰平喘作用。","k":"拔毒化腐生肌药"},{"t":1,"s":"具有解毒，清肺化痰作用的药物是","o":["瓜蒌","半夏","大蒜","硼砂","贝母"],"a":"D","e":"本题测试硼砂的功效。瓜蒌与贝母功能清肺化痰，但无解毒作用，常常误选A、E项。","k":"拔毒化腐生肌药"},{"t":1,"s":"砒石内服每次的用量是","o":["0.002~0.004g","0.01~0.02g","0.02~0.04g","0.15~0.3g","0.3~0.6g"],"a":"A","e":"砒石有大毒外用为主而较少内服，内服用量极小每次0.002~0.004g，在本题五个剂量组中属最小者。","k":"拔毒化腐生肌药"},{"t":2,"s":"硼砂治疗的病证有哪些","o":["咽喉肿痛","口舌生疮","虚火牙痛","目赤翳障","痰热咳嗽"],"a":"ABDE","e":"硼砂外用可清热解毒，用治咽喉肿痛，口舌生疮，目赤翳障，为喉科及眼科的常用药。内服能清肺化痰，用治痰热咳嗽。但无养阴作用，不用治虚火牙痛。","k":"拔毒化腐生肌药"},{"t":1,"s":"功能平冲降逆，用治奔豚的是（）","o":["代赭石","沉香","肉桂","牛膝","桂枝"],"a":"E","e":"桂枝功能平冲降逆，故选E。其他药物均能沉降，常误选。","k":"模拟试卷A卷"},{"t":1,"s":"患者，男，37岁，外感热病，壮热，烦渴，汗出，脉洪大，宜选（）与知母同用","o":["石膏","柴胡","芦根","栀子","天花粉"],"a":"A","e":"证属温病气分实热，治宜石膏与知母同用，故选A。","k":"模拟试卷A卷"},{"t":1,"s":"患者，男，29岁，暑月外感风寒，内伤生冷，恶寒发热，腹痛吐泻，治宜用（）","o":["麻黄","桂枝","柴胡","藿香","生姜"],"a":"D","e":"功能外散风寒，内化湿浊的是藿香，故选D。其他解表药均不能化湿，常误选。","k":"模拟试卷A卷"},{"t":1,"s":"患者，女，67岁，痰浊闭阻，胸痹心痛，胸中满闷，治宜用（）","o":["陈皮","青皮","木香","枳实","半夏"],"a":"D","e":"功能化痰以治胸痹的是枳实，故选D。陈皮、半夏化痰，善治痰多咳喘，常误选A、D。","k":"模拟试卷A卷"},{"t":1,"s":"患者，女，28岁，经行腹痛，出血紫暗，舌有瘀斑，脉涩，治宜用（）","o":["小蓟","艾叶","槐花","茜草","白及"],"a":"D","e":"证属瘀血出血，治宜化瘀止血药茜草，故选D。","k":"模拟试卷A卷"},{"t":1,"s":"患者，男，79岁，中风痰壅，口眼㖞斜，语言謇涩，治宜用（）","o":["白附子","半夏","旋覆花","白前","瓜蒌"],"a":"A","e":"白附子善治头面风痰，口眼㖞斜，故选A。","k":"模拟试卷A卷"},{"t":1,"s":"患者，男，67岁，肾阳不足，膀胱虚冷，遗尿尿频，治宜用（）","o":["乌药","沉香","薤白","丁香","花椒"],"a":"A","e":"乌药功能温肾散寒，治疗下焦虚寒，遗尿尿频，故选A。","k":"模拟试卷A卷"},{"t":1,"s":"患者，女，51岁，温病后期，夜热早凉，热退无汗，治宜用（）","o":["北沙参","鳖甲","生石膏","金银花","墨旱莲"],"a":"B","e":"鳖甲既能养阴，又退虚热，用治阴虚发热，故选B。","k":"模拟试卷A卷"},{"t":1,"s":"患者，女，36岁，阴虚有热，心烦，失眠，治宜用（）","o":["天冬","石斛","麦冬","玉竹","北沙参"],"a":"C","e":"功能养心阴，安心神的是麦冬，故选C。","k":"模拟试卷A卷"},{"t":1,"s":"善治太阳经头痛的药物是（）","o":["柴胡","羌活","细辛","白芷","吴茱萸"],"a":"B","e":"备选药物均治头痛，善治太阳经头痛的是羌活，第5题选B。","k":"模拟试卷A卷"},{"t":2,"s":"下列哪些药物有透疹作用（）","o":["蝉蜕","荆芥","升麻","薄荷","葛根"],"a":"ABCDE","e":"解表药质轻透散，亦能透疹，故选ABCDE。葛根是难点，常漏选。","k":"模拟试卷A卷"},{"t":2,"s":"既能凉血，又能活血的药物有（）","o":["丹皮","当归","丹参","茜草","赤芍"],"a":"ACDE","e":"当归是甘温补血药，故选ACDE。茜草是难点，功能化瘀、凉血、止血，常漏选。","k":"模拟试卷A卷"},{"t":2,"s":"可治阴虚燥咳的药物有（）","o":["百部","紫苏子","紫菀","款冬花","川贝母"],"a":"ACDE","e":"紫苏子降气化痰，多治痰多咳嗽，其他药物均能润肺，用治肺燥咳嗽，故选ACDE。","k":"模拟试卷A卷"},{"t":2,"s":"龙骨与牡蛎均具有的功效是（）","o":["收敛固涩","重镇降逆","镇惊安神","平肝潜阳","制酸止痛"],"a":"ACD","e":"龙骨和牡蛎共同的功效是重镇安神，重镇潜阳，煅后收敛固涩，故选ACD。","k":"模拟试卷A卷"},{"t":1,"s":"归经是","o":["药物对人体作用的不同趋向性","药物对机体的毒副作用","药物作用的定位概念","药物对人体寒热变化的作用倾向","药物具有辛苦甘酸咸五种味道"],"a":"C","e":"归经是定位概念，故选C。混淆作用趋向与作用部位，常错选A。","k":"模拟试卷B卷"},{"t":1,"s":"功能祛风解表，胜湿止痛，止痉的是","o":["麻黄","羌活","荆芥","防风","白芷"],"a":"D","e":"防风功能（祛风）胜湿，（祛风）止痉，故选D。混淆荆芥的功效，常错选C。","k":"模拟试卷B卷"},{"t":1,"s":"善治下半身风寒湿痹的是","o":["威灵仙","独活","羌活","防风","川乌"],"a":"B","e":"独活善下行，故选B。羌活善上行，常错选C。","k":"模拟试卷B卷"},{"t":1,"s":"功能清心开窍，用治热病神昏的是","o":["延胡索","姜黄","郁金","五灵脂","红花"],"a":"C","e":"郁金功能清心开窍，故选C。","k":"模拟试卷B卷"},{"t":1,"s":"功能利湿去浊，善治膏淋的是","o":["车前子","石韦","滑石","金钱草","萆薢"],"a":"E","e":"萆薢是治膏淋要药，故选E。","k":"模拟试卷B卷"},{"t":1,"s":"关于川贝母、浙贝母论述正确的是","o":["肺热燥咳、虚劳咳嗽用川贝母","浙贝母味甘，性偏于润","清热散结消痈之力，川贝母为胜","二者均治寒痰、湿痰证","川贝母味苦，性偏于泄"],"a":"A","e":"川贝、浙贝均治肺热、虚劳咳嗽，川贝味甘性润，浙贝味苦性泄，浙贝化痰散结力强，故选A。混淆二者特点，常误选他项。","k":"模拟试卷B卷"},{"t":1,"s":"患者，男，27岁，邪在少阳，寒热往来，胸胁苦满，口苦咽干，宜选用","o":["麻黄","桂枝","柴胡","葛根","羌活"],"a":"C","e
